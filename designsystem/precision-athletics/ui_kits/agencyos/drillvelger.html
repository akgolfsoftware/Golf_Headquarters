<script type="text/babel">
const { Toast } = window.AKGolfPrecisionAthletics_7d7c29;
function Board() {
  const [log, setLog] = React.useState(null);
  const cols = [["turn", "TURN · to trykk"], ["tek", "TEK · bare teknikk"], ["fys", "FYS · bare fysisk"]];
  return (
    <div style={{ padding: "28px 32px", display: "flex", flexDirection: "column", gap: 20, minHeight: "100vh" }}>

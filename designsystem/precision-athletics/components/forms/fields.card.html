<!DOCTYPE html><html lang="no"><head><meta charset="utf-8"><title>FormField</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);padding:20px;box-sizing:border-box}.lbl{font:var(--type-meta);color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}</style>
</head><body><div id="root"></div><script type="text/babel">
const NS = window.AKGolfPrecisionAthletics_7d7c29;
const { FormField, TextInput, SearchField, SegmentedFilter, Stepper } = NS;
function App(){const [q,setQ]=React.useState("Berg");const [f,setF]=React.useState("alle");const [m,setM]=React.useState(["plan"]);return <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:24,alignItems:"start"}}>
<div style={{display:"flex",flexDirection:"column",gap:20}}>
<FormField label="E-post til forelder" hint="Brukes til samtykke under 16 år." required><TextInput type="email" defaultValue="kari.berg@epost.no"/></FormField>
<FormField label="Telefon" required error="Nummeret har 7 sifre. Norske mobilnummer har 8."><TextInput mono defaultValue="4123 456"/></FormField>
<FormField label="Kommentar til spiller" optional><TextInput placeholder="Kort beskjed"/></FormField>
</div>
<div style={{display:"flex",flexDirection:"column",gap:20}}>
<SearchField value={q} onChange={setQ} placeholder="Søk spiller eller gruppe" count={2}/>
<div><div className="lbl">Enkeltvalg</div><SegmentedFilter value={f} onChange={setF} options={[{value:"alle",label:"Alle",count:9},{value:"plan",label:"Ukeplaner",count:4},{value:"endr",label:"Endringsforslag",count:2},{value:"fravar",label:"Fravær",count:0},{value:"samt",label:"Foreldresamtykke",count:3}]}/></div>
<div><div className="lbl">Flervalg</div><SegmentedFilter multi value={m} onChange={setM} options={["Junior elite","Junior","Voksen","Skadet"].map(x=>({value:x==="Junior elite"?"plan":x,label:x}))}/></div>
</div></div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);</script></body></html>

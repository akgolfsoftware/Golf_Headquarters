<!-- @dsCard group="Colors" viewport="700x150" name="Graphite ink & primary" subtitle="Five graphites; 900 is the primary button" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-flat)}.g{display:grid;gap:10px}.sw{border-radius:8px;height:64px;box-shadow:inset 0 0 0 1px rgba(20,20,19,.08)}.n{font:500 13px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:var(--type-meta);color:var(--text-muted);letter-spacing:.02em}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:var(--graphite-900)"></div><div class="n">900 · Primary</div><div class="v">--graphite-900 · #141413</div></div><div><div class="sw" style="background:var(--graphite-800)"></div><div class="n">800 · Body</div><div class="v">--graphite-800 · #2a2926</div></div><div><div class="sw" style="background:var(--graphite-700)"></div><div class="n">700 · Hover</div><div class="v">--graphite-700 · #3a3935</div></div><div><div class="sw" style="background:var(--graphite-600)"></div><div class="n">600 · Secondary</div><div class="v">--graphite-600 · #46443f</div></div><div><div class="sw" style="background:var(--graphite-500)"></div><div class="n">500 · Muted</div><div class="v">--graphite-500 · #686560</div></div><div><div class="sw" style="background:var(--graphite-400)"></div><div class="n">400 · Faint</div><div class="v">--graphite-400 · #8a8680</div></div></div></body></html>

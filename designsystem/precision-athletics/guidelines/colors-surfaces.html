<!-- @dsCard group="Colors" viewport="700x150" name="Sand surfaces" subtitle="Light theme page, flat, card, sunken, hairlines" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-flat)}.g{display:grid;gap:10px}.sw{border-radius:8px;height:64px;box-shadow:inset 0 0 0 1px rgba(20,20,19,.08)}.n{font:500 13px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:var(--type-meta);color:var(--text-muted);letter-spacing:.02em}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:var(--sand-200)"></div><div class="n">Page</div><div class="v">--sand-200 · #e6e3dd</div></div><div><div class="sw" style="background:var(--sand-100)"></div><div class="n">Flat</div><div class="v">--sand-100 · #faf8f3</div></div><div><div class="sw" style="background:var(--white)"></div><div class="n">Card</div><div class="v">--white · #fff</div></div><div><div class="sw" style="background:var(--sand-150)"></div><div class="n">Sunken</div><div class="v">--sand-150 · #f1eee8</div></div><div><div class="sw" style="background:var(--sand-300)"></div><div class="n">Hairline</div><div class="v">--sand-300 · #ddd9d1</div></div><div><div class="sw" style="background:var(--sand-400)"></div><div class="n">Strong</div><div class="v">--sand-400 · #c9c4ba</div></div></div></body></html>

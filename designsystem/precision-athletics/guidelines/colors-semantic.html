<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-flat)}.g{display:grid;gap:10px}.sw{border-radius:8px;height:64px;box-shadow:inset 0 0 0 1px rgba(20,20,19,.08)}.n{font:500 13px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:var(--type-meta);color:var(--text-muted);letter-spacing:.02em}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:var(--green-700)"></div><div class="n">OK</div><div class="v">--green-700 · #2f6b3a</div></div><div><div class="sw" style="background:var(--green-50)"></div><div class="n">OK tint</div><div class="v">--green-50</div></div><div><div class="sw" style="background:var(--amber-700)"></div><div class="n">Warn</div><div class="v">--amber-700 · #7e6110</div></div><div><div class="sw" style="background:var(--amber-50)"></div><div class="n">Warn tint</div><div class="v">--amber-50</div></div><div><div class="sw" style="background:var(--blue-800)"></div><div class="n">Info / link</div><div class="v">--blue-800 · #1d3557</div></div><div><div class="sw" style="background:var(--blue-50)"></div><div class="n">Info tint</div><div class="v">--blue-50</div></div></div></body></html>

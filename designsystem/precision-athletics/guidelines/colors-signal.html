<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-flat)}.g{display:grid;gap:10px}.sw{border-radius:8px;height:64px;box-shadow:inset 0 0 0 1px rgba(20,20,19,.08)}.n{font:500 13px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:var(--type-meta);color:var(--text-muted);letter-spacing:.02em}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div><div class="sw" style="background:var(--rust-600)"></div><div class="n">Signal</div><div class="v">--rust-600 · #9b2415</div></div><div><div class="sw" style="background:var(--rust-700)"></div><div class="n">Signal hover</div><div class="v">--rust-700 · #7d1c10</div></div><div><div class="sw" style="background:var(--rust-400)"></div><div class="n">Signal on night</div><div class="v">--rust-400 · #d8553f</div></div><div><div class="sw" style="background:var(--rust-100)"></div><div class="n">Signal tint</div><div class="v">--rust-100 · #fbebea</div></div></div></body></html>

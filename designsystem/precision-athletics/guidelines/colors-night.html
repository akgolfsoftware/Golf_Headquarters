<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-flat)}.g{display:grid;gap:10px}.sw{border-radius:8px;height:64px;box-shadow:inset 0 0 0 1px rgba(20,20,19,.08)}.n{font:500 13px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:var(--type-meta);color:var(--text-muted);letter-spacing:.02em}</style></head><body data-theme="night"><div class="g" style="grid-template-columns:repeat(6,1fr)"><div><div class="sw" style="background:var(--night-950)"></div><div class="n">Page</div><div class="v">--night-950 · #0c0d0c</div></div><div><div class="sw" style="background:var(--night-900)"></div><div class="n">Flat</div><div class="v">--night-900 · #141513</div></div><div><div class="sw" style="background:var(--night-850)"></div><div class="n">Card</div><div class="v">--night-850 · #1b1c1a</div></div><div><div class="sw" style="background:var(--night-800)"></div><div class="n">Hover</div><div class="v">--night-800 · #232421</div></div><div><div class="sw" style="background:var(--night-700)"></div><div class="n">Hairline</div><div class="v">--night-700 · #2f302c</div></div><div><div class="sw" style="background:var(--night-300)"></div><div class="n">Text 2</div><div class="v">--night-300 · #a9a59d</div></div></div></body></html>

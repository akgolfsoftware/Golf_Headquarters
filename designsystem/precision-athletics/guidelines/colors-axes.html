<!-- @dsCard group="Colors" viewport="700x150" name="Training axes" subtitle="Official values · soft 13% (SPILL 16%) background, darker ink" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-flat)}.g{display:grid;gap:10px}.sw{border-radius:8px;height:64px;box-shadow:inset 0 0 0 1px rgba(20,20,19,.08)}.n{font:500 13px/1.3 var(--font-sans);color:var(--text-primary);margin-top:8px}.v{font:var(--type-meta);color:var(--text-muted);letter-spacing:.02em}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div><div class="sw" style="height:40px;background:var(--axis-fys)"></div><div style="margin-top:8px"><span class="pa-badge pa-badge--fys"><span class="pa-badge__dot"></span>FYS</span></div><div class="v" style="margin-top:6px">Fysisk · --axis-fys</div></div><div><div class="sw" style="height:40px;background:var(--axis-tek)"></div><div style="margin-top:8px"><span class="pa-badge pa-badge--tek"><span class="pa-badge__dot"></span>TEK</span></div><div class="v" style="margin-top:6px">Teknikk · --axis-tek</div></div><div><div class="sw" style="height:40px;background:var(--axis-slag)"></div><div style="margin-top:8px"><span class="pa-badge pa-badge--slag"><span class="pa-badge__dot"></span>SLAG</span></div><div class="v" style="margin-top:6px">Slag · --axis-slag</div></div><div><div class="sw" style="height:40px;background:var(--axis-spill)"></div><div style="margin-top:8px"><span class="pa-badge pa-badge--spill"><span class="pa-badge__dot"></span>SPILL</span></div><div class="v" style="margin-top:6px">Spill · --axis-spill</div></div><div><div class="sw" style="height:40px;background:var(--axis-turn)"></div><div style="margin-top:8px"><span class="pa-badge pa-badge--turn"><span class="pa-badge__dot"></span>TURN</span></div><div class="v" style="margin-top:6px">Turnering · --axis-turn</div></div></div></body></html>

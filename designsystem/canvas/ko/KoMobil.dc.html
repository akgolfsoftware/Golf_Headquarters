<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <style>
    body { margin: 0; font-family: Poppins, Arial, system-ui, sans-serif; background: #000000; color: #F5F5F5; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #F5F5F5; text-decoration: none; } a:hover { color: #FFFFFF; }
    .caps { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8E8E93; }
    .num { font-variant-numeric: tabular-nums; }
    .press { transition: transform 180ms cubic-bezier(0.32,0.72,0,1); }
    .press:active { transform: scale(0.97); }
    .scroll::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #000000; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 16px 104px;">

    <div class="caps">Academy</div>
    <h1 style="margin: 6px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em;">Kø</h1>
    <p style="margin: 8px 0 0; font-size: 13px; line-height: 1.55; color: #8E8E93;">Alt som krever deg i dag.</p>

    <!-- Fane-rad ruller horisontalt på telefon -->
    <div class="scroll" role="tablist" aria-label="Kø-faner" style="display: flex; gap: 8px; margin: 18px -16px 0; padding: 0 16px; overflow-x: auto;">
      <sc-for list="{{ faner }}" as="f" hint-placeholder-count="5">
        <button type="button" role="tab" class="press" onClick="{{ f.pick }}" aria-selected="{{ f.aktiv }}"
          style="flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: none; cursor: pointer; font-family: Poppins, Arial, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap; background: {{ f.bg }}; color: {{ f.fg }};">
          <span>{{ f.label }}</span>
          <span class="num" style="opacity: 0.75;">{{ f.antall }}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 18px;">
      <span class="num" style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 22px; font-weight: 600;">{{ aktivAntall }}</span>
      <span class="caps" style="font-size: 10px;">{{ aktivEnhet }}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 16px;">
      <sc-for list="{{ saker }}" as="s" hint-placeholder-count="3">
        <article onClick="{{ s.pick }}" style="background: #161616; border-radius: 20px; padding: 16px 18px; cursor: pointer; opacity: {{ s.op }}; box-shadow: {{ s.ring }};">
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <span style="font-size: 15px; font-weight: 600;">{{ s.who }}</span>
            <sc-if value="{{ s.haster }}" hint-placeholder-val="{{ true }}">
              <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #FFD60A; box-shadow: inset 0 0 0 1px #FFD60A5C; border-radius: 999px; padding: 3px 8px;">Haster</span>
            </sc-if>
            <span class="num" style="margin-left: auto; font-size: 13px; color: #8E8E93;">{{ s.when }}</span>
          </div>
          <div class="caps" style="font-size: 10px; margin-top: 6px;">{{ s.kilde }}</div>
          <h3 style="margin: 8px 0 0; font-size: 15px; font-weight: 600;">{{ s.title }}</h3>
          <p style="margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: #8E8E93;">{{ s.detail }}</p>
          <sc-if value="{{ s.diff }}" hint-placeholder-val="{{ true }}">
            <div style="margin: 12px 0 0; padding: 12px 14px; background: #1C1C1E; border-radius: 14px;">
              <div class="caps" style="font-size: 9px; letter-spacing: 0.06em;">Dette endres</div>
              <span style="display: block; margin-top: 4px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere;">{{ s.diff }}</span>
            </div>
          </sc-if>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;">
            <sc-for list="{{ s.knapper }}" as="k" hint-placeholder-count="2">
              <span class="press" style="flex: 1 1 45%; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 999px; cursor: pointer; font-size: 15px; font-weight: {{ k.vekt }}; white-space: nowrap; background: {{ k.bg }}; color: {{ k.fg }}; box-shadow: {{ k.ring }};">{{ k.label }}</span>
            </sc-for>
          </div>
        </article>
      </sc-for>
    </div>
  </div>

  <!-- Tabbar AX-01a — flytende pille, fem destinasjoner -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 12px; height: 64px; background: #1C1C1E; border-radius: 999px; box-shadow: inset 0 0 0 1px #FFFFFF14; display: flex; align-items: center; padding: 8px 10px;">
    <div style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><div style="width: 20px; height: 20px; border-radius: 5px; background: #8E8E93;"></div><span style="font-size: 10px; font-weight: 600; color: #8E8E93;">Stall</span></div>
    <div style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><div style="width: 20px; height: 20px; border-radius: 5px; background: #8E8E93;"></div><span style="font-size: 10px; font-weight: 600; color: #8E8E93;">Workbench</span></div>
    <div style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; position: relative;">
      <div style="width: 20px; height: 20px; border-radius: 5px; background: #F5F5F5;"></div>
      <span style="font-size: 10px; font-weight: 600; color: #F5F5F5;">Kø</span>
      <span class="num" style="position: absolute; top: 2px; left: 50%; margin-left: 4px; min-width: 18px; height: 18px; border-radius: 999px; background: #FF453A; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px;">17</span>
    </div>
    <div style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><div style="width: 20px; height: 20px; border-radius: 5px; background: #8E8E93;"></div><span style="font-size: 10px; font-weight: 600; color: #8E8E93;">Jarvis</span></div>
    <div style="flex: 1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;"><div style="width: 20px; height: 20px; border-radius: 999px; background: #8E8E93;"></div><span style="font-size: 10px; font-weight: 600; color: #8E8E93;">Meg</span></div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fane: 'godkjenninger', valgt: 0 };
  }

  data() {
    return {
      godkjenninger: { label: 'Godkjenninger', enhet: 'venter på deg', saker: [
        { who: 'Øyvind Rohjan', haster: true, kilde: 'agent', when: '2 t siden',
          title: 'Bytt torsdagens økt til putting', detail: 'Tre runder på rad med SG putting under −0,8.',
          diff: 'TOR 16.00 · Nærspill → Putting · 60 min',
          knapper: [{ label: 'Merge', p: true }, { label: 'Avvis', f: true }] },
        { who: 'Sofie', haster: false, kilde: 'agent', when: '5 t siden',
          title: 'Legg til styrkeøkt onsdag', detail: 'FYS-andelen ligger på 9 % denne perioden.',
          diff: 'ONS 07.30 · FYS · 45 min',
          knapper: [{ label: 'Merge', p: false }, { label: 'Avvis', f: true }] },
        { who: 'Mari', haster: false, kilde: 'forespørsel', when: 'i går',
          title: 'Ber om time fredag 14.00', detail: 'Ledig i kalenderen.',
          diff: 'FRE 14.00 · Mulligan · 60 min',
          knapper: [{ label: 'Legg i kalenderen', p: false }, { label: 'Kan ikke', f: true }] },
      ] },
      agentko: { label: 'Agent-kø', enhet: 'oppgaver i arbeid', saker: [
        { who: 'Ukesrapport', haster: false, kilde: 'klar', when: 'i kø',
          title: 'Oppsummer uke 35', detail: 'Leser plan, logg, runder og tester. Skriver ingenting selv.',
          diff: '', knapper: [{ label: 'Kjør nå', p: true }, { label: 'Pause', s: true }] },
        { who: 'Turneringssync', haster: false, kilde: 'pågår', when: 'startet 09.12',
          title: 'Henter resultater fra GolfBox', detail: '1 402 av 2 939 ferdig.',
          diff: '', knapper: [{ label: 'Avbryt', s: true }] },
      ] },
      agentgodkjenn: { label: 'Agent-godkjenning', enhet: 'resultater å se på', saker: [
        { who: 'Ukeplan-forslag', haster: false, kilde: 'resultat', when: '1 dg siden',
          title: 'Uke 36 for Øyvind Rohjan er klar', detail: 'Fem økter foreslått. Ingenting er publisert.',
          diff: 'MAN TEK · ONS FYS · TOR SLAG · LØR SPILL',
          knapper: [{ label: 'Godkjenn', p: true }, { label: 'Avvis', f: true }] },
      ] },
      tester: { label: 'Foreslåtte tester', enhet: 'test å vurdere', saker: [
        { who: 'Øyvind Rohjan', haster: false, kilde: 'egen test', when: '6 dg siden',
          title: 'Wedge-stige 40–80 m', detail: 'Ti slag per avstand, snitt nærhet i meter.',
          diff: '4 steg · målverdi i meter · lavere er bedre',
          knapper: [{ label: 'Godkjenn', p: true }, { label: 'Avvis', f: true }] },
      ] },
      dubletter: { label: 'Dubletter', enhet: 'mulige dubletter', saker: [
        { who: 'Onsøy Open 2026', haster: false, kilde: 'manuell', when: '12.06.2026',
          title: 'Ligner på Onsøy Open (GolfBox)', detail: 'Samme dato, 4 av 5 ord felles.',
          diff: 'MANUAL → GOLFBOX · 38 påmeldte',
          knapper: [{ label: 'Slå sammen', p: true }, { label: 'Behold begge', s: true }] },
      ] },
    };
  }

  renderVals() {
    const d = this.data();
    const nokler = ['godkjenninger', 'agentko', 'agentgodkjenn', 'tester', 'dubletter'];
    const antall = { godkjenninger: 7, agentko: 3, agentgodkjenn: 2, tester: 1, dubletter: 4 };
    const aktiv = d[this.state.fane];

    const faner = nokler.map((k) => {
      const er = k === this.state.fane;
      return {
        label: d[k].label, antall: antall[k], aktiv: er,
        bg: er ? '#FFFFFF' : '#2C2C2E', fg: er ? '#000000' : '#F5F5F5',
        pick: () => this.setState({ fane: k, valgt: 0 }),
      };
    });

    const saker = aktiv.saker.map((s, i) => ({
      ...s,
      op: i === this.state.valgt ? 1 : 0.55,
      ring: i === this.state.valgt ? 'inset 0 0 0 1px #FFFFFF14' : 'none',
      pick: () => this.setState({ valgt: i }),
      knapper: s.knapper.map((k) => ({
        label: k.label,
        vekt: k.p ? 700 : 600,
        bg: k.p ? '#FFFFFF' : k.f ? 'transparent' : '#2C2C2E',
        fg: k.p ? '#000000' : k.f ? '#FF453A' : '#F5F5F5',
        ring: k.f ? 'inset 0 0 0 1px #FFFFFF14' : 'none',
      })),
    }));

    return { faner, saker, aktivAntall: antall[this.state.fane], aktivEnhet: aktiv.enhet };
  }
}
</script>
</body>
</html>

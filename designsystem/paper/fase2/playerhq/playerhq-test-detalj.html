<!-- FIDELITET: PIXEL-FASIT -->
<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TN Putt Gate · PlayerHQ · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
:root {
  --bg: #faf9f5; --surface: #ffffff; --soft: #f0eee6; --soft-hover: #e8e6dc;
  --surface-warm: #e3dacc; --surface-manilla: #ebdbbc; --surface-kraft: #d4a27f;
  --border: #e8e6dc; --hairline: #d1cfc5; --inverse: #000000;
  --fg: #141413; --ink-soft: #3d3d3a; --muted: #5e5d59; --mid: #b0aea5; --text-tertiary: #87867f;
  --cta: #141413; --on-cta: #faf9f5; --cta-hover: #3d3d3a;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.12); --accent-fg: #b85c3d;
  --on-accent: #141413; --accent-deep: #c6613f;
  --up: #63784a; --up-raw: #788c5d; --dn: #a85536; --info: #46719f; --info-raw: #6a9bcc;
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --disp: var(--font-sans); --ui: var(--font-sans); --body: var(--font-serif); --mono: var(--font-mono);
  --text-label: 10px; --text-body-player: 14px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --r-sm: 8px; --r: 12px; --r-md: 16px; --r-lg: 24px; --r-pill: 999px;
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --focus: #d97757; --ease: cubic-bezier(0.16, 1, 0.3, 1); --dur: 160ms;
  --tap: 44px; --tap-lg: 48px; --z-toast: 100;
}
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413; --surface: #1d1c1a; --soft: #26241f; --soft-hover: #2e2c28;
  --border: rgba(250, 249, 245, 0.10); --hairline: rgba(250, 249, 245, 0.08);
  --fg: #faf9f5; --ink-soft: #e8e6dc; --muted: #b0aea5; --mid: #6b675e;
  --cta: #faf9f5; --on-cta: #141413; --cta-hover: #e8e6dc;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.18); --accent-fg: #e5a184; --on-accent: #141413;
  --up: #9db284; --dn: #de9e82; --info: #93b7dc;
  --shadow: none; --focus: #d97757;
}
[data-theme="light"] { color: #141413; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
@media (pointer: coarse) { :root { --floor: var(--tap); } }
:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }

/* ═══ PlayerHQ · Test-detalj (fase2/W1) ═══
   Rute: /portal/tren/tester/[testId] — én test: protokoll, scoringsregel
   og egen historikk. Gjennomføringen har egen fasit
   (fase1/playerhq-test-gjennomfor.html) — denne skjermen er FORBEREDELSEN.
   Kilde: TestDefinition (protokoll zod-parset) + TestResult (historikk).
   Demoen: TN Putt Gate — samme test som gjennomførings-fasiten. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; color:inherit; text-decoration:none; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(var(--s8) + env(safe-area-inset-bottom)); }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s4); }
.kort .rad{ display:flex; align-items:baseline; gap:var(--s2); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:13px; }
.kort .rad:last-child{ border-bottom:0; }
.kort .rad .v{ margin-left:auto; font-family:var(--mono); text-align:right; }

.steg{ display:flex; gap:var(--s3); padding:var(--s2) 0; font-size:13px;
  border-bottom:1px solid var(--border-soft); }
.steg:last-child{ border-bottom:0; }
.steg .nr{ flex:none; width:22px; height:22px; border-radius:var(--r-pill);
  display:grid; place-items:center; background:var(--soft); font-family:var(--mono);
  font-size:11px; color:var(--muted); }
.steg .tx{ font-family:var(--body); color:var(--ink-soft); }

/* Historikk — små stolper, siste måling markert */
.hist{ display:flex; align-items:flex-end; gap:var(--s2); height:72px; margin:var(--s3) 0; }
.hist .b{ flex:1; background:var(--soft); border-radius:var(--r-sm) var(--r-sm) 0 0;
  position:relative; min-height:8px; }
.hist .b.siste{ background:var(--mid); }
.hist .b span{ position:absolute; top:-18px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:9.5px; color:var(--muted); white-space:nowrap; }
.histx{ display:flex; gap:var(--s2); }
.histx span{ flex:1; text-align:center; font-family:var(--mono); font-size:9.5px;
  color:var(--mid); }

.why{ margin:var(--s3) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

/* D4: anbefalte drills — et OPPSLAG i samme taksonomi, aldri en vurdering.
   Drillen deler område-slot med testen; begrunnelsen står i klartekst. */
.fdrill{ padding:var(--s3) 0; border-bottom:1px solid var(--border-soft); }
.fdrill:last-child{ border-bottom:0; padding-bottom:0; }
.fdrill .fn{ font-size:13.5px; font-weight:600; }
.fdrill code{ display:block; font-family:var(--mono); font-size:10.5px; word-break:break-all;
  background:var(--softer); border:1px solid var(--border-soft); border-radius:var(--r-sm);
  padding:var(--s2) var(--s3); margin:var(--s2) 0; }
.fdrill .fb{ margin:0 0 var(--s2); font-family:var(--body); font-size:13px; color:var(--muted); }
.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s2); animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }
button,.btn,summary,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow{ min-height:0; }
</style>
</head>
<body>
<p class="framehint">PlayerHQ · Test-detalj · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">
    <a class="ikon" href="playerhq-tester-hub.html" aria-label="Til testene" data-od-id="testd-tilbake">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="min-width:0">
      <h1>TN Putt Gate</h1>
      <span class="sub">TEK · putting · måles i fot</span>
    </div>
    <span style="flex:1"></span>
    <!-- demo-bryter · fjernes før koding -->
    <div data-demo-only="true" style="display:flex;gap:4px">
      <button class="ikon" data-tilstand="fylt" aria-pressed="true" aria-label="Demo: suksess" data-od-id="testd-demo-fylt"><span class="num" style="font-size:10px">F</span></button>
      <button class="ikon" data-tilstand="tom" aria-pressed="false" aria-label="Demo: tom" data-od-id="testd-demo-tom"><span class="num" style="font-size:10px">T</span></button>
      <button class="ikon" data-tilstand="laster" aria-pressed="false" aria-label="Demo: laster" data-od-id="testd-demo-laster"><span class="num" style="font-size:10px">L</span></button>
      <button class="ikon" data-tilstand="feil" aria-pressed="false" aria-label="Demo: feil" data-od-id="testd-demo-feil"><span class="num" style="font-size:10px">E</span></button>
    </div>
    <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="testd-theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="kropp" id="kropp"></main>
</div>

<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ Test-detalj · datamodell ═══
   Kilde: TestDefinition (protokoll fra src/lib/portal-tester/protocol.ts,
   zod-parset) + TestResult (historikk). Samme TN Putt Gate-data som
   gjennomførings-fasiten. Putting i FOT (CANON v3.5). */

var TEST = {
  navn:'TN Putt Gate', akse:'TEK', varighet:'ca. 20 min', utstyr:'Putter · 20 baller · gate 10 cm',
  scoring:'Antall putter gjennom porten av 20 forsøk, fra 6 fot.',
  steg:[
    'Sett opp porten 10 cm bred, 1 fot foran ballen.',
    'Merk startpunktet 6 fot fra hullet — flatt underlag.',
    '20 putter. Hver putt gjennom porten teller, uansett om den går i.',
    'Logg antallet — resultatet går rett til TalentHQ.'
  ]
};

var HISTORIKK = [
  { dato:'12.06', verdi:11 }, { dato:'28.06', verdi:12 }, { dato:'22.07', verdi:14 }
];
var MAKS = 20;

var tilstand = 'fylt';

function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';

  if (tilstand === 'laster'){
    for (var i = 0; i < 6; i++){ var s = el('div', 'skel'); s.style.width = (92 - i*9) + '%'; w.appendChild(s); }
    return;
  }
  if (tilstand === 'tom'){
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Du har ikke tatt denne testen ennå'));
    t.appendChild(el('p', null,
      'Protokollen står under — første måling blir referansen din. ' +
      'Alt du trenger er putter, 20 baller og en gate.'));
    var b = el('a', 'btn now full', 'Ta første måling');
    b.href = '../../fase1/playerhq-test-gjennomfor.html'; b.dataset.odId = 'testd-tom-start';
    t.appendChild(b); w.appendChild(t);
    w.appendChild(protokollKort());
    return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Klarte ikke å hente historikken'));
    f.appendChild(el('p', null,
      'Resultatlageret svarte ikke innen 30 sekunder. Protokollen står under — ' +
      'du kan ta testen nå og logge resultatet etterpå.'));
    var fb = el('button', 'btn now full', 'Prøv igjen'); fb.dataset.odId = 'testd-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f);
    w.appendChild(protokollKort());
    return;
  }

  /* ── Suksess ── */
  var k = el('div', 'kort');
  k.appendChild(el('div', 'eyebrow', 'om testen'));
  [['Pyramide', TEST.akse], ['Varighet', TEST.varighet], ['Utstyr', TEST.utstyr]]
  .forEach(function(pr){
    var r = el('div', 'rad');
    r.appendChild(el('span', null, pr[0]));
    r.appendChild(el('span', 'v num', pr[1]));
    k.appendChild(r);
  });
  w.appendChild(k);

  w.appendChild(protokollKort());

  var hk = el('div', 'kort');
  hk.appendChild(el('div', 'eyebrow', 'din historikk · ' + HISTORIKK.length + ' målinger'));
  var hg = el('div', 'hist');
  HISTORIKK.forEach(function(m, i){
    var b = el('div', 'b' + (i === HISTORIKK.length - 1 ? ' siste' : ''));
    b.style.height = Math.round(m.verdi / MAKS * 100) + '%';
    b.appendChild(el('span', 'num', m.verdi + ' av ' + MAKS));
    hg.appendChild(b);
  });
  hk.appendChild(hg);
  var hx = el('div', 'histx');
  HISTORIKK.forEach(function(m){ hx.appendChild(el('span', 'num', m.dato)); });
  hk.appendChild(hx);
  var tr = el('div'); tr.style.marginTop = 'var(--s3)';
  tr.appendChild(el('span', 'tag up', '+2 vs forrige måling'));
  hk.appendChild(tr);
  var wd = el('details', 'why'); wd.dataset.odId = 'testd-why';
  wd.appendChild(el('summary', null, 'Hvorfor dette tallet'));
  var ul = document.createElement('ul');
  ['Kilde: dine tre siste målinger av TN Putt Gate, logget 12.06, 28.06 og 22.07.',
   'Beregning: trenden er siste måling mot nest siste — 14 mot 12 er pluss to.',
   'Forbehold: målingene er gyldige når protokollen følges likt hver gang — samme avstand (6 fot), samme gate (10 cm).']
   .forEach(function(x){ ul.appendChild(el('li', null, x)); });
  wd.appendChild(ul); hk.appendChild(wd);
  w.appendChild(hk);

  /* D4: test → drill. Oppslaget peker på drills som deler område-slot med
     testen — samme taksonomi som hele appen (AK-formelens fem slots).
     «Legg i uka» legger drillen som UTKAST i workbench, aldri rett i planen. */
  var ak = el('div', 'kort');
  ak.appendChild(el('div', 'eyebrow', 'tren mot neste måling'));
  var kr = el('div', 'rad');
  kr.appendChild(el('span', null, 'Siste måling'));
  kr.appendChild(el('span', 'v num', '14 av 20 · kravet for kategorien din er 16'));
  ak.appendChild(kr);
  [ { n:'Putt 5–10 ft · ni kuler', f:'SLAG_PUTT_5_10_AUTO_TRENINGSOMRADE_OBSERVERT',
      b:'Testens eget bånd — 6 fot ligger i 5–10 ft. Samme press som testen: observert.' },
    { n:'Portputt 3–5 ft', f:'TEK_PUTT_3_5_AUTO_TRENINGSOMRADE_OBSERVERT',
      b:'Båndet under testavstanden — startlinja gjennom samme gate, kortere avstand.' }
  ].forEach(function(d, i){
    var fd = el('div', 'fdrill');
    fd.appendChild(el('span', 'fn', d.n));
    var c = document.createElement('code'); c.textContent = d.f; fd.appendChild(c);
    fd.appendChild(el('p', 'fb', d.b));
    var lg = el('a', 'btn', 'Legg i uka som utkast');
    lg.href = '../../fase1/workbench-desktop.html';
    lg.dataset.odId = 'testd-legg-drill-' + i;
    fd.appendChild(lg);
    ak.appendChild(fd);
  });
  var wd2 = el('details', 'why'); wd2.dataset.odId = 'testd-why-anbefaling';
  wd2.appendChild(el('summary', null, 'Hvorfor akkurat disse'));
  var ul2 = document.createElement('ul');
  ['Oppslaget er taksonomi, ikke vurdering: drills som deler område-slot (putt, samme fot-bånd) med testen.',
   'Rekkefølgen er nærmeste bånd først. Ingen skjult skåring.',
   '«Legg i uka» legger drillen som utkast i workbench — du bekrefter før den teller.']
   .forEach(function(x){ ul2.appendChild(el('li', null, x)); });
  wd2.appendChild(ul2);
  ak.appendChild(wd2);
  w.appendChild(ak);

  /* Kontrakt §3: skjermens ene aksenthandling — start testen. */
  var b2 = el('a', 'btn now full', 'Start testen');
  b2.href = '../../fase1/playerhq-test-gjennomfor.html'; b2.dataset.odId = 'testd-start';
  w.appendChild(b2);
}

function protokollKort(){
  var pk = el('div', 'kort');
  pk.appendChild(el('div', 'eyebrow', 'protokoll'));
  TEST.steg.forEach(function(s, i){
    var st = el('div', 'steg');
    st.appendChild(el('span', 'nr num', String(i + 1)));
    st.appendChild(el('span', 'tx', s));
    pk.appendChild(st);
  });
  var sc = el('div', 'rad'); sc.style.marginTop = 'var(--s2)';
  sc.appendChild(el('span', null, 'Scoring'));
  var sv = el('span', 'v'); sv.style.fontFamily = 'var(--body)';
  sv.style.textAlign = 'left'; sv.style.marginLeft = 'var(--s3)';
  sv.textContent = TEST.scoring;
  sc.appendChild(sv);
  pk.appendChild(sc);
  return pk;
}

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){ tilstand = b.dataset.tilstand; settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(KEY, next); } catch(e){}
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();
</script>
</body>
</html>

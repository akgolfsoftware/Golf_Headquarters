<script>
(function(){

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

var tilstand='fylt';

 var w=document.getElementById('kropp');w.innerHTML='';

 [['Score (brutto)',harData?String(slagSum):'71'],['Mot par',harData?signertHel(diff):'−1'],['SG total',harData?sgTekst(0.42):'—']].forEach(function(k){
  var f=el('div','kpifl');f.appendChild(el('span','l',k[0]));f.appendChild(el('span','v num',k[1]));kpirad.appendChild(f)
 });

 if(harData){
  var sgK=el('div','kort');sgK.appendChild(el('span','eyebrow','sg per kategori · mot Broadie scratch'));
  var sg=el('div','sg');var maks=Math.max.apply(null,SGKAT.map(function(d){return Math.abs(d[1])}));
  SGKAT.forEach(function(d){var r=el('div','sgrad');r.appendChild(el('span','n',d[0]));var sp=el('span','spor2');sp.appendChild(el('span','null'));var i=document.createElement('i');i.className=d[1]>=0?'pos':'neg';i.style.width=(Math.abs(d[1])/maks*48)+'%';sp.appendChild(i);r.appendChild(sp);r.appendChild(el('span','v num '+(d[1]>=0?'pos':'neg'),sgTekst(d[1])));sg.appendChild(r)});
  sgK.appendChild(sg);w.appendChild(sgK);
  var tabK=el('div','kort');tabK.appendChild(el('span','eyebrow','scorekort · 18 hull'));
  var dtwrap=el('div','dtwrap');var tab=el('table','tab');
  var thead=document.createElement('thead');thead.innerHTML='<tr><th>Hull</th><th class="r">Par</th><th class="r">Score</th><th class="r">Mot par</th></tr>';tab.appendChild(thead);
  var tbody=document.createElement('tbody');
  HULL.forEach(function(h){var d=h[2]-h[1];var tr=document.createElement('tr');tr.appendChild(el('td',null,String(h[0])));tr.appendChild(el('td','r num',String(h[1])));tr.appendChild(el('td','r num',String(h[2])));tr.appendChild(el('td','r num '+(d>0?'neg':d<0?'pos':''),signertHel(d)));tbody.appendChild(tr)});
  tab.appendChild(tbody);var tfoot=document.createElement('tfoot');var trf=document.createElement('tr');trf.appendChild(el('td',null,'Sum'));trf.appendChild(el('td','r',String(parSum)));trf.appendChild(el('td','r',String(slagSum)));trf.appendChild(el('td','r '+(diff>0?'neg':'pos'),signertHel(diff)));tfoot.appendChild(trf);tab.appendChild(tfoot);
  dtwrap.appendChild(tab);tabK.appendChild(dtwrap);w.appendChild(tabK);
  var statK=el('div','kort');statK.appendChild(el('span','eyebrow','putt · fairway · gir'));
  var rader=el('div','rader');
  [['Putter totalt','32 putt · 18 hull'],['Fairway truffet','9 av 14'],['Green in regulation','7 av 18']].forEach(function(r,i,arr){var rad=el('div','rad');rad.style.cursor='default';var tekst=el('div','tekst');tekst.appendChild(el('span','t',r[0]));rad.appendChild(tekst);rad.appendChild(el('span','trail num',r[1]));if(i===arr.length-1)rad.style.borderBottom='0';rader.appendChild(rad)});
  statK.appendChild(rader);w.appendChild(statK);
 } else {
  var k=el('div','kort');k.appendChild(el('span','eyebrow','sg per kategori'));k.appendChild(tomInfo('Ingen SG beregnet for denne runden','Runden er registrert med hurtig score. Før hull for hull med slag for å få SG og scorekort.'));w.appendChild(k);
  var k2=el('div','kort');k2.appendChild(el('span','eyebrow','scorekort'));k2.appendChild(tomInfo('Ingen hull-for-hull ennå','Kun totalscore er registrert for denne runden.'));w.appendChild(k2);
 }
}

})();

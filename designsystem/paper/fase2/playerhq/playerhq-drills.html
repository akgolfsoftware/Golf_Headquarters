<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Øvelsesbank · PlayerHQ · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
:root {
  --bg: #faf9f5; --surface: #ffffff; --soft: #f0eee6; --soft-hover: #e8e6dc;
  --surface-warm: #e3dacc; --surface-manilla: #ebdbbc; --surface-kraft: #d4a27f;
  --border: #e8e6dc; --hairline: #d1cfc5; --inverse: #000000;
  --fg: #141413; --ink-soft: #3d3d3a; --muted: #5e5d59; --mid: #b0aea5; --text-tertiary: #87867f;
  --cta: #141413; --on-cta: #faf9f5; --cta-hover: #3d3d3a;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.12); --accent-fg: #b85c3d;
  --on-accent: #141413; --accent-deep: #c6613f;
  --up: #63784a; --up-raw: #788c5d; --dn: #a85536; --info: #46719f; --info-raw: #6a9bcc;
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --disp: var(--font-sans); --ui: var(--font-sans); --body: var(--font-serif); --mono: var(--font-mono);
  --text-label: 10px; --text-body-player: 14px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --r-sm: 8px; --r: 12px; --r-md: 16px; --r-lg: 24px; --r-pill: 999px;
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --focus: #d97757; --ease: cubic-bezier(0.16, 1, 0.3, 1); --dur: 160ms;
  --tap: 44px; --tap-lg: 48px; --z-toast: 100;
}
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413; --surface: #1d1c1a; --soft: #26241f; --soft-hover: #2e2c28;
  --border: rgba(250, 249, 245, 0.10); --hairline: rgba(250, 249, 245, 0.08);
  --fg: #faf9f5; --ink-soft: #e8e6dc; --muted: #b0aea5; --mid: #6b675e;
  --cta: #faf9f5; --on-cta: #141413; --cta-hover: #e8e6dc;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.18); --accent-fg: #e5a184; --on-accent: #141413;
  --up: #9db284; --dn: #de9e82; --info: #93b7dc;
  --shadow: none; --focus: #d97757;
}
[data-theme="light"] { color: #141413; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
@media (pointer: coarse) { :root { --floor: var(--tap); } }
:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }

/* ═══ PlayerHQ · Øvelsesbank (fase2/W1) ═══
   Rute: /portal/drills (kanonisk — /portal/tren/ovelser er redirect hit).
   Kilde: DrillMal-tabellen (appens egen øvelsesbank). Demo-drillene er
   HENTET fra fasit-filene (workbench-mobil + chat-desktop) — ALDRI
   påfunnede driller (drill-banken i masterbrain er tom med vilje).
   Ordbok: «Nærspill», aldri «kort spill». */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,summary,input,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }

/* Filterchips — aria-pressed inverterer til blekk (mønsterdok §5) */
.chips{ display:flex; gap:var(--s2); overflow-x:auto; scrollbar-width:none;
  padding-bottom:var(--s1); margin-bottom:var(--s3); }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:none; min-height:var(--tap); padding:0 var(--s3); border-radius:var(--r-pill);
  border:1px solid var(--border); background:transparent; font-size:13px; cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; color:inherit; text-decoration:none; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(var(--s8) + env(safe-area-inset-bottom)); }

.nowblock{ background:var(--accent-soft); border:1px solid var(--border);
  border-radius:var(--r); padding:var(--s4); margin-bottom:var(--s4); }
.nowblock h3{ margin:var(--s2) 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.nowblock p{ margin:0 0 var(--s4); font-family:var(--body); font-size:14px;
  color:var(--muted); max-width:52ch; }

.drill{ display:flex; align-items:center; gap:var(--s3); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r); padding:var(--s3) var(--s4);
  margin-bottom:var(--s2); text-decoration:none; color:inherit; }
.drill:hover{ border-color:var(--mid); }
.drill .tx{ flex:1; min-width:0; }
.drill .dn2{ font-size:13.5px; font-weight:600; display:block; }
.drill .dm{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted);
  margin-top:2px; }
.drill .df{ display:block; font-family:var(--mono); font-size:9.5px; color:var(--mid);
  margin-top:var(--s1); word-break:break-all; }

.why{ margin:var(--s3) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s2); animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }
button,.btn,summary,a.btn,a.drill,.chip{ min-height:var(--tap); }
.tag,.num,.eyebrow,.drill .df{ min-height:0; }
</style>
</head>
<body>
<p class="framehint">PlayerHQ · Øvelsesbank · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">
    <a class="ikon" href="../../fase1/playerhq-plan.html" aria-label="Til planen" data-od-id="drills-tilbake">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="min-width:0">
      <h1>Øvelsesbank</h1>
      <span class="sub" id="toppSub">Drills du kan legge i øktene dine</span>
    </div>
    <span style="flex:1"></span>
    <!-- demo-bryter · fjernes før koding -->
    <div data-demo-only="true" style="display:flex;gap:4px">
      <button class="ikon" data-tilstand="fylt" aria-pressed="true" aria-label="Demo: suksess" data-od-id="drills-demo-fylt"><span class="num" style="font-size:10px">F</span></button>
      <button class="ikon" data-tilstand="tom" aria-pressed="false" aria-label="Demo: tom" data-od-id="drills-demo-tom"><span class="num" style="font-size:10px">T</span></button>
      <button class="ikon" data-tilstand="laster" aria-pressed="false" aria-label="Demo: laster" data-od-id="drills-demo-laster"><span class="num" style="font-size:10px">L</span></button>
      <button class="ikon" data-tilstand="feil" aria-pressed="false" aria-label="Demo: feil" data-od-id="drills-demo-feil"><span class="num" style="font-size:10px">E</span></button>
    </div>
    <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="drills-theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="kropp" id="kropp"></main>
</div>

<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ Øvelsesbank · datamodell ═══
   Kilde: DrillMal (appens øvelsesbank). ALLE demo-driller er hentet fra
   eksisterende fasit-filer (workbench-mobil.html + chat-desktop-tur 3) —
   ingen påfunnede driller. AK-formel v2 per drill. Anbefalingen bygges
   fra SG-gapet (BrukerSgInput/Round — samme kilde som fokus-innløpet). */

var ANBEFALT = {
  navn:'Én ball, ett mål', omr:'Nærspill · chip',
  f:'SPILL_CHIP_AUTO_BANE_KONKURRANSE',
  hvorfor:'Nærspill er største SG-gapet ditt — denne trener chip under konkurransepress.'
};

var DRILLS = [
  { navn:'Avstandsstige 50–100 m', omr:'Innspill', tid:'35 min · 30 reps',
    f:'TEK_INNSPILL_50_LAV_HAST_TRENINGSOMRADE_ALENE', brukt:'brukt i 4 økter siste 30 dager' },
  { navn:'Halv sving · kalibrering', omr:'Innspill', tid:'30 min · 15 reps',
    f:'TEK_INNSPILL_50_UTEN_BALL_INNENDORS_ALENE', brukt:'brukt i 3 økter siste 30 dager' },
  { navn:'Én ball · én sjanse', omr:'Innspill', tid:'25 min · 12 reps',
    f:'SLAG_INNSPILL_100_AUTO_BANE_KONKURRANSE', brukt:'brukt i 2 økter siste 30 dager' },
  { navn:'Stigetrapp 50 → 100 m', omr:'Innspill', tid:'10 min',
    f:'TEK_INNSPILL_50_LAV_HAST_TRENINGSOMRADE_OBSERVERT', brukt:'brukt i 1 økt siste 30 dager' },
  { navn:'Landingskontroll 75 m', omr:'Innspill', tid:'8 min',
    f:'TEK_INNSPILL_50_LAV_HAST_TRENINGSOMRADE_OBSERVERT', brukt:'ny for deg' },
  { navn:'Én ball, ett mål', omr:'Nærspill', tid:'7 min',
    f:'SPILL_CHIP_AUTO_BANE_KONKURRANSE', brukt:'ny for deg' }
];

var FILTRE = ['Alle', 'TEK', 'SLAG', 'SPILL'];
var aktivtFilter = 'Alle';
var tilstand = 'fylt';

function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';

  if (tilstand === 'laster'){
    for (var i = 0; i < 7; i++){ var s = el('div', 'skel'); s.style.width = (95 - i*7) + '%'; w.appendChild(s); }
    return;
  }
  if (tilstand === 'tom'){
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Øvelsesbanken er tom'));
    t.appendChild(el('p', null,
      'Anders har ikke publisert driller ennå — banken fylles av coachen, ikke av appen. ' +
      'Øktene dine virker som før; drillene der ligger i selve økta.'));
    var b = el('button', 'btn now full', 'Spør Anders om øvelsesbanken');
    b.dataset.odId = 'drills-tom-be';
    b.addEventListener('click', function(){
      document.getElementById('live').textContent = 'Spørsmål sendt til Anders'; });
    t.appendChild(b); w.appendChild(t); return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Klarte ikke å hente øvelsesbanken'));
    f.appendChild(el('p', null,
      'Banken svarte ikke innen 30 sekunder. Drillene i planlagte økter ligger ' +
      'i selve økta og virker som før.'));
    var fb = el('button', 'btn now full', 'Prøv igjen'); fb.dataset.odId = 'drills-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f); return;
  }

  /* ── Suksess ── */
  var nb = el('div', 'nowblock');
  nb.appendChild(el('div', 'eyebrow', 'Én ting nå · anbefalt for deg'));
  nb.appendChild(el('h3', null, ANBEFALT.navn + ' · ' + ANBEFALT.omr));
  nb.appendChild(el('p', null,
    'Nærspill er største SG-gapet ditt. Denne driller chip under konkurransepress — ' +
    'og den er kort nok til å legges på slutten av torsdagsøkta.'));
  /* Kontrakt §3: skjermens ene aksenthandling — legger drillen i neste økt. */
  var b2 = el('button', 'btn now full', 'Legg i neste økt');
  b2.dataset.odId = 'drills-anbefalt-legg';
  b2.addEventListener('click', function(){
    document.getElementById('live').textContent = ANBEFALT.navn + ' lagt i torsdagsøkta — Anders får beskjed'; });
  nb.appendChild(b2);
  var wd = el('details', 'why'); wd.dataset.odId = 'drills-why-anbefalt';
  wd.appendChild(el('summary', null, 'Hvorfor denne drillen'));
  var ul = document.createElement('ul');
  ['Kilde: SG-tallene dine siste 10 runder — nærspill ligger −1,8 mot kategorisnittet, størst av de fire områdene.',
   'Beregning: banken filtreres på området med størst gap, så på press-nivået fra planen din.',
   'Forbehold: en anbefaling, aldri et pålegg — Anders ser hva du legger inn og kan justere.']
   .forEach(function(x){ ul.appendChild(el('li', null, x)); });
  wd.appendChild(ul); nb.appendChild(wd);
  w.appendChild(nb);

  var ch = el('div', 'chips');
  ch.setAttribute('role', 'group'); ch.setAttribute('aria-label', 'Filtrer på pyramide');
  FILTRE.forEach(function(f2){
    var c = el('button', 'chip', f2);
    c.setAttribute('aria-pressed', String(f2 === aktivtFilter));
    c.dataset.odId = 'drills-filter-' + f2.toLowerCase();
    c.addEventListener('click', function(){ aktivtFilter = f2; render(); });
    ch.appendChild(c);
  });
  w.appendChild(ch);

  var synlige = DRILLS.filter(function(d){
    return aktivtFilter === 'Alle' || d.f.indexOf(aktivtFilter + '_') === 0; });
  w.appendChild(el('div', 'eyebrow', 'drills · ' + synlige.length + ' av ' + DRILLS.length));
  var lw = el('div'); lw.style.marginTop = 'var(--s2)';
  synlige.forEach(function(d, i){
    var a = el('a', 'drill');
    a.href = 'playerhq-drill-detalj.html'; a.dataset.odId = 'drills-rad-' + i;
    var tx = el('div', 'tx');
    tx.appendChild(el('span', 'dn2', d.navn));
    tx.appendChild(el('span', 'dm', d.omr + ' · ' + d.tid + ' · ' + d.brukt));
    tx.appendChild(el('span', 'df', d.f));
    a.appendChild(tx);
    lw.appendChild(a);
  });
  if (!synlige.length){
    var ing = el('div', 'tom');
    ing.appendChild(el('h3', null, 'Ingen drills i dette filteret'));
    ing.appendChild(el('p', null, 'Prøv et annet pyramide-område — eller «Alle».'));
    lw.appendChild(ing);
  }
  w.appendChild(lw);
}

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){ tilstand = b.dataset.tilstand; settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(KEY, next); } catch(e){}
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();
</script>
</body>
</html>

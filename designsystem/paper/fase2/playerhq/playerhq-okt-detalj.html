<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
:root {
  --bg: #faf9f5; --surface: #ffffff; --soft: #f0eee6; --soft-hover: #e8e6dc;
  --surface-warm: #e3dacc; --surface-manilla: #ebdbbc; --surface-kraft: #d4a27f;
  --border: #e8e6dc; --hairline: #d1cfc5; --inverse: #000000;
  --fg: #141413; --ink-soft: #3d3d3a; --muted: #5e5d59; --mid: #b0aea5; --text-tertiary: #87867f;
  --rail: #141413; --rail-fg: #b0aea5; --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08); --rail-active: rgba(250, 249, 245, 0.14);
  --cta: #141413; --on-cta: #faf9f5; --cta-hover: #3d3d3a;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.12); --accent-fg: #b85c3d;
  --on-accent: #141413; --accent-deep: #c6613f;
  --accent-coral: #ebcece; --accent-fig: #c46686; --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d; --accent-sky: #6a9bcc; --accent-heather: #cbcadb;
  --up: #63784a; --up-raw: #788c5d; --dn: #a85536; --info: #46719f; --info-raw: #6a9bcc;
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --disp: var(--font-sans); --ui: var(--font-sans); --body: var(--font-serif); --mono: var(--font-mono);
  --text-display: 32px; --text-title: 22px; --text-card: 16px; --text-panel: 14.5px;
  --text-body-agency: 13.5px; --text-body-player: 14px; --text-label: 10px; --text-kpi: 40px;
  --text-hero: 56px; --text-section: 40px; --text-prose: 18px; --text-prose-lg: 22px;
  --text-nav: 16px; --text-eyebrow: 12px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px;
  --r-none: 0px; --r-sm: 8px; --r: 12px; --r-md: 16px; --r-lg: 24px; --r-pill: 999px;
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none; --scrim: rgba(20, 20, 19, 0.4);
  --focus: #d97757; --ease: cubic-bezier(0.16, 1, 0.3, 1); --dur: 160ms; --dur-slow: 280ms;
  --tap: 44px; --tap-lg: 48px; --tap-capture: 60px;
  --logo-mark: #141413; --logo-dot: #b85c3d;
  --z-sticky: 10; --z-rail: 20; --z-sheet: 40; --z-modal: 50; --z-toast: 100; --z-command: 110;
}
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413; --surface: #1d1c1a; --soft: #26241f; --soft-hover: #2e2c28;
  --surface-warm: #2a2824; --border: rgba(250, 249, 245, 0.10); --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000; --fg: #faf9f5; --ink-soft: #e8e6dc; --muted: #b0aea5; --mid: #6b675e;
  --text-tertiary: #87867f; --rail: #0e0d0c; --rail-fg: #97938a; --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06); --rail-active: rgba(250, 249, 245, 0.12);
  --cta: #faf9f5; --on-cta: #141413; --cta-hover: #e8e6dc;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.18); --accent-fg: #e5a184; --on-accent: #141413;
  --up: #9db284; --up-raw: #788c5d; --dn: #de9e82; --info: #93b7dc; --info-raw: #6a9bcc;
  --shadow: none; --focus: #d97757; --logo-mark: #faf9f5; --logo-dot: #d97757;
}
[data-theme="light"] { color: #141413; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
@media (pointer: coarse) { :root { --floor: var(--tap); } }
:root{ --softer:#f6f4ee; --border-soft:#efede4; }

/* ═══ PlayerHQ · Økt-detalj (fase2/W1 · vedtak Anders 05.08.2026) ═══
   ERSTATTER TO RUTER: /portal/gjennomfore/[id] (OktV2, TrainingSessionV2
   Spor B) og /portal/tren/[sessionId]/planlagt (OktPlanlagtV2, inviter-
   kompis) — slått sammen til ÉN skjerm med planlagt/fullført-tilstand.
   Nås fra Plan (uka) og Hjem (dagens økt). Ingen sløyfe-nav her —
   sløyfa hører til dagens live-flyt (playerhq-live-brief.html).

   Eierskapsmodellen (Anders 01.08.2026): Øyvind eier planen sin.
   Ingenting sperrer. Anders får varsling, ikke en forespørsel. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; color:inherit; text-decoration:none; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(var(--s8) + env(safe-area-inset-bottom)); }

.nowblock{ background:var(--accent-soft); border:1px solid var(--border);
  border-radius:var(--r); padding:var(--s4); margin-bottom:var(--s4); }
.nowblock h3{ margin:var(--s2) 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.nowblock p{ margin:0 0 var(--s4); font-family:var(--body); font-size:14px;
  color:var(--muted); max-width:52ch; }
.nowblock .rad2{ display:flex; gap:var(--s2); flex-wrap:wrap; }
.nowblock .rad2 .btn{ flex:1; }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s4); }
.kort .rad{ display:flex; align-items:baseline; gap:var(--s2); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:13px; }
.kort .rad:last-child{ border-bottom:0; }
.kort .rad .v{ margin-left:auto; font-family:var(--mono); text-align:right; }
.maal{ margin:0 0 var(--s2); font-family:var(--body); font-size:15px; }

.drill{ border:1px solid var(--border); border-radius:var(--r); padding:var(--s3);
  margin-bottom:var(--s2); background:var(--surface); display:flex; gap:var(--s3);
  align-items:flex-start; }
.drill .dtx{ min-width:0; flex:1; }
.drill .dn2{ font-size:13.5px; font-weight:600; }
.drill .dm{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.drill .df{ display:block; font-family:var(--mono); font-size:9.5px; color:var(--mid);
  margin-top:var(--s1); word-break:break-all; }
.drill .hake{ flex:none; width:22px; height:22px; border-radius:var(--r-pill);
  display:grid; place-items:center; border:1px solid var(--border); color:var(--mid); }
.drill .hake.ok{ background:var(--soft); color:var(--up); border-color:var(--hairline); }
.drill .hake svg{ width:13px; height:13px; fill:none; stroke:currentColor;
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

.res{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); margin-bottom:var(--s4); }
.res .c{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s3) var(--s4); }
.res .c .n2{ font-family:var(--mono); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }

.eier{ display:flex; gap:var(--s3); padding:var(--s3) var(--s4); border-radius:var(--r);
  background:var(--soft); border:1px solid var(--border); margin-bottom:var(--s4);
  font-family:var(--body); font-size:12.5px; color:var(--muted); }
.eier svg{ width:16px; height:16px; flex:none; margin-top:2px; fill:none;
  stroke:var(--muted); stroke-width:1.7; }

.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.tom .valg{ display:flex; flex-direction:column; gap:var(--s2); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s2); animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }

.why{ margin:var(--s3) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

/* ── rediger-tilstand (20.08.2026) ── */
.felt2{ margin-bottom:var(--s3); }
.felt2 label{ display:block; font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:var(--s1); }
.inp{ width:100%; min-height:var(--tap); padding:0 var(--s3); font:inherit; font-size:14px; color:var(--fg); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); }
textarea.inp{ min-height:72px; padding:var(--s2) var(--s3); font-family:var(--body); resize:vertical; }
.seg{ display:flex; gap:var(--s1); flex-wrap:wrap; }
.seg button{ min-height:var(--tap); padding:0 var(--s3); font-size:12.5px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); cursor:pointer; }
.seg button[aria-pressed="true"]{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.step2{ display:inline-flex; align-items:center; gap:var(--s2); }
.step2 button{ width:var(--tap); height:var(--tap); display:grid; place-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); font-family:var(--mono); font-size:16px; cursor:pointer; }
.step2 .val{ font-family:var(--mono); font-size:15px; font-weight:600; min-width:2.5ch; text-align:center; }
.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,summary,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow,.drill .df{ min-height:0; }
</style>
</head>

<script>
(function(){
'use strict';

/* ═══ Økt-detalj · datamodell ═══
   Kilder: TrainingPlanSession (økta + drills) · TrainingLog (resultat) ·
   PlayerEnrollment (inviter-kompis-kandidater fra samme gruppe).
   AK-formel v2: Pyramide_Område_Motorikk_Belastning_Press.
   Demo-kanon: Øyvind Rohjan (spiller), Anders Kristiansen (coach).
   Økta er o2 fra workbench-desktop.html — samme data, samme formler. */

/* Teknikk-dimensjon (VOKABULAR §3.4, 20.08.2026): ÉN per drill, valgt fra
   områdegruppens liste. Motorikk finnes KUN på fullsving-områder — på
   nærspill/bunker/putt/fys/bane finnes feltet ikke (ikke grået, ikke tomt). */
var DIM_VALG = { fullsving:['Sikte','Startretning','Kurve','Treffpunkt'],
  putt:['Greenlesing','Sikte','Ballstart','Lengdekontroll'],
  chip:['Landingspunkt','Utrulling','Treffpunkt','Køllevalg'] };
var OKT = {
  id:'o2', dagNavn:'Tirsdag 4.8', start:'15:00', slutt:'16:30',
  navn:'Innspill · lengdekontroll', akse:'TEK', sted:'Gamle Fredrikstad GK',
  maal:'Ni av tolv innenfor fire meter fra 50–100 m.', tidMin:90,
  drills:[
    { navn:'Halv sving · kalibrering', reps:15, tidMin:30, gruppe:'fullsving', dim:'Treffpunkt',
      f:'TEK_INNSPILL_50_UTEN_BALL_INNENDORS_ALENE' },
    { navn:'Avstandsstige 50–100 m', reps:30, tidMin:35, gruppe:'fullsving', dim:'Kurve',
      f:'TEK_INNSPILL_50_LAV_HAST_TRENINGSOMRADE_ALENE' },
    { navn:'Én ball · én sjanse', reps:12, tidMin:25, gruppe:'fullsving', dim:'Treffpunkt',
      f:'SLAG_INNSPILL_100_AUTO_BANE_KONKURRANSE' }
  ]
};

/* Gjennomført-varianten — kilde: TrainingLog for samme økt. */
var RESULTAT = {
  fullfortKl:'16:38', treff:9, av:12, maalNaadd:true,
  drillsGjort:[true, true, true],
  notat:'Wedgen føltes tung etter slag 12 — fanget i chatten 16:12.'
};

/* Inviter-kandidater — kilde: PlayerEnrollment, samme gruppe (GFGK U19). */
var KOMPISER = ['Markus H.', 'Sander L.'];

var NESTE = { dagNavn:'Torsdag 6.8', start:'16:00', navn:'Nærspill · landingspunkt' };

var tilstand = 'fylt';

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function tid(m){ var t = Math.floor(m/60), r = m%60;
  return t ? (r ? t+' t '+r+' min' : t+' t') : r+' min'; }

function hake(ok){
  var h = el('span', 'hake' + (ok ? ' ok' : ''));
  h.innerHTML = ok
    ? '<svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg>'
    : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>';
  return h;
}

function metaKort(erGjort){
  var m = el('div', 'kort');
  m.appendChild(el('div', 'eyebrow', OKT.navn));
  var rader = [
    ['Når', OKT.dagNavn + ' ' + OKT.start + '–' + OKT.slutt],
    ['Sted', OKT.sted],
    ['Varighet', tid(OKT.tidMin)],
    ['Pyramide', OKT.akse],
    ['Publisert av', 'Anders Kristiansen · 30.07']
  ];
  if (erGjort) rader.push(['Fullført', OKT.dagNavn + ' ' + RESULTAT.fullfortKl]);
  rader.forEach(function(pr){
    var r = el('div', 'rad');
    r.appendChild(el('span', null, pr[0]));
    r.appendChild(el('span', 'v num', pr[1]));
    m.appendChild(r);
  });
  return m;
}

function drillListe(erGjort){
  var wrap = el('div');
  wrap.appendChild(el('div', 'eyebrow', 'drills · ' + OKT.drills.length + ' · ' + tid(OKT.tidMin)));
  var dw = el('div'); dw.style.marginTop = 'var(--s2)';
  OKT.drills.forEach(function(d, i){
    var dd = el('div', 'drill');
    if (erGjort) dd.appendChild(hake(RESULTAT.drillsGjort[i]));
    var tx = el('div', 'dtx');
    tx.appendChild(el('span', 'dn2', d.navn));
    tx.appendChild(el('span', 'dm', d.reps + ' reps · ' + tid(d.tidMin) + ' · ' + d.dim));
    tx.appendChild(el('span', 'df', d.f));
    dd.appendChild(tx);
    dw.appendChild(dd);
  });
  wrap.appendChild(dw);
  return wrap;
}

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';
  var sub = document.getElementById('toppSub');
  sub.textContent = OKT.dagNavn + ' · uke 32';

  if (tilstand === 'laster'){
    for (var i = 0; i < 7; i++){ var s = el('div', 'skel'); s.style.width = (95 - i*7) + '%'; w.appendChild(s); }
    return;
  }
  if (tilstand === 'tom'){
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Fant ikke økta'));
    t.appendChild(el('p', null,
      'Den kan være slettet fra planen, eller lenken er gammel. ' +
      'Neste økt i planen er ' + NESTE.navn.toLowerCase() + ' ' +
      NESTE.dagNavn.toLowerCase() + ' kl. ' + NESTE.start + '.'));
    var v = el('div', 'valg');
    /* Kontrakt §3: i tom tilstand er planen veien videre — ett trykk. */
    var pl = el('a', 'btn now full', 'Åpne planen');
    pl.href = '../../fase1/playerhq-plan.html'; pl.dataset.odId = 'okt-tom-plan';
    v.appendChild(pl);
    t.appendChild(v); w.appendChild(t); return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Klarte ikke å hente økta'));
    f.appendChild(el('p', null,
      'Planen svarte ikke innen 30 sekunder. Er økta allerede startet, ' +
      'ligger loggen trygt — ingenting er mistet.'));
    /* Kontrakt §3: i feiltilstand er «Prøv igjen» skjermens ene aksenthandling. */
    var fb = el('button', 'btn now full', 'Prøv igjen'); fb.dataset.odId = 'okt-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f); return;
  }

  if (tilstand === 'rediger'){
    /* ── Rediger (20.08.2026) — spilleren eier økta, alt kan endres.
       Ingen sperrer, ingen validering mot regler. Lagre varsler Anders. ── */
    var rk = el('div', 'kort');
    rk.appendChild(el('div', 'eyebrow', 'rediger økt'));
    [['Navn', OKT.navn, 'text'], ['Sted', OKT.sted, 'text']].forEach(function(fp){
      var fw = el('div', 'felt2'); fw.style.marginTop = 'var(--s3)';
      var lb = el('label', null, fp[0]); lb.htmlFor = 'f-' + fp[0]; fw.appendChild(lb);
      var inp = el('input', 'inp'); inp.type = fp[2]; inp.value = fp[1]; inp.id = 'f-' + fp[0];
      fw.appendChild(inp); rk.appendChild(fw);
    });
    var tidrad = el('div'); tidrad.style.cssText = 'display:flex;gap:var(--s2)';
    [['Start', OKT.start], ['Slutt', OKT.slutt]].forEach(function(tp){
      var fw = el('div', 'felt2'); fw.style.flex = '1';
      var lb = el('label', null, tp[0]); lb.htmlFor = 'f-' + tp[0]; fw.appendChild(lb);
      var inp = el('input', 'inp num'); inp.type = 'time'; inp.value = tp[1]; inp.id = 'f-' + tp[0];
      fw.appendChild(inp); tidrad.appendChild(fw);
    });
    rk.appendChild(tidrad);
    var mw = el('div', 'felt2');
    var mlb = el('label', null, 'Målsetning'); mlb.htmlFor = 'f-maal'; mw.appendChild(mlb);
    var mta = el('textarea', 'inp'); mta.value = OKT.maal; mta.id = 'f-maal';
    mw.appendChild(mta); rk.appendChild(mw);
    w.appendChild(rk);

    OKT.drills.forEach(function(d, i){
      var dk = el('div', 'kort');
      dk.appendChild(el('div', 'eyebrow', 'drill ' + (i + 1)));
      var nw = el('div', 'felt2'); nw.style.marginTop = 'var(--s2)';
      var nlb = el('label', null, 'Navn'); nlb.htmlFor = 'd-navn-' + i; nw.appendChild(nlb);
      var ninp = el('input', 'inp'); ninp.type = 'text'; ninp.value = d.navn; ninp.id = 'd-navn-' + i;
      nw.appendChild(ninp); dk.appendChild(nw);
      var reprad = el('div', 'felt2');
      reprad.appendChild(el('label', null, 'Reps'));
      var st = el('div', 'step2');
      var mn = el('button', null, '−'); mn.type = 'button'; mn.setAttribute('aria-label', 'Færre reps'); mn.dataset.odId = 'okt-rediger-reps-ned-' + i;
      var vv = el('span', 'val num', String(d.reps));
      var pl2 = el('button', null, '+'); pl2.type = 'button'; pl2.setAttribute('aria-label', 'Flere reps'); pl2.dataset.odId = 'okt-rediger-reps-opp-' + i;
      mn.addEventListener('click', function(){ if (d.reps > 1){ d.reps--; vv.textContent = String(d.reps); } });
      pl2.addEventListener('click', function(){ d.reps++; vv.textContent = String(d.reps); });
      st.appendChild(mn); st.appendChild(vv); st.appendChild(pl2);
      reprad.appendChild(st); dk.appendChild(reprad);
      var dw2 = el('div', 'felt2');
      dw2.appendChild(el('label', null, 'Teknikk-dimensjon · velg én'));
      var sg = el('div', 'seg'); sg.setAttribute('role', 'group'); sg.setAttribute('aria-label', 'Teknikk-dimensjon');
      DIM_VALG[d.gruppe].forEach(function(dim){
        var b = el('button', null, dim); b.type = 'button';
        b.setAttribute('aria-pressed', String(d.dim === dim));
        b.dataset.odId = 'okt-rediger-dim-' + i + '-' + dim.toLowerCase();
        b.addEventListener('click', function(){ d.dim = dim;
          sg.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); }); });
        sg.appendChild(b);
      });
      dw2.appendChild(sg); dk.appendChild(dw2);
      /* Motorikk: KUN fullsving (VOKABULAR §3.1). På andre områder rendres
         blokken under ikke i det hele tatt. */
      if (d.gruppe === 'fullsving'){
        var mo = el('div', 'felt2');
        mo.appendChild(el('label', null, 'Motorikk'));
        var msg = el('div', 'seg'); msg.setAttribute('role', 'group'); msg.setAttribute('aria-label', 'Motorikk');
        var valgt = d.f.indexOf('UTEN_BALL') > -1 ? 'Uten ball' : d.f.indexOf('LAV_HAST') > -1 ? 'Lav hastighet' : 'Automatikk';
        ['Uten ball', 'Lav hastighet', 'Automatikk'].forEach(function(m2){
          var b = el('button', null, m2); b.type = 'button';
          b.setAttribute('aria-pressed', String(m2 === valgt));
          b.dataset.odId = 'okt-rediger-mot-' + i + '-' + m2.replace(/ /g, '-').toLowerCase();
          b.addEventListener('click', function(){
            msg.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); }); });
          msg.appendChild(b);
        });
        mo.appendChild(msg); dk.appendChild(mo);
      }
      var fj = el('button', 'btn sm', 'Fjern drill'); fj.type = 'button'; fj.dataset.odId = 'okt-rediger-fjern-' + i;
      fj.addEventListener('click', function(){ toast('Drillen fjernes når du lagrer'); });
      dk.appendChild(fj);
      w.appendChild(dk);
    });
    var leggtil = el('button', 'btn full', 'Legg til drill'); leggtil.type = 'button'; leggtil.dataset.odId = 'okt-rediger-ny-drill';
    leggtil.addEventListener('click', function(){ toast('Drillbiblioteket åpnes i et ark'); });
    w.appendChild(leggtil);
    var lr = el('div'); lr.style.cssText = 'display:flex;gap:var(--s2);margin-top:var(--s4)';
    var lagre = el('button', 'btn now', 'Lagre endringer'); lagre.type = 'button'; lagre.dataset.odId = 'okt-rediger-lagre'; lagre.style.flex = '1';
    lagre.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); toast('Lagret — Anders får beskjed'); });
    var avbryt = el('button', 'btn', 'Avbryt'); avbryt.type = 'button'; avbryt.dataset.odId = 'okt-rediger-avbryt';
    avbryt.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    lr.appendChild(lagre); lr.appendChild(avbryt);
    w.appendChild(lr);
    var e2 = el('div', 'eier'); e2.style.marginTop = 'var(--s4)';
    e2.appendChild(el('span', null, 'Alt her er ditt å endre. Ingen regler sperrer — Anders får beskjed om endringene, ikke en forespørsel.'));
    w.appendChild(e2);
    return;
  }

  if (tilstand === 'gjort'){
    /* ── Gjennomført ── */
    var rg = el('div', 'res');
    var c1 = el('div', 'c');
    c1.appendChild(el('div', 'eyebrow', 'resultat'));
    c1.appendChild(el('div', 'n2', RESULTAT.treff + ' av ' + RESULTAT.av));
    c1.appendChild(el('span', 'tag ' + (RESULTAT.maalNaadd ? 'up' : ''),
      RESULTAT.maalNaadd ? 'Mål nådd' : 'Under mål'));
    var c2 = el('div', 'c');
    c2.appendChild(el('div', 'eyebrow', 'endring'));
    c2.appendChild(el('div', 'n2', '+2'));
    c2.appendChild(el('span', 'tag up', 'vs 30.07'));
    rg.appendChild(c1); rg.appendChild(c2);
    w.appendChild(rg);

    var wk = el('div', 'kort');
    wk.appendChild(el('div', 'eyebrow', 'målsetning'));
    wk.appendChild(el('p', 'maal prose', OKT.maal));
    var wd = el('details', 'why'); wd.dataset.odId = 'okt-why-resultat';
    wd.appendChild(el('summary', null, 'Hvorfor dette tallet'));
    var ul = document.createElement('ul');
    ['Kilde: loggen fra økta ' + OKT.dagNavn + ', drill «Én ball · én sjanse» — 12 slag, 9 innenfor 4 m.',
     'Beregning: endringen er mot samme drill 30.07 (7 av 12). Samme avstandsbånd, samme formel.',
     'Forbehold: tallet gjelder treningsområdet, ikke bane. Anders ser samme tall i sin stall.']
     .forEach(function(x){ ul.appendChild(el('li', null, x)); });
    wd.appendChild(ul); wk.appendChild(wd);
    w.appendChild(wk);

    if (RESULTAT.notat){
      var nk = el('div', 'kort');
      nk.appendChild(el('div', 'eyebrow', 'din observasjon'));
      nk.appendChild(el('p', 'maal prose', RESULTAT.notat));
      w.appendChild(nk);
    }

    w.appendChild(metaKort(true));
    w.appendChild(drillListe(true));

    /* Kontrakt §3: gjennomført økt — den ene aksenthandlingen peker på det
       neste som skjer: neste økt i planen. Å lese oppsummeringen er lesing —
       vanlig knapp. */
    var rad = el('div'); rad.style.cssText = 'display:flex;gap:var(--s2);margin-top:var(--s4)';
    var neste = el('a', 'btn now', 'Åpne neste økt');
    neste.href = '../../fase1/playerhq-plan.html'; neste.dataset.odId = 'okt-gjort-neste';
    neste.style.flex = '1';
    var opps = el('a', 'btn', 'Se oppsummering');
    opps.href = '../../fase1/playerhq-live-summary.html'; opps.dataset.odId = 'okt-gjort-summary';
    rad.appendChild(neste); rad.appendChild(opps);
    w.appendChild(rad);
    return;
  }

  /* ── Planlagt (fylt) ── */
  var nb = el('div', 'nowblock');
  nb.appendChild(el('div', 'eyebrow', 'Én ting nå'));
  var h = el('h3');
  h.appendChild(document.createTextNode('Økta starter kl. '));
  h.appendChild(el('span', 'num', OKT.start));
  nb.appendChild(h);
  nb.appendChild(el('p', null,
    OKT.sted + ' er booket ' + OKT.start + '–' + OKT.slutt + '. ' +
    'Alt du trenger står klart under — du trenger ikke gjøre noe før du er der.'));
  var rad2 = el('div', 'rad2');
  /* Kontrakt §3: skjermens ene aksenthandling. Nedtelling er informasjon,
     ikke sperre — å starte tidlig er helt greit. */
  var start = el('a', 'btn now', 'Start økta');
  start.href = '../../fase1/playerhq-live-brief.html'; start.dataset.odId = 'okt-start';
  var flytt = el('a', 'btn', 'Flytt økta');
  flytt.href = '../../fase1/playerhq-plan.html'; flytt.dataset.odId = 'okt-flytt';
  var rediger = el('button', 'btn', 'Rediger');
  rediger.type = 'button'; rediger.dataset.odId = 'okt-rediger';
  rediger.addEventListener('click', function(){ tilstand = 'rediger'; settDemo(); });
  rad2.appendChild(start); rad2.appendChild(flytt); rad2.appendChild(rediger);
  nb.appendChild(rad2);
  w.appendChild(nb);

  w.appendChild(metaKort(false));

  var mk = el('div', 'kort');
  mk.appendChild(el('div', 'eyebrow', 'målsetning'));
  mk.appendChild(el('p', 'maal prose', OKT.maal));
  var wd2 = el('details', 'why'); wd2.dataset.odId = 'okt-why-maal';
  wd2.appendChild(el('summary', null, 'Hvorfor dette tallet'));
  var ul2 = document.createElement('ul');
  ['Kilde: økta 30.07, innspill 50–100 m. 12 slag registrert, 7 innenfor 4 m.',
   'Beregning: målet er sist gang pluss to — 7 av 12 ble 9 av 12.',
   'Forbehold: foreslått fra IUP-en din. Veiledende, aldri låst — du kan endre det når du starter.']
   .forEach(function(x){ ul2.appendChild(el('li', null, x)); });
  wd2.appendChild(ul2); mk.appendChild(wd2);
  w.appendChild(mk);

  w.appendChild(drillListe(false));

  /* Inviter-kompis — funksjonen fra /tren/[sessionId]/planlagt, beholdt.
     Kilde: PlayerEnrollment, samme gruppe. */
  var ik = el('div', 'kort'); ik.style.marginTop = 'var(--s4)';
  ik.appendChild(el('div', 'eyebrow', 'tren sammen'));
  var ip = el('p', 'maal prose');
  ip.style.fontSize = '13.5px';
  ip.textContent = KOMPISER.join(' og ') + ' fra gruppa di er ledige i samme tidsrom.';
  ik.appendChild(ip);
  var ib = el('button', 'btn sm', 'Inviter en kompis');
  ib.dataset.odId = 'okt-inviter';
  ib.addEventListener('click', function(){
    toast('Invitasjon sendt til Markus H.'); si('Invitasjon sendt'); });
  ik.appendChild(ib);
  w.appendChild(ik);

  var e = el('div', 'eier');
  e.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/>' +
    '<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  e.appendChild(el('span', null,
    'Økta er din. Du kan endre målet, hoppe over drills eller droppe hele økta — ' +
    'ingenting sperrer. Anders får beskjed, så han vet hva som skjedde.'));
  w.appendChild(e);
}

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){ tilstand = b.dataset.tilstand; settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(KEY, next); } catch(e){}
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();
</script>
</body>
</html>

<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
:root {
  --bg: #faf9f5; --surface: #ffffff; --soft: #f0eee6; --soft-hover: #e8e6dc;
  --surface-warm: #e3dacc; --border: #e8e6dc; --hairline: #d1cfc5; --inverse: #000000;
  --fg: #141413; --ink-soft: #3d3d3a; --muted: #5e5d59; --mid: #b0aea5; --text-tertiary: #87867f;
  --rail: #141413; --rail-fg: #b0aea5; --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08); --rail-active: rgba(250, 249, 245, 0.14);
  --cta: #141413; --on-cta: #faf9f5; --cta-hover: #3d3d3a;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.12); --accent-fg: #b85c3d; --on-accent: #141413;
  --accent-olive: #788c5d; --accent-sky: #6a9bcc; --accent-fig: #c46686; --accent-cactus: #bcd1ca; --accent-heather: #cbcadb;
  --up: #63784a; --up-raw: #788c5d; --dn: #a85536; --info: #46719f; --info-raw: #6a9bcc;
  --font-sans: "Poppins", Arial, system-ui, sans-serif; --font-serif: "Lora", Georgia, "Times New Roman", serif; --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --disp: var(--font-sans); --ui: var(--font-sans); --body: var(--font-serif); --mono: var(--font-mono);
  --text-label: 10px; --text-body-player: 14px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --r-sm: 8px; --r: 12px; --r-lg: 24px; --r-pill: 999px;
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05); --scrim: rgba(20, 20, 19, 0.4);
  --focus: #d97757; --ease: cubic-bezier(0.16, 1, 0.3, 1); --dur: 160ms;
  --tap: 44px; --tap-lg: 48px;
  --logo-mark: #141413; --logo-dot: #b85c3d;
  --z-rail: 20; --z-toast: 100;
}
[data-theme="dark"] {
  color: #faf9f5; --bg: #141413; --surface: #1d1c1a; --soft: #26241f; --soft-hover: #2e2c28;
  --border: rgba(250, 249, 245, 0.10); --hairline: rgba(250, 249, 245, 0.08);
  --fg: #faf9f5; --muted: #b0aea5; --mid: #6b675e;
  --rail: #0e0d0c; --rail-fg: #97938a; --rail-on: #faf9f5;
  --cta: #faf9f5; --on-cta: #141413; --accent-soft: rgba(217, 119, 87, 0.18); --accent-fg: #e5a184;
  --up: #9db284; --up-raw: #788c5d; --dn: #de9e82; --info: #93b7dc; --shadow: none; --logo-mark: #faf9f5; --logo-dot: #d97757;
}
[data-theme="light"] { color: #141413; }
:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
@media (pointer: coarse) { :root { --floor: var(--tap); } }

/* ═══ PlayerHQ · Hull-analyse (rute /portal/analysere/hull) ═══
   Mal §12 detaljside (todelt: sone-kart + hull-for-hull-tabell).
   Malmanifest: docs/port/w2-komponent-manifest-analysere.md.
   Ikke geografisk banekart — sone-diagrammet er tee→innspill→nærspill→putt,
   aggregert over spillerens runder, samme data som listen under. */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui); font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,summary,[tabindex]):focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2); min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500; background:transparent; border:1px solid var(--border); border-radius:var(--r); cursor:pointer; white-space:nowrap; text-decoration:none; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.full{ width:100%; }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative; overflow:hidden; background:var(--bg); border:1px solid var(--border); border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){ .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; } .framehint{ display:none; } }
@media (min-width:1024px){ .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; } .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; } .tilbake-rad > *{ max-width:720px; margin-left:auto; margin-right:auto; } }
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }
.phone .scrim{ position:absolute; }

.tilbake-rad{ flex:none; padding:var(--s3) var(--s4) 0; background:var(--surface); }
.tilbake{ display:inline-flex; align-items:center; gap:4px; min-height:var(--tap); font-family:var(--mono); font-size:11px; letter-spacing:.03em; color:var(--muted); text-decoration:none; }
.tilbake:hover{ color:var(--fg); }

.topp{ flex:none; padding:var(--s2) var(--s4) var(--s3); border-bottom:1px solid var(--border); background:var(--surface); }
.topprad{ display:flex; align-items:center; gap:var(--s2); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:2px; }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center; background:transparent; border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; }

.segs{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4); overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); }
.segs::-webkit-scrollbar{ display:none; }
.segs button{ flex:none; min-height:var(--tap); padding:0 var(--s4); font-size:13px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-pill); color:var(--muted); cursor:pointer; }
.segs button[aria-current="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }

.kropp{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4) var(--s4) calc(var(--s8) + env(safe-area-inset-bottom)); }
.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:var(--s4); margin-bottom:var(--s3); }
.kort > .eyebrow{ display:block; margin-bottom:var(--s2); }
.kort .eyebrow-rad{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s2); margin-bottom:var(--s2); }
.kort .eyebrow-rad .eyebrow{ margin-bottom:0; }

/* Sone-diagram: fire soner koblet av en linje */
.sonediag{ display:flex; align-items:flex-start; gap:4px; }
.sonelinje{ flex:0 1 10px; min-width:6px; height:2px; border-radius:2px; background:var(--border); align-self:center; margin-top:20px; }
.soneblok{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px 10px; border-radius:var(--r); background:var(--soft); border:1px solid var(--border); }
.soneblok .kode{ font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.soneblok .v{ font-family:var(--mono); font-size:13px; font-weight:600; }
.soneblok .v.pos{ color:var(--up); } .soneblok .v.neg{ color:var(--dn); } .soneblok .v.na{ color:var(--mid); }
.soneblok .spor{ width:70%; height:4px; border-radius:var(--r-pill); background:var(--border); overflow:hidden; }
.soneblok .spor i{ display:block; height:100%; border-radius:var(--r-pill); }

/* SG-stolper med nullinje i midten (delt mønster med playerhq-analyse.html) */
.sg{ margin-top:var(--s2); }
.sgrad{ display:grid; grid-template-columns:82px minmax(0,1fr) 58px; gap:var(--s2); align-items:center; min-height:34px; }
.sgrad .n{ font-size:12.5px; }
.sgrad .v{ font-family:var(--mono); font-size:13px; text-align:right; }
.sgrad .v.pos{ color:var(--up); } .sgrad .v.neg{ color:var(--dn); }
.spor2{ position:relative; height:10px; background:var(--soft); border-radius:var(--r-pill); }
.spor2 .null{ position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--hairline); }
.spor2 i{ position:absolute; top:0; bottom:0; border-radius:var(--r-pill); }
.spor2 i.pos{ background:var(--up-raw); left:50%; } .spor2 i.neg{ background:var(--dn); right:50%; }

/* Per-sone liste */
.rader{ display:flex; flex-direction:column; }
.rad{ display:flex; align-items:center; gap:var(--s3); min-height:52px; padding:var(--s2) 0; border-bottom:1px solid var(--border-soft); cursor:default; }
.rad:last-child{ border-bottom:0; }
.rad .tekst{ flex:1; min-width:0; }
.rad .tekst .t{ font-size:13px; font-weight:500; }
.rad .tekst .m{ display:block; font-size:11.5px; color:var(--muted); margin-top:1px; }
.rad .spark{ flex:none; width:56px; height:20px; }
.rad .spark polyline{ fill:none; stroke:var(--mid); stroke-width:1.3; }
.rad .trail{ flex:none; width:78px; text-align:right; font-family:var(--mono); font-size:12.5px; font-weight:600; }
.rad .trail.pos{ color:var(--up); } .rad .trail.neg{ color:var(--dn); } .rad .trail.na{ color:var(--mid); }

/* KPI-fliser */
.kpirad{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2); margin-bottom:var(--s3); }
.kpifl{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:var(--s3); text-align:center; }
.kpifl .l{ display:block; font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
.kpifl .v{ font-family:var(--mono); font-size:18px; font-weight:600; }

/* Scorekort-tabell (18 hull, DataTable-mønster: rulling i egen container, klebrig hode) */
.dtwrap{ max-height:280px; overflow:auto; border-top:1px solid var(--border); margin-top:var(--s2); }
.tab{ width:100%; border-collapse:collapse; }
.tab thead th{ position:sticky; top:0; background:var(--surface); text-align:left; font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:500; padding:var(--s2) var(--s1); border-bottom:1px solid var(--border); }
.tab td{ padding:8px var(--s1); border-bottom:1px solid var(--border-soft); font-size:12.5px; }
.tab tr:last-child td{ border-bottom:0; }
.tab td.r,.tab th.r{ text-align:right; font-family:var(--mono); }
.tab td.pos{ color:var(--up); } .tab td.neg{ color:var(--dn); }
.tab tfoot td{ padding:var(--s2) var(--s1) 0; border-bottom:0; font-family:var(--mono); font-size:11px; color:var(--muted); }

/* Varmekart: UT/INN-rutenett, én kategorisk risikofarge (aldri blandet med opp-farge) */
.varme{ overflow-x:auto; margin-top:var(--s2); }
.varmerad{ display:flex; align-items:center; gap:var(--s2); margin-bottom:6px; }
.varmerad .lab{ flex:none; width:34px; font-family:var(--mono); font-size:9.5px; color:var(--muted); text-transform:uppercase; }
.varmerad .celler{ display:flex; gap:4px; }
.vcelle{ width:30px; height:30px; border-radius:var(--r-sm); display:grid; place-items:center; font-family:var(--mono); font-size:10px; font-weight:600; border:1px solid var(--border); cursor:default; color:var(--fg); }
.varmelegende{ display:flex; align-items:center; gap:6px; margin-top:var(--s3); font-family:var(--mono); font-size:9.5px; color:var(--muted); }
.varmelegende .lstrip{ width:64px; height:8px; border-radius:var(--r-pill); background:linear-gradient(to right, var(--soft), var(--dn)); }

.merknad{ font-family:var(--body); font-size:12px; color:var(--muted); padding:var(--s2) var(--s3); background:var(--soft); border-radius:var(--r-sm); margin-bottom:var(--s3); }
.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border); border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }
.tom.mini{ padding:var(--s4); }

.faner{ flex:none; display:flex; background:var(--rail); z-index:var(--z-rail); padding-bottom:env(safe-area-inset-bottom); }
.faner a{ flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--rail-fg); text-decoration:none; font-size:10px; position:relative; }
.faner a svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.faner a[aria-current="page"]{ color:var(--rail-on); }
.faner a[aria-current="page"]::before{ content:""; position:absolute; top:0; left:24%; right:24%; height:2px; background:var(--rail-on); border-radius:var(--r-pill); }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:var(--z-toast); background:var(--fg); color:var(--bg); padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,a.btn{ min-height:var(--tap); }
</style>
</head>

<script>
(function(){
'use strict';

/* ═══ Datamodell — matcher AnalysereHullV2Data (src/components/portal/v2/AnalysereHullV2.tsx) ═══
   soner: SG + trening siste 30 d per sone (OTT/APP/ARG/PUTT).
   runde: siste registrerte runde med hull-for-hull (18 hull).
   hullVarme: snitt avvik-fra-par per hull over ALLE runder (min. 3 runder krevd, se hole-heatmap.ts). */

var SONER = [
  { kode:'OTT',  label:'Tee total',  sub:'Tee-slag',            sg:0.81,  okter:4, minutter:140, trend:[0.2,0.4,0.5,0.6,0.7,0.81] },
  { kode:'APP',  label:'Innspill',   sub:'Tilnærming',          sg:-0.44, okter:6, minutter:210, trend:[0.1,-0.1,-0.2,-0.3,-0.4,-0.44] },
  { kode:'ARG',  label:'Nærspill',   sub:'Chip, pitch, bunker', sg:1.20,  okter:5, minutter:170, trend:[0.6,0.8,0.9,1.0,1.1,1.20] },
  { kode:'PUTT', label:'Putt',       sub:'Putting',             sg:1.35,  okter:3, minutter:110, trend:[0.9,1.0,1.1,1.2,1.3,1.35] }
];
var SG_REGISTRERINGER = 8;

var RUNDE = {
  bane:'Emigrant Golfklubb', totalScore:71,
  hull: [
    [1,4,4],[2,3,3],[3,5,5],[4,4,5],[5,4,4],[6,3,4],[7,5,5],[8,4,4],[9,4,3],
    [10,4,4],[11,3,3],[12,5,4],[13,4,5],[14,4,4],[15,3,3],[16,5,5],[17,4,4],[18,4,4]
  ]
};

var HULLVARME_RUNDEANTALL = 6;
var HULLVARME = [
  0.10,0.00,0.05,0.35,0.00,0.55,0.00,-0.10,-0.15,
  0.05,0.00,-0.20,0.30,0.00,-0.05,0.05,0.00,0.05
];

var fane = 'sone', tilstand = 'fylt';

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function komma(n){ return String(n).replace('.', ','); }
function sgTekst(v){ return (v > 0 ? '+' : v < 0 ? '−' : '') + komma(Math.abs(v).toFixed(2)); }
function signertHel(n){ return n === 0 ? 'E' : (n > 0 ? '+' : '−') + Math.abs(n); }

function tomKort(eyebrow, tittel, forklaring, mini){
  var k = el('div', 'kort');
  if (eyebrow) k.appendChild(el('span', 'eyebrow', eyebrow));
  var t = el('div', 'tom' + (mini ? ' mini' : ''));
  t.appendChild(el('h3', null, tittel));
  t.appendChild(el('p', null, forklaring));
  k.appendChild(t);
  return k;
}

/* ── Fane: Sone-kart ─────────────────────────────────────────────────── */
function renderSone(w){
  var harData = tilstand === 'fylt';

  var diagK = el('div', 'kort');
  diagK.appendChild(el('span', 'eyebrow', 'sone-kart · tee → innspill → nærspill → putt'));
  var diag = el('div', 'sonediag');
  SONER.forEach(function(s, i){
    if (i > 0) diag.appendChild(el('span', 'sonelinje'));
    var b = el('div', 'soneblok');
    b.appendChild(el('span', 'kode', s.kode));
    var vis = harData;
    b.appendChild(el('span', 'v ' + (vis ? (s.sg >= 0 ? 'pos' : 'neg') : 'na'), vis ? sgTekst(s.sg) : '—'));
    var sp = el('span', 'spor'); var i2 = document.createElement('i');
    i2.style.width = vis ? (Math.min(100, Math.abs(s.sg) * 40 + 14) + '%') : '0%';
    i2.style.background = vis ? (s.sg >= 0 ? 'var(--up)' : 'var(--dn)') : 'var(--mid)';
    sp.appendChild(i2); b.appendChild(sp);
    diag.appendChild(b);
  });
  diagK.appendChild(diag);
  w.appendChild(diagK);

  if (harData){
    var maks = Math.max.apply(null, SONER.map(function(d){ return Math.abs(d.sg); }));
    var sgK = el('div', 'kort');
    sgK.appendChild(el('span', 'eyebrow', 'sg per sone · mot Broadie scratch'));
    var sg = el('div', 'sg');
    SONER.forEach(function(d){
      var r = el('div', 'sgrad');
      r.appendChild(el('span', 'n', d.label));
      var sp = el('span', 'spor2'); sp.appendChild(el('span', 'null'));
      var i = document.createElement('i');
      i.className = d.sg >= 0 ? 'pos' : 'neg';
      i.style.width = (Math.abs(d.sg) / maks * 48) + '%';
      sp.appendChild(i); r.appendChild(sp);
      r.appendChild(el('span', 'v num ' + (d.sg >= 0 ? 'pos' : 'neg'), sgTekst(d.sg) + ' slag'));
      sg.appendChild(r);
    });
    sgK.appendChild(sg);
    w.appendChild(sgK);
  } else {
    w.appendChild(tomKort('sg per sone', 'Ingen SG-registreringer ennå',
      'Logg en runde med Strokes Gained, så fylles sonene med dine faktiske tall.'));
  }

  var listK = el('div', 'kort');
  var er = el('div', 'eyebrow-rad');
  er.appendChild(el('span', 'eyebrow', 'per sone'));
  er.appendChild(el('span', 'num', harData ? (SG_REGISTRERINGER + ' SG-registreringer') : '0 SG-registreringer'));
  listK.appendChild(er);
  var rader = el('div', 'rader');
  SONER.forEach(function(s){
    var r = el('div', 'rad');
    var tekst = el('div', 'tekst');
    tekst.appendChild(el('span', 't', s.label));
    tekst.appendChild(el('span', 'm', s.sub + ' · ' + (harData ? s.okter : 0) + ' økter · ' + (harData ? s.minutter : 0) + ' min siste 30 d'));
    r.appendChild(tekst);

    var svgNs = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNs, 'svg');
    svg.setAttribute('viewBox', '0 0 56 20'); svg.setAttribute('class', 'spark'); svg.setAttribute('aria-hidden', 'true');
    if (harData && s.trend.length > 1){
      var mn = Math.min.apply(null, s.trend), mx = Math.max.apply(null, s.trend);
      var pts = s.trend.map(function(v, i){
        var x = i / (s.trend.length - 1) * 56;
        var y = 18 - (mx === mn ? 9 : (v - mn) / (mx - mn) * 16);
        return x + ',' + y;
      }).join(' ');
      var pl = document.createElementNS(svgNs, 'polyline'); pl.setAttribute('points', pts); svg.appendChild(pl);
    }
    r.appendChild(svg);

    r.appendChild(el('span', 'trail ' + (harData ? (s.sg >= 0 ? 'pos' : 'neg') : 'na'), harData ? (sgTekst(s.sg) + ' slag') : '—'));
    rader.appendChild(r);
  });
  listK.appendChild(rader);
  w.appendChild(listK);
}

/* ── Fane: Hull for hull ─────────────────────────────────────────────── */
function renderHull(w){
  var harData = tilstand === 'fylt';

  if (!harData){
    w.appendChild(tomKort('hull for hull', 'Ingen runder med hull-score ennå',
      'Logg en runde hull for hull, så ser du fordelingen her.'));
    w.appendChild(tomKort('varmekart · hvor du taper slag', 'For få runder til varmekart',
      'Logg minst 3 runder hull for hull, så vises varmekartet over banen.'));
    return;
  }

  var parSum = RUNDE.hull.reduce(function(s,h){ return s + h[1]; }, 0);
  var slagSum = RUNDE.hull.reduce(function(s,h){ return s + h[2]; }, 0);
  var parDiff = slagSum - parSum;
  var snittPerHull = parDiff / RUNDE.hull.length;
  var snittTekst = (snittPerHull >= 0 ? '+' : '−') + komma(Math.abs(snittPerHull).toFixed(1));

  var caps = el('span', 'eyebrow', 'siste runde · ' + RUNDE.bane);
  caps.style.display = 'block'; caps.style.marginBottom = 'var(--s2)';
  w.appendChild(caps);

  var kpirad = el('div', 'kpirad');
  [['Score (brutto)', String(RUNDE.totalScore)], ['Mot par', signertHel(parDiff)], ['Snitt per hull', snittTekst]].forEach(function(k){
    var f = el('div', 'kpifl');
    f.appendChild(el('span', 'l', k[0]));
    f.appendChild(el('span', 'v num', k[1]));
    kpirad.appendChild(f);
  });
  w.appendChild(kpirad);

  var tabK = el('div', 'kort');
  tabK.appendChild(el('span', 'eyebrow', 'scorekort · 18 hull'));
  var dtwrap = el('div', 'dtwrap');
  var tab = el('table', 'tab');
  var thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Hull</th><th class="r">Par</th><th class="r">Score</th><th class="r">Mot par</th></tr>';
  tab.appendChild(thead);
  var tbody = document.createElement('tbody');
  RUNDE.hull.forEach(function(h){
    var diff = h[2] - h[1];
    var tr = document.createElement('tr');
    tr.appendChild(el('td', null, String(h[0])));
    tr.appendChild(el('td', 'r num', String(h[1])));
    tr.appendChild(el('td', 'r num', String(h[2])));
    tr.appendChild(el('td', 'r num ' + (diff > 0 ? 'neg' : diff < 0 ? 'pos' : ''), signertHel(diff)));
    tbody.appendChild(tr);
  });
  tab.appendChild(tbody);
  var tfoot = document.createElement('tfoot');
  var trf = document.createElement('tr');
  var tdf = el('td', null, 'Sum'); tdf.colSpan = 1; trf.appendChild(tdf);
  trf.appendChild(el('td', 'r', String(parSum)));
  trf.appendChild(el('td', 'r', String(slagSum)));
  trf.appendChild(el('td', 'r ' + (parDiff > 0 ? 'neg' : parDiff < 0 ? 'pos' : ''), signertHel(parDiff)));
  tfoot.appendChild(trf); tab.appendChild(tfoot);
  dtwrap.appendChild(tab); tabK.appendChild(dtwrap);
  w.appendChild(tabK);

  var varmeK = el('div', 'kort');
  var ver = el('div', 'eyebrow-rad');
  ver.appendChild(el('span', 'eyebrow', 'varmekart · hvor du taper slag'));
  ver.appendChild(el('span', 'num', HULLVARME_RUNDEANTALL + ' runder m/ hull-for-hull'));
  varmeK.appendChild(ver);
  var varme = el('div', 'varme');
  [['UT', HULLVARME.slice(0,9), 0], ['INN', HULLVARME.slice(9,18), 9]].forEach(function(rad){
    var rd = el('div', 'varmerad');
    rd.appendChild(el('span', 'lab', rad[0]));
    var celler = el('div', 'celler');
    rad[1].forEach(function(diff, i){
      var intensitet = Math.max(0, Math.min(1, diff / 1.0));
      var c = el('div', 'vcelle', String(rad[2] + i + 1));
      c.style.background = 'color-mix(in srgb, var(--dn) ' + Math.round(intensitet * 70) + '%, var(--soft))';
      c.title = 'Hull ' + (rad[2] + i + 1) + ': ' + signertHel(Math.round(diff*10)/10).replace('+0','E').replace('−0','E') + ' mot par · ' + HULLVARME_RUNDEANTALL + ' runder';
      celler.appendChild(c);
    });
    rd.appendChild(celler);
    varme.appendChild(rd);
  });
  varmeK.appendChild(varme);
  var leg = el('div', 'varmelegende');
  leg.appendChild(el('span', null, 'på/under par'));
  leg.appendChild(el('span', 'lstrip'));
  leg.appendChild(el('span', null, 'konsekvent bogey+'));
  varmeK.appendChild(leg);
  w.appendChild(varmeK);
}

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';
  w.appendChild(el('p', 'merknad',
    'Tallene er målinger, ikke karakterer. Ingen terskler er vurdert — regler og låser er midlertidig ute.'));
  if (fane === 'sone') renderSone(w); else renderHull(w);
}

document.querySelectorAll('.segs button').forEach(function(b){
  b.addEventListener('click', function(){
    fane = b.dataset.fane;
    document.querySelectorAll('.segs button').forEach(function(x){ x.setAttribute('aria-current','false'); });
    b.setAttribute('aria-current','true');
    render(); si('Viser ' + b.textContent + '.');
  });
});

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){ tilstand = b.dataset.tilstand; settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();
</script>

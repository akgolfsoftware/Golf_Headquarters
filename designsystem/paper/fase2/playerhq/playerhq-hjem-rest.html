<!-- FIDELITET: MAL — avvik per rute i fase2/manifest-w2-komplett.md. Mørk modus og tilstander er IKKE definert her; de ligger i fase2/playerhq/w3-base.css. -->
<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utenfor banen · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="w3-base.css">
<style>
.tilbake-rad{flex:none;padding:var(--s3) var(--s4) 0;background:var(--surface)}
.tilbake{display:inline-flex;align-items:center;gap:4px;min-height:var(--tap);font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none}
.btn.ink{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.faneknapper{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.faneknapper button{flex:1;min-height:40px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:12.5px;cursor:pointer;color:inherit}
.faneknapper button[aria-pressed="true"]{background:var(--soft);font-weight:600;border-color:var(--hairline)}
.nu{background:var(--accent-soft);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s4)}
.nu .eyebrow{display:block;color:var(--accent-fg);margin-bottom:var(--s2)}
.nu h2{margin:0 0 var(--s1);font-family:var(--disp);font-size:16px;font-weight:600}
.nu p{margin:0 0 var(--s3);font-family:var(--body);font-size:13.5px;color:var(--muted);max-width:46ch;text-wrap:pretty}
.eyebrow-rad{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3)}
.uke{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:var(--s3)}
.dag{border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 2px;text-align:center;background:var(--surface)}
.dag .d{display:block;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dag .p{display:block;width:10px;height:10px;border-radius:999px;margin:6px auto 0;background:var(--soft);border:1px solid var(--border)}
.dag.gjort .p{background:var(--up);border-color:var(--up)}
.dag.planlagt{background:var(--soft)}
.dag.planlagt .p{background:transparent;border-style:dashed;border-color:var(--mid)}
.orad{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:var(--s2);align-items:center;min-height:44px;border-bottom:1px solid var(--border-soft)}
.orad:last-child{border-bottom:0}
.orad .on{font-size:13px;font-weight:500}
.orad .om{display:block;font-family:var(--mono);font-size:10px;color:var(--mid);margin-top:1px}
.orad .ov{font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:right}
.orad .ov.pos{color:var(--up)}
.prad{display:flex;align-items:center;gap:var(--s3);min-height:52px;padding:var(--s2) 0;border-bottom:1px solid var(--border-soft);text-decoration:none;color:inherit}
.prad:last-child{border-bottom:0}
.avatar{flex:none;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--border);font-family:var(--mono);font-size:11px;font-weight:700}
.prad .tx{flex:1;min-width:0}.prad .tn{font-size:13px;font-weight:500}
.prad .tm{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.prad .tr{font-family:var(--mono);font-size:12.5px;font-weight:600}
.prad .tr.meg{color:var(--accent-fg)}
.ukort{border:1px solid var(--border);border-radius:var(--r);padding:var(--s3) var(--s4);margin-bottom:var(--s2);background:var(--surface)}
.ukort .un{font-size:13.5px;font-weight:600}
.ukort .um{display:block;font-family:var(--body);font-size:12.5px;color:var(--muted);margin-top:2px;text-wrap:pretty}
.spor{position:relative;height:10px;background:var(--soft);border-radius:var(--r-pill);overflow:hidden;margin-top:var(--s3)}
.spor i{position:absolute;inset:0 auto 0 0;background:var(--up-raw);border-radius:var(--r-pill)}
.sporfot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--mid);margin-top:6px}
.forklar{font-family:var(--mono);font-size:10.5px;color:var(--mid);margin-top:var(--s3);letter-spacing:.03em}
.faner{flex:none;display:flex;background:#141413;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.faner a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#b0aea5;text-decoration:none;font-size:10px;position:relative}
.faner a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.faner a[aria-current="page"]{color:#faf9f5}
.faner a[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:2px;background:#faf9f5;border-radius:var(--r-pill)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:var(--z-toast);background:var(--fg);color:var(--bg);padding:var(--s3) var(--s4);border-radius:var(--r);font-size:13px}
</style>
</head>
<body>
<p class="framehint">PlayerHQ · I dag → Utenfor banen · 430 px. Under 641 px fyller den skjermen.</p>
<div class="phone">
  <div class="tilbake-rad"><a class="tilbake" href="../../fase1/playerhq-chat-mobil.html" data-od-id="rest-tilbake">‹ I dag</a></div>
  <header class="topp">
    <div style="min-width:0"><h1>Utenfor banen</h1><span class="sub" id="undertekst">Fysisk · lag · utfordringer</span></div>
    <span style="flex:1"></span>
    <div style="display:flex;gap:4px">
      <button class="ikon" data-tilstand="fylt" aria-pressed="true" aria-label="Demo: med data" data-od-id="rest-demo-fylt"><span class="num" style="font-size:10px">S</span></button>
      <button class="ikon" data-tilstand="tom" aria-pressed="false" aria-label="Demo: tom" data-od-id="rest-demo-tom"><span class="num" style="font-size:10px">T</span></button>
      <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="rest-theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>
  <main class="kropp" id="kropp"></main>
  <nav class="faner" aria-label="Hovednavigasjon"><a href="../../fase1/playerhq-chat-mobil.html" aria-current="page" data-od-id="tab-idag"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>I dag</a><a href="../../fase1/playerhq-plan.html" data-od-id="tab-plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</a><a href="../../fase1/playerhq-analyse.html" data-od-id="tab-analyse"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Analyse</a><a href="../../fase1/playerhq-meg.html" data-od-id="tab-meg"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Meg</a></nav>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>
<script>
(function(){
'use strict';
var live=document.getElementById('live'),toastEl=document.getElementById('toast'),toastT;
function toast(t){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true},2600)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var tilstand='fylt',fane='fysisk';
var UKE=[{d:'ma',s:'gjort'},{d:'ti',s:''},{d:'on',s:'gjort'},{d:'to',s:'planlagt'},{d:'fr',s:'planlagt'},{d:'lø',s:''},{d:'sø',s:''}];
var OVELSER=[
 {n:'Knebøy',m:'3 × 8 · 60 kg',v:'+5 kg',pos:true},
 {n:'Markløft',m:'3 × 5 · 85 kg',v:'=',pos:false},
 {n:'Rotasjon med kabel',m:'3 × 12 per side',v:'+2 rep',pos:true},
 {n:'Hoftemobilitet',m:'8 min',v:'Fullført',pos:false}
];
var LAG=[
 {i:'MB',n:'Mathias Berg',m:'HCP 8,1 · Bogstad',v:'−1,2',meg:false},
 {i:'ØR',n:'Øyvind Rohjan',m:'HCP 12,4 · Emigrant',v:'−0,4',meg:true},
 {i:'SL',n:'Sara Lund',m:'HCP 14,0 · Oslo GK',v:'−0,3',meg:false},
 {i:'JH',n:'Jonas Haug',m:'HCP 16,2 · Bogstad',v:'+0,1',meg:false}
];
var UTFORDRINGER=[
 {n:'30 dager med putting',m:'Minst 15 min putting hver dag i mai. 6 deltakere fra stallen.',gjort:18,mal:30,dager:'12 dager igjen'},
 {n:'Nærspill 8/10',m:'Treff 8 av 10 innenfor 2 meter i en økt. Én registrering per uke teller.',gjort:2,mal:4,dager:'Til 31. mai'}
];
function kort(){return el('div','kort')}
function render(){
 var w=document.getElementById('kropp');w.innerHTML='';
 if(tilstand==='tom'){
  document.getElementById('undertekst').textContent='Ingenting aktivert';
  var k=kort();var t=el('div','tom');
  t.appendChild(el('h3','','Ingenting aktivt utenfor banen'));
  t.appendChild(el('p','','Fysisk plan settes opp av coachen din. Lag og utfordringer krever at du er med i en stall som har det slått på — spør Anders hvis du vil bli med.'));
  var b=el('a','btn','Skriv til Anders');b.href='../../fase1/playerhq-chat-mobil.html';b.dataset.odId='rest-tom-chat';t.appendChild(b);
  k.appendChild(t);w.appendChild(k);return;
 }
 document.getElementById('undertekst').textContent='Øyvind Rohjan · 2 av 4 økter denne uka';
 var nu=el('div','nu');
 nu.appendChild(el('span','eyebrow','én ting nå'));
 nu.appendChild(el('h2','','Fysisk økt i dag — 35 min'));
 nu.appendChild(el('p','','Underkropp og rotasjon. Ligger som torsdagsøkt i planen, og du har fri før fredagstimen.'));
 var nb=el('button','btn now full','Start dagens fysiske økt');nb.dataset.odId='rest-nu-start';
 nb.addEventListener('click',function(){toast('Fysisk økt startet.')});
 nu.appendChild(nb);w.appendChild(nu);
 var fk=el('div','faneknapper');
 [['fysisk','Fysisk'],['lag','Lag'],['utfordring','Utfordringer']].forEach(function(f){
  var b=el('button',null,f[1]);b.setAttribute('aria-pressed',String(fane===f[0]));b.dataset.odId='rest-fane-'+f[0];
  b.addEventListener('click',function(){fane=f[0];render()});fk.appendChild(b)});
 w.appendChild(fk);
 if(fane==='fysisk'){
  var k1=kort();
  var er=el('div','eyebrow-rad');er.appendChild(el('span','eyebrow','uke 21'));er.appendChild(el('span','num','2/4 økter'));k1.appendChild(er);
  var u=el('div','uke');
  UKE.forEach(function(d){var c=el('div','dag'+(d.s?' '+d.s:''));c.appendChild(el('span','d',d.d));c.appendChild(el('span','p'));u.appendChild(c)});
  k1.appendChild(u);
  k1.appendChild(el('p','forklar','Fylt = gjennomført · stiplet = planlagt · tom = ikke satt opp.'));
  w.appendChild(k1);
  var k2=kort();
  var er2=el('div','eyebrow-rad');er2.appendChild(el('span','eyebrow','dagens økt'));er2.appendChild(el('span','num','35 min'));k2.appendChild(er2);
  OVELSER.forEach(function(o){
   var r=el('div','orad');
   var tx=el('div');tx.appendChild(el('span','on',o.n));tx.appendChild(el('span','om',o.m));r.appendChild(tx);
   r.appendChild(el('span','ov'+(o.pos?' pos':''),o.v));k2.appendChild(r);
  });
  var a=el('a','btn full','Åpne hele fysisk-planen');a.href='playerhq-fys-plan.html';a.style.marginTop='var(--s3)';a.dataset.odId='rest-fys-plan';k2.appendChild(a);
  w.appendChild(k2);
 }
 if(fane==='lag'){
  var k3=kort();
  var er3=el('div','eyebrow-rad');er3.appendChild(el('span','eyebrow','stall bogstad · sg siste 30 dager'));er3.appendChild(el('span','num','4 spillere'));k3.appendChild(er3);
  LAG.forEach(function(p){
   var r=el('div','prad');r.appendChild(el('span','avatar num',p.i));
   var tx=el('div','tx');tx.appendChild(el('span','tn',p.n+(p.meg?' (deg)':'')));tx.appendChild(el('span','tm',p.m));r.appendChild(tx);
   r.appendChild(el('span','tr'+(p.meg?' meg':''),p.v));k3.appendChild(r);
  });
  k3.appendChild(el('p','forklar','Kun spillere som har delt tallene sine med stallen. Deling styres under Meg → Personvern.'));
  w.appendChild(k3);
 }
 if(fane==='utfordring'){
  var k4=kort();
  var er4=el('div','eyebrow-rad');er4.appendChild(el('span','eyebrow','aktive utfordringer'));er4.appendChild(el('span','num',UTFORDRINGER.length+' aktive'));k4.appendChild(er4);
  UTFORDRINGER.forEach(function(u2){
   var c=el('div','ukort');
   c.appendChild(el('span','un',u2.n));c.appendChild(el('span','um',u2.m));
   var sp=el('div','spor');var i=el('i');i.style.width=Math.round(u2.gjort/u2.mal*100)+'%';sp.appendChild(i);c.appendChild(sp);
   var f2=el('div','sporfot');f2.appendChild(el('span',null,u2.gjort+' av '+u2.mal));f2.appendChild(el('span',null,u2.dager));c.appendChild(f2);
   k4.appendChild(c);
  });
  k4.appendChild(el('p','forklar','Utfordringer settes opp av coachen for hele stallen. Du kan ikke lage egne ennå.'));
  w.appendChild(k4);
 }
 live.textContent='Utenfor banen · '+fane;
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){b.addEventListener('click',function(){tilstand=b.dataset.tilstand;document.querySelectorAll('[data-tilstand]').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.tilstand===tilstand))});render()})});
var KEY='akhq-theme-playerhq',saved=localStorage.getItem(KEY);if(saved)document.documentElement.dataset.theme=saved;
document.getElementById('themeBtn').addEventListener('click',function(){var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem(KEY,n);this.setAttribute('aria-label',n==='dark'?'Bytt til lys modus':'Bytt til mørk modus')});
render();
})();
</script>
</body>
</html>

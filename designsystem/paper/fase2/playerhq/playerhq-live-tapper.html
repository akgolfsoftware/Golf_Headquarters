<!-- FIDELITET: PIXEL-FASIT -->
<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slagteller · PlayerHQ · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
:root {
  --bg: #faf9f5; --surface: #ffffff; --soft: #f0eee6; --soft-hover: #e8e6dc;
  --surface-warm: #e3dacc; --surface-manilla: #ebdbbc; --surface-kraft: #d4a27f;
  --border: #e8e6dc; --hairline: #d1cfc5; --inverse: #000000;
  --fg: #141413; --ink-soft: #3d3d3a; --muted: #5e5d59; --mid: #b0aea5; --text-tertiary: #87867f;
  --rail: #141413; --rail-fg: #b0aea5; --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08); --rail-active: rgba(250, 249, 245, 0.14);
  --cta: #141413; --on-cta: #faf9f5; --cta-hover: #3d3d3a;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.12); --accent-fg: #b85c3d;
  --on-accent: #141413; --accent-deep: #c6613f;
  --up: #63784a; --up-raw: #788c5d; --dn: #a85536; --info: #46719f; --info-raw: #6a9bcc;
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --disp: var(--font-sans); --ui: var(--font-sans); --body: var(--font-serif); --mono: var(--font-mono);
  --text-label: 10px; --text-kpi: 40px; --text-body-player: 14px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
  --r-sm: 8px; --r: 12px; --r-md: 16px; --r-lg: 24px; --r-pill: 999px;
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --scrim: rgba(20, 20, 19, 0.4);
  --focus: #d97757; --ease: cubic-bezier(0.16, 1, 0.3, 1); --dur: 160ms;
  --tap: 44px; --tap-lg: 48px; --tap-capture: 60px;
  --z-toast: 100;
}
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413; --surface: #1d1c1a; --soft: #26241f; --soft-hover: #2e2c28;
  --border: rgba(250, 249, 245, 0.10); --hairline: rgba(250, 249, 245, 0.08);
  --fg: #faf9f5; --ink-soft: #e8e6dc; --muted: #b0aea5; --mid: #6b675e;
  --cta: #faf9f5; --on-cta: #141413; --cta-hover: #e8e6dc;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.18); --accent-fg: #e5a184; --on-accent: #141413;
  --up: #9db284; --dn: #de9e82; --info: #93b7dc;
  --shadow: none; --focus: #d97757;
}
[data-theme="light"] { color: #141413; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
@media (pointer: coarse) { :root { --floor: var(--tap); } }
:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }

/* ═══ PlayerHQ · Slagteller (fase2/W1) ═══
   Rute: /portal/(fullscreen)/live/[sessionId]/tapper — rask slaglogging
   UNDER en økt: velg kølle, tapp per slag. Tommel-først: køllene er
   60px-flater (--tap-capture) nederst, telleren øverst.
   Kilde: Shot (manuell logging) — IKKE TrackManShot (egen import). */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *, .bunn > *{ max-width:720px; margin-left:auto; margin-right:auto; width:100%; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; color:inherit; text-decoration:none; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.kropp{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }

/* Telleren — skjermens hovedoppslag */
.telle{ text-align:center; padding:var(--s5) 0 var(--s4); }
.telle .stort{ font-family:var(--mono); font-size:var(--text-kpi); font-weight:600;
  font-variant-numeric:tabular-nums; line-height:1.1; }
.telle .under{ font-family:var(--body); font-size:13.5px; color:var(--muted); }

/* Sist loggede slag — angre-vindu */
.sist{ display:flex; align-items:center; gap:var(--s3); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r); padding:var(--s3) var(--s4);
  margin-bottom:var(--s3); }
.sist .tx{ flex:1; min-width:0; font-size:13px; }
.sist .tx .k{ font-weight:600; }
.sist .tx .t2{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }

/* Fordeling per kølle */
.ford .rad{ display:flex; align-items:center; gap:var(--s3); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:13px; }
.ford .rad:last-child{ border-bottom:0; }
.ford .stolpe{ flex:1; height:6px; background:var(--soft); border-radius:var(--r-pill);
  overflow:hidden; }
.ford .stolpe i{ display:block; height:100%; background:var(--mid); border-radius:var(--r-pill); }
.ford .n3{ font-family:var(--mono); font-variant-numeric:tabular-nums; min-width:2ch; text-align:right; }

/* Køllene — bunnfestet fangstflate, 60px-mål (Kontrakt §4: primær
   handling bunnfestet på mobil, aldri i scroll-flyt) */
.bunn{ flex:none; border-top:1px solid var(--border); background:var(--surface);
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom)); }
.klubber{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2);
  margin-bottom:var(--s3); }
.klubb{ min-height:var(--tap-capture); border:1px solid var(--border);
  border-radius:var(--r); background:var(--bg); font-size:14px; font-weight:500;
  cursor:pointer; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; }
.klubb:active{ background:var(--soft); transform:translateY(1px); }
.klubb .kn{ font-family:var(--mono); font-size:10px; color:var(--muted); }

.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s2); animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow{ min-height:0; }
</style>
</head>
<body>
<p class="framehint">PlayerHQ · Slagteller · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">
    <a class="ikon" href="../../fase1/playerhq-live-okt.html" aria-label="Til live-økta" data-od-id="tapper-tilbake">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="min-width:0">
      <h1>Slagteller</h1>
      <span class="sub">Innspill · lengdekontroll · 15:00–16:30</span>
    </div>
    <span style="flex:1"></span>
    <!-- demo-bryter · fjernes før koding -->
    <div data-demo-only="true" style="display:flex;gap:4px">
      <button class="ikon" data-tilstand="fylt" aria-pressed="true" aria-label="Demo: suksess" data-od-id="tapper-demo-fylt"><span class="num" style="font-size:10px">F</span></button>
      <button class="ikon" data-tilstand="tom" aria-pressed="false" aria-label="Demo: tom" data-od-id="tapper-demo-tom"><span class="num" style="font-size:10px">T</span></button>
      <button class="ikon" data-tilstand="laster" aria-pressed="false" aria-label="Demo: laster" data-od-id="tapper-demo-laster"><span class="num" style="font-size:10px">L</span></button>
      <button class="ikon" data-tilstand="feil" aria-pressed="false" aria-label="Demo: feil" data-od-id="tapper-demo-feil"><span class="num" style="font-size:10px">E</span></button>
    </div>
    <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="tapper-theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="kropp" id="kropp"></main>
  <div class="bunn" id="bunn" hidden>
    <div class="klubber" id="klubber"></div>
    <!-- Kontrakt §3: skjermens ene aksenthandling — avslutter tellingen og
         lagrer slagene i økta. Kølletappene er selve fangstflaten (blekk). -->
    <button class="btn now full" id="avslutt" data-od-id="tapper-avslutt">Avslutt og lagre</button>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ Slagteller · datamodell ═══
   Kilde: Shot-modellen (manuell logging), knyttet til økt o2 fra
   workbench-desktop.html. Køllelista er spillerens utstyrsbag
   (User → utstyrsbag) — demoen viser et vanlig oppsett. */

var KLUBBER = [
  { id:'driver', navn:'Driver' }, { id:'iron7', navn:'7-jern' },
  { id:'iron9', navn:'9-jern' }, { id:'pw', navn:'PW' },
  { id:'sw56', navn:'56°' }, { id:'putter', navn:'Putter' }
];

/* Allerede loggede slag denne økta (demo). */
var SLAG = [
  { klubb:'56°', kl:'15:41' }, { klubb:'56°', kl:'15:39' },
  { klubb:'PW', kl:'15:36' }, { klubb:'PW', kl:'15:33' },
  { klubb:'7-jern', kl:'15:28' }
];

var tilstand = 'fylt';

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';
  var bunn = document.getElementById('bunn');
  bunn.hidden = tilstand !== 'fylt';

  if (tilstand === 'laster'){
    for (var i = 0; i < 6; i++){ var s = el('div', 'skel'); s.style.width = (92 - i*9) + '%'; w.appendChild(s); }
    return;
  }
  if (tilstand === 'tom'){
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Ingen økt pågår'));
    t.appendChild(el('p', null,
      'Slagtelleren hører til en pågående økt. Start dagens økt, så teller vi derfra.'));
    /* Kontrakt §3: tom tilstand — én aksenthandling, én vei videre. */
    var b = el('a', 'btn now full', 'Start økta');
    b.href = '../../fase1/playerhq-live-brief.html'; b.dataset.odId = 'tapper-tom-start';
    t.appendChild(b); w.appendChild(t); return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Slagene ble ikke lagret'));
    f.appendChild(el('p', null,
      'Nettet forsvant under lagringen. De ' + SLAG.length + ' slagene ligger trygt på ' +
      'telefonen og sendes automatisk når nettet er tilbake.'));
    var fb = el('button', 'btn now full', 'Prøv igjen nå'); fb.dataset.odId = 'tapper-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f); return;
  }

  /* ── Suksess ── */
  var te = el('div', 'telle');
  te.appendChild(el('div', 'eyebrow', 'slag denne økta'));
  var st = el('div', 'stort num', String(SLAG.length));
  st.id = 'teller';
  te.appendChild(st);
  te.appendChild(el('div', 'under', 'Tapp kølla du slo med — ett tapp per slag.'));
  w.appendChild(te);

  if (SLAG.length){
    var s0 = SLAG[0];
    var si2 = el('div', 'sist');
    var tx = el('div', 'tx');
    var k = el('span', 'k', s0.klubb);
    tx.appendChild(k);
    tx.appendChild(document.createTextNode(' · siste slag'));
    tx.appendChild(el('span', 't2 num', 'kl. ' + s0.kl));
    si2.appendChild(tx);
    var angre = el('button', 'btn', 'Angre');
    angre.dataset.odId = 'tapper-angre';
    angre.addEventListener('click', function(){
      SLAG.shift(); toast('Slaget er fjernet'); si('Slaget er fjernet'); render(); });
    si2.appendChild(angre);
    w.appendChild(si2);

    var fk = el('div');
    fk.className = 'ford';
    fk.appendChild(el('div', 'eyebrow', 'fordeling per kølle'));
    var telling = {};
    SLAG.forEach(function(s){ telling[s.klubb] = (telling[s.klubb] || 0) + 1; });
    var maks = Math.max.apply(null, Object.keys(telling).map(function(k){ return telling[k]; }));
    Object.keys(telling).forEach(function(kn){
      var r = el('div', 'rad');
      var navn = el('span', null, kn); navn.style.minWidth = '64px';
      r.appendChild(navn);
      var stolpe = el('span', 'stolpe');
      var fyll = el('i'); fyll.style.width = Math.round(telling[kn] / maks * 100) + '%';
      stolpe.appendChild(fyll); r.appendChild(stolpe);
      r.appendChild(el('span', 'n3 num', String(telling[kn])));
      fk.appendChild(r);
    });
    w.appendChild(fk);
  }
}

function byggKlubber(){
  var kw = document.getElementById('klubber');
  KLUBBER.forEach(function(k){
    var b = el('button', 'klubb');
    b.dataset.odId = 'tapper-klubb-' + k.id;
    b.appendChild(el('span', null, k.navn));
    b.appendChild(el('span', 'kn num', 'tapp = 1 slag'));
    b.addEventListener('click', function(){
      SLAG.unshift({ klubb:k.navn, kl:'15:44' });
      si(k.navn + ' registrert — ' + SLAG.length + ' slag');
      render();
    });
    kw.appendChild(b);
  });
  document.getElementById('avslutt').addEventListener('click', function(){
    toast(SLAG.length + ' slag lagret i økta');
    si(SLAG.length + ' slag lagret');
    setTimeout(function(){ location.href = '../../fase1/playerhq-live-okt.html'; }, 900);
  });
}

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){ tilstand = b.dataset.tilstand; settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(KEY, next); } catch(e){}
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

byggKlubber();
render();
})();
</script>
</body>
</html>

/* akhq-tokens.css v3.1 — KOPIERT VERBATIM. */

<p class="framehint">PlayerHQ · Runder · 430 px. Under 641 px fyller den skjermen.</p>
<div class="phone" data-demo-only="true">

<script>
(function(){
'use strict';
var live=document.getElementById('live');function si(t){live.textContent=t}
var toastEl=document.getElementById('toast'),toastT;function toast(t){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true},2600)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function komma(n,d){d=d==null?1:d;return n.toFixed(d).replace('.',',')}
function sgTekst(v){return (v>0?'+':v<0?'−':'')+komma(Math.abs(v),2)}
function signertHel(n){return n===0?'E':(n>0?'+':'−')+Math.abs(n)}
var tilstand='fylt';

function tomKort(icon,tittel,tekst){var k=el('div','kort');var t=el('div','tom');t.appendChild(el('h3',null,tittel));t.appendChild(el('p',null,tekst));k.appendChild(t);return k}
var RUNDER=[
 {bane:'Emigrant Golfklubb',dato:'18. mai 2026',par:72,score:71,sg:0.42,best:true},
 {bane:'Oslo Golfklubb',dato:'11. mai 2026',par:72,score:76,sg:-1.10,best:false},
 {bane:'Bogstad Golfklubb',dato:'4. mai 2026',par:71,score:74,sg:-0.35,best:false},
 {bane:'Emigrant Golfklubb',dato:'27. april 2026',par:72,score:75,sg:-0.62,best:false}
];
function render(){
 var w=document.getElementById('kropp');w.innerHTML='';
 var harData=tilstand==='fylt';
 var kpirad=el('div','kpirad');
 [['Snittscore · brutto',harData?'74':'—'],['Snitt SG',harData?'−0,41':'—'],['Runder',harData?String(RUNDER.length):'0']].forEach(function(k){
  var f=el('div','kpifl'+(k[0]==='Runder'&&harData?' tint':''));f.appendChild(el('span','l',k[0]));f.appendChild(el('span','v num',k[1]));kpirad.appendChild(f)
 });
 w.appendChild(kpirad);
 if(!harData){
  var t=tomKort('flag','Ingen runder logget ennå','Loggfør din første runde — live-føring er raskest.');
  var b=el('button','btn ink full','Start live-føring');b.dataset.odId='runder-tom-live';b.addEventListener('click',function(){toast('Live-føring åpnes fra Runder-fanen.')});t.querySelector('.tom').appendChild(document.createElement('br'));t.appendChild(b);
  var l=el('a','btn full','Hurtig score — deretter importer fra UpGame på rundedetalj →');l.style.background='transparent';l.style.border='0';l.style.color='var(--muted)';l.style.fontSize='12px';l.href='#';l.dataset.odId='runder-tom-hurtig';t.appendChild(l);
  w.appendChild(t);return;
 }
 var br=el('div','btnrow');br.style.marginBottom='var(--s3)';
 var b1=el('button','btn ink','Start live-føring');b1.dataset.odId='runder-live';b1.addEventListener('click',function(){toast('Live-føring startet.')});
 var b2=el('button','btn','Før slag for slag');b2.dataset.odId='runder-slag';b2.addEventListener('click',function(){toast('Åpner slag-for-slag-føring.')});
 var b3=el('button','btn','Hurtig score');b3.dataset.odId='runder-hurtig';b3.addEventListener('click',function(){toast('Åpner hurtig-registrering.')});
 br.appendChild(b1);br.appendChild(b2);br.appendChild(b3);w.appendChild(br);
 var listK=el('div','kort');
 var er=el('div','eyebrow-rad');er.appendChild(el('span','eyebrow','runde-historikk'));er.appendChild(el('span','num',RUNDER.length+' runder'));listK.appendChild(er);
 var rader=el('div','rader');
 RUNDER.forEach(function(r){
  var a=el('a','rad');a.href='playerhq-runde-detalj.html';a.dataset.odId='runder-rad-'+r.bane.replace(/[^a-z]/gi,'').toLowerCase();
  var box=el('span','scorebox'+(r.best?' best':''));
  box.appendChild(el('span','s num',String(r.score)));box.appendChild(el('span','p num',signertHel(r.score-r.par)));
  a.appendChild(box);
  var tekst=el('div','tekst');var tRow=el('span','t');tRow.appendChild(document.createTextNode(r.bane));
  if(r.best){var star=el('span',null,'★');star.style.color='var(--up)';star.style.fontSize='11px';tRow.appendChild(star)}
  tekst.appendChild(tRow);tekst.appendChild(el('span','m',r.dato+' · Par '+r.par));a.appendChild(tekst);
  a.appendChild(el('span','trail '+(r.sg>=0?'pos':'neg'),sgTekst(r.sg)));
  var chev=el('span','chev','›');a.appendChild(chev);
  rader.appendChild(a);
 });
 listK.appendChild(rader);w.appendChild(listK);
}

function settDemo(){document.querySelectorAll('[data-tilstand]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.tilstand===tilstand))});render()}
document.querySelectorAll('[data-tilstand]').forEach(function(b){b.addEventListener('click',function(){tilstand=b.dataset.tilstand;settDemo()})});
var KEY='akhq-theme-playerhq';var saved=localStorage.getItem(KEY);if(saved)document.documentElement.dataset.theme=saved;
document.getElementById('themeBtn').addEventListener('click',function(){var next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(KEY,next);this.setAttribute('aria-label',next==='dark'?'Bytt til lys modus':'Bytt til mørk modus')});
render();
})();
</script>

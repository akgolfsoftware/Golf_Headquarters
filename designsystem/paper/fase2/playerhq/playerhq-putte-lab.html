<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Putte-lab · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="w3-base.css">
<style>
.tilbake-rad{flex:none;padding:var(--s3) var(--s4) 0;background:var(--surface)}
.tilbake{display:inline-flex;align-items:center;gap:4px;min-height:var(--tap);font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none}
.btn.ink{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.faneknapper{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.faneknapper button{flex:1;min-height:40px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:12.5px;cursor:pointer;color:inherit}
.faneknapper button[aria-pressed="true"]{background:var(--soft);font-weight:600;border-color:var(--hairline)}
.kpirad{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-bottom:var(--s3)}
.kpifl{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--s3);text-align:center}
.kpifl .l{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kpifl .v{font-family:var(--mono);font-size:18px;font-weight:600}
.kpifl .v.pos{color:var(--up)}.kpifl .v.neg{color:var(--dn)}
.eyebrow-rad{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3)}
.drad{display:grid;grid-template-columns:52px minmax(0,1fr) 62px;gap:var(--s2);align-items:center;min-height:38px}
.drad .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.drad .v{font-family:var(--mono);font-size:12.5px;text-align:right;font-weight:600}
.drad .v.pos{color:var(--up)}.drad .v.neg{color:var(--dn)}
.spor{position:relative;height:12px;background:var(--soft);border-radius:var(--r-pill);overflow:hidden}
.spor i{position:absolute;top:0;bottom:0;left:0;border-radius:var(--r-pill);background:var(--up-raw)}
.spor i.svak{background:var(--dn)}
.spor b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--hairline)}
.spor2{position:relative;height:12px;background:var(--soft);border-radius:var(--r-pill)}
.spor2 .null{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--hairline)}
.spor2 i{position:absolute;top:0;bottom:0;border-radius:var(--r-pill)}
.spor2 i.pos{background:var(--up-raw);left:50%}.spor2 i.neg{background:var(--dn);right:50%}
.forklar{font-family:var(--mono);font-size:10.5px;color:var(--mid);margin-top:var(--s2);letter-spacing:.03em}
.plot{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden}
.plot svg{display:block;width:100%;height:240px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:var(--s2)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:999px;margin-right:6px;vertical-align:middle}
.tab{width:100%;border-collapse:collapse}
.tab th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:var(--s2) var(--s1);border-bottom:1px solid var(--border)}
.tab td{padding:9px var(--s1);border-bottom:1px solid var(--border-soft);font-size:12.5px}
.tab tr:last-child td{border-bottom:0}
.tab td.r,.tab th.r{text-align:right;font-family:var(--mono)}
.tab td.pos{color:var(--up)}.tab td.neg{color:var(--dn)}
.tips{background:var(--soft);border-radius:var(--r-sm);padding:var(--s3) var(--s4);font-family:var(--body);font-size:13px;color:var(--muted);text-wrap:pretty}
.tips strong{color:var(--fg);font-family:var(--ui);font-size:12.5px}
.faner{flex:none;display:flex;background:#141413;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.faner a{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#b0aea5;text-decoration:none;font-size:10px;position:relative}
.faner a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.faner a[aria-current="page"]{color:#faf9f5}
.faner a[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:2px;background:#faf9f5;border-radius:var(--r-pill)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:var(--z-toast);background:var(--fg);color:var(--bg);padding:var(--s3) var(--s4);border-radius:var(--r);font-size:13px}
</style>
</head>
<body>
<p class="framehint">PlayerHQ · Putte-lab (dybde under Analyse) · 430 px. Under 641 px fyller den skjermen.</p>
<div class="phone">
  <div class="tilbake-rad"><a class="tilbake" href="../../fase1/playerhq-analyse.html" data-od-id="putt-tilbake">‹ Analyse</a></div>
  <header class="topp">
    <div style="min-width:0"><h1>Putte-lab</h1><span class="sub" id="undertekst">Øyvind Rohjan · 9 registreringer · siste 90 dager</span></div>
    <span style="flex:1"></span>
    <div style="display:flex;gap:4px">
      <button class="ikon" data-tilstand="fylt" aria-pressed="true" aria-label="Demo: med data" data-od-id="putt-demo-fylt"><span class="num" style="font-size:10px">S</span></button>
      <button class="ikon" data-tilstand="tom" aria-pressed="false" aria-label="Demo: tom" data-od-id="putt-demo-tom"><span class="num" style="font-size:10px">T</span></button>
      <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="putt-theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>
  <main class="kropp" id="kropp"></main>
  <nav class="faner" aria-label="Hovednavigasjon"><a href="../../fase1/playerhq-chat-mobil.html" data-od-id="tab-idag"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>I dag</a><a href="../../fase1/playerhq-plan.html" data-od-id="tab-plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</a><a href="../../fase1/playerhq-analyse.html" aria-current="page" data-od-id="tab-analyse"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Analyse</a><a href="../../fase1/playerhq-meg.html" data-od-id="tab-meg"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Meg</a></nav>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>
<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var live=document.getElementById('live'),toastEl=document.getElementById('toast'),toastT;
function toast(t){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true},2600)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function s(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
function komma(n,d){d=d==null?1:d;return n.toFixed(d).replace('.',',')}
function sg(v){return (v>0?'+':v<0?'−':'')+komma(Math.abs(v),2)}
var tilstand='fylt',fane='treff';
var AVSTAND=[
 {n:'0–1 m',treff:97,ref:98,ant:64,sg:0.06},
 {n:'1–2 m',treff:71,ref:78,ant:41,sg:-0.21},
 {n:'2–3 m',treff:44,ref:47,ant:33,sg:-0.04},
 {n:'3–5 m',treff:22,ref:27,ant:38,sg:-0.18},
 {n:'5–9 m',treff:9,ref:12,ant:29,sg:-0.11},
 {n:'9 m +',treff:3,ref:4,ant:21,sg:0.02}
];
var LENGDE=[
 {n:'2 m',avvik:0.18},{n:'4 m',avvik:0.31},{n:'6 m',avvik:0.55},
 {n:'8 m',avvik:0.92},{n:'12 m',avvik:1.48},{n:'16 m',avvik:2.30}
];
var OKTER=[
 {d:'14. mai',t:'Puttetest 3–9 m',ant:24,treff:'42 %',sg:-0.19},
 {d:'29. apr',t:'Lab · distansekontroll',ant:36,treff:'—',sg:null},
 {d:'21. apr',t:'Puttetest 1–3 m',ant:30,treff:'63 %',sg:-0.34},
 {d:'9. apr',t:'Lab · leselinje',ant:18,treff:'—',sg:null}
];
function fl(l,v,k){var f=el('div','kpifl');f.appendChild(el('span','l',l));f.appendChild(el('span','v num'+(k?' '+k:''),v));return f}
function kort(){var k=el('div','kort');return k}
function render(){
 var w=document.getElementById('kropp');w.innerHTML='';
 if(tilstand==='tom'){
  document.getElementById('undertekst').textContent='Øyvind Rohjan · ingen registreringer';
  var k=kort();var t=el('div','tom');
  t.appendChild(el('h3','','Ingen putte-data ennå'));
  t.appendChild(el('p','','Putte-laben bygger på registrerte putter — fra live-føring av runder eller fra en puttetest. Minst 30 putter trengs før treffprosent per avstand vises, og minst 3 økter før distanskontroll tegnes.'));
  var b=el('a','btn','Se puttetestene');b.href='playerhq-tester-hub.html';b.dataset.odId='putt-tom-tester';t.appendChild(b);
  k.appendChild(t);w.appendChild(k);
  live.textContent='Tom tilstand';return;
 }
 document.getElementById('undertekst').textContent='Øyvind Rohjan · 226 putter · siste 90 dager';
 var kp=el('div','kpirad');
 kp.appendChild(fl('SG putt · runde','−0,46','neg'));
 kp.appendChild(fl('Putter / runde','31,4'));
 kp.appendChild(fl('3-putter','1,8'));
 w.appendChild(kp);
 var fk=el('div','faneknapper');
 [['treff','Treff %'],['distanse','Distansekontroll'],['okter','Økter']].forEach(function(f){
  var b=el('button',null,f[1]);b.setAttribute('aria-pressed',String(fane===f[0]));b.dataset.odId='putt-fane-'+f[0];
  b.addEventListener('click',function(){fane=f[0];render()});fk.appendChild(b)});
 w.appendChild(fk);
 if(fane==='treff'){
  var k1=kort();
  var er=el('div','eyebrow-rad');er.appendChild(el('span','eyebrow','treff % per avstand'));er.appendChild(el('span','num','vs. HCP 12-referanse'));k1.appendChild(er);
  AVSTAND.forEach(function(a){
   var r=el('div','drad');r.appendChild(el('span','n',a.n));
   var sp=el('div','spor');var i=el('i');i.style.width=a.treff+'%';if(a.treff<a.ref-4)i.className='svak';sp.appendChild(i);
   var b=document.createElement('b');b.style.left=a.ref+'%';sp.appendChild(b);r.appendChild(sp);
   r.appendChild(el('span','v'+(a.treff>=a.ref?' pos':' neg'),a.treff+' %'));k1.appendChild(r);
  });
  k1.appendChild(el('p','forklar','Strek = referanse for HCP 12. Antall putter per intervall i tabellen under.'));
  w.appendChild(k1);
  var k2=kort();k2.appendChild(el('span','eyebrow','sg putt per avstand'));
  AVSTAND.forEach(function(a){
   var r=el('div','drad');r.style.marginTop='6px';r.appendChild(el('span','n',a.n));
   var sp=el('div','spor2');var n=el('span','null');sp.appendChild(n);
   var i=el('i',a.sg>=0?'pos':'neg');i.style.width=Math.min(Math.abs(a.sg)/0.30*50,50)+'%';sp.appendChild(i);r.appendChild(sp);
   r.appendChild(el('span','v '+(a.sg>=0?'pos':'neg'),sg(a.sg)));k2.appendChild(r);
  });
  k2.appendChild(el('p','forklar','Størst tap: 1–2 m. 41 putter, 7 prosentpoeng under referanse.'));
  w.appendChild(k2);
  var k3=kort();k3.appendChild(el('span','eyebrow','coach-tips'));
  var tp=el('div','tips');var st=el('strong','','Anders: ');tp.appendChild(st);
  tp.appendChild(document.createTextNode('Tapet ligger i 1–2 m, ikke i lengdeputtene. Kjør porten-drillen med 12 putter fra 1,5 m før hver runde de neste tre ukene.'));
  k3.appendChild(tp);w.appendChild(k3);
 }
 if(fane==='distanse'){
  var kd=kort();
  var erd=el('div','eyebrow-rad');erd.appendChild(el('span','eyebrow','spredning · lengdeavvik'));erd.appendChild(el('span','num','36 putter'));kd.appendChild(erd);
  var plot=el('div','plot');
  var g=s('svg',{viewBox:'0 0 400 240','aria-label':'Spredningsplot: avstand mot lengdeavvik'});
  g.appendChild(s('line',{x1:'44',y1:'120',x2:'386',y2:'120',stroke:'var(--hairline)','stroke-width':'1'}));
  [0,1,2,3].forEach(function(i){
   g.appendChild(s('line',{x1:'44',y1:String(40+i*53.3),x2:'386',y2:String(40+i*53.3),stroke:'var(--border-soft)','stroke-width':'1'}));
  });
  var punkter=[[2,.10],[2,-.14],[2,.22],[3,-.05],[3,.30],[4,.18],[4,-.35],[4,.42],[5,-.22],[6,.55],[6,-.40],[6,.72],[7,.35],[8,-.85],[8,1.02],[8,.60],[9,-.55],[10,1.20],[10,-.72],[11,.88],[12,1.55],[12,-1.10],[12,.95],[13,1.35],[14,-1.25],[14,1.80],[15,2.05],[16,-1.60],[16,2.40],[16,1.20],[17,2.65],[18,-1.85],[18,2.20],[5,.08],[7,-.18],[9,.44]];
  punkter.forEach(function(p){
   var x=44+(p[0]-2)/16*342, y=120-(p[1]/3)*80;
   g.appendChild(s('circle',{cx:String(x),cy:String(y),r:'3.6',fill:Math.abs(p[1])<0.6?'var(--up-raw)':'var(--dn)','fill-opacity':'.7'}));
  });
  [['2 m',44],['8 m',172],['14 m',300],['18 m',386]].forEach(function(t){
   var tx=s('text',{x:String(t[1]),y:'232','font-family':'var(--mono)','font-size':'9',fill:'var(--muted)','text-anchor':'middle'});tx.textContent=t[0];g.appendChild(tx)});
  [['+3 m',40],['0',120],['−3 m',200]].forEach(function(t){
   var tx=s('text',{x:'38',y:String(t[1]+3),'font-family':'var(--mono)','font-size':'9',fill:'var(--muted)','text-anchor':'end'});tx.textContent=t[0];g.appendChild(tx)});
  plot.appendChild(g);kd.appendChild(plot);
  var lg=el('div','legend');
  var l1=el('span');l1.appendChild(el('i'));l1.lastChild.style.background='var(--up-raw)';l1.appendChild(document.createTextNode('innenfor 0,6 m'));
  var l2=el('span');l2.appendChild(el('i'));l2.lastChild.style.background='var(--dn)';l2.appendChild(document.createTextNode('utenfor 0,6 m'));
  lg.appendChild(l1);lg.appendChild(l2);kd.appendChild(lg);
  kd.appendChild(el('p','forklar','Over 0-linja = for langt. 68 % av avvikene er lange — tendens til å slå forbi.'));
  w.appendChild(kd);
  var kl=kort();kl.appendChild(el('span','eyebrow','snittavvik per avstand'));
  LENGDE.forEach(function(l){
   var r=el('div','drad');r.style.marginTop='6px';r.appendChild(el('span','n',l.n));
   var sp=el('div','spor');var i=el('i');i.style.width=Math.min(l.avvik/2.5*100,100)+'%';if(l.avvik>1.2)i.className='svak';sp.appendChild(i);r.appendChild(sp);
   r.appendChild(el('span','v',komma(l.avvik,2)+' m'));kl.appendChild(r);
  });
  kl.appendChild(el('p','forklar','Mål fra lab-protokollen: under 5 % av puttlengden. Fra 12 m er kravet 0,60 m.'));
  w.appendChild(kl);
 }
 if(fane==='okter'){
  var ko=kort();
  var ero=el('div','eyebrow-rad');ero.appendChild(el('span','eyebrow','putte-økter og tester'));ero.appendChild(el('span','num',OKTER.length+' økter'));ko.appendChild(ero);
  var tab=el('table','tab');
  var th=document.createElement('thead');var tr=document.createElement('tr');
  ['Dato','Økt','Putter','Treff','SG'].forEach(function(h,i){var c=document.createElement('th');if(i>1)c.className='r';c.textContent=h;tr.appendChild(c)});
  th.appendChild(tr);tab.appendChild(th);
  var tb=document.createElement('tbody');
  OKTER.forEach(function(o){
   var r=document.createElement('tr');
   [[o.d,''],[o.t,''],[String(o.ant),'r'],[o.treff,'r'],[o.sg==null?'—':sg(o.sg),'r '+(o.sg==null?'':o.sg>=0?'pos':'neg')]].forEach(function(c){
    var td=document.createElement('td');if(c[1])td.className=c[1];td.textContent=c[0];r.appendChild(td)});
   tb.appendChild(r)});
  tab.appendChild(tb);ko.appendChild(tab);
  ko.appendChild(el('p','forklar','«—» = lab-økt uten hull-mål; distansekontroll måles i avvik, ikke treffprosent.'));
  w.appendChild(ko);
  var kn=kort();
  var b=el('a','btn full','Se alle puttetester');b.href='playerhq-tester-hub.html';b.dataset.odId='putt-alle-tester';kn.appendChild(b);
  w.appendChild(kn);
 }
 live.textContent='Putte-lab · '+fane;
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){b.addEventListener('click',function(){tilstand=b.dataset.tilstand;document.querySelectorAll('[data-tilstand]').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.tilstand===tilstand))});render()})});
var KEY='akhq-theme-playerhq',saved=localStorage.getItem(KEY);if(saved)document.documentElement.dataset.theme=saved;
document.getElementById('themeBtn').addEventListener('click',function(){var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem(KEY,n);this.setAttribute('aria-label',n==='dark'?'Bytt til lys modus':'Bytt til mørk modus')});
render();
})();
</script>
</body>
</html>

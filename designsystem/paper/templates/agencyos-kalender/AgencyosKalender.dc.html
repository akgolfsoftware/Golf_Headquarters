<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="AgencyOS · Kalender" description="Uke- og dagsvisning på TimeGrid, med selskapsfilter, synlige kollisjoner, bakgrunnslag for booking og skole, og bookingpanel med avbestillingsfrist før bekreftelse." -->
<helmet><script src="./ds-base.js"></script><style>html,body{margin:0;padding:0}body{background:var(--bg)}a{color:var(--fg)}a:hover{color:var(--accent-fg)}[data-rsp=rail]{display:flex;flex:none}[data-rsp=panel]{display:flex}[data-rsp=tab]{display:none}[data-rsp=verktoy]{display:flex;flex-wrap:wrap;gap:8px;align-items:center}@media(max-width:1180px){[data-rsp=panel]{display:none}}@media(max-width:880px){[data-rsp=rail]{display:none}[data-rsp=pad]{padding:16px 14px 24px}[data-rsp=tab]{display:block}[data-rsp=sbar]{display:none}}</style></helmet>
<div style="display:flex;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13.5px;-webkit-font-smoothing:antialiased">
<div data-rsp="rail"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Rail" items="{{ railItems }}" current="{{ nav }}" onNavigate="{{ go }}" initials="AK" hint-size="64px,100vh"></x-import></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Topbar" theme="{{ theme }}" onToggleTheme="{{ toggleTheme }}" searchPlaceholder="Søk i økter, bookinger og spillere" hint-size="100%,56px"></x-import>
<div style="flex:1;min-width:0;display:flex;align-items:stretch">
<main data-rsp="pad" style="flex:1;min-width:0;padding:24px 28px 32px;display:flex;flex-direction:column;gap:14px">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.PageHeader" kicker="Uke 31 · 31. juli – 6. august" title="Kalender" lead="Ett selskap om gangen. «Alle» finnes, men er et valg du tar — fem kalendere oppå hverandre er ingen kalender." meta="{{ headerMeta }}" actions="{{ headerActions }}" dataOdId="page-header" hint-size="100%,120px"></x-import>

<div data-rsp="verktoy">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.SegmentControl" options="{{ visninger }}" value="{{ visning }}" onChange="{{ setVisning }}" dataOdId="nav-visning" hint-size="260px,44px"></x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Select" options="{{ selskaper }}" value="{{ selskap }}" onChange="{{ setSelskap }}" dataOdId="felt-selskap" hint-size="220px,44px"></x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Chip" selected="{{ visLedig }}" onClick="{{ toggleLedig }}" dataOdId="cta-ledig" hint-size="120px,44px">Vis ledig tid</x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Chip" selected="{{ visBakgrunn }}" onClick="{{ toggleBakgrunn }}" dataOdId="cta-bakgrunn">Skole og booking</x-import>
</div>

<sc-if value="{{ harKollisjon }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Banner" tone="warn" title="{{ kollisjonTittel }}" actionLabel="Vis i lerretet" onAction="{{ visKollisjon }}" hint-size="100%,72px">{{ kollisjonTekst }}</x-import>
</sc-if>

<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.TimeGrid" days="{{ dager }}" events="{{ hendelser }}" now="{{ naa }}" maxHeight="{{ 520 }}" onEventClick="{{ apneHendelse }}" state="{{ dataState }}" dataOdId="panel-kalender" hint-size="100%,520px"></x-import>

<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Divider" label="dagens plan" align="start" hint-size="100%,24px"></x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.ListGroup" as="div" dataOdId="list-dagen" hint-size="100%,220px">
<sc-for list="{{ dagensRader }}" as="r" hint-placeholder-count="4">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.ListRow" as="div" leading="none" title="{{ r.title }}" meta="{{ r.meta }}" trailing="value" value="{{ r.right }}" onClick="{{ r.apne }}" dataOdId="row-dagen" hint-size="100%,60px"></x-import>
</sc-for>
</x-import>
</main>

<aside data-rsp="panel" style="width:340px;flex:none;border-left:1px solid var(--border);background:var(--surface);padding:16px;flex-direction:column;gap:12px;box-sizing:border-box;overflow:auto">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">booking · steg {{ steg }} av 4</span><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Button" variant="ghost" size="sm" onClick="{{ nullstill }}" dataOdId="cta-booking-avbryt" hint-size="70px,44px">Avbryt</x-import></div>
<h2 style="font-family:var(--disp);font-size:16px;font-weight:600;margin:0;line-height:1.25">{{ stegTittel }}</h2>
<p style="margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)">{{ stegLead }}</p>

<sc-if value="{{ steg1 }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.FormField" label="Hva" hint-size="100%,72px"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Select" options="{{ typer }}" value="{{ type }}" onChange="{{ setType }}" dataOdId="felt-type" hint-size="100%,44px"></x-import></x-import>
</sc-if>
<sc-if value="{{ steg2 }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.FormField" label="Hvem" hint="Søk i stallen" hint-size="100%,88px"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Combobox" options="{{ spillere }}" value="{{ spiller }}" onChange="{{ setSpiller }}" placeholder="Søk i stallen" dataOdId="felt-spiller" hint-size="100%,44px"></x-import></x-import>
</sc-if>
<sc-if value="{{ steg3 }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:10px">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.FormField" label="Dato" hint-size="100%,72px"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.DatePicker" value="{{ dato }}" onChange="{{ setDato }}" dataOdId="felt-dato" hint-size="100%,44px"></x-import></x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.FormField" label="Ledige tider" hint-size="100%,88px"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.SegmentControl" options="{{ tider }}" value="{{ tid }}" onChange="{{ setTid }}" dataOdId="felt-tid" hint-size="100%,44px"></x-import></x-import>
</div>
</sc-if>
<sc-if value="{{ steg4 }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:12px">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.KeyValueGrid" items="{{ oppsummering }}" columns="{{ 1 }}" hint-size="100%,180px"></x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Callout" tone="info" label="Avbestillingsfrist" hint-size="100%,120px">Avbestilling senere enn 24 timer før start faktureres med 50 % av timeprisen — 450 kr. Fristen for denne timen går ut fredag 1. august kl. 15:00.</x-import>
</div>
</sc-if>

<div style="margin-top:auto;display:flex;gap:8px;flex-wrap:wrap">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Button" variant="ghost" size="sm" onClick="{{ forrige }}" dataOdId="cta-booking-forrige" hint-size="86px,44px">Forrige</x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Button" variant="primary" size="sm" onClick="{{ neste }}" dataOdId="cta-booking-neste" hint-size="120px,44px">{{ nesteLabel }}</x-import>
</div>
</aside>
</div>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Composer" context="{{ kontekst }}" onContextToggle="{{ toggleCtx }}" onSubmit="{{ spor }}" placeholder="Spør om uken — «hvem har ledig tid torsdag ettermiddag?»" hint-size="100%,72px"></x-import>
<div data-rsp="sbar"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.StatusBar" items="{{ statusPunkter }}" hint-size="100%,26px"></x-import></div>
<div data-rsp="tab"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.TabBar" items="{{ tabItems }}" current="{{ tab }}" onNavigate="{{ setTab }}" hint-size="100%,56px"></x-import></div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860},&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;content&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;content&quot;,&quot;tsType&quot;:&quot;\&quot;content\&quot; | \&quot;loading\&quot; | \&quot;empty\&quot; | \&quot;error\&quot;&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;initialTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;\&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  state = {
    theme: "light", nav: "kalender", tab: "alt",
    visning: "Uke", selskap: "akademi", visLedig: true, visBakgrunn: true,
    steg: 4, type: "1-til-1", spiller: "Emma Sæther", dato: "2026-08-03", tid: "16:00",
    valgtId: null
  };

  componentDidMount() {
    let t = null;
    try { t = localStorage.getItem("akhq-theme-agencyos"); } catch (e) {}
    this.applyTheme(t || this.props.initialTheme || "light", false);
    /* Dagvisning er standard på telefon, uke på desktop — beslutning i
       restansens 5.4. Leses én gang ved montering, ikke ved hver render. */
    const smal = window.matchMedia && window.matchMedia("(max-width: 880px)").matches;
    if (smal) this.setState({ visning: "Dag" });
    this.waitNs(0);
  }

  waitNs(n) {
    const ns = window.AKGolfHQClaudePaper_605a48;
    if (ns && ns.RailIcons && ns.TimeGrid && ns.DatePicker) { this.forceUpdate(); return; }
    if (n < 60) setTimeout(() => this.waitNs(n + 1), 100);
  }

  applyTheme(t, persist) {
    const v = t === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", v);
    if (persist) { try { localStorage.setItem("akhq-theme-agencyos", v); } catch (e) {} }
    this.setState({ theme: v });
  }

  kilde() {
    return [
      { id: "e1", selskap: "akademi", day: 0, start: "07:00", end: "08:30", title: "Emma — TEK tee" },
      { id: "e2", selskap: "akademi", day: 0, start: "17:00", end: "17:45", title: "Jonas — FYS" },
      { id: "e3", selskap: "junior", day: 1, start: "16:00", end: "17:00", title: "Junior gruppe 3" },
      { id: "e4", selskap: "junior", day: 1, start: "16:30", end: "17:30", title: "Markus — øktforespørsel" },
      { id: "e5", selskap: "akademi", day: 2, start: "15:00", end: "16:30", title: "Emma — nærspill" },
      { id: "e10", selskap: "akademi", day: 2, start: "16:00", end: "17:00", title: "GFGK — klubbavtale, møte" },
      { id: "e6", selskap: "akademi", day: 3, start: "15:00", end: "17:00", title: "Emma — ni hull" },
      { id: "e7", selskap: "software", day: 3, start: "09:00", end: "10:00", title: "Sprintgjennomgang" },
      { id: "e8", selskap: "akademi", day: 4, start: "07:00", end: "07:45", title: "Emma — mobilitet" },
      { id: "e9", selskap: "junior", day: 5, start: "10:00", end: "11:30", title: "Junior lørdagstrening" },
      { id: "b1", selskap: "akademi", day: 1, start: "08:00", end: "15:00", title: "WANG skole", kind: "bg" },
      { id: "b2", selskap: "akademi", day: 3, start: "08:00", end: "14:00", title: "WANG skole", kind: "bg" },
      { id: "b3", selskap: "drift", day: 2, start: "18:00", end: "21:00", title: "Sim 2 — drop-in booket", kind: "bg" },
      { id: "f1", selskap: "akademi", day: 2, start: "10:00", end: "12:00", title: "Ledig — sim 3", kind: "free" },
      { id: "f2", selskap: "akademi", day: 4, start: "13:00", end: "15:00", title: "Ledig — sim 1", kind: "free" }
    ];
  }

  renderVals() {
    const ns = window.AKGolfHQClaudePaper_605a48 || {};
    const I = ns.RailIcons || {};
    const B = ns.Button;
    const KORT = [
      { label: "man", date: "31" }, { label: "tir", date: "1" }, { label: "ons", date: "2", today: true },
      { label: "tor", date: "3" }, { label: "fre", date: "4" }, { label: "lør", date: "5" }, { label: "søn", date: "6" }
    ];
    const selskaper = [
      { value: "alle", label: "Alle fem selskap" },
      { value: "akademi", label: "AK Golf Academy" },
      { value: "junior", label: "Junior Academy" },
      { value: "software", label: "AK Golf Software" },
      { value: "drift", label: "Drift og simulator" }
    ];
    const s = this.state;
    let hendelser = this.kilde();
    if (s.selskap !== "alle") hendelser = hendelser.filter((h) => h.selskap === s.selskap);
    if (!s.visLedig) hendelser = hendelser.filter((h) => h.kind !== "free");
    if (!s.visBakgrunn) hendelser = hendelser.filter((h) => h.kind !== "bg");
    const dagvisning = s.visning === "Dag";
    /* Dagsvisning er samme lerret med én kolonne — ikke en annen komponent.
       En kalender som bytter anatomi mellom visninger må læres to ganger. */
    const dagIdx = 2;
    const dager = dagvisning ? [KORT[dagIdx]] : KORT;
    const synlige = (dagvisning ? hendelser.filter((h) => h.day === dagIdx).map((h) => Object.assign({}, h, { day: 0 })) : hendelser);
    /* Kollisjon = to ikke-bakgrunnshendelser som overlapper i tid samme dag.
       Beregnes, ikke merkes for hånd — en hardkodet advarsel lyver så snart
       dataene endrer seg. */
    const min = (t) => parseInt(t.split(":")[0], 10) * 60 + parseInt(t.split(":")[1], 10);
    /* Ledig tid og bakgrunnslag kolliderer per definisjon ikke: de er tilbud
       og kontekst, ikke avtaler. Bare ekte hendelser telles. */
    const ekte = synlige.filter((h) => !h.kind);
    const kollisjoner = [];
    for (let i = 0; i < ekte.length; i++) {
      for (let j = i + 1; j < ekte.length; j++) {
        const a = ekte[i], b = ekte[j];
        if (a.day === b.day && min(a.start) < min(b.end) && min(b.start) < min(a.end)) kollisjoner.push([a, b]);
      }
    }
    const k = kollisjoner[0];
    const dagens = hendelser.filter((h) => h.day === dagIdx);
    const lenke = (id, tekst) => (B ? React.createElement(B, { variant: "ghost", size: "sm", dataOdId: "cta-" + id }, tekst) : null);
    const steg = s.steg;
    const stegTittel = ["Hva slags time?", "Hvem er den for?", "Når passer det?", "Bekreft bookingen"][steg - 1];
    const stegLead = [
      "Timetypen styrer varighet, pris og hvilke fasiliteter som er mulige.",
      "Coach booker for spiller. Spilleren booker selv i PlayerHQ, og drop-in går mot Mulligan-simulatorene.",
      "Kun tider der både coach og fasilitet er ledige vises.",
      "Frist og gebyr står her — før du bekrefter, ikke i kvitteringen etterpå."
    ][steg - 1];
    return {
      theme: s.theme, nav: s.nav, tab: s.tab,
      dataState: this.props.dataState || "content",
      visninger: ["Dag", "Uke", "Måned", "År"], visning: s.visning,
      setVisning: (v) => this.setState({ visning: v }),
      selskaper: selskaper, selskap: s.selskap,
      setSelskap: (e) => this.setState({ selskap: e && e.target ? e.target.value : e }),
      visLedig: s.visLedig, toggleLedig: () => this.setState({ visLedig: !s.visLedig }),
      visBakgrunn: s.visBakgrunn, toggleBakgrunn: () => this.setState({ visBakgrunn: !s.visBakgrunn }),
      dager: dager, hendelser: synlige, naa: "11:04",
      apneHendelse: (h) => this.setState({ valgtId: h.id }),
      harKollisjon: !!k,
      kollisjonTittel: k ? "Kollisjon " + KORT[k[0].day].label + " " + k[0].start : "",
      kollisjonTekst: k ? k[0].title + " og " + k[1].title + " overlapper. Ingen av dem er flyttet automatisk — kalenderen anbefaler, den omdisponerer ikke." : "",
      visKollisjon: () => {},
      /* Hardt mellomrom mellom tall og substantiv: metaspalten er 139 px, og
         «1 kollisjon» brakk til «1» / «kollisjon» [funn i review 31.07]. */
      headerMeta: ekte.filter((h) => !h.kind).length + "\u00A0økter · " + (kollisjoner.length ? kollisjoner.length + "\u00A0" + (kollisjoner.length === 1 ? "kollisjon" : "kollisjoner") : "ingen kollisjon"),
      headerActions: lenke("kal-eksport", "Eksporter uke"),
      dagensRader: dagens.map((h) => ({
        title: h.title,
        meta: h.start + "–" + h.end + " · " + (selskaper.filter((x) => x.value === h.selskap)[0] || {}).label + (h.kind === "bg" ? " · bakgrunn" : h.kind === "free" ? " · ledig" : ""),
        right: h.start,
        apne: () => this.setState({ valgtId: h.id })
      })),
      steg: steg, steg1: steg === 1, steg2: steg === 2, steg3: steg === 3, steg4: steg === 4,
      stegTittel: stegTittel, stegLead: stegLead,
      nesteLabel: steg === 4 ? "Bekreft booking" : "Neste steg",
      neste: () => this.setState({ steg: Math.min(4, steg + 1) }),
      forrige: () => this.setState({ steg: Math.max(1, steg - 1) }),
      nullstill: () => this.setState({ steg: 1 }),
      typer: [
        { value: "1-til-1", label: "1-til-1 økt · 60 min · 900 kr" },
        { value: "gruppe", label: "Gruppetime · 90 min · 350 kr per spiller" },
        { value: "test", label: "Testkjøring · 120 min" },
        { value: "dropin", label: "Drop-in simulator · 60 min · 450 kr" }
      ],
      type: s.type, setType: (e) => this.setState({ type: e && e.target ? e.target.value : e }),
      spillere: [
        { value: "emma", label: "Emma Sæther", note: "kat. C" },
        { value: "jonas", label: "Jonas Hveem", note: "kat. B" },
        { value: "mia", label: "Mia Berg", note: "kat. E" }
      ],
      spiller: s.spiller, setSpiller: (v) => this.setState({ spiller: v }),
      dato: s.dato, setDato: (v) => this.setState({ dato: v }),
      tider: ["14:00", "16:00", "17:30"], tid: s.tid,
      setTid: (v) => this.setState({ tid: v }),
      oppsummering: [
        { key: "Type", value: "1-til-1 økt · 60 min" },
        { key: "Spiller", value: s.spiller },
        { key: "Når", value: "mandag 3. august · " + s.tid },
        { key: "Sted", value: "Mulligan Sandvika · sim 3" },
        { key: "Pris", value: "900 kr", mono: true },
        { key: "Faktureres", value: "AK Golf Academy" }
      ],
      toggleTheme: () => this.applyTheme(s.theme === "dark" ? "light" : "dark", true),
      go: (id) => this.setState({ nav: id }),
      setTab: (id) => this.setState({ tab: id }),
      spor: () => {},
      toggleCtx: () => {},
      kontekst: [
        { id: "u31", label: "uke 31", active: true },
        { id: "sim", label: "Mulligan", active: false }
      ],
      railItems: [
        { id: "hjem", label: "Hjem", icon: I.hjem },
        { id: "ko", label: "Kø", icon: I.ko },
        { id: "stall", label: "Stall", icon: I.stall },
        { id: "kalender", label: "Kalender", icon: I.idag },
        { id: "plan", label: "Workbench", icon: I.plan },
        { id: "alt", label: "Alt", icon: I.analyse }
      ],
      tabItems: [
        { id: "hjem", label: "Hjem", icon: I.hjem },
        { id: "ko", label: "Kø", icon: I.ko },
        { id: "stall", label: "Stall", icon: I.stall },
        { id: "ai", label: "Agenter", icon: I.ai },
        { id: "alt", label: "Alt", icon: I.analyse }
      ],
      statusPunkter: [
        { label: "v2.4 · P3 SPES" },
        { label: "agentfeil", value: 1, tone: "dn", onClick: () => {} },
        { label: "MRR", value: "184 200", onClick: () => {} },
        { label: "innsikter", value: 6, onClick: () => {} },
        { label: "CANON", value: "✓", tone: "up" }
      ]
    };
  }
}

</script>
</body>
</html>

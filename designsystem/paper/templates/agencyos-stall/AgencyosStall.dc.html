<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="AgencyOS · Stall og spillerprofil" description="Stall sortert på hvem som trenger deg, med synlig begrunnelse per rad, og spillerprofilen som artefakt i panelet — fem faner, samme innhold i panel og bunnark." -->
<helmet><script src="./ds-base.js"></script><style>html,body{margin:0;padding:0}body{background:var(--bg)}a{color:var(--fg)}a:hover{color:var(--accent-fg)}[data-rsp=rail]{display:flex;flex:none}[data-rsp=panel]{display:flex}[data-rsp=tab]{display:none}@media(max-width:1180px){[data-rsp=panel]{display:none}}@media(max-width:880px){[data-rsp=rail]{display:none}[data-rsp=pad]{padding:16px 14px 20px}[data-rsp=tab]{display:block}[data-rsp=sbar]{display:none}}</style></helmet>
<div style="display:flex;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13.5px;-webkit-font-smoothing:antialiased">
<div data-rsp="rail"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Rail" items="{{ railItems }}" current="{{ nav }}" onNavigate="{{ go }}" initials="AK" hint-size="232px,100vh"></x-import></div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Topbar" theme="{{ theme }}" onToggleTheme="{{ toggleTheme }}" searchPlaceholder="Søk i stall" hint-size="100%,56px"></x-import>
<div style="flex:1;min-width:0;display:flex;align-items:stretch">
<main data-rsp="pad" style="flex:1;min-width:0;padding:24px 28px 28px;display:flex;flex-direction:column;gap:14px">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.PageHeader" kicker="Onsdag 30. juli · 18 spillere" title="Stall" lead="Sortert på hvem som trenger deg — ikke alfabetisk. Begrunnelsen står på raden, fordi en usynlig sortering ikke blir stolt på." meta="{{ headerMeta }}" actions="{{ headerActions }}" dataOdId="page-header" hint-size="100%,120px"></x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.SegmentControl" options="{{ filtre }}" value="{{ filter }}" onChange="{{ setFilter }}" dataOdId="nav-stall-filter" hint-size="360px,44px"></x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Panel" title="Trenger deg" titleLevel="{{ h3 }}" action="{{ sortAction }}" flush="{{ true }}" footnote="{{ fotnote }}" dataOdId="panel-stall" hint-size="100%,420px">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.ListGroup" as="div" dataOdId="list-stall" hint-size="100%,380px">
<sc-for list="{{ spillere }}" as="p" hint-placeholder-count="6">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.ListRow" as="div" leading="avatar" avatar="{{ p.avatar }}" title="{{ p.name }}" titleBadge="{{ p.kat }}" meta="{{ p.grunn }}" trailing="value" value="{{ p.sg }}" onClick="{{ p.open }}" dataOdId="row-stall" hint-size="100%,60px"></x-import>
</sc-for>
</x-import>
</x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Divider" label="uten utestående" align="start" hint-size="100%,24px"></x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Panel" title="Resten av stallen" titleLevel="{{ h3 }}" flush="{{ true }}" footnote="14 spillere er i rute. De ligger alfabetisk, fordi ingen av dem konkurrerer om oppmerksomheten din." dataOdId="panel-rest" hint-size="100%,200px">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.ListGroup" as="div" dataOdId="list-rest" hint-size="100%,160px">
<sc-for list="{{ resten }}" as="r" hint-placeholder-count="3">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.ListRow" as="div" leading="avatar" avatar="{{ r.avatar }}" title="{{ r.name }}" titleBadge="{{ r.kat }}" meta="{{ r.grunn }}" trailing="value" value="{{ r.sg }}" onClick="{{ r.open }}" dataOdId="row-rest" hint-size="100%,60px"></x-import>
</sc-for>
</x-import>
</x-import>
</main>
<aside data-rsp="panel" style="width:340px;flex:none;border-left:1px solid var(--border);background:var(--surface);padding:16px;flex-direction:column;gap:12px;box-sizing:border-box;overflow:hidden">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">artefakt · spillerprofil</span><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Button" variant="ghost" size="sm" dataOdId="cta-panel-close" hint-size="60px,44px">Lukk</x-import></div>
<div style="display:flex;align-items:center;gap:10px;min-width:0"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Avatar" name="{{ valgtNavn }}" size="md" hint-size="36px,36px"></x-import><div style="min-width:0"><h2 style="font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.25">{{ valgtNavn }}</h2><p style="margin:2px 0 0;font-size:11.5px;color:var(--muted)">{{ valgtMeta }}</p></div></div>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Tabs" tabs="{{ faner }}" value="{{ fane }}" onChange="{{ setFane }}" label="Spillerprofilens faner" dataOdId="nav-profil-faner" hint-size="100%,44px"></x-import>
<div style="display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.KeyValueGrid" items="{{ faneFakta }}" columns="{{ 1 }}" hint-size="100%,150px"></x-import>
<sc-if value="{{ visPyramide }}" hint-placeholder-val="{{ true }}">
<div><span style="font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">pyramidefordeling · siste 8 uker</span><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.PyramidProgress" levels="{{ pyramide }}" state="{{ dataState }}" hint-size="100%,150px"></x-import></div>
</sc-if>
<sc-if value="{{ visSg }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.SgBreakdown" items="{{ sgItems }}" total="{{ sgTotal }}" window="siste 8 uker" benchmarkLabel="kategorikrav A" state="{{ dataState }}" hint-size="100%,180px"></x-import>
</sc-if>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Divider" label="{{ varselLabel }}" align="start" hint-size="100%,24px"></x-import>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.ListGroup" as="div" dataOdId="list-varsler" hint-size="100%,120px">
<sc-for list="{{ varsler }}" as="v" hint-placeholder-count="2">
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.ListRow" as="div" leading="none" title="{{ v.title }}" meta="{{ v.meta }}" trailing="badge" badge="{{ v.badge }}" dataOdId="row-varsel" hint-size="100%,56px"></x-import>
</sc-for>
</x-import>
</div>
<div style="margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Button" variant="primary" size="sm" dataOdId="cta-profil-spor" hint-size="120px,44px">{{ faneHandling }}</x-import><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Button" variant="ghost" size="sm" dataOdId="cta-profil-alt" hint-size="86px,44px">Åpne alt</x-import></div>
</aside>
</div>
<x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.Composer" context="{{ kontekst }}" onContextToggle="{{ toggleCtx }}" onSubmit="{{ spor }}" placeholder="Spør om en spiller — «hvorfor er Emma øverst?»" hint-size="100%,72px"></x-import>
<div data-rsp="sbar"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.StatusBar" items="{{ statusPunkter }}" hint-size="100%,26px"></x-import></div>
<div data-rsp="tab"><x-import component-from-global-scope="AKGolfHQClaudePaper_605a48.TabBar" items="{{ tabItems }}" current="{{ tab }}" onNavigate="{{ setTab }}" hint-size="100%,56px"></x-import></div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860},&quot;dataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;content&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;content&quot;,&quot;tsType&quot;:&quot;\&quot;content\&quot; | \&quot;loading\&quot; | \&quot;empty\&quot; | \&quot;error\&quot;&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;initialTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;\&quot;light\&quot; | \&quot;dark\&quot;&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  state = { theme: "light", nav: "stall", tab: "stall", filter: "Trenger deg 4", fane: "status", valgt: "emma", ctx: { emma: true } };

  componentDidMount() {
    let t = null;
    try { t = localStorage.getItem("akhq-theme-agencyos"); } catch (e) {}
    this.applyTheme(t || this.props.initialTheme || "light", false);
    this.waitNs(0);
  }

  waitNs(n) {
    const ns = window.AKGolfHQClaudePaper_605a48;
    if (ns && ns.RailIcons && ns.Composer) { this.forceUpdate(); return; }
    if (n < 60) setTimeout(() => this.waitNs(n + 1), 100);
  }

  applyTheme(t, persist) {
    const v = t === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", v);
    if (persist) { try { localStorage.setItem("akhq-theme-agencyos", v); } catch (e) {} }
    this.setState({ theme: v });
  }

  /* Sorteringsgrunnen står som lesbar tekst på raden — beslutning [natt 7].
     Rekkefølgen er den samme som teksten sier, aldri en skjult vekting. */
  kilde() {
    return [
      { id: "emma", name: "Emma Sæther", kat: "A", grunn: "9 dager siden sist økt · ukeplan venter godkjenning", sg: "+2,92", meta: "15 år · kat. A · WANG Toppidrett", trenger: true },
      { id: "jonas", name: "Jonas Hveem", kat: "B", grunn: "testresultat ulest · lastavvik +1,5 t mot plan", sg: "+1,04", meta: "17 år · kat. B · P3 SPES", trenger: true },
      { id: "mia", name: "Mia Berg", kat: "C", grunn: "samtykke utløper 14. august · 2 åpne LIFE-koder", sg: "−0,31", meta: "14 år · kat. C · junior", trenger: true },
      { id: "sofie", name: "Sofie Lund", kat: "D", grunn: "politiattest mangler for trener · 4 økter planlagt", sg: "+0,12", meta: "13 år · kat. D · junior", trenger: true },
      { id: "sander", name: "Sander Lie", kat: "B", grunn: "alt i rute · neste økt torsdag 15:00", sg: "+0,88", meta: "16 år · kat. B · elite", trenger: false },
      { id: "nora", name: "Nora Fjeld", kat: "A", grunn: "alt i rute · test 12. august", sg: "+1,76", meta: "18 år · kat. A · elite", trenger: false },
      { id: "tobias", name: "Tobias Haug", kat: "C", grunn: "alt i rute · permisjon til 10. august", sg: "+0,04", meta: "15 år · kat. C · junior", trenger: false }
    ];
  }

  faneInnhold(sp) {
    const f = this.state.fane;
    if (f === "utvikling") return {
      fakta: [
        { key: "SG totalt", value: sp.sg + " · ▲ +0,41 (8 uker)", mono: true },
        { key: "Snittscore", value: "72,4 · ▼ −1,1", mono: true },
        { key: "WAGR", value: "1 842 · ▲ +214", mono: true },
        { key: "AK-stigen", value: "steg 7 av 12" }
      ],
      handling: "Spør om utviklingen", visPyramide: false, visSg: true,
      varselLabel: "testhistorikk",
      varsler: [
        { title: "Test 12.07 · protokoll 1–20", meta: "7 av 9 kategorikrav oppfylt", badge: { tone: "up", text: "7/9" } },
        { title: "Test 08.05 · protokoll 1–20", meta: "5 av 9 kategorikrav oppfylt", badge: { tone: "mut", text: "5/9" } }
      ]
    };
    if (f === "teknikk") return {
      fakta: [
        { key: "Teknisk plan", value: "P2 · P6 · P7" },
        { key: "TrackMan-mål", value: "SD side 4,8 m (baseline 5,6)", mono: true },
        { key: "Hit-rate", value: "62 % (baseline 55 %)", mono: true },
        { key: "Kølle i fokus", value: "Jern 7" }
      ],
      handling: "Åpne i Workbench", visPyramide: false, visSg: false,
      varselLabel: "posisjonsoppgaver",
      varsler: [
        { title: "P6 · håndledd i overgang", meta: "tosporet fremdrift: 3 av 5 økter", badge: { tone: "info", text: "pågår" } },
        { title: "P2 · vekt over høyre", meta: "fullført 24.07", badge: { tone: "up", text: "ferdig" } }
      ]
    };
    if (f === "plan") return {
      fakta: [
        { key: "Uke 31", value: "4 økter · 6,5 t av 5–8 t", mono: true },
        { key: "TEK-andel", value: "38 % (30–45)", mono: true },
        { key: "Periode", value: "P3 SPESIALISERING" },
        { key: "Låste ankere", value: "man 07:00 TEK tee" }
      ],
      handling: "Åpne i Workbench", visPyramide: true, visSg: false,
      varselLabel: "ventende forespørsler",
      varsler: [
        { title: "Øktforespørsel torsdag 16:00", meta: "fra Markus · kolliderer med gruppetime", badge: { tone: "warn", text: "kollisjon" } }
      ]
    };
    if (f === "person") return {
      fakta: [
        { key: "Utstyr", value: "Ping G430 · 7-jern 33°" },
        { key: "Skole", value: "WANG Toppidrett · Vg1" },
        { key: "Foresatt", value: "Hilde Sæther" },
        { key: "Abonnement", value: "Junior · 1 490 kr/mnd", mono: true }
      ],
      handling: "Åpne kundekort", visPyramide: false, visSg: false,
      varselLabel: "samtykke og LIFE",
      varsler: [
        { title: "Bilde- og videobruk", meta: "utløper 14.08.2026 · foresatt varslet", badge: { tone: "warn", text: "30 d" } },
        { title: "LIFE · søvn under 7 t", meta: "logget 3 av 7 dager", badge: { tone: "info", text: "åpen" } }
      ]
    };
    return {
      fakta: [
        { key: "Kategori", value: "A · krav 7 av 9 oppfylt" },
        { key: "Ukevolum", value: "6,5 t av 5–8 t · aldersregel 15 år", mono: true },
        { key: "Neste økt", value: "i morgen 07:00 · TEK tee" },
        { key: "Neste test", value: "12. august" }
      ],
      handling: "Spør om Emma", visPyramide: true, visSg: false,
      varselLabel: "aktive agentvarsler · 2",
      varsler: [
        { title: "Ukeplan venter godkjenning", meta: "Plan-vakten · 4 timer", badge: { tone: "warn", text: "4 t" } },
        { title: "Lastavvik siste uke −1,5 t", meta: "Last-vakten · 1 dag", badge: { tone: "info", text: "1 d" } }
      ]
    };
  }

  renderVals() {
    const ns = window.AKGolfHQClaudePaper_605a48 || {};
    const I = ns.RailIcons || {};
    const B = ns.Button;
    const lenke = (id, tekst) => B ? React.createElement(B, { variant: "ghost", size: "sm", dataOdId: "cta-" + id }, tekst) : null;
    const alle = this.kilde();
    const trenger = alle.filter((s) => s.trenger);
    const filtre = ["Trenger deg " + trenger.length, "Alle " + alle.length, "Junior", "Elite"];
    const valgtFilter = filtre.indexOf(this.state.filter) === -1 ? filtre[0] : this.state.filter;
    let liste = valgtFilter.indexOf("Trenger deg") === 0 ? trenger : alle;
    if (valgtFilter === "Junior") liste = alle.filter((s) => /junior/.test(s.meta));
    if (valgtFilter === "Elite") liste = alle.filter((s) => /elite/.test(s.meta));
    const rad = (s) => Object.assign({}, s, {
      avatar: { name: s.name },
      kat: { kind: "tag", text: s.kat },
      open: () => this.setState({ valgt: s.id })
    });
    const sp = alle.filter((s) => s.id === this.state.valgt)[0] || alle[0];
    const f = this.faneInnhold(sp);
    return {
      theme: this.state.theme,
      nav: this.state.nav,
      tab: this.state.tab,
      h3: 3,
      dataState: this.props.dataState || "content",
      filter: valgtFilter,
      filtre: filtre,
      spillere: liste.map(rad),
      resten: alle.filter((s) => !s.trenger).map(rad),
      fotnote: trenger.length + " av " + alle.length + " spillere har noe utestående. Grunnen står på raden, ikke i en tooltip.",
      headerMeta: trenger.length + " trenger deg",
      headerActions: lenke("stall-ny", "Ny spiller"),
      sortAction: lenke("stall-sort", "Sorter"),
      setFilter: (v) => this.setState({ filter: v }),
      faner: [
        { id: "status", label: "Status" },
        { id: "utvikling", label: "Utvikling" },
        { id: "teknikk", label: "Teknikk" },
        { id: "plan", label: "Plan" },
        { id: "person", label: "Person" }
      ],
      fane: this.state.fane,
      setFane: (id) => this.setState({ fane: id }),
      valgtNavn: sp.name,
      valgtMeta: sp.meta,
      faneFakta: f.fakta,
      faneHandling: f.handling,
      visPyramide: f.visPyramide,
      visSg: f.visSg,
      varselLabel: f.varselLabel,
      varsler: f.varsler,
      pyramide: [
        { label: "TURN", pct: 4 },
        { label: "SPILL", pct: 22 },
        { label: "SLAG", pct: 24 },
        { label: "TEK", pct: 38 },
        { label: "FYS", pct: 12 }
      ],
      sgItems: [
        { label: "OTT", value: 1.10, benchmark: 0.80 },
        { label: "APP", value: 0.84, benchmark: 0.90 },
        { label: "ARG", value: 0.62, benchmark: 0.50 },
        { label: "PUTT", value: 0.36, benchmark: 0.40 }
      ],
      sgTotal: 2.92,
      toggleTheme: () => this.applyTheme(this.state.theme === "dark" ? "light" : "dark", true),
      go: (id) => this.setState({ nav: id }),
      setTab: (id) => this.setState({ tab: id }),
      spor: () => {},
      toggleCtx: (id) => this.setState((s) => ({ ctx: Object.assign({}, s.ctx, { [id]: !s.ctx[id] }) })),
      kontekst: [
        { id: "emma", label: sp.name.split(" ")[0], active: !!this.state.ctx.emma },
        { id: "stall", label: "stallen", active: !!this.state.ctx.stall },
        { id: "u31", label: "uke 31", active: !!this.state.ctx.u31 }
      ],
      railItems: [
        { id: "hjem", label: "Hjem", icon: I.hjem },
        { id: "ko", label: "Kø", icon: I.ko },
        { id: "stall", label: "Stall", icon: I.stall },
        { id: "kalender", label: "Kalender", icon: I.idag },
        { id: "plan", label: "Workbench", icon: I.plan },
        { id: "alt", label: "Alt", icon: I.analyse }
      ],
      tabItems: [
        { id: "hjem", label: "Hjem", icon: I.hjem },
        { id: "ko", label: "Kø", icon: I.ko },
        { id: "stall", label: "Stall", icon: I.stall },
        { id: "ai", label: "Agenter", icon: I.ai },
        { id: "alt", label: "Alt", icon: I.analyse }
      ],
      statusPunkter: [
        { label: "v2.4 · P3 SPES" },
        { label: "agentfeil", value: 1, tone: "dn", onClick: () => {} },
        { label: "MRR", value: "184 200", onClick: () => {} },
        { label: "innsikter", value: 6, onClick: () => {} },
        { label: "CANON", value: "✓", tone: "up" }
      ]
    };
  }
}

</script>
</body>
</html>

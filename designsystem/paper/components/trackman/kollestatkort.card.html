<!-- @dsCard group="TrackMan" viewport="980x1610" name="KolleStatKort" subtitle="Køllekort i 860 (to kort side om side hos konsument) og 300 px × begge moduser, alle datatilstander. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w300{width:300px}.to{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { KolleStatKort } = window.AKGolfHQClaudePaper_605a48;
const J7 = { club: "Jern 7", count: 22, carry: "168 m", carrySpread: "±4,2 m", rows: [
  { label: "Ballhastighet", value: "53,1 m/s" }, { label: "Spinn", value: "6 400 rpm" },
  { label: "Apex", value: "31 m" }, { label: "Landingsvinkel", value: "48°" },
] };
const DRV = { club: "Driver", count: 18, carry: "231 m", carrySpread: "±9,8 m", rows: [
  { label: "Ballhastighet", value: "72,4 m/s" }, { label: "Spinn", value: "3 150 rpm" },
  { label: "Apex", value: "38 m" },
] };
function Specimen() {
  return (<>
    <div className="lab">860 px — to køller side om side (konsumentens grid)</div>
    <div className="cw w860"><div className="to"><KolleStatKort {...J7} dataOdId="kolle-j7" /><KolleStatKort {...DRV} dataOdId="kolle-drv" /></div></div>
    <div className="lab">300 px — under 320-terskelen (hero 20 px) · tett</div>
    <div className="cw w300"><KolleStatKort {...J7} dense dataOdId="kolle-smal" /></div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <KolleStatKort club="Wedge 56" state="empty" dataOdId="kolle-tom" />
      <div style={{height:12}} />
      <KolleStatKort club="Wedge 56" state="loading" dataOdId="kolle-laster" />
      <div style={{height:12}} />
      <KolleStatKort club="Wedge 56" state="error" dataOdId="kolle-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: fjern carrySpread
   (spredningstesten rød) eller snu :not(:last-child). */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="kpi-kolle-j7"]');
  push(!!f && /±4,2 m/.test(f.textContent), "spredningen står ved carry-snittet");
  push(!!f && f.querySelectorAll(".akhq-kolle-rad").length === 4, "fire parameterrader");
  const rader = f ? [...f.querySelectorAll(".akhq-kolle-rad")] : [];
  const siste = rader[rader.length - 1];
  push(!!siste && getComputedStyle(siste).borderBottomWidth === "0px", "siste rad har aldri strek");
  /* MÅLT: siden kan rendres skalert, så en 1px-hårlinje computer til
     0.555556px — `=== "1px"` var rød på en strek som finnes. */
  push(rader.length > 0 && parseFloat(getComputedStyle(rader[0]).borderBottomWidth) > 0, "øvrige rader har hårlinje");
  push(!!f && [...f.querySelectorAll(".akhq-kolle-rv")].every((v) => /(m\/s|rpm|m$|°)/.test(v.textContent)), "alle verdier har enhet");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

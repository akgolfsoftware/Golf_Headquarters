<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.cw{box-sizing:border-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}a{color:var(--muted)}a:hover{color:var(--fg)}
</style></head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { ConfirmDialog, Button, Panel, SectionLabel, KeyValueGrid } = window.AKGolfHQClaudePaper_605a48;
function Width({ px, note, children }) {
  return (<div style={{display:"grid",gap:"var(--s2)",justifyItems:px ? "start" : "stretch"}}>
    <SectionLabel as="div">{px ? "Container " + px + " px" : "Levende · full bredde"}{note ? " · " + note : ""}</SectionLabel>
    <div className="cw" style={px ? {width:px} : {width:"100%"}}>{children}</div>
  </div>);
}
function Levende() {
  const [åpen, setÅpen] = React.useState(false);
  const [status, setStatus] = React.useState("Ingen handling utført");
  const trigger = React.useRef(null);
  return (<div>
    <Panel title="Torsdagens økt" density="sm" dataOdId="panel-okt"
      action={<Button ref={trigger} variant="ghost" size="sm" onClick={() => setÅpen(true)} dataOdId="cta-slett">Slett økt</Button>}>
      <KeyValueGrid dataOdId="kv-okt" columns={1} items={[{ key: "Status", value: status, mono: false }]} />
    </Panel>
    <ConfirmDialog open={åpen} triggerRef={trigger}
      kicker="Slett økt" title="Slette torsdagens økt?"
      body="Økten fjernes fra kalenderen og fra Emmas ukeplan."
      consequence="3 loggede serier og 2 videoklipp slettes permanent"
      confirmLabel="Slett økten"
      onConfirm={() => { setStatus("Økten er slettet"); setÅpen(false); }}
      onCancel={() => { setStatus("Avbrutt — fokus tilbake på knappen"); setÅpen(false); }} />
  </div>);
}
function Specimen() {
  return (<div style={{display:"grid",gap:"var(--s5)"}}>
    <Width note="klikk «Slett økt» — inert på bakgrunnen, Escape lukker, fokus returnerer">
      <Levende />
    </Width>
    <Width px={430} note="destruktiv · --dn tekst og ramme, aldri fylt rødt">
      <ConfirmDialog preview open kicker="Fjern spiller" title="Fjerne Emma fra stallen?"
          body="Emma mister tilgang til PlayerHQ og forsvinner fra alle lister."
          consequence="14 økter, 6 tester og all historikk beholdes i 90 dager"
          confirmLabel="Fjern Emma" onCancel={() => {}} onConfirm={() => {}} />
    </Width>
    <Width px={430} note="busy · knappene disabled, Escape og klikk utenfor sperret">
      <ConfirmDialog preview open busy kicker="Avpubliser" title="Avpublisere ukeplanen?"
          body="Planen forsvinner fra Emmas PlayerHQ til den publiseres igjen."
          consequence="Emma har allerede logget 2 av 5 økter denne uken"
          confirmLabel="Avpubliser" onCancel={() => {}} onConfirm={() => {}} />
    </Width>
    <Width px={330} note="under 340 px · handlingene stables, bekreft nederst">
      <ConfirmDialog preview open kicker="Slett drill" title="Slette «Gate 7 jern»?"
          body="Drillen fjernes fra biblioteket."
          confirmLabel="Slett drillen" onCancel={() => {}} onConfirm={() => {}} />
    </Width>
    <Width px={430} note="destructive=false · vanlig primærhandling i blekk">
      <ConfirmDialog preview open destructive={false} kicker="Publiser" title="Publisere planen til Emma?"
          body="Emma får varsel og ser planen i PlayerHQ umiddelbart."
          confirmLabel="Publiser planen" onCancel={() => {}} onConfirm={() => {}} />
    </Width>
  </div>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
</script></body></html>

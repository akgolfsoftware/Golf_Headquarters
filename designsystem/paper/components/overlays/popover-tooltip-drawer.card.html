<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.w{display:flex;flex-direction:column;gap:8px}.narrow{width:300px;max-width:100%}.rom{padding-bottom:190px}.ramme{position:relative;height:300px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}.rad{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="two"><div class="half" id="light"></div><div class="half" data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { Popover, Tooltip, Drawer, Button, Chip, FormField, TextInput, ListGroup, ListRow, StatusBadge } = window.AKGolfHQClaudePaper_605a48;
function Specimen({ narrow }) {
  const W = narrow ? "narrow" : "";
  return (<>
    <div className="lab">{narrow ? "300 px container — panelbredden" : "full bredde — hovedkolonnen"}</div>
    <div className={"w " + W}>

      <div className="lab">popover · åpen, med tittel og handlinger</div>
      <div className="rom">
        <Popover defaultOpen label="Grunnlag" title="Hvorfor foreslås 6,5 t?"
          dataOdId="popover-grunnlag"
          footer={<><Button size="sm" dataOdId="pop-ok">Godta</Button><Button size="sm" variant="ghost" dataOdId="pop-endre">Endre</Button></>}
          trigger={<Button size="sm" variant="ghost">Hvorfor?</Button>}>
          Periodens minimum er 5 t, maksimum 8 t. Forrige uke ble 6 t, og
          testen 12.07 flyttet Emma til kategori C.
        </Popover>
      </div>

      <div className="lab">popover · uten tittel, fokus til første felt</div>
      <div className="rom">
        <Popover defaultOpen label="Filtrer kø" dataOdId="popover-filter"
          footer={<Button size="sm" dataOdId="pop-bruk">Bruk filter</Button>}
          trigger={<Button size="sm" variant="ghost">Filter</Button>}>
          <FormField label="Søk i køen" htmlFor="pf1"><TextInput id="pf1" placeholder="Emma, faktura, samtykke" /></FormField>
        </Popover>
      </div>

      <div className="lab">popover · lukket (utløseren alene, aria-expanded=false)</div>
      <Popover label="Grunnlag" title="Hvorfor?" dataOdId="popover-lukket"
        trigger={<Button size="sm" variant="ghost">Hvorfor?</Button>}>Tekst</Popover>

      <div className="lab">tooltip · standard, med hurtigtast, og under</div>
      <div className="rad rom">
        <Tooltip text="Åpner indeksen over alle funksjoner" kbd="⌘K" open dataOdId="tip-alt">
          <Button size="sm" variant="ghost">Alt</Button>
        </Tooltip>
        <Tooltip text="Strokes gained, siste åtte uker" side="bottom" open dataOdId="tip-sg">
          <Button size="sm" variant="ghost">SG</Button>
        </Tooltip>
        <Tooltip text="Vises først etter 350 ms hover eller fokus" dataOdId="tip-hvile">
          <Button size="sm" variant="ghost">I hvile (hover meg)</Button>
        </Tooltip>
      </div>

      <div className="lab">drawer · høyre, med fotrad (innrammet forhåndsvisning)</div>
      <div className="ramme">
        <Drawer preview open label="Filtre" title="Avgrens køen" dataOdId="panel-drawer-h"
          footer={<><Button size="sm" dataOdId="drw-bruk">Bruk</Button><Button size="sm" variant="ghost" dataOdId="drw-nullstill">Nullstill</Button></>}>
          <ListGroup as="div">
            <ListRow as="div" title="Kun coaching" meta="4 saker" trailing="toggle" toggleChecked onToggle={()=>{}} dataOdId="list-f1" />
            <ListRow as="div" title="Kun drift" meta="3 saker" trailing="toggle" onToggle={()=>{}} dataOdId="list-f2" />
            <ListRow as="div" title="Skjul utsatte" meta="1 sak" trailing="toggle" onToggle={()=>{}} dataOdId="list-f3" />
          </ListGroup>
        </Drawer>
      </div>

      <div className="lab">drawer · venstre, uten fotrad, tom tilstand</div>
      <div className="ramme">
        <Drawer preview open side="left" label="Nylig" title="Ingen nylige artefakter" dataOdId="panel-drawer-v">
          <span style={{ color: "var(--muted)" }}>Det du åpner havner her, så du finner tilbake.</span>
        </Drawer>
      </div>

    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen narrow={false} />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen narrow={true} />);
/* ASSERTIONER. Sett feile først: bytt 43.99 til 99 i gulvmålingen, eller
   forvent at tooltipen finnes ved grov peker — begge blir røde alene.
   Falsifisering kjørt 31.07: 2 forfalsket → 2 røde, 5 uberørte grønne. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const wrap = document.createElement("div"); wrap.setAttribute("data-coarse-test", ""); document.body.appendChild(wrap);
  const gulv = (sel, min, navn) => {
    const n = document.querySelector(sel); if (!n) { push(false, navn + " ikke funnet"); return; }
    const p = n.cloneNode(true); wrap.appendChild(p);
    const r = p.getBoundingClientRect();
    const sone = parseFloat(getComputedStyle(p, "::after").height) || 0;
    const h = Math.max(r.height, sone);
    push(h >= min - 0.01, navn + " treffhøyde " + h.toFixed(1) + " px ≥ " + min + " ved grov peker (synlig boks " + r.height.toFixed(1) + " px)");
  };
  gulv(".akhq-pop-x", 44, "popover lukkeknapp");
  gulv(".akhq-drw-x", 44, "drawer lukkeknapp");
  wrap.remove();
  // Fokuskontrakt: laget har en fokuserbar node, og drawer har tabindex=-1
  const pop = document.querySelector(".akhq-pop-lay");
  push(!!pop && pop.querySelectorAll('button,input,a[href],[tabindex]:not([tabindex="-1"])').length > 0, "popover-laget har minst én fokuserbar node");
  const drw = document.querySelector(".akhq-drw");
  push(!!drw && drw.getAttribute("tabindex") === "-1" && drw.getAttribute("role") === "dialog", "drawer er role=dialog med tabindex=-1");
  // Tooltip er koblet, og ikke-interaktiv
  const tip = document.querySelector(".akhq-tip-lay");
  const trig = document.querySelector('[data-od-id="tip-alt"] button');
  push(!!tip && tip.getAttribute("role") === "tooltip" && !!trig && trig.getAttribute("aria-describedby") === tip.id, "tooltip koblet med aria-describedby");
  push(!!tip && getComputedStyle(tip).pointerEvents === "none", "tooltip stjeler ingen klikk (pointer-events: none)");
  // Oransjemonopolet: ingen av lagene bruker aksentfargen på flate eller ramme
  const lag = [...document.querySelectorAll(".akhq-pop-lay,.akhq-drw,.akhq-tip-lay")];
  const oransje = lag.filter((e) => { const c = getComputedStyle(e); return /217, ?119, ?87/.test(c.backgroundColor + c.borderTopColor + c.borderLeftColor); });
  push(oransje.length === 0, "ingen av lagene bruker oransje som flate eller ramme");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  document.getElementById("light").appendChild(ut);
  window.__assert = res;
}, 80));
</script></body></html>

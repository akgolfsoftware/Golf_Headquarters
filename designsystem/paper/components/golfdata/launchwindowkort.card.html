<!-- @dsCard group="Golfdata" viewport="980x1490" name="LaunchWindowKort" subtitle="Launch-vindu i 860 og 340 px × begge moduser: innenfor/utenfor, alle datatilstander. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w340{width:340px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { LaunchWindowKort } = window.AKGolfHQClaudePaper_605a48;
const P = [
  { label: "Launch", value: 12.4, display: "12,4°", windowMin: 11, windowMax: 14, windowDisplay: "11–14°", scaleMin: 6, scaleMax: 20, inWindow: true },
  { label: "Spinn", value: 3150, display: "3 150 rpm", windowMin: 2200, windowMax: 2800, windowDisplay: "2 200–2 800", scaleMin: 1500, scaleMax: 4000 },
  { label: "Angrepsvinkel", value: 1.8, display: "+1,8°", windowMin: 0, windowMax: 4, windowDisplay: "0–+4°", scaleMin: -5, scaleMax: 8, inWindow: true },
];
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjans driver: launch og angrepsvinkel innenfor, spinnet over vinduet</div>
    <div className="cw w860"><LaunchWindowKort club="Driver" params={P} dataOdId="lwin-driver" /></div>
    <div className="lab">340 px — under 380-terskelen: tallkolonnen ryker, sporet bærer</div>
    <div className="cw w340"><LaunchWindowKort club="Driver" params={P} dataOdId="lwin-smal" /></div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <LaunchWindowKort params={[]} state="empty" dataOdId="lwin-tom" />
      <div style={{height:12}} />
      <LaunchWindowKort params={[]} state="loading" dataOdId="lwin-laster" />
      <div style={{height:12}} />
      <LaunchWindowKort params={[]} state="error" dataOdId="lwin-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: sett spinn inWindow:true
   (utenfor-testen rød) eller tving --vind:inline i smal. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const d = LYS.querySelector('[data-od-id="kpi-lwin-driver"]');
  push(!!d && d.querySelectorAll(".akhq-lwin-rad").length === 3, "tre parametre");
  push(!!d && d.querySelectorAll(".akhq-lwin-m--ut").length === 1, "kun spinnet er utenfor vinduet");
  const ut1 = d && d.querySelector(".akhq-lwin-m--ut");
  push(!!ut1 && /168, ?85, ?54/.test(getComputedStyle(ut1).backgroundColor), "utenfor-markøren er leire, aldri rød");
  push(!!d && /3 150 rpm utenfor/.test(d.getAttribute("aria-label") || ""), "sammendraget sier innenfor/utenfor med enhet");
  const smalV = LYS.querySelector('[data-od-id="kpi-lwin-smal"] .akhq-lwin-v');
  push(!!smalV && getComputedStyle(smalV).display === "none", "340 px → tallkolonnen skjult (terskel 380)");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

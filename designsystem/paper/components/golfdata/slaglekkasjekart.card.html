<!-- @dsCard group="Golfdata" viewport="980x1790" name="SlagLekkasjeKart" subtitle="Rangerte SG-tap i 860 og 340 px × begge moduser: verste fremhevet, tett, alle datatilstander. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w340{width:340px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { SlagLekkasjeKart } = window.AKGolfHQClaudePaper_605a48;
const RADER = [
  { label: "Nærspill 20–50 m", sg: -1.84, display: "−1,84" },
  { label: "Utslag under press", sg: -1.1, display: "−1,10" },
  { label: "Putt 9–15 ft", sg: -0.6, display: "−0,60" },
  { label: "Bunker", sg: -0.35, display: "−0,35" },
];
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjans lekkasjer siste 5 runder, nærspillet verst</div>
    <div className="cw w860"><SlagLekkasjeKart rows={RADER} basis="siste 5 runder" note="Resten av spillet er på eller over kategori B-nivå." dataOdId="lekk-full" /></div>
    <div className="lab">340 px — under 380-terskelen · tett</div>
    <div className="cw w340">
      <SlagLekkasjeKart rows={RADER} dataOdId="lekk-smal" />
      <div style={{height:12}} />
      <SlagLekkasjeKart rows={RADER.slice(0, 2)} dense dataOdId="lekk-tett" />
    </div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <SlagLekkasjeKart rows={[]} state="empty" dataOdId="lekk-tom" />
      <div style={{height:12}} />
      <SlagLekkasjeKart rows={[]} state="loading" dataOdId="lekk-laster" />
      <div style={{height:12}} />
      <SlagLekkasjeKart rows={[]} state="error" dataOdId="lekk-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: fremhev rad 2 i stedet
   for rad 1, eller bruk bindestrek i display. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="kpi-lekk-full"]');
  const fyll = f ? [...f.querySelectorAll(".akhq-lekk-fyll")] : [];
  push(fyll.length === 4, "fire lekkasjer");
  push(fyll.length > 1 && fyll[0].classList.contains("akhq-lekk-fyll--verst") && !fyll[1].classList.contains("akhq-lekk-fyll--verst"), "kun øverste rad er fremhevet");
  push(fyll.length > 1 && fyll[0].getBoundingClientRect().width > fyll[1].getBoundingClientRect().width, "størst tap er lengst");
  push(!!f && [...f.querySelectorAll(".akhq-lekk-v")].every((v) => /^−/.test(v.textContent)), "alle verdier bruker ekte minustegn");
  push(!!f && /nærspill/i.test(f.textContent), "ordboka: nærspill");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

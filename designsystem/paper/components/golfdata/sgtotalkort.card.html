<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w320{width:320px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>

<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { SgTotalKort } = window.AKGolfHQClaudePaper_605a48;
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjan, positiv total med delta og basis</div>
    <div className="cw w860"><SgTotalKort value={2.92} delta={0.4} deltaBasis="vs forrige 5 runder" basis="siste 5 runder · mot kategori B" dataOdId="sgt-pos" /></div>
    <div className="lab">negativ total · kompakt</div>
    <div className="cw w860">
      <SgTotalKort value={-1.35} delta={-0.2} deltaBasis="vs forrige 5 runder" basis="siste 5 runder · mot kategori B" dataOdId="sgt-neg" />
      <div style={{height:12}} />
      <SgTotalKort value={2.92} compact basis="siste 5 runder" dataOdId="sgt-komp" />
    </div>
    <div className="lab">320 px — under 340-terskelen (hero 32 px)</div>
    <div className="cw w320"><SgTotalKort value={2.92} delta={0.4} deltaBasis="vs forrige 5" basis="siste 5 runder" dataOdId="sgt-smal" /></div>

ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: fjern fortegnet i sg()
   (formattesten rød) eller bytt --dn til rød hex. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const pos = LYS.querySelector('[data-od-id="kpi-sgt-pos"] .akhq-sgt-hero');
  push(!!pos && pos.textContent === "+2,92", "positiv: fortegn + komma-desimal (" + (pos ? pos.textContent : "?") + ")");
  const neg = LYS.querySelector('[data-od-id="kpi-sgt-neg"] .akhq-sgt-hero');
  push(!!neg && neg.textContent === "−1,35", "negativ: ekte minustegn (" + (neg ? neg.textContent : "?") + ")");
  push(!!pos && !!neg && getComputedStyle(pos).color !== getComputedStyle(neg).color, "positiv og negativ har ulik tone");
  push(!!neg && /168, ?85, ?54/.test(getComputedStyle(neg).color), "negativ er leire (--dn), aldri rød");
  push(!!LYS.querySelector('[data-od-id="kpi-sgt-pos"] .akhq-sgt-basis'), "basis-linjen vises — aldri SG uten grunnlag");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

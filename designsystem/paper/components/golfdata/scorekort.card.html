<!-- @dsCard group="Golfdata" viewport="980x2360" name="Scorekort" subtitle="18 hull i 860 og 400 px × begge moduser: birdie/eagle/bogey/dobbel-merker, 9-hulls, kompakt, alle datatilstander. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w400{width:400px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { Scorekort } = window.AKGolfHQClaudePaper_605a48;
const PAR = [4, 5, 3, 4, 4, 5, 3, 4, 4, 4, 3, 5, 4, 4, 3, 5, 4, 4];
const SLAG = [4, 4, 4, 4, 3, 5, 3, 6, 4, 4, 3, 3, 5, 4, 2, 5, 5, 5];
const HULL = PAR.map((par, i) => ({ par, score: SLAG[i] }));
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjan på GFGK: birdie (sirkel, hull 2/5/15), eagle (dobbel sirkel, hull 12 — 3 på par 5), bogey (firkant, hull 3/13/17/18), dobbel (hull 8). Sum 73 = +1</div>
    <div className="cw w860"><Scorekort holes={HULL} courseLabel="GFGK · 3. august" dataOdId="scor-full" /></div>
    <div className="lab">400 px — under 560-terskelen: 18 px merker, ingen horisontal scroll · 9 hull kompakt</div>
    <div className="cw w400">
      <Scorekort holes={HULL} courseLabel="GFGK" dataOdId="scor-smal" />
      <div style={{height:12}} />
      <Scorekort holes={HULL.slice(0, 9)} compact courseLabel="9 hull · kveld" dataOdId="scor-ni" />
    </div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <Scorekort holes={[]} state="empty" dataOdId="scor-tom" />
      <div style={{height:12}} />
      <Scorekort holes={[]} state="loading" dataOdId="scor-laster" />
      <div style={{height:12}} />
      <Scorekort holes={[]} state="error" dataOdId="scor-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: fjern «brutto» fra
   totalen (brutto-testen rød) eller gi bogey-merket rød ramme. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="kpi-scor-full"]');
  push(!!f && f.querySelectorAll(".akhq-scor-s").length === 18, "18 hull");
  push(!!f && /brutto/i.test(f.textContent), "totalen er merket brutto — aldri netto");
  push(!!f && f.querySelectorAll(".akhq-scor-s--eagle").length === 1 && f.querySelectorAll(".akhq-scor-s--dobbel").length === 1, "eagle- og dobbelmerket finnes");
  const birdie = f && f.querySelector(".akhq-scor-s--birdie");
  const bogey = f && f.querySelector(".akhq-scor-s--bogey");
  push(!!birdie && getComputedStyle(birdie).borderRadius === "999px", "birdie er sirkel");
  push(!!bogey && getComputedStyle(bogey).borderRadius === "3px", "bogey er firkant");
  push(!!birdie && !!bogey && getComputedStyle(birdie).color === getComputedStyle(bogey).color, "tallet er alltid --fg — tonen bor i rammen");
  push(!!f && /73 slag/.test(f.getAttribute("aria-label") || ""), "sammendraget: 73 slag (+1 \u2014 aldri lik par, s\u00e5 fortegnsvisningen vises)");
  const smal = LYS.querySelector('[data-od-id="kpi-scor-smal"]');
  push(!!smal && smal.scrollWidth <= smal.clientWidth + 1, "400 px: ingen horisontal scroll");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

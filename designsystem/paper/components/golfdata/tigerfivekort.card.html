/* ASSERTIONER — verifikatør skal se dem feile først: send seks tall (radtesten

window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const a = LYS.querySelector('[data-od-id="kpi-t5-avvik"]');
  push(!!a && a.querySelectorAll(".akhq-t5-rad").length === 5, "alltid fem rader");
  push(!!a && a.querySelectorAll(".akhq-t5-prikk--avvik").length === 3, "tre rader med avvik tones leire");

  push(!!null_ && null_.querySelectorAll(".akhq-t5-prikk--avvik").length === 0, "perfekt runde: alle prikker oliven");

  window.__assert = res;

<!-- @dsCard group="Golfdata" viewport="980x1650" name="PuttModellKort" subtitle="Make-% per fot i 860 og 340 px × begge moduser: over/under referanse, alle datatilstander. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w340{width:340px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { PuttModellKort } = window.AKGolfHQClaudePaper_605a48;
const RADER = [
  { ft: 3, pct: 96, display: "96 %", ref: 95, refDisplay: "95 %" },
  { ft: 6, pct: 68, display: "68 %", ref: 65, refDisplay: "65 %" },
  { ft: 9, pct: 41, display: "41 %", ref: 45, refDisplay: "45 %" },
  { ft: 15, pct: 22, display: "22 %", ref: 24, refDisplay: "24 %" },
  { ft: 25, pct: 9, display: "9 %", ref: 10, refDisplay: "10 %" },
];
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjans modell: 3 og 6 ft over referansen (oliven), resten under (blå)</div>
    <div className="cw w860"><PuttModellKort rows={RADER} basis="siste 90 dager · ref kategori B" dataOdId="pmod-full" /></div>
    <div className="lab">340 px — under 380-terskelen: referanseverdien ryker fra kolonnen</div>
    <div className="cw w340"><PuttModellKort rows={RADER} dataOdId="pmod-smal" /></div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <PuttModellKort rows={[]} state="empty" dataOdId="pmod-tom" />
      <div style={{height:12}} />
      <PuttModellKort rows={[]} state="loading" dataOdId="pmod-laster" />
      <div style={{height:12}} />
      <PuttModellKort rows={[]} state="error" dataOdId="pmod-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: bytt ft til m i kilden
   (fot-testen rød) eller sett ref-markøren til --dn. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="kpi-pmod-full"]');
  push(!!f && f.querySelectorAll(".akhq-pmod-rad").length === 5, "fem distanser");
  push(!!f && [...f.querySelectorAll(".akhq-pmod-d")].every((d) => / ft$/.test(d.textContent)), "alle distanser i FOT (CANON)");
  push(!!f && f.querySelectorAll(".akhq-pmod-fyll--over").length === 2, "3 og 6 ft over referansen tones oliven");
  push(!!f && f.querySelectorAll(".akhq-pmod-ref").length === 5, "referansemarkør i hver rad");
  const smalRef = LYS.querySelector('[data-od-id="kpi-pmod-smal"] .akhq-pmod-refv');
  push(!!smalRef && getComputedStyle(smalRef).display === "none", "340 px → ref-verdien skjult (terskel 380)");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

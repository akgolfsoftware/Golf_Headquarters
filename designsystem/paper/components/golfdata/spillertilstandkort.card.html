<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w340{width:340px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { SpillerTilstandKort } = window.AKGolfHQClaudePaper_605a48;
const FELT = [
  { label: "Form", value: "72,4 snitt", tone: "up" },
  { label: "Etterlevelse", value: "86 %" },
  { label: "Sist aktiv", value: "i går" },
  { label: "Neste", value: "tir 09:00" },
];
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjan i stallen, med flagg til coach</div>
    <div className="cw w860"><SpillerTilstandKort fields={FELT} flags={["Ingen FYS-økt logget på 8 dager — planen sier 2/uke."]} basis="oppdatert i dag 07:12" dataOdId="stk-flagg" /></div>
    <div className="lab">uten flagg (normaltilstanden)</div>
    <div className="cw w860"><SpillerTilstandKort fields={FELT} basis="oppdatert i dag 07:12" dataOdId="stk-ren" /></div>
    <div className="lab">340 px — under 380-terskelen: 2 × 2</div>
    <div className="cw w340"><SpillerTilstandKort fields={FELT} dataOdId="stk-smal" /></div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <SpillerTilstandKort fields={[]} state="empty" dataOdId="stk-tom" />
      <div style={{height:12}} />
      <SpillerTilstandKort fields={[]} state="loading" dataOdId="stk-laster" />
      <div style={{height:12}} />
      <SpillerTilstandKort fields={[]} state="error" dataOdId="stk-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: send fem felter
   (maks-testen rød) eller skriv «sperret» i et flagg. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="kpi-stk-flagg"]');
  push(!!f && f.querySelectorAll(".akhq-stk-felt").length === 4, "fire felter");
  push(!!f && f.querySelectorAll(".akhq-stk-flagg-rad").length === 1, "ett flagg");
  push(!!f && !/sperret|låst/i.test(f.textContent), "flagget informerer — ingen sperretekst");
  const up = f && f.querySelector(".akhq-stk-fv--up");
  push(!!up && /120, ?143, ?74|99, ?120, ?74/.test(getComputedStyle(up).color), "form-tonen er oliven (--up)");
  push(!!LYS.querySelector('[data-od-id="kpi-stk-ren"]') && !LYS.querySelector('[data-od-id="kpi-stk-ren"] .akhq-stk-flagg-rad'), "uten flagg: ingen flaggliste");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { StrikeSmashKort } = window.AKGolfHQClaudePaper_605a48;

/* ASSERTIONER — verifikatør skal se dem feile først: gi hæl-segmentet leire
   (moraltesten rød) eller skriv smash med punktum. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="kpi-ssk-full"]');
  const v = f && f.querySelector(".akhq-ssk-v");
  push(!!v && v.textContent === "1,46", "smash med komma-desimal (" + (v ? v.textContent : "?") + ")");
  push(!!f && /mål 1,48/.test(f.textContent), "målet står ved siden av");
  const seg = f ? [...f.querySelectorAll(".akhq-ssk-strike .akhq-ssk-seg")] : [];
  push(seg.length === 3 && seg[1].getBoundingClientRect().width > seg[0].getBoundingClientRect().width, "senter (67 %) er bredest");
  push(seg.length === 3 && !seg.some((s) => /168, ?85, ?54/.test(getComputedStyle(s).backgroundColor)), "ingen leire i treffbildet — avvik er ikke moral");
  push(!!f && /hæl 20 %/.test(f.getAttribute("aria-label") || ""), "sammendraget bærer fordelingen");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));

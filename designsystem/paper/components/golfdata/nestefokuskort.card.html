<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w320{width:320px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>

<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { NesteFokusKort, Button } = window.AKGolfHQClaudePaper_605a48;
const FULL = {
  title: "Nærspillet er største gevinst",
  why: "Du taper 1,2 slag per runde rundt greenen mot kategori B. Utslag og putting holder nivået — flytter vi treningstid hit, flytter scoren seg mest.",
  evidence: "SG nærspill −1,2 · siste 5 runder · størst gap mot kategori B",
  planNote: "Lagt inn som 2 økter/uke i SPES-perioden",
};
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjan, full anbefaling med handling (bibliotekets Button)</div>
    <div className="cw w860"><NesteFokusKort {...FULL} actions={<Button size="sm" dataOdId="nfok-wb">Åpne i Workbench</Button>} dataOdId="nfok-full" /></div>
    <div className="lab">uten handling · kompakt</div>
    <div className="cw w860">
      <NesteFokusKort title="Hold vedlikeholdsdosen på putting" evidence="SG putt +0,3 · stabil i 8 uker" dataOdId="nfok-kort" />
      <div style={{height:12}} />
      <NesteFokusKort {...FULL} compact dataOdId="nfok-komp" />
    </div>
    <div className="lab">320 px — under 340-terskelen</div>
    <div className="cw w320"><NesteFokusKort {...FULL} dataOdId="nfok-smal" /></div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <NesteFokusKort title="" state="empty" dataOdId="nfok-tom" />
      <div style={{height:12}} />
      <NesteFokusKort title="" state="loading" dataOdId="nfok-laster" />
      <div style={{height:12}} />
      <NesteFokusKort title="" state="error" dataOdId="nfok-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: gi kickeren --accent
   (oransjetesten rød) eller tegn en egen knapp i kortet. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="panel-nfok-full"]');
  const alt = f ? f.querySelectorAll("*") : [];
  push(!!f && ![...alt].some((e) => /217, ?119, ?87/.test(getComputedStyle(e).color + getComputedStyle(e).backgroundColor)), "ingenting i kortet er oransje — OneThingNow eier den");
  push(!!f && f.querySelectorAll(".akhq-btn").length === 1, "handlingen er bibliotekets Button");
  push(!!f && /nærspill/i.test(f.textContent) && !/kort spill/i.test(f.textContent), "ordboka: nærspill, aldri kort spill");
  const why = f && f.querySelector(".akhq-nfok-hvorfor");
  push(!!why && /Lora/.test(getComputedStyle(why).fontFamily), "hvorfor-prosaen er Lora i du-form");
  push(!!f && /I planen/i.test(f.textContent), "plankoblingen vises");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

<!-- @dsCard group="Datakomponenter" viewport="980x900" name="Gauge, stige og mål" subtitle="ScoreGauge · GoalProgress · ProgramLadder · PercentileGauge — med tweaks for symmetri i gauge-tallet" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
.tw{border-top:1px solid var(--border);margin-top:var(--s5);padding-top:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.tw-row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.tw-lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:96px}
.tw input[type=range]{flex:1;min-width:140px;accent-color:var(--fg);height:44px}
.tw input[type=text]{font:400 12.5px/1 var(--mono);color:var(--fg);background:var(--soft);border:1px solid var(--border);border-radius:var(--r-sm);height:44px;padding:0 10px;width:110px;box-sizing:border-box}
.tw input[type=text]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tw-out{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.55}
.tw-ok{color:var(--up)}.tw-bad{color:var(--dn)}
/* Senterlinjen er en m\u00e5lelinje, ikke pynt: den viser buens midtakse s\u00e5 avviket
   kan leses av direkte i stedet for \u00e5 p\u00e5st\u00e5s. */
.guide{position:relative}
.guide::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--dn);opacity:.55;z-index:2}
.guide-hero .akhq-gauge-hero{outline:1px dashed var(--info);outline-offset:2px}
</style></head>
<body><div class="two"><div class="half" id="light"></div><div class="half" data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { ScoreGauge, GoalProgress, ProgramLadder, PercentileGauge, Button, SegmentControl } = window.AKGolfHQClaudePaper_605a48;

const subs = [
  { label: "Fokus", value: "8,1", window: "siste økt" },
  { label: "Volum", value: "420", unit: "baller", window: "denne uka" },
  { label: "Treff", value: "68", unit: "%", window: "siste økt" },
];

/* Tweaks lever i kortet, ikke i komponenten: de finnes for å kunne SE og MÅLE
   symmetrivalget, ikke for å gi produktet en bryter det ikke skal ha. */
function GaugeTweaks() {
  const [value, setValue] = React.useState(82);
  const [unit, setUnit] = React.useState("av 100");
  const [plass, setPlass] = React.useState("Enhet under");
  const [guide, setGuide] = React.useState(true);
  const wrapRef = React.useRef(null);
  const [maal, setMaal] = React.useState(null);
  const placement = plass === "Enhet under" ? "below" : "inline";

  /* Måler direkte i effektkroppen: layout er committet når effekten kjører.
     IKKE requestAnimationFrame — rAF er suspendert i en skjult ramme
     (document.hidden), og kortgriden rendrer kort utenfor skjermen for
     miniatyrer, så callbacken ville aldri kjørt og readouten aldri vist seg
     [funn 31.07]. ResizeObserver dekker re-måling ved breddeendring. */
  const mal = React.useCallback(() => {
    const rot = wrapRef.current;
    if (!rot) return;
    const svg = rot.querySelector(".akhq-gauge svg");
    const hero = rot.querySelector(".akhq-gauge-hero");
    if (!svg || !hero) return;
    const s = svg.getBoundingClientRect(), h = hero.getBoundingClientRect();
    if (!s.width) return;
    const bue = (s.left + s.right) / 2, tall = (h.left + h.right) / 2;
    /* +0 fjerner negativ null: «-0.00 px» leser som et avvik i en retning, og
       det finnes ingen retning når avviket er null. */
    const avvik = (tall - bue) + 0;
    setMaal({ avvik: avvik, andel: avvik / s.width * 100, stablet: !!rot.querySelector(".akhq-gauge-val") });
  }, []);

  React.useLayoutEffect(() => { mal(); }, [value, unit, placement, mal]);

  React.useEffect(() => {
    const rot = wrapRef.current;
    if (!rot || typeof ResizeObserver !== "function") return;
    const ro = new ResizeObserver(() => mal());
    ro.observe(rot);
    return () => ro.disconnect();
  }, [mal]);

  const symmetrisk = maal && Math.abs(maal.avvik) < 1;
  /* Norsk UI: komma som desimaltegn, også i en måleutskrift. */
  const nb = (n, d) => (Math.abs(n) < 0.005 ? 0 : n).toFixed(d).replace(".", ",");
  return (
    <div>
      <div ref={wrapRef} className={(guide ? "guide " : "") + (guide ? "guide-hero" : "")}>
        <ScoreGauge label="Treningskvalitet" value={value} unit={unit} unitPlacement={placement} subs={subs} />
      </div>
      <div className="tw">
        <div className="tw-row"><span className="tw-lab">Enhetens plass</span>
          <SegmentControl options={["Enhet under", "Enhet inline"]} value={plass} onChange={setPlass} dataOdId="nav-tw-plass" />
        </div>
        <div className="tw-row"><span className="tw-lab">Verdi {value}</span>
          <input type="range" min="0" max="100" step="1" value={value} onChange={(e) => setValue(+e.target.value)} aria-label="Verdi" />
        </div>
        <div className="tw-row"><span className="tw-lab">Enhetstekst</span>
          <input type="text" value={unit} onChange={(e) => setUnit(e.target.value)} aria-label="Enhetstekst" />
          <Button size="sm" variant="ghost" onClick={() => setUnit("%")} dataOdId="cta-tw-kort">%</Button>
          <Button size="sm" variant="ghost" onClick={() => setUnit("av 100")} dataOdId="cta-tw-lang">av 100</Button>
        </div>
        <div className="tw-row"><span className="tw-lab">Senterlinje</span>
          <Button size="sm" variant={guide ? "primary" : "ghost"} onClick={() => setGuide((g) => !g)} dataOdId="cta-tw-guide">{guide ? "Vist" : "Skjult"}</Button>
          <span className="tw-out">rød = buens akse · blå = tallets boks</span>
        </div>
        {maal && (
          <div className={"tw-out " + (symmetrisk ? "tw-ok" : "tw-bad")}>
            {symmetrisk ? "✓ " : "✗ "}tallets senter avviker {nb(maal.avvik, 2)} px fra buens — {nb(maal.andel, 1)} % av buebredden
            {placement === "below" && !maal.stablet && " · ADVARSEL: bundelen mangler unitPlacement, så komponenten rendrer inline"}
          </div>
        )}
        <div className="tw-out">Prøv «Enhet inline» med lang enhet: avviket er halve enhetsbredden, så «av 100» er fire ganger verre enn «%».</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("light")).render(<>
  <GaugeTweaks />
  <GoalProgress label="Rangeøkter" value={9} target={12} unit="økter" window="denne måneden" />
</>);
ReactDOM.createRoot(document.getElementById("dark")).render(<>
  <ScoreGauge label="Treningskvalitet" value={82} unit="av 100" subs={subs} />
  <ProgramLadder xp={{ label: "Nivå 3", current: 55, max: 450 }} steps={[
    { title: "Dag 1 · Grunnslag", status: "done" },
    { title: "Dag 2 · Approach", meta: "4 drills · 45 min", status: "active", action: <Button size="sm" dataOdId="cta-start-step">Start</Button> },
    { title: "Dag 3 · Banespill", status: "locked" },
  ]} />
  <PercentileGauge label="SG total" value={68} cohort="NGF U19 · siste 12 mnd" />
</>);
</script></body></html>

<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}a{color:var(--muted)}a:hover{color:var(--fg)}</style></head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { SkipLink, ThemeToggle, QuickLinkBar, StickyActionBar, Toast, Panel, Button, SectionLabel, KeyValueGrid } = window.AKGolfHQClaudePaper_605a48;
function Width({ px, note, children }) {
  return (<div style={{display:"grid",gap:"var(--s2)",justifyItems:"start"}}>
    <SectionLabel as="div">Container {px} px{note ? " · " + note : ""}</SectionLabel>
    <div className="cw" style={{width:px}}>{children}</div>
  </div>);
}
function Specimen({ toggleTarget }) {
  return (<div style={{display:"grid",gap:"var(--s5)"}}>
    <div style={{display:"grid",gap:"var(--s3)"}}>
      <SectionLabel as="div">SkipLink · usynlig til den får fokus</SectionLabel>
      <div style={{position:"relative",minHeight:56,border:"1px dashed var(--border)",borderRadius:"var(--r-sm)",padding:"var(--s3)",overflow:"hidden"}}>
        <SkipLink href="#innhold" />
        <span style={{font:"400 12.5px/1.5 var(--body)",color:"var(--muted)"}}>Første element i body. Skjules med left:-9999px, aldri display:none — den må kunne fokuseres.</span>
      </div>
    </div>
    <div style={{display:"grid",gap:"var(--s3)"}}>
      <SectionLabel as="div">ThemeToggle · frittstående, egen nøkkel per flate</SectionLabel>
      <div style={{display:"flex",gap:"var(--s3)",alignItems:"center",flexWrap:"wrap"}}>
        <ThemeToggle storageKey="akhq-theme-demo" target={toggleTarget} />
        <span style={{font:"400 12px/1.5 var(--body)",color:"var(--muted)"}}>Teksten viser modusen som er aktiv nå, ikke den knappen bytter til.</span>
      </div>
    </div>
    <Width px={860} note="QuickLinkBar · sekundær navigasjon i bunnen av en seksjon">
      <Panel title="Belastning uke 31" footnote="Tallene oppdateres når økten lagres." dataOdId="panel-bel">
        <KeyValueGrid dataOdId="kv-bel" items={[
          { key: "Planlagt volum", value: "4 økter" },
          { key: "Registrert", value: "3 økter" },
          { key: "Avvik", value: "−1" },
          { key: "Neste økt", value: "tor 09:30" }
        ]} />
        <div style={{marginTop:"var(--s4)"}}>
          <QuickLinkBar links={[
            { id:"periode", text:"Periodeplan", href:"#periode" },
            { id:"tester", text:"Testresultater", href:"#tester" },
            { id:"kalender", text:"Kalender", href:"#kalender" }
          ]} />
        </div>
      </Panel>
    </Width>
    <Width px={430} note="StickyActionBar · sticky i rullende beholder, maks to knapper">
      <div style={{height:240,overflow:"auto",border:"1px dashed var(--border)",borderRadius:"var(--r)",display:"flex",flexDirection:"column"}}>
        <div style={{padding:"var(--s4)",flex:1}}>
          <p style={{margin:0,font:"400 12.5px/1.55 var(--body)",color:"var(--muted)"}}>Innholdet ruller under raden. Gradienten over kanten hindrer at teksten ser avkuttet ut.</p>
          <p style={{margin:"var(--s4) 0 0",font:"400 12.5px/1.55 var(--body)",color:"var(--muted)"}}>Sticky, ikke fixed — raden legger seg aldri over PlayerHQs TabBar, og hver skjerm slipper å huske bunnpolstring.</p>
          <p style={{margin:"var(--s4) 0 0",font:"400 12.5px/1.55 var(--body)",color:"var(--muted)"}}>Bunnpolstringen tar høyde for safe-area på iPhone med hjemmeindikator.</p>
        </div>
        <StickyActionBar note="Utkast lagret 08:42">
          <Button variant="ghost" size="sm" dataOdId="cta-forhandsvis">Forhåndsvis</Button>
          <Button size="sm" dataOdId="cta-publiser">Publiser</Button>
        </StickyActionBar>
      </div>
    </Width>
    <div style={{display:"grid",gap:"var(--s3)"}}>
      <SectionLabel as="div">Toast · farge i prikken, aldri i flaten</SectionLabel>
      <div style={{display:"flex",flexWrap:"wrap",gap:"var(--s3)"}}>
        <Toast inline>Utkast lagret</Toast>
        <Toast inline tone="ok">Ukeplan publisert til Øyvind</Toast>
        <Toast inline tone="warn">Synk feilet · prøver igjen om 30 s</Toast>
        <Toast inline tone="info">Tre nye forslag fra Caddie</Toast>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen toggleTarget="#light" />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen toggleTarget="#dark" />);
</script></body></html>

<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w380{width:380px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { SpillerGruppeVeksler } = window.AKGolfHQClaudePaper_605a48;
const ITEMS = [
  { key: "wang", label: "WANG VG2", group: true, count: 6 },
  { key: "oyvind", label: "Øyvind Rohjan" },
  { key: "emma", label: "Øyvind Rohjan" },
  { key: "jonas", label: "Jonas Lie" },
];
function Demo({ id, start }) {
  const [v, setV] = React.useState(start);
  return <SpillerGruppeVeksler items={ITEMS} value={v} onChange={setV} allCount={15} dataOdId={id} />;
}
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjan valgt; Alle og WANG-gruppen med antall</div>
    <div className="cw w860"><Demo id="sgv-bred" start="oyvind" /></div>
    <div className="lab">380 px — under 420-terskelen: navnene kollapser, valgene står</div>
    <div className="cw w380"><Demo id="sgv-smal" start={null} /></div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: fjern Alle-valget
   (standardtesten rød) eller skjul et valg i smal bredde. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const b = LYS.querySelector('[data-od-id="nav-sgv-bred"]');
  push(!!b && b.querySelectorAll('[role=radio]').length === 5, "Alle + gruppe + tre spillere = fem valg");
  push(!!b && /Alle/.test(b.querySelectorAll('[role=radio]')[0].textContent), "Alle står først");
  const valgt = b && b.querySelector('[aria-checked="true"]');
  push(!!valgt && /Øyvind Rohjan/.test(valgt.textContent) && !/217, ?119, ?87/.test(getComputedStyle(valgt).backgroundColor), "valgt er blekkfylt, aldri oransje");
  push(!!b && b.querySelectorAll(".akhq-avatar").length === 3, "spillerne har avatar fra biblioteket");
  const smal = LYS.querySelector('[data-od-id="nav-sgv-smal"]');
  const smalNavn = smal && smal.querySelector(".akhq-sgvx-navn");
  push(!!smal && smal.querySelectorAll('[role=radio]').length === 5 && !!smalNavn && getComputedStyle(smalNavn).display === "none", "380 px → navn kollapser, alle valg står");
  push(!!b && b.querySelectorAll('[role=radio][tabindex="0"]').length === 1, "roving tabindex: ett tab-stopp");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

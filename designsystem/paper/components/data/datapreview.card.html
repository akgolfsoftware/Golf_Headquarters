<!-- @dsCard group="Data" viewport="980x1450" name="DataPreview" subtitle="Import-forhåndsvisning i 860 og 320 px × begge moduser: resttall, tett, alle datatilstander. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w320{width:320px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { DataPreview } = window.AKGolfHQClaudePaper_605a48;
const KOL = ["Dato", "Turnering", "Bane", "Brutto"];
const RADER = [
  ["12.07.2026", "Srixon Tour #3", "Losby", "74"],
  ["05.07.2026", "Klubbmesterskap", "GFGK", "71"],
  ["28.06.2026", "Srixon Tour #2", "Miklagard", "76"],
  ["21.06.2026", "Treningsrunde", "GFGK", "73"],
  ["14.06.2026", "Srixon Tour #1", "Bogstad", "75"],
  ["07.06.2026", "Klubbturnering", "GFGK", "72"],
];
function Specimen() {
  return (<>
    <div className="lab">860 px — GolfBox-import for Øyvind Rohjan: fem rader vises, resten telles</div>
    <div className="cw w860"><DataPreview columns={KOL} rows={RADER} moreCount={38} dataOdId="dp-full" /></div>
    <div className="lab">320 px — under 380-terskelen: tabellen ruller i egen container · tett</div>
    <div className="cw w320"><DataPreview columns={KOL} rows={RADER.slice(0, 3)} dense dataOdId="dp-smal" /></div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <DataPreview columns={[]} rows={[]} state="empty" dataOdId="dp-tom" />
      <div style={{height:12}} />
      <DataPreview columns={[]} rows={[]} state="loading" dataOdId="dp-laster" />
      <div style={{height:12}} />
      <DataPreview columns={[]} rows={[]} state="error" dataOdId="dp-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: vis alle seks rader
   (taktesten rød) eller flytt scrollen til siden. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="panel-dp-full"]');
  push(!!f && f.querySelectorAll(".akhq-dprev-tr").length === 5, "seks rader inn → fem vises (taket)");
  push(!!f && /\+ 38 rader til/.test(f.textContent), "resttallet vises");
  const siste = f && f.querySelector(".akhq-dprev-tr:last-child .akhq-dprev-td");
  push(!!siste && getComputedStyle(siste).borderBottomWidth === "0px", "siste rad uten strek");
  const scroll = LYS.querySelector('[data-od-id="panel-dp-smal"] .akhq-dprev-scroll');
  push(!!scroll && getComputedStyle(scroll).overflowX === "auto", "rullingen bor i komponentens container");
  push(!!f && f.querySelectorAll("button").length === 0, "ren visning — import-knappen eier konsumenten");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

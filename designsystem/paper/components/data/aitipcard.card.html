<!-- @dsCard group="Data" viewport="980x1590" name="AiTipCard" subtitle="Caddie-tips i 860 og 320 px × begge moduser: med/uten lukking, dempet, alle datatilstander. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w320{width:320px}.w{display:flex;flex-direction:column;gap:14px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { AiTipCard } = window.AKGolfHQClaudePaper_605a48;
const TIP = "Wedge-serien din har truffet vinduet tre økter på rad — vurder å øke presset til konkurranseform på torsdag.";
function Specimen() {
  return (<>
    <div className="lab">860 px — tips med evidens og lukking · uten lukking · dempet</div>
    <div className="cw w860"><div className="w">
      <AiTipCard tip={TIP} evidence="8 av 10 innenfor 5 m · siste 3 økter" onDismiss={()=>{}} dataOdId="tip-full" />
      <AiTipCard source="Plan-vakten" tip="Uka ligger 1,5 t under GRUNN-vinduet — helgen har ledig plass lørdag formiddag." evidence="4,0 t av 5–8 t · uke 32" dataOdId="tip-uten" />
      <AiTipCard tip="Husk å registrere velvære før økta." muted dataOdId="tip-dempet" />
    </div></div>
    <div className="lab">320 px — under 340-terskelen</div>
    <div className="cw w320"><AiTipCard tip={TIP} evidence="siste 3 økter" onDismiss={()=>{}} dataOdId="tip-smal" /></div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <AiTipCard tip="" state="empty" dataOdId="tip-tom" />
      <div style={{height:12}} />
      <AiTipCard tip="" state="loading" dataOdId="tip-laster" />
      <div style={{height:12}} />
      <AiTipCard tip="" state="error" dataOdId="tip-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: gi kickeren --accent
   (oransjetesten rød) eller legg en handlingsknapp i tipset. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="panel-tip-full"]');
  const kick = f && f.querySelector(".akhq-aitip-kick");
  push(!!kick && /70, ?113, ?159/.test(getComputedStyle(kick).color), "kickeren er analyse-blå");
  push(!!kick && !/217, ?119, ?87/.test(getComputedStyle(kick).color), "aldri oransje");
  push(!!f && f.querySelectorAll("button").length === 1, "kun lukkeknappen — ingen handlingsknapper i et tips");
  push(!!f && /siste 3 økter/.test(f.textContent), "evidenslinjen vises");
  const uten = LYS.querySelector('[data-od-id="panel-tip-uten"]');
  push(!!uten && uten.querySelectorAll("button").length === 0, "uten onDismiss: ingen knapp");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

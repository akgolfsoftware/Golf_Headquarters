<!-- @dsCard group="Struktur" viewport="980x3600" name="DataTable" subtitle="Sortering, tallkolonner i mono, egen rullecontainer, tom/laster/feil. Begge moduser × to containerbredder" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:var(--s2)}.blokk{display:flex;flex-direction:column;gap:var(--s5)}.assert{font-family:var(--mono);font-size:10px;line-height:1.55;white-space:pre-wrap;margin-top:var(--s5)}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { DataTable } = window.AKGolfHQClaudePaper_605a48;

const KOL = [
  { key: "navn", label: "Spiller", sortable: true, strong: true, width: "170px" },
  { key: "kat", label: "AK-kategori", width: "110px" },
  { key: "runder", label: "Runder", align: "end", sortable: true },
  { key: "snitt", label: "Snittscore", align: "end", sortable: true },
  { key: "sg", label: "SG totalt", align: "end", sortable: true, tone: (r) => (r.sgTall >= 0 ? "up" : "dn") },
  { key: "sist", label: "Sist spilt", width: "130px" }
];
const RAD = [
  { id: 1, navn: "Øyvind Rohjan", kat: "D", runder: 5, snitt: "74,2", sg: "+2,92", sgTall: 2.92, sist: "28.07.2026" },
  { id: 2, navn: "Jonas Hveem", kat: "C", runder: 4, snitt: "71,8", sg: "−0,41", sgTall: -0.41, sist: "27.07.2026" },
  { id: 3, navn: "Mia Kolstad", kat: "E", runder: 6, snitt: "79,5", sg: "−1,86", sgTall: -1.86, sist: "26.07.2026" },
  { id: 4, navn: "Aksel Rønning", kat: "A", runder: 5, snitt: "69,4", sg: "+4,18", sgTall: 4.18, sist: "29.07.2026" }
];
const FOT = "Kilde: registrerte runder + TrackMan · siste 5 runder · oppdatert 31.07.2026 kl. 09:15";

function Specimen() {
  const [sort, setSort] = React.useState({ key: "sg", dir: "desc" });
  return (
    <div className="blokk">
      <div>
        <span className="lab">860 px container — AgencyOS hovedspalte · sortert på SG totalt</span>
        <div className="cw" style={{ width: 860 }} data-bred>
          <DataTable caption="Stall · SG totalt siste 5 runder" columns={KOL} rows={RAD}
            sort={sort} onSort={setSort} footNote={FOT} dataOdId="panel-stall-bred" />
        </div>
      </div>

      <div>
        <span className="lab">430 px container — PlayerHQ-kolonnen · terskelen fyrt, tabellen ruller i seg selv</span>
        <div className="cw" style={{ width: 430 }} data-smal>
          <DataTable caption="Stall · SG totalt" columns={KOL} rows={RAD}
            sort={sort} onSort={setSort} footNote={FOT} dataOdId="panel-stall-smal" />
        </div>
      </div>

      <div>
        <span className="lab">laster — skjelettrader med kjent geometri, ikke spinner</span>
        <div className="cw" style={{ width: 430 }}>
          <DataTable columns={KOL.slice(0, 4)} rows={[]} state="loading" loadingRows={3} dataOdId="panel-stall-laster" />
        </div>
      </div>

      <div>
        <span className="lab">tom — ekte norsk tomtekst</span>
        <div className="cw" style={{ width: 430 }}>
          <DataTable columns={KOL.slice(0, 4)} rows={[]} state="empty"
            emptyText="Ingen registrerte runder i perioden ennå. Runder dukker opp her så snart en økt er avsluttet."
            dataOdId="panel-stall-tom" />
        </div>
      </div>

      <div>
        <span className="lab">feil — samme anatomi, egen tekst</span>
        <div className="cw" style={{ width: 430 }}>
          <DataTable columns={KOL.slice(0, 4)} rows={RAD} state="error"
            errorText="Kunne ikke hente runder fra TrackMan. Prøv igjen om et øyeblikk."
            dataOdId="panel-stall-feil" />
        </div>
      </div>

      <div>
        <span className="lab">tetthet tett — samme kolonner, strammere rader</span>
        <div className="cw" style={{ width: 430 }}>
          <DataTable columns={KOL.slice(0, 4)} rows={RAD} density="tett" dataOdId="panel-stall-tett" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);

/* ASSERTIONER — skal ses feile først. Tre forfalskninger kjørt 31.07 mot en
   rigg som serverer bundelen med DataTable-kilden injisert (kompilatoren var
   ikke tilgjengelig i den økta):
     (1) sorteringsgulvet klemt til 20 px      -> 1 rød, 13 uberørte grønne
     (2) tallkolonnen tvunget til text-align:left -> 1 rød, 13 uberørte grønne
     (3) .akhq-dt-scroll{overflow:visible}      -> 1 rød, 13 uberørte grønne

   TELLENDE ASSERTIONER SKOPES TIL LYS-HALVDELEN. Kortet rendrer to spesimen;
   alt som telles dobles ellers. Den feilen ble funnet 31.07 i tre assertioner
   på forms-p2 og workbench som derfor aldri kunne bli grønne. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");

  // Gulv ved grov peker — målt på en klone i en coarse-merket wrapper
  const wrap = document.createElement("div"); wrap.setAttribute("data-coarse-test", ""); document.body.appendChild(wrap);
  const sorter = LYS.querySelector(".akhq-dt-sort");
  if (!sorter) { push(false, "sorteringsknapp ikke funnet — instrumentsvikt, ikke funn"); }
  else {
    const p = sorter.cloneNode(true); wrap.appendChild(p);
    const h = p.getBoundingClientRect().height;
    push(h >= 43.99, "sorteringsknapp " + h.toFixed(1) + " px ≥ 44 ved grov peker (synlig " + sorter.getBoundingClientRect().height.toFixed(1) + " px)");
  }
  wrap.remove();

  // Tallkolonner: høyrestilt OG mono med tabulære sifre
  const tall = [...LYS.querySelectorAll('[data-od-id="panel-stall-bred"] .akhq-dt-td--tall')];
  const cs = tall.length ? getComputedStyle(tall[0]) : null;
  push(tall.length > 0 && tall.every((t) => getComputedStyle(t).textAlign === "right"), "alle tallceller er høyrestilt (" + tall.length + " celler)");
  push(!!cs && /Plex Mono/.test(cs.fontFamily) && /tabular-nums/.test(cs.fontVariantNumeric), "tallceller er mono med tabulære sifre (" + (cs ? cs.fontVariantNumeric : "-") + ")");

  // Rullingen bor i komponenten — ikke på siden
  const smal = LYS.querySelector('[data-od-id="panel-stall-smal"] .akhq-dt-scroll');
  push(!!smal && smal.scrollWidth > smal.clientWidth + 1, "430 px: tabellen er bredere enn containeren (" + (smal ? smal.scrollWidth + " > " + smal.clientWidth : "-") + ")");
  /* Paret over+under er poenget: tabellen ER for bred, OG det er denne
     containeren som tar rullingen.
     FORKASTET PREDIKAT (31.07): `document.documentElement.scrollWidth <=
     window.innerWidth` så riktig ut og var grønt, men kunne ikke bli rødt —
     verdien er klemt til viewporten selv med overflow slått av og tabellen
     tvunget til 2400 px. En sjekk som ikke kan bli rød beviser ingenting.
     Merk også at forfalskningen må sette BEGGE akser: er én akse `visible`
     og den andre ikke, regner CSS `visible` om til `auto`, og en
     ettakset forfalskning blir en no-op. */
  const oxSmal = smal ? getComputedStyle(smal).overflowX : "";
  push(oxSmal === "auto", "rullingen bor på .akhq-dt-scroll (overflow-x: " + oxSmal + "), ikke på en forelder");

  // Sortering: aria-sort på th, nøyaktig én sortert kolonne
  const ths = [...LYS.querySelectorAll('[data-od-id="panel-stall-bred"] .akhq-dt-th')];
  const sortert = ths.filter((t) => ["ascending", "descending"].includes(t.getAttribute("aria-sort")));
  push(sortert.length === 1 && sortert[0].getAttribute("aria-sort") === "descending", "nøyaktig én kolonne har aria-sort, og den er descending");
  push(ths.filter((t) => t.getAttribute("aria-sort") === "none").length === 3, "de tre øvrige sorterbare kolonnene har aria-sort=none");

  // Siste rad har aldri strek
  const rader = [...LYS.querySelectorAll('[data-od-id="panel-stall-bred"] .akhq-dt-tr')];
  const siste = rader[rader.length - 1];
  push(rader.length === 4 && getComputedStyle(siste.querySelector(".akhq-dt-td")).borderBottomWidth === "0px", "siste rad har ingen skillelinje");

  // Tilstander
  const sk = LYS.querySelectorAll('[data-od-id="panel-stall-laster"] .akhq-dt-sk');
  push(sk.length === 12, "lastetilstand gir 3 rader × 4 kolonner skjelett (" + sk.length + ")");
  const tom = LYS.querySelector('[data-od-id="panel-stall-tom"] .akhq-dt-tom');
  push(!!tom && !/Ingen data/.test(tom.textContent) && tom.textContent.length > 30, "tomtekst er ekte norsk setning, ikke «Ingen data»");
  const feil = LYS.querySelector('[data-od-id="panel-stall-feil"] .akhq-dt-tom');
  push(!!feil && /TrackMan/.test(feil.textContent), "feiltilstand viser sin egen tekst, ikke tomteksten");

  // Grunnlagslinjen ligger utenfor rullecontaineren
  const fot = LYS.querySelector('[data-od-id="panel-stall-bred"] .akhq-dt-fot');
  push(!!fot && !fot.closest(".akhq-dt-scroll"), "grunnlagslinjen ruller ikke med tabellen");

  // Fargedisiplin
  const flater = [...LYS.querySelectorAll(".akhq-dt-scroll,.akhq-dt-th,.akhq-dt-td,.akhq-dt-sort")];
  push(flater.every((e) => !/217, ?119, ?87/.test(getComputedStyle(e).backgroundColor)), "ingen tabellflate bruker oransje");
  const opp = LYS.querySelector('[data-od-id="panel-stall-bred"] .akhq-dt-td--opp');
  push(!!opp && /99, ?120, ?74/.test(getComputedStyle(opp).color), "positiv SG er --up grønn (" + (opp ? getComputedStyle(opp).color : "-") + ")");

  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 120));
</script></body></html>

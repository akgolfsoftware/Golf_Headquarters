<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w430{width:430px}.lerret{border:1px dashed var(--border);border-radius:var(--r-sm);padding:var(--s4);font-family:var(--mono);font-size:11px;color:var(--muted)}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { UkeKalender, VisningsVelger } = window.AKGolfHQClaudePaper_605a48;
function Specimen() {
  const lerret = <div className="lerret">[ lerretet — TimeGrid eller AgendaRow-liste sendes som children ]</div>;
  return (<>
    <div className="lab">860 px — AgencyOS hovedspalte (over 560-terskelen: datospennet vises)</div>
    <div className="cw w860">
      <UkeKalender weekLabel="Uke 32" rangeLabel="3.–9. august 2026" onPrev={()=>{}} onNext={()=>{}} onToday={()=>{}}
        toolbar={<VisningsVelger value="uke" onChange={()=>{}} dataOdId="ukal-visning" />} dataOdId="ukal-bred">{lerret}</UkeKalender>
    </div>
    <div className="lab">430 px — PlayerHQ-kolonnen (under 560: datospennet er skjult, uketallet står)</div>
    <div className="cw w430">
      <UkeKalender weekLabel="Uke 32" rangeLabel="3.–9. august 2026" onPrev={()=>{}} onNext={()=>{}} onToday={()=>{}} dataOdId="ukal-smal">{lerret}</UkeKalender>
    </div>
    <div className="lab">tilstander: tom · laster · feil · kompakt · uten navigasjon (lese-artefakt)</div>
    <div className="cw w860">
      <UkeKalender weekLabel="Uke 33" state="empty" dataOdId="ukal-tom" />
      <div style={{height:12}} />
      <UkeKalender weekLabel="Uke 33" state="loading" dataOdId="ukal-laster" />
      <div style={{height:12}} />
      <UkeKalender weekLabel="Uke 33" state="error" dataOdId="ukal-feil" />
      <div style={{height:12}} />
      <UkeKalender weekLabel="Uke 34" rangeLabel="17.–23. august 2026" compact onToday={()=>{}} dataOdId="ukal-kompakt">{lerret}</UkeKalender>
      <div style={{height:12}} />
      <UkeKalender weekLabel="Uke 32" rangeLabel="3.–9. august 2026" dataOdId="ukal-lese">{lerret}</UkeKalender>
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — forfatteren har IKKE sett dem kjøre; verifikatør skal se dem
   feile først: tving f.eks. terskelen til 5600 px (da blir «smal viser ikke
   spennet» rød) eller fjern en handler (da blir knappetellingen rød). */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const bred = LYS.querySelector('[data-od-id="panel-ukal-bred"]');
  const smal = LYS.querySelector('[data-od-id="panel-ukal-smal"]');
  const rb = bred && bred.querySelector(".akhq-ukal-range");
  const rs = smal && smal.querySelector(".akhq-ukal-range");
  push(!!rb && getComputedStyle(rb).display !== "none", "860 px → datospennet vises");
  push(!!rs && getComputedStyle(rs).display === "none", "430 px → datospennet er skjult (terskel 560)");
  push(!!bred && bred.querySelectorAll("button").length >= 3, "bred ramme har I dag + ‹ + ›");
  const lese = LYS.querySelector('[data-od-id="panel-ukal-lese"]');
  push(!!lese && lese.querySelectorAll("button").length === 0, "uten handlere → ingen knapper (lese-artefakt)");
  const wrap = document.createElement("div"); wrap.setAttribute("data-coarse-test", ""); document.body.appendChild(wrap);
  const b = LYS.querySelector('[data-od-id="cta-ukal-bred-idag"]');
  if (b) { const k = b.cloneNode(true); wrap.appendChild(k); push(k.getBoundingClientRect().height >= 43.99, "I dag-knappen " + k.getBoundingClientRect().height.toFixed(1) + " px ved grov peker"); }
  wrap.remove();
  push(!!LYS.querySelector('[data-od-id="panel-ukal-tom"] .akhq-empty'), "tom tilstand har norsk tomtekst");
  push(!!LYS.querySelector('[data-od-id="panel-ukal-laster"] .akhq-skel'), "laster-tilstand rendrer skeleton");
  push(!!LYS.querySelector('[data-od-id="panel-ukal-feil"] .akhq-error'), "feiltilstand rendrer feiltekst");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

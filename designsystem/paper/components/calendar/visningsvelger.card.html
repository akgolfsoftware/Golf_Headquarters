<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w340{width:340px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { VisningsVelger } = window.AKGolfHQClaudePaper_605a48;
function Demo({ start }) {
  const [v, setV] = React.useState(start);
  return <VisningsVelger value={v} onChange={setV} dataOdId={"vv-" + start} />;
}
function Specimen() {
  return (<>
    <div className="lab">860 px — alle fem visninger, interaktiv (klikk/piltaster bytter)</div>
    <div className="cw w860"><Demo start="uke" /></div>
    <div className="lab">340 px — under 360-terskelen: strammere polstring, etikettene står</div>
    <div className="cw w340"><Demo start="dag" /></div>
    <div className="lab">delmengde (PlayerHQ: dag/uke/agenda) · blokk-modifikator i 340 px</div>
    <div className="cw w340">
      <VisningsVelger value="agenda" views={["dag", "uke", "agenda"]} onChange={()=>{}} dataOdId="vv-del" />
      <div style={{height:10}} />
      <VisningsVelger value="uke" views={["dag", "uke", "agenda"]} block onChange={()=>{}} dataOdId="vv-blokk" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: bytt forventet etikett
   til «Mnd» (rød) eller fjern [data-coarse-test]-klonen (gulvtesten rød). */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const g = LYS.querySelector('[data-od-id="nav-vv-uke"]');
  push(!!g && g.getAttribute("role") === "radiogroup", "gruppen er radiogroup");
  const knapper = g ? [...g.querySelectorAll('[role=radio]')] : [];
  push(knapper.length === 5 && knapper.map((k) => k.textContent).join("·") === "Dag·Uke·Måned·Periode·Agenda", "fem visninger i fast rekkefølge med fulle etiketter");
  push(knapper.filter((k) => k.tabIndex === 0).length === 1, "roving tabindex: ett tab-stopp");
  const valgt = knapper.find((k) => k.getAttribute("aria-checked") === "true");
  push(!!valgt && !/217, ?119, ?87/.test(getComputedStyle(valgt).backgroundColor), "valgt visning er aldri oransje");
  const del = LYS.querySelector('[data-od-id="nav-vv-del"]');
  push(!!del && del.querySelectorAll('[role=radio]').length === 3, "views-delmengde gir tre knapper");
  const wrap = document.createElement("div"); wrap.setAttribute("data-coarse-test", ""); document.body.appendChild(wrap);
  if (valgt) { const k = valgt.cloneNode(true); wrap.appendChild(k); push(k.getBoundingClientRect().height >= 43.99, "knapp " + k.getBoundingClientRect().height.toFixed(1) + " px ved grov peker"); }
  wrap.remove();
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

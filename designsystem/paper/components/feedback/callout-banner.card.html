<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}</style></head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { Callout, Banner, Panel, SectionLabel, Toast } = window.AKGolfHQClaudePaper_605a48;
function Width({ px, note, children }) {
  return (<div style={{display:"grid",gap:"var(--s2)",justifyItems:"start"}}>
    <SectionLabel as="div">Container {px} px{note ? " · " + note : ""}</SectionLabel>
    <div className="cw" style={{width:px}}>{children}</div>
  </div>);
}
const Bånd = () => (<div style={{display:"grid",gap:"var(--s3)"}}>
  <Banner tone="warn" announce="alert" label="Validering" title="Planen kan ikke publiseres" actionLabel="Gå til uke 34" dataOdId="banner-validering">Uke 34 har 6 økter mot maks 5. Rett volumet før du publiserer.</Banner>
  <Banner tone="info" announce="status" label="Drift" closable dataOdId="banner-drift">TrackMan-synk er forsinket. Tall fra i dag kan mangle til 14:00.</Banner>
</div>);
function Specimen() {
  return (<div style={{display:"grid",gap:"var(--s5)"}}>
    <div style={{display:"grid",gap:"var(--s3)"}}>
      <SectionLabel as="div">Callout · fire toner</SectionLabel>
      <Callout>Caddie foreslår, du godkjenner. Ingenting publiseres til spilleren uten at du sier ja.</Callout>
      <Callout tone="warn" label="Validering">Volum må være mellom 1 og 40 økter før planen kan publiseres.</Callout>
      <Callout tone="info" label="Kilde">Tallene kommer fra TrackMan-økter siste 30 dager. Runder på bane teller ikke inn her.</Callout>
      <Callout tone="privacy" label="Personvern">Foreldre ser sammendrag og betaling, aldri fritekstnotater fra økten.</Callout>
    </div>
    <Width px={860} note="hovedspalte · tre grid-spor, handlinger til høyre"><Bånd /></Width>
    <Width px={500} note="i panel → container 462 · over terskelen"><Panel title="Bånd i panel" dataOdId="panel-band"><Bånd /></Panel></Width>
    <Width px={430} note="PlayerHQ-kolonne · under 460 → handlinger under teksten"><Bånd /></Width>
    <div style={{display:"grid",gap:"var(--s3)"}}>
      <SectionLabel as="div">Grensen: Toast forsvinner, Banner blir stående, Callout forklarer</SectionLabel>
      <Toast inline>Ukeplan publisert til Emma</Toast>
      <Panel title="I panel" density="sm" dataOdId="panel-callout">
        <Callout tone="info">Callout ligger inne i panelet og forklarer stedet. Den har ingen handling og går ikke bort.</Callout>
      </Panel>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
</script></body></html>

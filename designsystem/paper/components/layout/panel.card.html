<!-- @dsCard group="Fundament" viewport="980x3400" name="Panel" subtitle="Kortflaten ~60 skjermer står på — verifisert i fire containerbredder rundt 480px-terskelen" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}</style></head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { Panel, SectionLabel, Button, ListGroup, ListRow } = window.AKGolfHQClaudePaper_605a48;
const queue = [
  { name: "Emma Berg", meta: "Ukeplan foreslått av Caddie", v: "i dag" },
  { name: "Jonas Hult", meta: "Testprotokoll godkjent 08:14", v: "man" }
];
function Prose({ pad }) {
  return (<Panel title="Ukens tall" density="md" dataOdId="panel-prose">
    <p style={{margin:0,font:"400 12.5px/1.55 var(--body)",color:"var(--muted)",textWrap:"pretty"}}>Ikke-flush panel — polstring {pad}. Her er sammenligningen mot flush-panelet over synlig.</p>
  </Panel>);
}
function Demo() {
  return (<Panel title="Godkjenninger" action={<a href="#" style={{font:"600 12.5px/1 var(--ui)",color:"var(--muted)",textDecoration:"none"}}>Se hele køen →</a>} footnote="Fire av tolv spillere har avvik verdt en samtale denne uken." flush dataOdId="panel-godkjenninger">
    <ListGroup dataOdId="list-ko">
      {queue.map((q,i)=> <ListRow key={i} leading="avatar" avatar={{name:q.name}} title={q.name} meta={q.meta} trailing="value" value={q.v} href={"#"+i} dataOdId={"ko-"+i} />)}
    </ListGroup>
  </Panel>);
}
function Width({ px, note, children }) {
  return (<div style={{display:"grid",gap:"var(--s2)",justifyItems:"start"}}>
    <SectionLabel as="div">Container {px} px{note ? " · " + note : ""}</SectionLabel>
    <div className="cw" style={{width:px}}>{children}</div>
  </div>);
}
function Specimen() {
  return (<div style={{display:"grid",gap:"var(--s5)"}}>
    <Width px={860} note="AgencyOS hovedspalte · flush 0 · md 16/18/18">
      <div style={{display:"grid",gap:"var(--s4)"}}><Demo /><Prose pad="16/18/18" /></div>
    </Width>
    <Width px={500} note="to-kolonnepanel · over terskelen, uendret">
      <div style={{display:"grid",gap:"var(--s4)"}}><Demo /><Prose pad="16/18/18" /></div>
    </Width>
    <Width px={430} note="PlayerHQ-kolonne · under 480 · flush fortsatt 0 · md 16">
      <div style={{display:"grid",gap:"var(--s4)"}}><Demo /><Prose pad="16" /></div>
    </Width>
    <Width px={430} note="varianter: density sm, uten tittel (DIV)">
      <div style={{display:"grid",gap:"var(--s4)"}}>
        <Panel label="Denne uken" title="Belastning" density="sm" action={<Button variant="ghost" size="sm">Juster</Button>} dataOdId="panel-belastning">
          <p style={{margin:0,font:"400 12.5px/1.5 var(--body)",color:"var(--muted)"}}>Tett variant for sidespalte og inspektørpanel.</p>
        </Panel>
        <Panel dataOdId="panel-uten-tittel">
          <p style={{margin:0,font:"400 13px/1.55 var(--body)",color:"var(--muted)",textWrap:"pretty"}}>Uten tittel rendres Panel som &lt;div&gt; — et landemerke uten tilgjengelig navn skal ikke forekomme.</p>
        </Panel>
      </div>
    </Width>
  </div>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
</script></body></html>

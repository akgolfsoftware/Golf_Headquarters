<!-- @dsCard group="Skall" viewport="980x1900" name="Composer, StatusBar og CommandPalette" subtitle="Bølge P1 — skallets tre manglende deler. Komponist festet under flaten, mono-statuslinje, ⌘K-indeks med nivåmerke" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.w{display:flex;flex-direction:column;gap:8px}.narrow{width:380px;max-width:100%}.frame{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--bg)}.stub{padding:var(--s4);color:var(--muted);font-size:12px}.assert{font-family:var(--mono);font-size:10px;line-height:1.5}.ok{color:var(--up)}.bad{color:var(--dn)}.cmdk-inline{position:relative;height:330px;overflow:hidden;border:1px solid var(--border);border-radius:var(--r)}.cmdk-inline .akhq-cmdk-scrim{position:absolute;padding-top:var(--s4)}</style>
</head>
<body><div class="two"><div class="half" id="light"></div><div class="half" data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { Composer, StatusBar, CommandPalette, Divider, Skeleton, FAB } = window.AKGolfHQClaudePaper_605a48;
const punkter = [
  { label: "v2.4 · P3 SPES" },
  { label: "agentfeil", value: 1, tone: "dn", onClick: () => {} },
  { label: "MRR", value: "184 200", onClick: () => {} },
  { label: "innsikter", value: 6, onClick: () => {} },
  { label: "CANON", value: "✓", tone: "up" }
];
const funksjoner = [
  { id: "oyvind-plan", label: "Øyvind Rohjan · ukeplan", group: "artefakter", meta: "uke 31", level: 2 },
  { id: "oyvind-prof", label: "Øyvind Rohjan · spillerprofil", group: "artefakter", meta: "fem faner", level: 2 },
  { id: "periode", label: "Periodeplan P3 SPESIALISERING", group: "artefakter", level: 2 },
  { id: "wb", label: "Planlegg uke i Workbench", group: "flater", meta: "krever bredde", level: 3, keywords: "workbench dra økter" },
  { id: "kal", label: "Kalender", group: "flater", meta: "uke · dag · år", level: 3 },
  { id: "publiser", label: "Publiser ukeplan …", group: "handlinger", level: 1 },
  { id: "spor", label: "Spør om en spiller …", group: "handlinger", level: 1 }
];
function Specimen({ narrow, cmdkOpen }) {
  const [tekst, setTekst] = React.useState("");
  const [ctx, setCtx] = React.useState({ oyvind: true });
  const kontekst = [
    { id: "oyvind", label: "Øyvind R.", active: !!ctx.oyvind },
    { id: "u31", label: "uke 31", active: !!ctx.u31 },
    { id: "p3", label: "P3 SPES", active: !!ctx.p3 }
  ];
  return (<>
    <div className="lab">{narrow ? "380 px container" : "full bredde"}</div>
    <div className={"w " + (narrow ? "narrow" : "")}>
      <div className="lab">Composer — festet under flaten</div>
      <div className="frame"><div className="stub">Flaten står her. Komponisten tar aldri plass fra den.</div>
        <Composer value={tekst} onChange={setTekst} context={kontekst} onContextToggle={(id) => setCtx((s) => ({ ...s, [id]: !s[id] }))} onSubmit={() => setTekst("")} />
      </div>
      <div className="lab">Composer · med tekst (send aktiv) og disabled</div>
      <div className="frame"><Composer value="Hvordan ligger Øyvind an mot kategorikravene?" onChange={()=>{}} /></div>
      <div className="frame"><Composer disabled placeholder="Komponisten er av i fullskjerm" /></div>

      <div className="lab">StatusBar — mono, tre klikkbare celler, skjult under 880 px vindu</div>
      <div className="frame"><div className="stub">Flate</div><StatusBar items={punkter} /></div>

      <div className="lab">CommandPalette — nivåmerke per rad</div>
      <div className="cmdk-inline"><CommandPalette open={cmdkOpen} items={funksjoner} query={cmdkOpen ? "" : ""} onQueryChange={()=>{}} onPick={()=>{}} onClose={()=>{}} /></div>

      <div className="lab">Divider · Skeleton · FAB (FAB rendres inline her, i produkt er den fixed)</div>
      <div className="frame" style={{padding:"var(--s4)"}}>
        <Divider label="utsatt" align="start" />
        <Skeleton variant="text" lines={3} />
        <Divider spacing="tight" />
        <div style={{display:"flex",gap:10,alignItems:"center"}}><Skeleton variant="circle" height={28} /><Skeleton variant="number" /></div>
        <Divider label="handling" align="start" />
        <div style={{position:"relative",height:70}}><FAB label="Logg slag" style={{position:"absolute",right:0,bottom:0}} /></div>
      </div>
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen narrow={false} cmdkOpen={true} />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen narrow={true} cmdkOpen={true} />);
/* ASSERTIONER. Skal ses feile først: sett forventet gulv til 99 px, eller
   forvent at hinten er synlig i den smale spalten — begge blir røde alene. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const wrap = document.createElement("div"); wrap.setAttribute("data-coarse-test", ""); document.body.appendChild(wrap);
  const maal = (sel, min) => {
    const n = document.querySelector(sel); if (!n) { push(false, sel + " ikke funnet"); return; }
    const p = n.cloneNode(true); wrap.appendChild(p);
    const h = p.getBoundingClientRect().height;
    push(h >= min - 0.01, sel + " " + h.toFixed(1) + " px ≥ " + min + " ved grov peker");
  };
  maal(".akhq-comp-in", 44);
  maal(".akhq-comp-ctx", 44);
  maal(".akhq-cmdk-item", 44);
  maal(".akhq-fab", 56);
  wrap.remove();
  // StatusBar: klikkbar celle har 44 px ::after-sone, men boksen forblir liten
  const sb = document.querySelector(".akhq-sbar-btn");
  const w2 = document.createElement("div"); w2.setAttribute("data-coarse-test", ""); document.body.appendChild(w2);
  const p2 = sb.cloneNode(true); w2.appendChild(p2);
  const sone = parseFloat(getComputedStyle(p2, "::after").height);
  const boks = p2.getBoundingClientRect().height;
  push(sone >= 43.99 && boks < 44, "statuslinjecelle: sone " + sone.toFixed(1) + " px, synlig boks " + boks.toFixed(1) + " px");
  w2.remove();
  // Komponistens hint skjules i smal container
  const hint = document.querySelector("#dark .akhq-comp-hint");
  push(hint && getComputedStyle(hint).display === "none", "380 px container → komponisthinten skjult");
  const hint2 = document.querySelector("#light .akhq-comp-hint");
  push(hint2 && getComputedStyle(hint2).display !== "none", "full bredde → hinten synlig");
  // Tomt felt: send er disabled
  const send = document.querySelector('#light [data-od-id="cta-composer-send"]');
  push(!!send && send.disabled, "tomt komponistfelt → send-knappen er disabled");
  // Nivåmerket finnes på hver palett-rad som har level
  const merker = document.querySelectorAll("#light .akhq-cmdk-item .akhq-badge--tag").length;
  push(merker >= 7, "palettrader med nivåmerke: " + merker);
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  document.getElementById("light").appendChild(ut);
  window.__assert = res;
}, 80));
</script></body></html>

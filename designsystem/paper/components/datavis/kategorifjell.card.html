<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w340{width:340px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { KategoriFjell } = window.AKGolfHQClaudePaper_605a48;
const KAT = [
  { label: "A", value: 82, krav: 90 }, { label: "B", value: 74, krav: 80 },
  { label: "C", value: 68, krav: 70 }, { label: "D", value: 71, krav: 60 },
  { label: "E", value: 55, krav: 50 }, { label: "F", value: 48, krav: 45 },
  { label: "G", value: 40, krav: 40 }, { label: "H", value: 36, krav: 35 },
  { label: "I", value: 28, krav: 30 }, { label: "J", value: 22, krav: 25 },
  { label: "K", value: 15, krav: 20 },
];
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjans A–K-profil mot kategorikrav, fokus på C</div>
    <div className="cw w860"><KategoriFjell categories={KAT} focus="C" dataOdId="kfjell-bred" /></div>
    <div className="lab">uten kravlinje (ingen krav i data → heller ingen legend)</div>
    <div className="cw w860"><KategoriFjell categories={KAT.map((c) => ({ label: c.label, value: c.value }))} dataOdId="kfjell-uten" /></div>
    <div className="lab">340 px — under 380-terskelen: 88 px høyde · lav variant</div>
    <div className="cw w340">
      <KategoriFjell categories={KAT} focus="C" dataOdId="kfjell-smal" />
      <div style={{height:12}} />
      <KategoriFjell categories={KAT} low showLegend={false} dataOdId="kfjell-lav" />
    </div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <KategoriFjell categories={[]} state="empty" dataOdId="kfjell-tom" />
      <div style={{height:12}} />
      <KategoriFjell categories={[]} state="loading" dataOdId="kfjell-laster" />
      <div style={{height:12}} />
      <KategoriFjell categories={[]} state="error" dataOdId="kfjell-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: gi kravlinjen rød
   stroke i kilden, eller fjern polygon-punktene for A og K. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const b = LYS.querySelector('[data-od-id="kpi-kfjell-bred"]');
  push(!!b && b.querySelectorAll(".akhq-kfjell-klab").length === 11, "elleve kategorier A–K");
  push(!!b && !!b.querySelector(".akhq-kfjell-krav"), "kravlinjen tegnes når krav finnes");
  const uten = LYS.querySelector('[data-od-id="kpi-kfjell-uten"]');
  push(!!uten && !uten.querySelector(".akhq-kfjell-krav") && !uten.querySelector(".akhq-kfjell-legend"), "uten krav: ingen linje og ingen legend");
  const fokus = b && b.querySelector(".akhq-kfjell-klab--fokus");
  push(!!fokus && fokus.textContent === "C", "fokus-kategorien C er fremhevet");
  const krav = b && b.querySelector(".akhq-kfjell-krav");
  push(!!krav && /106, ?155, ?204/.test(getComputedStyle(krav).stroke), "kravlinjen er analyse-blå (--info-raw), aldri rød");
  push(!!b && /A 82/.test(b.getAttribute("aria-label") || ""), "sammendraget bærer kategoriverdiene");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

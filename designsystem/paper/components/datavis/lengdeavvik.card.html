<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w340{width:340px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { LengdeAvvik } = window.AKGolfHQClaudePaper_605a48;
const RADER = [
  { label: "Driver", value: 6, display: "+6 m langt" },
  { label: "J5", value: 2, display: "+2 m langt" },
  { label: "J7", value: -4, display: "−4 m kort" },
  { label: "J9", value: -2, display: "−2 m kort" },
  { label: "Wedge 56", value: -11, display: "−11 m kort", flagged: true },
];
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjans carry-avvik mot mål, wedge 56 flagget utenfor toleranse</div>
    <div className="cw w860"><LengdeAvvik rows={RADER} dataOdId="lavv-bred" /></div>
    <div className="lab">340 px — under 380-terskelen: smalere kolonner · tett variant</div>
    <div className="cw w340">
      <LengdeAvvik rows={RADER} dataOdId="lavv-smal" />
      <div style={{height:12}} />
      <LengdeAvvik rows={RADER.slice(0, 3)} dense dataOdId="lavv-tett" />
    </div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <LengdeAvvik rows={[]} state="empty" dataOdId="lavv-tom" />
      <div style={{height:12}} />
      <LengdeAvvik rows={[]} state="loading" dataOdId="lavv-laster" />
      <div style={{height:12}} />
      <LengdeAvvik rows={[]} state="error" dataOdId="lavv-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: flagg alle rader
   (moraltesten rød) eller fjern retningsordet fra display. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const b = LYS.querySelector('[data-od-id="kpi-lavv-bred"]');
  const rader = b ? [...b.querySelectorAll(".akhq-lavv-rad")] : [];
  push(rader.length === 5, "fem køller");
  const langt = rader[0] && rader[0].querySelector(".akhq-lavv-stolpe");
  const kort = rader[2] && rader[2].querySelector(".akhq-lavv-stolpe");
  push(!!langt && langt.style.left === "50%", "+6 m tegnes til høyre for null");
  push(!!kort && kort.style.right === "50%", "−4 m tegnes til venstre for null");
  push(!!langt && !!kort && getComputedStyle(langt).backgroundColor === getComputedStyle(kort).backgroundColor, "begge retninger er --mid — retning er ikke moral");
  const flagg = rader[4] && rader[4].querySelector(".akhq-lavv-stolpe");
  push(!!flagg && /168, ?85, ?54/.test(getComputedStyle(flagg).backgroundColor), "flagget rad er leire (--dn), aldri rød");
  push(!!b && /−4 m kort/.test(b.getAttribute("aria-label") || ""), "sammendraget bærer enhet og retning");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

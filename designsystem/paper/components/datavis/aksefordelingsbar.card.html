<!-- @dsCard group="Datavis" viewport="980x1410" name="AkseFordelingsBar" subtitle="Stablet fordelingsbånd i 860 og 320 px × begge moduser: standard, tynn, uten legend, alle datatilstander. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w320{width:320px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { AkseFordelingsBar } = window.AKGolfHQClaudePaper_605a48;
const SLAG = [
  { label: "Putt", pct: 41, display: "41 %" },
  { label: "Nærspill", pct: 22, display: "22 %" },
  { label: "Innspill", pct: 19, display: "19 %" },
  { label: "Utslag", pct: 18, display: "18 %" },
];
const TID = [
  { label: "AK Golf Academy", pct: 45, display: "18,0 t" },
  { label: "WANG", pct: 30, display: "12,0 t" },
  { label: "Mulligan", pct: 15, display: "6,0 t" },
  { label: "GFGK", pct: 10, display: "4,0 t" },
];
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjans slagfordeling siste 5 runder</div>
    <div className="cw w860"><AkseFordelingsBar segments={SLAG} dataOdId="afb-slag" /></div>
    <div className="lab">timer per virksomhet denne måneden · tynn uten legend</div>
    <div className="cw w860">
      <AkseFordelingsBar segments={TID} dataOdId="afb-tid" />
      <div style={{height:12}} />
      <AkseFordelingsBar segments={TID} thin hideLegend dataOdId="afb-tynn" />
    </div>
    <div className="lab">320 px — under 340-terskelen (12 px bånd), legenden bryter om</div>
    <div className="cw w320"><AkseFordelingsBar segments={SLAG} dataOdId="afb-smal" /></div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <AkseFordelingsBar segments={[]} state="empty" dataOdId="afb-tom" />
      <div style={{height:12}} />
      <AkseFordelingsBar segments={[]} state="loading" dataOdId="afb-laster" />
      <div style={{height:12}} />
      <AkseFordelingsBar segments={[]} state="error" dataOdId="afb-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: send seks segmenter
   (maks-testen rød) eller tving --legend:flex på uten-legend-varianten. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const slag = LYS.querySelector('[data-od-id="kpi-afb-slag"]');
  push(!!slag && slag.querySelectorAll(".akhq-afb-seg").length === 4, "fire segmenter");
  const seg = slag ? [...slag.querySelectorAll(".akhq-afb-seg")] : [];
  push(seg.length === 4 && new Set(seg.map((s) => getComputedStyle(s).backgroundColor)).size === 4, "alle segmenter har distinkt tone fra den lukkede rekka");
  push(seg.length === 4 && seg[0].getBoundingClientRect().width > seg[3].getBoundingClientRect().width, "41 % er bredere enn 18 % — vekten bærer andelen");
  push(!!slag && /Nærspill 22 %/.test(slag.getAttribute("aria-label") || ""), "sammendraget bruker ordboka (Nærspill)");
  const tynn = LYS.querySelector('[data-od-id="kpi-afb-tynn"] .akhq-afb-legend');
  push(!!tynn && getComputedStyle(tynn).display === "none", "uten-legend-modifikatoren skjuler legenden");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

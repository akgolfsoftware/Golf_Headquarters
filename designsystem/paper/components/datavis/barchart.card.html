<!-- @dsCard group="Datavis" viewport="980x2420" name="BarChart" subtitle="Kategorisøyler i 860 og 340 px × begge moduser: med og uten benchmark, lav variant, alle datatilstander. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w340{width:340px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { BarChart } = window.AKGolfHQClaudePaper_605a48;
const UKER = [
  { label: "u27", value: 5.5, display: "5,5 t" }, { label: "u28", value: 7, display: "7,0 t" },
  { label: "u29", value: 4, display: "4,0 t" }, { label: "u30", value: 6.5, display: "6,5 t" },
  { label: "u31", value: 8, display: "8,0 t" }, { label: "u32", value: 6, display: "6,0 t" },
];
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjans uketimer med mållinje 6 t (over = oliven, under = leire-tint)</div>
    <div className="cw w860"><BarChart items={UKER} benchmark={6} benchmarkLabel="mål 6 t" dataOdId="bch-benk" /></div>
    <div className="lab">uten benchmark — alle søyler analyse-blå</div>
    <div className="cw w860"><BarChart items={UKER} dataOdId="bch-flat" /></div>
    <div className="lab">340 px — under 380-terskelen: verditall skjult · lav variant</div>
    <div className="cw w340">
      <BarChart items={UKER} benchmark={6} dataOdId="bch-smal" />
      <div style={{height:12}} />
      <BarChart items={UKER.slice(0, 4)} low dataOdId="bch-lav" />
    </div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <BarChart items={[]} state="empty" dataOdId="bch-tom" />
      <div style={{height:12}} />
      <BarChart items={[]} state="loading" dataOdId="bch-laster" />
      <div style={{height:12}} />
      <BarChart items={[]} state="error" dataOdId="bch-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: sett benchmark til 0
   (under-testen rød) eller tving --vrd:block i smal (skjult-testen rød). */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const benk = LYS.querySelector('[data-od-id="kpi-bch-benk"]');
  push(!!benk && benk.querySelectorAll(".akhq-bch-stolpe--over").length === 4 && benk.querySelectorAll(".akhq-bch-stolpe--under").length === 2, "benchmark 6: fire over, to under");
  push(!!benk && !!benk.querySelector(".akhq-bch-benk"), "benchmark-linjen tegnes");
  const flat = LYS.querySelector('[data-od-id="kpi-bch-flat"]');
  push(!!flat && flat.querySelectorAll(".akhq-bch-stolpe--over,.akhq-bch-stolpe--under").length === 0, "uten benchmark: ingen toner");
  push(!!benk && /5,5 t/.test(benk.getAttribute("aria-label") || ""), "tekstsammendraget bærer verdiene med enhet");
  const smalV = LYS.querySelector('[data-od-id="kpi-bch-smal"] .akhq-bch-vrd');
  push(!!smalV && getComputedStyle(smalV).display === "none", "340 px → verditall skjult (terskel 380)");
  push(!!benk && benk.querySelectorAll("button,a[href]").length === 0, "ren visning — ingen treffmål i plottet");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

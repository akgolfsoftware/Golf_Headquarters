<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { LiveBar, Button } = window.AKGolfHQClaudePaper_605a48;
function Specimen() {
  return (<>
    <div className="lab">860 px — live med handlinger, pause, flat fullskjermvariant</div>
    <div className="cw w860"><div className="w">
      <LiveBar timeLabel="12:41" currentLabel="Blokk 2 av 4 · Wedge 40–90 m" nextLabel="Putting under press · 13:00" actions={<Button size="sm" variant="ghost" dataOdId="lb-pause">Pause</Button>} dataOdId="lb-live" />

ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);

/* ASSERTIONER — verifikatør skal se dem feile først: styl .akhq-lstat fra
   LiveBar-fila (eierskapstesten rød) eller fjern inverse-proppen. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const l = LYS.querySelector('[data-od-id="panel-lb-live"]');
  push(!!l && l.getAttribute("role") === "status", "linjen er role=status");
  const st = l && l.querySelector(".akhq-lstat");
  push(!!st && st.classList.contains("akhq-lstat--invers"), "LiveStatus komponeres med inverse — ikke restylet");
  push(!!l && l.querySelectorAll(".akhq-btn").length === 1, "handlingen er bibliotekets Button");
  const smalNeste = LYS.querySelector('[data-od-id="panel-lb-smal"] .akhq-lbar-neste');
  push(!!smalNeste && getComputedStyle(smalNeste).display === "none", "380 px → neste-linjen skjult (terskel 420)");
  const flat = LYS.querySelector('[data-od-id="panel-lb-flat"]');
  push(!!flat && getComputedStyle(flat).borderRadius === "0px", "flat-varianten er uten radius");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));

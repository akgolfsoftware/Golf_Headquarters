<!-- @dsCard group="Domene" viewport="980x620" name="BenchmarkBadge" subtitle="Tre toner i 860 og 280 px × begge moduser. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w280{width:280px}.rad{display:flex;gap:8px;flex-wrap:wrap}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { BenchmarkBadge } = window.AKGolfHQClaudePaper_605a48;
function Specimen() {
  return (<>
    <div className="lab">860 px — over (oliven), under (leire), nøytral måling (blå)</div>
    <div className="cw w860"><div className="rad">
      <BenchmarkBadge value="+0,4" basis="vs kat B · siste 5" tone="up" dataOdId="bmb-up" />
      <BenchmarkBadge value="−4 m" basis="vs krav" tone="dn" dataOdId="bmb-dn" />
      <BenchmarkBadge value="72,4" basis="snitt · siste 5" tone="info" dataOdId="bmb-info" />
    </div></div>
    <div className="lab">280 px — badgen bryter aldri; raden rundt bryter om</div>
    <div className="cw w280"><div className="rad">
      <BenchmarkBadge value="+0,4" basis="vs kat B · siste 5" tone="up" dataOdId="bmb-smal" />
      <BenchmarkBadge value="−1,84" basis="SG nærspill" tone="dn" dataOdId="bmb-smal2" />
    </div></div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: fjern basis fra en
   badge, eller bruk bindestrek i verdien. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const up = LYS.querySelector('[data-od-id="kpi-bmb-up"]');
  const dn = LYS.querySelector('[data-od-id="kpi-bmb-dn"]');
  push(!!up && /vs kat B/.test(up.textContent), "basis står i badgen");
  push(!!up && !!dn && getComputedStyle(up).color !== getComputedStyle(dn).color, "up og dn har ulik tone");
  push(!!dn && /168, ?85, ?54/.test(getComputedStyle(dn).color), "dn er leire, aldri rød");
  push(!!dn && /^−/.test(dn.textContent), "ekte minustegn");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

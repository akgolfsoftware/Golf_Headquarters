<!-- @dsCard group="Domene" viewport="980x1430" name="OektKort" subtitle="Øktkortet i 860 og 320 px × begge moduser: planlagt, gjennomført, med formelchip i footer. Høyde målt 03.08 (+10 %)" -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w320{width:320px}.w{display:flex;flex-direction:column;gap:10px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { OektKort, AKFormelChip } = window.AKGolfHQClaudePaper_605a48;
const PLAN = {
  title: "Teknikk tee — P5 til P7", timeLabel: "tir 9. aug · 09:00–10:30",
  focus: "Du holder P6-vinduet når tempoet er rolig — økta handler om å beholde det med ball.",
  drills: ["Speilsjekk P5–P7 uten ball · 10 min", "Halv fart med ball · 20 min", "Full fart med konsekvens · 15 min"],
};
function Specimen() {
  return (<>
    <div className="lab">860 px — planlagt økt med formelchip i footer, og gjennomført økt</div>
    <div className="cw w860"><div className="w">
      <OektKort {...PLAN} status="planlagt" statusLabel="Planlagt" footer={<AKFormelChip parts={["TEK", "TEE", "60 min"]} dataOdId="oekt-formel" />} onClick={()=>{}} dataOdId="oekt-plan" />
      <OektKort title="Styrke underkropp" timeLabel="man 8. aug · 07:00" drills={["Knebøy 4×6", "Utfall 3×8", "RFD-hopp 4×5"]} status="gjennomfort" statusLabel="Gjennomført · 45 min" onClick={()=>{}} dataOdId="oekt-ok" />
    </div></div>
    <div className="lab">320 px — under 340-terskelen: øvelseslisten skjult</div>
    <div className="cw w320"><OektKort {...PLAN} status="planlagt" statusLabel="Planlagt" onClick={()=>{}} dataOdId="oekt-smal" /></div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: tving --ovelser:flex i
   smal (skjult-testen rød) eller tegn et eget merke i kortet. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const p = LYS.querySelector('[data-od-id="cta-oekt-plan"]');
  push(!!p && p.querySelectorAll(".akhq-oekt-o-rad").length === 3, "tre øvelser");
  push(!!p && p.querySelectorAll(".akhq-akf").length === 1, "formelchippen kommer fra biblioteket via footer");
  const fokus = p && p.querySelector(".akhq-oekt-fokus");
  push(!!fokus && /Lora/.test(getComputedStyle(fokus).fontFamily), "fokus-prosaen er Lora");
  const ok = LYS.querySelector('[data-od-id="cta-oekt-ok"]');
  push(!!ok && ok.classList.contains("akhq-oekt--gjennomfort"), "gjennomført økt har dempet flate");
  const smal = LYS.querySelector('[data-od-id="cta-oekt-smal"] .akhq-oekt-ovelser');
  push(!!smal && getComputedStyle(smal).display === "none", "320 px → øvelsene skjult (terskel 340)");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

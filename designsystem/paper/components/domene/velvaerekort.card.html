<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w300{width:300px}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { VelvaereKort } = window.AKGolfHQClaudePaper_605a48;
const FELT = [
  { label: "Søvn", value: 4 }, { label: "Energi", value: 3 },
  { label: "Motivasjon", value: 5 }, { label: "Kropp", value: 2 },
];
function Specimen() {
  return (<>
    <div className="lab">860 px — Øyvind Rohjans morgenregistrering med notat</div>
    <div className="cw w860"><VelvaereKort fields={FELT} basis="i dag 07:05" note="Litt støl i korsryggen etter gårsdagens FYS-økt — sier ifra hvis det henger i under oppvarming." dataOdId="vvk-full" /></div>
    <div className="lab">300 px — under 320-terskelen · tett uten notat</div>
    <div className="cw w300"><VelvaereKort fields={FELT} dense dataOdId="vvk-smal" /></div>
    <div className="lab">tom · laster · feil</div>
    <div className="cw w860">
      <VelvaereKort fields={[]} state="empty" dataOdId="vvk-tom" />
      <div style={{height:12}} />
      <VelvaereKort fields={[]} state="loading" dataOdId="vvk-laster" />
      <div style={{height:12}} />
      <VelvaereKort fields={[]} state="error" dataOdId="vvk-feil" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: gi kropp=2 leire-prikker
   (dom-testen rød) eller fjern personvernlinjen. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="kpi-vvk-full"]');
  push(!!f && f.querySelectorAll(".akhq-vvk-rad").length === 4, "fire felter");
  const rader = f ? [...f.querySelectorAll(".akhq-vvk-rad")] : [];
  const kropp = rader[3];
  push(!!kropp && kropp.querySelectorAll(".akhq-vvk-p--fylt").length === 2, "kropp 2/5 → to fylte prikker");
  const fylt = kropp && kropp.querySelector(".akhq-vvk-p--fylt");
  push(!!fylt && !/168, ?85, ?54/.test(getComputedStyle(fylt).backgroundColor), "lav verdi tones ALDRI leire — informasjon, ikke dom");
  push(!!f && /Kun du og coach ser dette/.test(f.textContent), "personvernlinjen står i kortet");
  const note = f && f.querySelector(".akhq-vvk-note");
  push(!!note && /Lora/.test(getComputedStyle(note).fontFamily), "notatet er Lora — spillerens stemme");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

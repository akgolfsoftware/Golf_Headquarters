<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { DiffKort } = window.AKGolfHQClaudePaper_605a48;
const RADER = [
  { field: "Tirsdag 09:00", from: "TEK · 60 min", to: "SLAG · 60 min" },
  { field: "Ukevolum", from: "6,5 t", to: "6,0 t" },
  { field: "Lørdag 10:00", to: "SPILL · 9 hull på GFGK" },
];
function Specimen() {

    <div className="cw w860"><DiffKort title="Plan-vaktens forslag" rows={RADER} dataOdId="dfk-full" /></div>

      <DiffKort rows={[]} state="loading" dataOdId="dfk-laster" />

ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);

/* ASSERTIONER — verifikatør skal se dem feile først: merk NY med --up
   (blå-testen rød) eller legg godkjenn-knapp i kortet. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const f = LYS.querySelector('[data-od-id="panel-dfk-full"]');
  push(!!f && f.querySelectorAll(".akhq-dfk-rad").length === 3, "tre rader");
  const fra = f && f.querySelector(".akhq-dfk-fra");
  push(!!fra && getComputedStyle(fra).textDecorationLine === "line-through", "fra-verdien er gjennomstreket");
  const ny = f && f.querySelector(".akhq-dfk-ny");
  push(!!ny && /70, ?113, ?159/.test(getComputedStyle(ny).color), "NY er analyse-blå, aldri grønn");
  push(!!f && f.querySelectorAll("button").length === 0, "ren visning — godkjenning bor hos konsumenten");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));

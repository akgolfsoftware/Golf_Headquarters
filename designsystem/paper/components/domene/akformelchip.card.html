<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w280{width:280px}.rad{display:flex;gap:8px;flex-wrap:wrap}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>
</head>
<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { AKFormelChip } = window.AKGolfHQClaudePaper_605a48;
function Specimen() {
  return (<>
    <div className="lab">860 px — parts-visning, strengvisning, fylt variant</div>
    <div className="cw w860"><div className="rad">
      <AKFormelChip parts={["TEK", "TEE", "60 min"]} dataOdId="akf-parts" />
      <AKFormelChip formula="SLAG_WEDGE_45" dataOdId="akf-streng" />
      <AKFormelChip parts={["FYS", "STYRKE", "45 min"]} filled dataOdId="akf-fylt" />
    </div></div>
    <div className="lab">280 px — chippen krymper rundt teksten; lang formel klippes med title (ingen container-terskel, se .jsx)</div>
    <div className="cw w280"><AKFormelChip parts={["TEK", "TEE", "P5–P7", "60 min", "Mulligan 3", "med konsekvens"]} dataOdId="akf-lang" /></div>
  </>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Specimen />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Specimen />);
/* ASSERTIONER — verifikatør skal se dem feile først: gi chippen en
   pyramidefarge (fargeløs-testen rød) eller fjern title. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  const p = LYS.querySelector('[data-od-id="kpi-akf-parts"]');
  push(!!p && p.querySelectorAll(".akhq-akf-sep").length === 2, "tre parts → to skilletegn");
  push(!!p && getComputedStyle(p).backgroundColor === "rgba(0, 0, 0, 0)", "chippen er fargeløs — vokabular fargekodes aldri");
  push(!!p && getComputedStyle(p).cursor !== "pointer" && p.tagName !== "BUTTON", "ren visning — aldri treffmål");
  const lang = LYS.querySelector('[data-od-id="kpi-akf-lang"]');
  push(!!lang && /TEK · TEE/.test(lang.getAttribute("title") || ""), "hele formelen ligger i title");
  const fylt = LYS.querySelector('[data-od-id="kpi-akf-fylt"]');
  push(!!fylt && getComputedStyle(fylt).backgroundColor !== "rgba(0, 0, 0, 0)", "fylt variant har soft-flate");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));
</script></body></html>

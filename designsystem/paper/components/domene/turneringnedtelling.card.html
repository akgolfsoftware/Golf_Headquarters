<style>.stack{display:grid;grid-template-columns:1fr;min-height:100vh}.stack>div{padding:var(--s5);background:var(--bg);color:var(--fg)}.lab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}.cw{box-sizing:content-box;border:1px dashed var(--border);border-radius:var(--r);padding:var(--s4)}.w860{width:860px;max-width:100%}.w300{width:300px}.tre{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4)}.assert{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.ok{color:var(--up)}.bad{color:var(--dn)}</style>

<body><div class="stack"><div id="light"></div><div data-theme="dark" id="dark"></div></div>
<script type="text/babel">
const { TurneringNedtelling } = window.AKGolfHQClaudePaper_605a48;
function Specimen() {

    <div className="cw w860"><div className="tre">

/* ASSERTIONER — verifikatør skal se dem feile først: skriv «1 dager»
   (entallstesten rød) eller ton i dag med --dn. */
window.requestAnimationFrame(() => setTimeout(() => {
  const res = []; const push = (ok, t) => res.push((ok ? "✓ " : "✗ ") + t);
  const LYS = document.getElementById("light");
  push(/dager igjen/.test((LYS.querySelector('[data-od-id="kpi-tn-12"]') || {}).textContent || ""), "flertall: dager igjen");
  push(/dag igjen/.test((LYS.querySelector('[data-od-id="kpi-tn-1"]') || {}).textContent || "") && !/dager igjen/.test((LYS.querySelector('[data-od-id="kpi-tn-1"]') || {}).textContent || ""), "entall: dag igjen");
  const idag = LYS.querySelector('[data-od-id="kpi-tn-0"] .akhq-tned-tall');
  push(!!idag && /I dag/.test(idag.textContent), "0 dager → I dag");
  push(!!idag && /99, ?120, ?74/.test(getComputedStyle(idag).color), "i dag tones --up — toppunktet");
  push(/påmeldingsfrist/.test((LYS.querySelector('[data-od-id="kpi-tn-12"]') || {}).textContent || ""), "fristen vises som informasjon");
  push(!!LYS.querySelector(".akhq-empty") && !!LYS.querySelector(".akhq-skel") && !!LYS.querySelector(".akhq-error"), "tom/laster/feil rendrer Region-tilstandene");
  const ut = document.createElement("div"); ut.className = "assert";
  ut.innerHTML = res.map((r) => '<div class="' + (r[0] === "✓" ? "ok" : "bad") + '">' + r + "</div>").join("");
  LYS.appendChild(ut);
  window.__assert = res;
}, 90));

<!-- @dsCard group="Rom og form" viewport="700x220" name="Spacing" subtitle="--s1–--s8 · 4px-basis" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card-support.css">
<style>.sp{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:var(--s3)}.b{height:12px;background:var(--fg);border-radius:2px;opacity:.85}</style></head>
<body><div class="half" style="min-height:100vh;gap:6px">
<div class="sp"><span class="hex">--s1</span><div><div class="b" style="width:4px"></div></div><span class="hex">4px</span></div>
<div class="sp"><span class="hex">--s2</span><div><div class="b" style="width:8px"></div></div><span class="hex">8px</span></div>
<div class="sp"><span class="hex">--s3</span><div><div class="b" style="width:12px"></div></div><span class="hex">12px</span></div>
<div class="sp"><span class="hex">--s4</span><div><div class="b" style="width:16px"></div></div><span class="hex">16px</span></div>
<div class="sp"><span class="hex">--s5</span><div><div class="b" style="width:24px"></div></div><span class="hex">24px</span></div>
<div class="sp"><span class="hex">--s6</span><div><div class="b" style="width:32px"></div></div><span class="hex">32px</span></div>
<div class="sp"><span class="hex">--s7</span><div><div class="b" style="width:48px"></div></div><span class="hex">48px</span></div>
<div class="sp"><span class="hex">--s8</span><div><div class="b" style="width:64px"></div></div><span class="hex">64px</span></div>
</div></body></html>

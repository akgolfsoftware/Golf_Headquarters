<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card-support.css"></head>
<body><div class="rail" style="background:var(--rail);min-height:100vh;display:flex;align-items:center;gap:var(--s6);padding:0 var(--s5)">
<img src="../assets/ak-golf-logo-on-ink.svg" alt="AK Golf" style="height:28px">
<div class="sw" style="flex:0 0 auto"><div class="chip" style="background:var(--rail);border-color:rgba(250,249,245,.15);width:80px"></div><span class="name" style="color:var(--rail-on)">--rail</span><span class="hex" style="color:var(--rail-fg)">#141413</span></div>
<span style="color:var(--rail-fg);font-size:12px">Inaktiv --rail-fg</span>
<span style="color:var(--rail-on);font-size:12px;font-weight:500">Aktiv --rail-on</span>
</div></body></html>

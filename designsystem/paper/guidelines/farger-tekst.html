<!-- @dsCard group="Farger" viewport="700x200" name="Tekst" subtitle="fg · muted · mid — med målt kontrast mot --bg" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card-support.css">
<style>.line{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}.warn{color:var(--dn);font-size:10px}</style></head>
<body><div class="two">
<div class="half"><span class="tag">Lys</span>
<div class="line"><span style="color:var(--fg);font-weight:500">Primærtekst --fg</span><span class="ratio">17,5:1 AA</span></div>
<div class="line"><span style="color:var(--muted)">Sekundærtekst --muted</span><span class="ratio">6,4:1 AA</span></div>
<div class="line"><span style="color:var(--mid)">--mid #B0AEA5</span><span class="warn">2,3:1 — aldri tekst i lys modus</span></div>
</div>
<div class="half" data-theme="dark"><span class="tag">Mørk</span>
<div class="line"><span style="color:var(--fg);font-weight:500">Primærtekst --fg</span><span class="ratio">17,5:1 AA</span></div>
<div class="line"><span style="color:var(--muted)">Sekundærtekst --muted</span><span class="ratio">8,3:1 AA</span></div>
<div class="line"><span style="color:var(--mid)">--mid #6B675E</span><span class="ratio">kun grafikk</span></div>
</div>
</div></body></html>

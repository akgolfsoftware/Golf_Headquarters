<!-- @dsCard group="Farger" viewport="700x210" name="Handling" subtitle="CTA er blekk/papir — oransje har monopol på «Én ting nå» og focus" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card-support.css">
<style>.pill{display:inline-flex;align-items:center;height:32px;padding:0 var(--s4);border-radius:var(--r-pill);font-size:12px;font-weight:500;font-family:var(--ui)}</style></head>
<body><div class="two">
<div class="half"><span class="tag">Lys</span>
<div class="row" style="align-items:center">
<span class="pill" style="background:var(--cta);color:var(--on-cta)">Primær --cta</span>
<span class="pill" style="background:var(--accent);color:#141413">Én ting nå --accent</span>
<span class="pill" style="background:var(--accent-soft);color:var(--accent-fg)">--accent-soft</span>
</div>
<div class="row"><span style="color:var(--accent-fg);font-size:11px">--accent-fg #B85C3D · AA-tekst 4,3:1</span><span class="ratio">rå #D97757: 2,96:1 — aldri tekst på papir</span></div>
</div>
<div class="half" data-theme="dark"><span class="tag">Mørk</span>
<div class="row" style="align-items:center">
<span class="pill" style="background:var(--cta);color:var(--on-cta)">Primær --cta</span>
<span class="pill" style="background:var(--accent);color:#141413">Én ting nå --accent</span>
<span class="pill" style="background:var(--accent-soft);color:var(--accent-fg)">--accent-soft</span>
</div>
<div class="row"><span style="color:var(--accent-fg);font-size:11px">--accent-fg #E5A184 · 8,6:1</span></div>
</div>
</div></body></html>

<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><title>Terskelrigg</title><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:400 12px/1.5 var(--mono)}
h1{font:600 13px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
table{border-collapse:collapse;margin-bottom:24px}
td,th{padding:5px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.ok{color:var(--up)}.fail{color:var(--dn);font-weight:600}
.sum{padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-sm);display:inline-block;margin-bottom:20px}
#rig{position:absolute;left:-99999px;top:0}
</style></head>
<body>
<h1 id="hd">Terskelrigg</h1>
<div class="sum" id="sum">kjører…</div>
<table id="out"></table>
<div id="rig"></div>
<script type="text/babel">
/* ─────────────────────────────────────────────────────────────
   TERSKELRIGG — verifiserer at container-terskler fyrer der vi tror.
   Endre kun SPEC. Riggen rendrer hver sak i sin egen content-box
   kolonne, måler containeren, leser den påvirkede egenskapen og
   ASSERTERER mot forventet verdi. window.__M holder resultatet,
   window.__OK er false hvis noe feilet.

   ?selvtest i URL: forfalsker første sak (gruppe += 100) for å bevise
   at container-assertionen faktisk KAN feile. ?selvtest=dekning fjerner
   i stedet ALLE ufyrte Panel-saker (Panel har to — å fjerne bare én
   lar over>0 && under>0 være sann, og selvtesten blir en no-op) og skal
   gi «1 komponent(er) mangler sak på én side av terskelen».
   Forventet utfall i begge: __OK === false.
   En assertion som ikke er sett feile, er ikke verifisert — den første
   versjonen av denne riggen viste grønt fordi container-leddet var død
   kode (NaN > 1 er alltid false).

   VENTELISTE (31.07.2026): en SPEC-sak for en komponent som ennå ikke
   finnes i den kompilerte bundelen ville kastet på destrukturering og
   tatt hele riggen ned. Riggen filtrerer derfor bort slike saker og
   fører dem opp som VENTER — men __OK settes likevel false, fordi
   spec'en da ikke er verifisert i sin helhet. En rigg som meldte grønt
   mens fem terskler sto ukjørt ville vært nøyaktig den stille feilen
   readme advarer mot. Når bundelen er kompilert, forsvinner ventelista
   av seg selv og de fem tersklene begynner å assertere uten flere
   endringer her.
   ───────────────────────────────────────────────────────────── */
const NS = window.AKGolfHQClaudePaper_605a48;
const { Panel, ListGroup, ListRow, PageHeader, Button, Banner, EmptyState, KeyValueGrid } = NS;
/* De fem fra bølge P3 hentes via NS, ikke destrukturert: de kan mangle. */
const { DataTable, FilterPills, Pagination, Stepper, KanbanKolonne } = NS;

const SPEC = {
  ListRow: {
    terskel: "420px på .akhq-lgroup",
    /* Elementet spørringen måles mot */
    container: ".akhq-lgroup",
    /* Elementet som endrer seg, og egenskapen vi leser */
    subjekt: ".akhq-lrow",
    egenskap: "paddingLeft",
    /* Verdi når terskelen HAR fyrt, og når den ikke har */
    fyrt: "0px",
    ufyrt: "6px",
    saker: [
      { navn: "md",            bredde: 430, gruppe: 396, fyrer: true,  render: () => <Panel title="T" dataOdId="p"><Rad /></Panel> },
      { navn: "sm",            bredde: 430, gruppe: 396, fyrer: true,  render: () => <Panel title="T" density="sm" dataOdId="p"><Rad /></Panel> },
      { navn: "flush",         bredde: 430, gruppe: 392, fyrer: true,  render: () => <Panel title="T" flush dataOdId="p"><Rad /></Panel> },
      { navn: "flush+bleed",   bredde: 430, gruppe: 428, fyrer: false, render: () => <Panel title="T" flush bleed dataOdId="p"><Rad /></Panel> },
      { navn: "naken gruppe",  bredde: 430, gruppe: 430, fyrer: false, render: () => <Rad /> },
      { navn: "md i 500",      bredde: 500, gruppe: 462, fyrer: false, render: () => <Panel title="T" dataOdId="p"><Rad /></Panel> },
      { navn: "md i 860",      bredde: 860, gruppe: 822, fyrer: false, render: () => <Panel title="T" dataOdId="p"><Rad /></Panel> }
    ]
  },
  PageHeader: {
    terskel: "640px på .akhq-phead-wrap",
    container: ".akhq-phead-wrap",
    subjekt: ".akhq-phead-side",
    egenskap: "alignItems",
    fyrt: "flex-start",
    ufyrt: "flex-end",
    saker: [
      { navn: "PlayerHQ 430",  bredde: 430, gruppe: 430, fyrer: true,  render: () => <Hode /> },
      { navn: "iPad 740",      bredde: 740, gruppe: 740, fyrer: false, render: () => <Hode /> },
      { navn: "hovedspalte",   bredde: 860, gruppe: 860, fyrer: false, render: () => <Hode /> },
      { navn: "i Panel md 500",bredde: 500, gruppe: 462, fyrer: true,  render: () => <Panel title="T" dataOdId="p"><Hode /></Panel> }
    ]
  },
  Panel: {
    terskel: "480px på .akhq-panel-wrap",
    container: ".akhq-panel-wrap",
    subjekt: ".akhq-panel",
    egenskap: "paddingLeft",
    fyrt: "16px",
    ufyrt: "18px",
    saker: [
      { navn: "PlayerHQ 430",  bredde: 430, gruppe: 430, fyrer: true,  render: () => <Panel title="T" dataOdId="p">x</Panel> },
      { navn: "to-kolonne 500",bredde: 500, gruppe: 500, fyrer: false, render: () => <Panel title="T" dataOdId="p">x</Panel> },
      { navn: "hovedspalte",   bredde: 860, gruppe: 860, fyrer: false, render: () => <Panel title="T" dataOdId="p">x</Panel> }
    ]
  },
  KeyValueGrid: {
    terskel: "420px på .akhq-kvg-wrap",
    container: ".akhq-kvg-wrap",
    subjekt: ".akhq-kvg",
    egenskap: "gridTemplateColumns",
    fyrt: 1,
    ufyrt: 2,
    tell: true,
    saker: [
      { navn: "hovedspalte",    bredde: 860, gruppe: 822, fyrer: false, render: () => <Panel title="T" dataOdId="p"><KV /></Panel> },
      { navn: "to-kolonne 500", bredde: 500, gruppe: 462, fyrer: false, render: () => <Panel title="T" dataOdId="p"><KV /></Panel> },
      { navn: "PlayerHQ 430",   bredde: 430, gruppe: 397, fyrer: true,  render: () => <Panel title="T" dataOdId="p"><KV /></Panel> }
    ]
  },
  EmptyState: {
    terskel: "420px på .akhq-estate-wrap",
    container: ".akhq-estate-wrap",
    subjekt: ".akhq-estate",
    egenskap: "paddingTop",
    fyrt: "26px",
    ufyrt: "34px",
    saker: [
      { navn: "hovedspalte",    bredde: 860, gruppe: 822, fyrer: false, render: () => <Panel title="T" dataOdId="p"><Tom /></Panel> },
      { navn: "to-kolonne 500", bredde: 500, gruppe: 462, fyrer: false, render: () => <Panel title="T" dataOdId="p"><Tom /></Panel> },
      { navn: "PlayerHQ 430",   bredde: 430, gruppe: 397, fyrer: true,  render: () => <Panel title="T" dataOdId="p"><Tom /></Panel> }
    ]
  },
  Banner: {
    terskel: "460px på .akhq-banner-wrap — handlingene under teksten",
    container: ".akhq-banner-wrap",
    subjekt: ".akhq-banner",
    egenskap: "gridTemplateColumns",
    /* Under terskelen faller auto-kolonnen bort: to spor i stedet for tre */
    fyrt: 2,
    ufyrt: 3,
    tell: true,
    saker: [
      { navn: "PlayerHQ 430",   bredde: 430, gruppe: 430, fyrer: true,  render: () => <Band /> },
      { navn: "i Panel md 500", bredde: 500, gruppe: 462, fyrer: false, render: () => <Panel title="T" dataOdId="p"><Band /></Panel> },
      { navn: "hovedspalte",    bredde: 860, gruppe: 860, fyrer: false, render: () => <Band /> }
    ]
  },

  /* ── Bølge P3 (31.07.2026) ────────────────────────────────────
     Tersklene under er lest ut av kilden, ikke gjettet:
     DataTable  @container (max-width:560px) → --fs 13px → 12.5px
     FilterPills @container (max-width:420px) → --gap var(--s2)=8px → 6px
     Pagination  @container (max-width:380px) → .akhq-pag-tall display:none
     Stepper     @container (max-width:520px) → --flow row → column
     Kanban      @container (max-width:320px) → --pad var(--s3)=12px → 10px
     Alle fem står på venteliste til bundelen er kompilert. */
  DataTable: {
    terskel: "560px på .akhq-dt-wrap — cellene strammes inn",
    container: ".akhq-dt-wrap",
    subjekt: ".akhq-dt",
    egenskap: "fontSize",
    fyrt: "12.5px",
    ufyrt: "13px",
    saker: [
      { navn: "PlayerHQ 430",  bredde: 430, gruppe: 430, fyrer: true,  render: () => <Tab /> },
      { navn: "i Panel md 500",bredde: 500, gruppe: 462, fyrer: true,  render: () => <Panel title="T" dataOdId="p"><Tab /></Panel> },
      { navn: "hovedspalte",   bredde: 860, gruppe: 860, fyrer: false, render: () => <Tab /> }
    ]
  },
  FilterPills: {
    terskel: "420px på .akhq-fpill-wrap — mellomrommet 8 → 6 px",
    container: ".akhq-fpill-wrap",
    subjekt: ".akhq-fpill",
    egenskap: "columnGap",
    fyrt: "6px",
    ufyrt: "8px",
    saker: [
      { navn: "smal 400",      bredde: 400, gruppe: 400, fyrer: true,  render: () => <Piller /> },
      { navn: "i Panel md 430",bredde: 430, gruppe: 396, fyrer: true,  render: () => <Panel title="T" dataOdId="p"><Piller /></Panel> },
      { navn: "hovedspalte",   bredde: 860, gruppe: 860, fyrer: false, render: () => <Piller /> }
    ]
  },
  Pagination: {
    terskel: "380px på .akhq-pag-wrap — sidetallene faller bort",
    container: ".akhq-pag-wrap",
    subjekt: ".akhq-pag-tall",
    egenskap: "display",
    fyrt: "none",
    /* MÅLT, ikke lest: kilden sier `inline-flex` på .akhq-pag-b, men knappen er
       flex-element i .akhq-pag, og et flex-element blokkifiseres — computed
       display blir `flex`. Første utkast asserterte "inline-flex" og var rød
       mot ekte kilde. Les aldri denne verdien ut av CSS-en alene. */
    ufyrt: "flex",
    saker: [
      { navn: "smal 360",      bredde: 360, gruppe: 360, fyrer: true,  render: () => <Sider /> },
      { navn: "PlayerHQ 430",  bredde: 430, gruppe: 430, fyrer: false, render: () => <Sider /> },
      { navn: "hovedspalte",   bredde: 860, gruppe: 860, fyrer: false, render: () => <Sider /> }
    ]
  },
  Stepper: {
    terskel: "520px på .akhq-step-wrap — stigen legges loddrett",
    container: ".akhq-step-wrap",
    subjekt: ".akhq-step",
    egenskap: "flexDirection",
    fyrt: "column",
    ufyrt: "row",
    saker: [
      { navn: "PlayerHQ 430",  bredde: 430, gruppe: 430, fyrer: true,  render: () => <Steg /> },
      { navn: "i Panel md 500",bredde: 500, gruppe: 462, fyrer: true,  render: () => <Panel title="T" dataOdId="p"><Steg /></Panel> },
      { navn: "hovedspalte",   bredde: 860, gruppe: 860, fyrer: false, render: () => <Steg /> }
    ]
  },
  KanbanKolonne: {
    terskel: "320px på .akhq-kan-wrap — polstringen 12 → 10 px",
    container: ".akhq-kan-wrap",
    subjekt: ".akhq-kan-topp",
    egenskap: "paddingLeft",
    fyrt: "10px",
    ufyrt: "12px",
    saker: [
      { navn: "smal kolonne 300", bredde: 300, gruppe: 300, fyrer: true,  render: () => <Kan /> },
      { navn: "brettkolonne 380", bredde: 380, gruppe: 380, fyrer: false, render: () => <Kan /> },
      { navn: "hovedspalte",      bredde: 860, gruppe: 860, fyrer: false, render: () => <Kan /> }
    ]
  }
};

const Rad = () => <ListGroup dataOdId="l"><ListRow title="Rad" meta="meta" trailing="value" value="1" /></ListGroup>;
const Hode = () => <PageHeader kicker="k" title="T" lead="l" meta="m" actions={<Button>A</Button>} dataOdId="ph" />;
const Band = () => <Banner tone="warn" label="V" title="T" actionLabel="Handling" closable dataOdId="bn">Tekst i båndet.</Banner>;
const Tom = () => <EmptyState title="Ingen runder logget ennå">Når du legger inn en runde, ser du utviklingen her.</EmptyState>;
const KV = () => <KeyValueGrid items={[{key:"Varighet",value:"6 uker"},{key:"Økter",value:"4"}]} dataOdId="kv" />;
/* Bølge P3 — samme minimumsmønster: nok innhold til at terskelen har noe å endre. */
const Tab = () => <DataTable caption="Stall" dataOdId="dt"
  columns={[{ key: "navn", label: "Spiller", strong: true }, { key: "sg", label: "SG totalt", align: "end" }]}
  rows={[{ id: 1, navn: "Øyvind Rohjan", sg: "+2,92" }, { id: 2, navn: "Jonas Hveem", sg: "−0,41" }]} />;
const Piller = () => <FilterPills label="Område" value={["tek"]} dataOdId="fp"
  options={[{ value: "fys", label: "FYS", count: 4 }, { value: "tek", label: "TEK", count: 11 }]} />;
const Sider = () => <Pagination page={4} pageCount={12} totalLabel="248 økter · side 4 av 12" dataOdId="pg" />;
const Steg = () => <Stepper current={1} dataOdId="st" steps={[
  { id: "a", label: "Velg spillere" }, { id: "b", label: "Sett periode" }, { id: "c", label: "Bekreft og publiser" }]} />;
const Kan = () => <KanbanKolonne title="Til godkjenning" limit={5} dataOdId="kn"><div style={{ height: 20 }} /></KanbanKolonne>;

/* Venteliste: SPEC-saker for komponenter som ennå ikke finnes i bundelen.
   Fjernes fra kjøringen så riggen ikke kaster, men føres opp og gjør __OK
   false — en uverifisert terskel skal aldri kunne leses som grønn. */
/* Sjekken er `== null`, ikke `typeof !== "function"`: en komponent pakket i
   React.memo er et objekt, og en typeof-sjekk ville satt en eksisterende
   komponent på venteliste og skjult terskelen dens i stillhet. */
const VENTER = Object.keys(SPEC).filter((k) => NS[k] == null);
VENTER.forEach((k) => { delete SPEC[k]; });
window.__VENTER = VENTER;

/* Selvtest: bevis at assertionene kan feile.
   ?selvtest        — forfalsker container-bredden i én sak
   ?selvtest=dekning — fjerner siste ufyrte sak, så dekningen mangler én side */
const SELVTEST = location.search.includes("selvtest");
const SELVTEST_DEKNING = /selvtest=dekning/.test(location.search);
if (SELVTEST_DEKNING) {
  /* Fjern ALLE ufyrte saker — Panel har to, så det holder ikke å fjerne én:
     over>0 && under>0 ville fortsatt vært sann. Forventet: over 0, ok false. */
  SPEC.Panel.saker = SPEC.Panel.saker.filter(s => s.fyrer);
} else if (SELVTEST) {
  SPEC.ListRow.saker[0].gruppe += 100;
}

function Rig() {
  return (<div>{Object.entries(SPEC).flatMap(([komp, s]) =>
    s.saker.map((sak, i) => (
      <div key={komp + i} data-komp={komp} data-sak={sak.navn} style={{ boxSizing: "content-box", width: sak.bredde }}>
        {sak.render()}
      </div>
    ))
  )}</div>);
}
ReactDOM.createRoot(document.getElementById("rig")).render(<Rig />);

setTimeout(() => {
  const res = [];
  for (const box of document.querySelectorAll("[data-sak]")) {
    const s = SPEC[box.dataset.komp];
    const sak = s.saker.find(x => x.navn === box.dataset.sak);
    const c = box.querySelector(s.container) || box.firstElementChild;
    const subj = box.querySelector(s.subjekt);
    const målt = +c.getBoundingClientRect().width.toFixed(1);
    const verdi = getComputedStyle(subj)[s.egenskap];
    /* tell: sammenlign antall grid-spor i stedet for rå verdi */
    const les = s.tell ? verdi.trim().split(/\s+/).length : verdi;
    const fyrte = les === s.fyrt;
    const feil = [];
    if (!Number.isFinite(sak.gruppe)) feil.push("RIGGFEIL: sak.gruppe mangler");
    else if (Math.abs(målt - sak.gruppe) > 1) feil.push("container " + målt + " ≠ forventet " + sak.gruppe);
    if (fyrte !== sak.fyrer) feil.push("fyrer=" + fyrte + " forventet " + sak.fyrer + " (" + s.egenskap + "=" + verdi + ")");
    if (!fyrte && les !== s.ufyrt) feil.push(s.egenskap + "=" + verdi + " ≠ ufyrt " + s.ufyrt);
    res.push({ komp: box.dataset.komp, sak: sak.navn, spalte: sak.bredde, container: målt, forventet: sak.gruppe, verdi, fyrte, forventetFyrer: sak.fyrer, feil });
  }
  window.__M = res;
  const feilet = res.filter(r => r.feil.length);
  /* DEKNINGSASSERTION — gjelder RIGGENS EGEN SPEC, ikke spesimenkortene.
     Krever minst én sak på hver side av terskelen per komponent, ellers
     er terskelen aldri sammenlignet mot basistilstanden her.
     Beregnes fra deklarert `fyrer` (spec), ikke fra målt `fyrte` — det er
     forsvarlig fordi fyrer-assertionen over kryssjekker hver enkelt sak
     mot virkeligheten, så en løgn i spec'en fanges der.
     Kortenes egen breddedekning er IKKE dekket her; den er forfatterens
     sjekklistepunkt i guidelines/komponentskjelett.md. */
  const dekning = Object.keys(SPEC).map((k) => {
    const mine = res.filter(r => r.komp === k);
    const over = mine.filter(r => !r.forventetFyrer).length;
    const under = mine.filter(r => r.forventetFyrer).length;
    return { komp: k, over, under, ok: over > 0 && under > 0 };
  });
  window.__DEKNING = dekning;
  const dekningsfeil = dekning.filter(d => !d.ok);
  window.__OK = feilet.length === 0 && dekningsfeil.length === 0 && VENTER.length === 0;
  document.getElementById("out").innerHTML =
    "<tr><th>komponent<th>sak<th>spalte<th>container<th>forventet<th>egenskap<th>fyrer<th>status</tr>" +
    res.map(r => `<tr><td>${r.komp}<td>${r.sak}<td>${r.spalte}<td>${r.container}<td>${r.forventet}<td>${r.verdi}<td>${r.fyrte ? "JA" : "nei"}<td class="${r.feil.length ? "fail" : "ok"}">${r.feil.length ? r.feil.join("; ") : "ok"}</tr>`).join("") +
    "<tr><th colspan=8 style='padding-top:18px'>Dekning · minst én sak på hver side av terskelen</th></tr>" +
    dekning.map(d => `<tr><td>${d.komp}<td colspan=5>${d.over} over · ${d.under} under<td><td class="${d.ok ? "ok" : "fail"}">${d.ok ? "ok" : "MANGLER SAK " + (d.over ? "UNDER" : "OVER") + " TERSKELEN"}</tr>`).join("") +
    (VENTER.length
      ? "<tr><th colspan=8 style='padding-top:18px'>Venter på kompilering · finnes ikke i _ds_bundle.js</th></tr>" +
        VENTER.map(k => `<tr><td>${k}<td colspan=6>terskel deklarert, ikke kjørt<td class="fail">VENTER</tr>`).join("")
      : "");
  const sum = document.getElementById("sum");
  sum.className = "sum " + (feilet.length || dekningsfeil.length || VENTER.length ? "fail" : "ok");
  sum.textContent = (feilet.length || dekningsfeil.length || VENTER.length)
    ? [feilet.length ? feilet.length + " av " + res.length + " assertions FEILET" : null,
       dekningsfeil.length ? dekningsfeil.length + " komponent(er) mangler sak på én side av terskelen" : null,
       VENTER.length ? VENTER.length + " komponent(er) VENTER på kompilering (" + VENTER.join(", ") + ")" : null]
      .filter(Boolean).join(" · ") + " — se tabellen" + (SELVTEST ? " (selvtest" + (SELVTEST_DEKNING ? "=dekning" : "") + ": 1 forfalsket sak forventet)" : "")
    : res.length + " av " + res.length + " assertions ok · alle terskler fyrer der de skal · dekning ok på " + dekning.length + " komponenter";
  document.getElementById("hd").textContent = "Terskelrigg" + (SELVTEST ? " · SELVTEST" : "");
}, 500);
</script></body></html>

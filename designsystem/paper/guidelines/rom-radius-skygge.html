<!-- @dsCard group="Rom og form" viewport="700x210" name="Radius og skygge" subtitle="--r 8 · --r-sm 6 · --r-pill 999 · én myk skygge, ingen i mørk" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card-support.css">
<style>.box{background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--mono);color:var(--muted)}</style></head>
<body><div class="two">
<div class="half"><span class="tag">Lys</span>
<div class="row" style="align-items:center">
<div class="box" style="width:84px;height:56px;border-radius:var(--r);box-shadow:var(--shadow)">--r 8</div>
<div class="box" style="width:84px;height:56px;border-radius:var(--r-sm)">--r-sm 6</div>
<div class="box" style="width:96px;height:32px;border-radius:var(--r-pill)">--r-pill</div>
</div>
<span class="hex">--shadow: 0 1px 0 3 % + 0 18px 40px 5 % — kun på kort som løftes</span>
</div>
<div class="half" data-theme="dark"><span class="tag">Mørk</span>
<div class="row" style="align-items:center">
<div class="box" style="width:84px;height:56px;border-radius:var(--r);box-shadow:var(--shadow)">--r 8</div>
<div class="box" style="width:84px;height:56px;border-radius:var(--r-sm)">--r-sm 6</div>
<div class="box" style="width:96px;height:32px;border-radius:var(--r-pill)">--r-pill</div>
</div>
<span class="hex">--shadow: none — flaten skiller med --surface og --border</span>
</div>
</div></body></html>

<!-- @dsCard group="Navigasjon" viewport="1440x620" name="Rail — gammel mot ny (A1-avgjørelse)" subtitle="Venstre: 64px mørk skinne slik fase2-fasiten (w4-base.css) tegner den. Midten: ny 232px papirflatet sidemeny (18.08) — venter på Anders' A1-godkjenning. Høyre: den nyes kollapsede 64px-modus (≤1080px vindu)." -->
<!DOCTYPE html><html lang="nb"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card-support.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--bg);font-family:var(--ui);color:var(--fg)}
.duo{display:grid;grid-template-columns:1fr 1fr minmax(200px,.55fr);gap:16px;padding:16px}
.halv{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--bg)}
.cap{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.shell{display:flex;height:520px;overflow:hidden}
.stub{flex:1;min-width:0;padding:18px;display:flex;flex-direction:column;gap:10px}
.stubline{height:12px;border-radius:6px;background:var(--soft)}
.stubcard{height:110px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border)}
/* tving den nye railens kollapsede tilstand i tredje rute, uavhengig av vindusbredde */
.tvang-kollaps .akhq-rail{--w:64px;padding:16px 8px 14px;align-items:center}
.tvang-kollaps .akhq-rail-brand{justify-content:center;padding:0}
.tvang-kollaps .akhq-rail-item{justify-content:center;padding:0;width:48px}
.tvang-kollaps .akhq-rail-brand b,.tvang-kollaps .akhq-rail-label,.tvang-kollaps .akhq-rail-sec,.tvang-kollaps .akhq-rail-me-t{display:none}
.tvang-kollaps .akhq-rail-me{justify-content:center;padding:12px 0 0}
/* gammel rail, gjengitt verbatim fra Rail.jsx før 18.08 */
.g-rail{width:64px;flex:none;background:var(--rail);border-right:1px solid color-mix(in srgb,#faf9f5 6%,transparent);display:flex;flex-direction:column;align-items:center;padding:16px 0 14px;gap:2px;--logo-mark:#faf9f5;--logo-dot:var(--accent)}
.g-brand{width:36px;height:36px;display:grid;place-items:center;margin-bottom:14px}
.g-item{min-height:44px;width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0 6px;border-radius:var(--r);color:var(--rail-fg);background:transparent;border:0;cursor:pointer}
.g-item span{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.g-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.g-item[aria-current=page]{color:var(--rail-on);background:color-mix(in srgb,#faf9f5 9%,transparent)}
.g-spacer{flex:1}
.g-avatar{width:32px;height:32px;border-radius:50%;border:1px solid color-mix(in srgb,#faf9f5 14%,transparent);background:color-mix(in srgb,#faf9f5 8%,transparent);color:var(--rail-on);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600}
</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Rail, Icon } = window.AKGolfHQClaudePaper_605a48;
const items = ["hjem","ko","stall","plan","analyse"].map(id => ({ id, label: { hjem:"Hjem", ko:"Kø", stall:"Spillere", plan:"Kalender", analyse:"Analyse" }[id], icon: <Icon name={id === "analyse" ? "analyse" : id} /> }));
const Stub = () => (<div className="stub"><div className="stubline" style={{width:"40%"}}></div><div className="stubline" style={{width:"70%"}}></div><div className="stubcard"></div><div className="stubcard"></div></div>);
function Gammel(){
  return (<nav className="g-rail" aria-label="Gammel rail">
    <div className="g-brand"><Icon name="hjem" /></div>
    {items.map((it,i)=>(<button key={it.id} type="button" className="g-item" aria-current={i===0?"page":undefined}>{it.icon}<span>{it.label}</span></button>))}
    <div className="g-spacer"></div><div className="g-avatar">AK</div>
  </nav>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<div className="duo">
  <div className="halv"><div className="cap">Gammel — 64 px mørk skinne (fase2-fasit / A1)</div><div className="shell"><Gammel /><Stub /></div></div>
  <div className="halv"><div className="cap">Ny — 232 px papirflate (18.08 · venter A1-godkjenning)</div><div className="shell"><Rail items={items} current="hjem" initials="AK" /><Stub /></div></div>
  <div className="halv tvang-kollaps"><div className="cap">Ny — kollapset 64 px (≤1080 px vindu)</div><div className="shell"><Rail items={items} current="hjem" initials="AK" /><Stub /></div></div>
</div>);
</script></body></html>

    <Grp label="Forms — tilstander og berøringsgulv i container-laget">
      <div className="three">
        <Cell label="Input default"><Input label="Spillernavn" placeholder="Skriv navn" dataOdId="inp-d" /></Cell>
        <Cell label="Input error"><Input label="Volum" defaultValue="0" error="Volum må være over 0 for å publisere" dataOdId="inp-e" /></Cell>
        <Cell label="Input + hint"><Input label="Måldato" hint="Brukes til å regne baklengs" placeholder="dd.mm.åååå" dataOdId="inp-h" /></Cell>
      </div>
      <div className="row" style={{ marginTop: 14 }}>
        <Cell label="Toggle av"><Toggle checked={false} label="Varsler" dataOdId="tog-av" /></Cell>
        <Cell label="Toggle på"><Toggle checked={pa} onChange={setPa} label="Varsler" dataOdId="tog-pa" /></Cell>
        <Cell label="Toggle disabled"><Toggle checked disabled label="Låst av trener" dataOdId="tog-l" /></Cell>
        <Cell label="SegmentControl"><SegmentControl value={seg} onChange={setSeg} options={["Uke", "Måned", "År"]} dataOdId="seg" /></Cell>
      </div>
      <div className="row" style={{ marginTop: 14 }} data-coarse-test>
        <Cell label="coarse-stand-in: input → 44"><Input label="Input" placeholder="44 px" dataOdId="inp-coarse" /></Cell>
        <Cell label="toggle → 44"><Toggle checked label="Toggle" dataOdId="tog-coarse" /></Cell>
        <Cell label="seg-btn → 40"><SegmentControl value="Uke" options={["Uke", "Måned"]} dataOdId="seg-coarse" /></Cell>
        <Cell label="chip static → 22 (nullet)"><Chip static dataOdId="chip-null">M3</Chip></Cell>
      </div>
      <p className="lead mono" style={{ marginTop: 8, marginBottom: 0, fontSize: 11.5 }} id="floor-assert">måler …</p>
    </Grp>

    <Grp label="Navigasjon — Breadcrumbs og TabBar">
      <div className="row">
        <Cell label="Breadcrumbs"><Breadcrumbs items={[{ label: "AgencyOS", href: "#" }, { label: "Stall", href: "#" }, { label: "Markus Pedersen" }]} dataOdId="nav-crumbs" /></Cell>
      </div>
      <div style={{ marginTop: 14, maxWidth: 430 }}><TabBar items={[{ id: "idag", label: "I dag" }, { id: "tren", label: "Tren" }, { id: "golf", label: "Min golf" }, { id: "mer", label: "Mer" }]} current="idag" dataOdId="nav-tabbar" /></div>
    </Grp>

    <Grp label="Golfviz — fylt tilstand, begge moduser">
      <div className="three">
        <Cell label="SgBreakdown"><SgBreakdown items={[{ label: "Putting", value: 0.42 }, { label: "Nærspill", value: -0.18 }, { label: "Innspill", value: 0.11 }]} total={0.35} window="8 uker" dataOdId="sg" /></Cell>
        <Cell label="PuttLab"><PuttLab buckets={[{ range: "1–2 m", pct: 90, attempts: 20 }, { range: "3–6 m", pct: 45, attempts: 20 }, { range: "7–12 m", pct: 15, attempts: 20 }]} window="8 uker" dataOdId="putt" /></Cell>
        <Cell label="GappingChart"><GappingChart clubs={[{ club: "PW", min: 118, max: 128, avg: 124 }, { club: "9j", min: 128, max: 140, avg: 135 }, { club: "8j", min: 140, max: 152, avg: 147 }]} dataOdId="gap" /></Cell>
        <Cell label="PyramidProgress"><PyramidProgress levels={[{ label: "Turnering", pct: 30 }, { label: "Spesialisering", pct: 65 }, { label: "Grunn", pct: 92 }]} dataOdId="pyr" /></Cell>
        <Cell label="HoleStrip"><HoleStrip holes={Array.from({ length: 9 }, (_, i) => ({ hole: i + 1, sg: (i % 3 - 1) * 0.4 }))} window="Runde 14. juni" dataOdId="holes" /></Cell>
        <Cell label="TrendBand"><TrendBand data={[68, 71, 70, 73, 72, 75, 74, 77]} band={{ min: 70, max: 74 }} pbIndex={7} window="8 siste runder" dataOdId="trend" /></Cell>
      </div>
    </Grp>
  </div>);
}
ReactDOM.createRoot(document.getElementById("light")).render(<Kort />);
ReactDOM.createRoot(document.getElementById("dark")).render(<Kort />);
setTimeout(() => {
  const AKTIV = new Set(["button","a","input","select","textarea","summary","label"]);
  const AKTIVROLLE = new Set(["button","link","menuitem","tab","option","checkbox","radio","switch"]);
  const rigg = [...document.querySelectorAll('[data-coarse-test] [class^="akhq-"],[data-coarse-test] [class*=" akhq-"]')];
  const riggOk = rigg.some((el) => {
    const f = parseFloat((getComputedStyle(el).getPropertyValue("--floor") || "0").trim());
    return AKTIV.has(el.tagName.toLowerCase()) && f > 0;
  });
  const n = document.getElementById("floor-assert");
  if (!riggOk) { window.__floorAssert = { riggOk: false, ok: false, merknad: "RIGGEN VIRKER IKKE — ingen interaktivt element i [data-coarse-test] har --floor > 0. Container-regelen er ikke lastet (typisk stale bundle); ingen brudd telt." };
    if (n) { n.textContent = "⚠ riggen virker ikke — container-regelen er ikke lastet (stale bundle)"; n.style.color = "var(--dn)"; } return; }
  const brudd = []; let sjekket = 0;
  for (const el of document.querySelectorAll('[data-coarse-test] [class^="akhq-"],[data-coarse-test] [class*=" akhq-"]')) {
    const cs = getComputedStyle(el);
    if (parseFloat((cs.getPropertyValue("--floor") || "").trim() || "NaN") !== 0) continue;
    sjekket++;
    const tag = el.tagName.toLowerCase(), rolle = (el.getAttribute("role") || "").toLowerCase(), ti = el.getAttribute("tabindex");
    const g = [];
    if (AKTIV.has(tag) && !(tag === "a" && !el.hasAttribute("href"))) g.push("tag=" + tag);
    if (AKTIVROLLE.has(rolle)) g.push("role=" + rolle);
    if (el.hasAttribute("href")) g.push("href");
    if (ti !== null && parseInt(ti, 10) >= 0) g.push("tabindex=" + ti);
    if (cs.cursor === "pointer") g.push("cursor:pointer");
    if (g.length) brudd.push({ odId: el.dataset.odId, klasse: el.className, grunner: g });
  }
  /* sjekket > 0-vernet: «ok» skal være false når instrumentet ikke målte noe
     (bindende regel i readme). Uten et eksplisitt nullet element i riggen
     melder kortet ellers grønt på tom mengde. */
  const ok = sjekket > 0 && brudd.length === 0;
  window.__floorAssert = { riggOk: true, sjekket, brudd, ok, merknad: sjekket === 0 ? "målte ingenting — ingen eksplisitt nullet element i [data-coarse-test]" : undefined };
  if (n) { n.textContent = sjekket === 0 ? "✗ målte ingenting — ingen eksplisitt nullet element i riggen" : ok ? "✓ riggen virker · " + sjekket + " eksplisitt nullet element, alle ikke-interaktive" : "✗ " + brudd.length + " brudd: " + brudd.map((b) => (b.odId || b.klasse) + " (" + b.grunner.join(", ") + ")").join(" · "); n.style.color = ok ? "var(--up)" : "var(--dn)"; }
}, 600);
</script></body></html>

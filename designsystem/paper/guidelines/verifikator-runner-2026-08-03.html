<script>

"components/domene/fleksmerke.card.html",
"components/domene/lfasebadge.card.html",
"components/domene/livebar.card.html",
"components/domene/livestatus.card.html",
"components/domene/nivastige.card.html",

"components/golfviz/range.card.html"
];
const log = (m, cls) => { const d = document.createElement("div"); d.textContent = m; if (cls) d.className = cls; document.getElementById("log").appendChild(d); };
const resultater = [];
// rAF fryses i skjulte faner — stubben under limes inn i hvert kort før lasting,
// så assertion-kjeden går via setTimeout (fyrer også skjult, throttlet til ~1 s).
const RAF_STUB = '<script>window.requestAnimationFrame=function(cb){return setTimeout(cb,16)};<' + '/script>';
async function kjorEtt(p) {
  let hDecl = null, w = 980, txt;
  try { txt = await (await fetch("../" + p)).text(); }
  catch (e) { return { p, feil: "fetch: " + e.message }; }
  const m = txt.match(/viewport="(\d+)x(\d+)"/);
  if (m) { w = +m[1]; hDecl = +m[2]; }
  const baseUrl = new URL("../" + p.slice(0, p.lastIndexOf("/") + 1), location.href).href;
  let patched = txt.replace(/<meta charset="utf-8">/i, '<meta charset="utf-8"><base href="' + baseUrl + '">' + RAF_STUB);
  if (patched === txt) patched = RAF_STUB + txt;
  return new Promise((resolve) => {
    const fr = document.createElement("iframe");
    fr.style.cssText = "width:" + w + "px;height:220px;border:0;position:absolute;left:-99999px;top:0";
    document.body.appendChild(fr);
    fr.srcdoc = patched;
    const t0 = Date.now();
    const iv = setInterval(() => {
      let a = null, h = null;
      try { a = fr.contentWindow && fr.contentWindow.__assert; h = fr.contentDocument && fr.contentDocument.documentElement.scrollHeight; } catch (e) {}
      if (a || Date.now() - t0 > 30000) {
        clearInterval(iv);
        const r = { p, w, hDecl, hMeas: h, antall: a ? a.length : 0, rode: a ? a.filter((x) => x[0] !== "✓") : null, timeout: !a };
        fr.remove(); resolve(r);
      }
    }, 400);
  });
}
(async () => {
  for (let i = 0; i < CARDS.length; i++) {
    document.getElementById("st").textContent = (i + 1) + "/" + CARDS.length + " " + CARDS[i];
    const r = await kjorEtt(CARDS[i]);
    resultater.push(r);
    const rod = r.timeout || r.feil || (r.rode && r.rode.length);
    log((rod ? "ROD " : "OK  ") + r.p + "  asserts=" + r.antall + " hDecl=" + r.hDecl + " hMeas=" + r.hMeas + (r.rode && r.rode.length ? "  " + r.rode.join(" | ") : "") + (r.timeout ? " TIMEOUT" : ""), rod ? "bad" : "ok");
  }
  window.__RESULT = JSON.stringify(resultater);
  document.getElementById("st").textContent = "FERDIG " + resultater.length;
  document.title = "FERDIG";
})();
</script>

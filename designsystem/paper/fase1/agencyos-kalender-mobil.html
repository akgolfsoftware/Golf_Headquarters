<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalender · AgencyOS · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

/* v3.1-tillegg foreslått fra agencyoshq.html — mellomtrinn i cream-stigen.
   Skal inn i tokens-fila hvis Anders godkjenner. */
:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }

/* ═══ Kalender · AgencyOS · mobil ═══
   Ressursen er coachens tid. Simulator vises aldri som kolonne eller ressurs.
   Sju kolonner får ikke plass på 430 px, og en klemt ukevisning er verre enn
   ingen — derfor har mobilen egne komponenter:
     Dag    · én tidsakse i full bredde, 30-minutters oppløsning
     Agenda · lista, når du bare skal vite hva som skjer
     Uke    · én rad per dag med belegg og kollisjoner, ikke et rutenett
     Måned  · tetthetsprikker, tapp for å gå til dagen
   Alle fire finnes på desktop også. Ingen funksjon er borte. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.5; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.full{ width:100%; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.chip{ display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  padding:0 var(--s4); font-size:13px; background:var(--surface); flex:none;
  border:1px solid var(--border); border-radius:var(--r-pill); cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }

.phone{ width:430px; max-width:100%; height:932px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }
.phone .scrim,.phone .ark{ position:absolute; }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s3);
  padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:20px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

/* Visningsvelger og filtre: to sveipbare rader, aldri en «mer»-meny. */
.rader{ flex:none; background:var(--softer); border-bottom:1px solid var(--border-soft); }
.visning,.filtre{ display:flex; gap:var(--s2); padding:var(--s2) var(--s4);
  overflow-x:auto; scrollbar-width:none; }
.visning::-webkit-scrollbar,.filtre::-webkit-scrollbar{ display:none; }
.visning button{ flex:none; min-height:var(--tap); padding:0 var(--s4); font-size:13px;
  background:transparent; border:1px solid transparent; border-radius:var(--r-pill);
  cursor:pointer; color:var(--muted); }
.visning button[aria-current="true"]{ background:var(--surface); border-color:var(--border);
  color:var(--fg); font-weight:600; }

/* Dagpiller — mobilens egen ukekomponent. */
.dagstrip{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border);
  background:var(--surface); }
.dagstrip::-webkit-scrollbar{ display:none; }
.dagstrip button{ flex:none; min-width:52px; min-height:56px; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; font-size:11px; color:var(--muted); position:relative; }
.dagstrip button .dd{ font-family:var(--mono); font-size:13px; color:var(--fg); }
.dagstrip button[aria-selected="true"]{ background:var(--fg); border-color:var(--fg); color:var(--bg); }
.dagstrip button[aria-selected="true"] .dd{ color:var(--bg); }
.dagstrip button.idag::after{ content:""; position:absolute; bottom:5px; width:4px; height:4px;
  border-radius:var(--r-pill); background:var(--accent); }
.dagstrip button .prikk{ display:block; width:5px; height:5px; border-radius:var(--r-pill);
  background:var(--mid); }

.maal{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  overflow-x:auto; scrollbar-width:none; }
.maal::-webkit-scrollbar{ display:none; }
.maal .m{ flex:none; min-width:104px; background:var(--soft);
  border:1px solid var(--border-soft); border-radius:var(--r); padding:var(--s2) var(--s3); }
.maal .k{ display:block; font-family:var(--mono); font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); }
.maal .v{ display:block; font-family:var(--mono); font-size:18px; }
.maal .w{ display:block; font-family:var(--body); font-size:11px; color:var(--muted); }

.lerret{ flex:1; min-height:0; overflow-y:auto; padding:0 var(--s4) var(--s5); }

/* ── Dagvisning: én kolonne, full bredde ─────────────────────── */
.tg{ display:grid; grid-template-columns:54px minmax(0,1fr); position:relative;
  margin-top:var(--s3); }
.tg-corner{ border-bottom:1px solid var(--border); }
.tg-head{ display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3);
  border-bottom:1px solid var(--border); border-left:1px solid var(--border-soft); }
.tg-head .h{ font-size:13px; font-weight:600; }
.tg-head .sub{ font-family:var(--mono); font-size:10px; color:var(--muted); }
.tg-axis{ position:relative; }
.tg-tick{ height:30px; position:relative; }
.tg-tick span{ position:absolute; top:-7px; right:var(--s2); font-family:var(--mono);
  font-size:10px; color:var(--mid); }
.tg-tick:not(.hel) span{ display:none; }
.tg-col{ position:relative; border-left:1px solid var(--border-soft);
  background:
    repeating-linear-gradient(to bottom, var(--hairline) 0 1px, transparent 1px 60px),
    repeating-linear-gradient(to bottom, var(--border-soft) 0 1px, transparent 1px 30px);
  background-color:var(--surface); }

/* Sloten er 30 px på mobil, ikke 22 som på desktop. Grunnen er tommelen:
   en halvtimes avtale blir 30 px høy, en time 60 px. Med desktop-sloten ville
   den korteste avtalen vært 22 px — under enhver treffgrense. Aksen viser
   fortsatt 30-minutters oppløsning; det er bare skalaen som er større. */
.ev{ position:absolute; left:3px; right:3px; overflow:hidden; text-align:left;
  padding:var(--s1) var(--s2); border-radius:var(--r-sm); cursor:pointer;
  border:1px solid var(--border); background:var(--surface); }
.ev .t{ display:block; font-size:12px; font-weight:600; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.ev .m{ display:block; font-family:var(--mono); font-size:10px; color:var(--muted); }
.ev.coaching{ background:var(--soft); border-color:var(--mid); }
.ev.ledig{ background:var(--surface); border-style:dashed; }
.ev.holdt{ background:var(--softer); border-style:dotted; }
.ev.sperret{ background:var(--softer); color:var(--muted);
  background-image:repeating-linear-gradient(45deg, var(--border-soft) 0 6px, transparent 6px 12px); }
.ev.kollisjon{ border-color:var(--dn); border-width:2px; }
.ev[aria-current="true"]{ box-shadow:inset 0 0 0 2px var(--fg); }
.naa{ position:absolute; left:0; right:0; height:0; border-top:2px solid var(--accent);
  pointer-events:none; }
.naa span{ position:absolute; top:-8px; left:var(--s2); font-family:var(--mono);
  font-size:9px; color:var(--accent-fg); background:var(--bg); padding:0 3px; }

/* ── Agenda ──────────────────────────────────────────────────── */
.agenda{ padding-top:var(--s3); }
.agrad{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--s3);
  width:100%; text-align:left; padding:var(--s3) var(--s4); margin-bottom:var(--s2);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; align-items:center; }
.agrad:active{ background:var(--soft); }
.agrad.ledig{ border-style:dashed; }
.agrad.kollisjon{ border-color:var(--dn); }
.agrad .kl{ font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap; }
.agrad .t{ display:block; font-size:14px; font-weight:600; }
.agrad .s{ display:block; font-family:var(--body); font-size:12.5px; color:var(--muted); }
.agrad .meta{ display:flex; gap:var(--s2); margin-top:var(--s1); flex-wrap:wrap; }

/* ── Ukevisning: én rad per dag, ikke sju kolonner ───────────── */
.uke{ padding-top:var(--s3); }
.ukerad{ display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:var(--s3);
  width:100%; text-align:left; padding:var(--s3) var(--s4); margin-bottom:var(--s2);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; align-items:center; }
.ukerad:active{ background:var(--soft); }
.ukerad.idag{ border-color:var(--fg); }
.ukerad .dag{ font-family:var(--mono); font-size:12px; }
.ukerad .dag b{ display:block; font-size:15px; }
.ukerad .s{ display:block; font-family:var(--body); font-size:12.5px; color:var(--muted); }
.ukerad .adv{ display:block; font-size:12px; color:var(--dn); }
.ukerad .pct{ font-family:var(--mono); font-size:15px; }
.bar{ display:block; height:4px; border-radius:var(--r-pill); background:var(--soft);
  margin-top:var(--s1); overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--mid); }

/* ── Måned ───────────────────────────────────────────────────── */
.maaned{ display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; padding-top:var(--s3); }
.ukedag{ font-family:var(--mono); font-size:9px; text-transform:uppercase; color:var(--muted);
  text-align:center; padding-bottom:var(--s1); }
.mdag{ min-height:52px; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:var(--s1) 0; background:var(--surface); border:1px solid var(--border-soft);
  border-radius:var(--r-sm); cursor:pointer; }
.mdag .d{ font-family:var(--mono); font-size:12px; }
.mdag.utenfor{ opacity:.4; }
.mdag.idag{ border-color:var(--fg); }
.tetthet{ display:flex; gap:2px; }
.tetthet i{ width:4px; height:4px; border-radius:var(--r-pill); background:var(--mid); }

.tom{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--s3);
  margin-top:var(--s4); padding:var(--s6) var(--s4); background:var(--soft);
  border:1px dashed var(--border); border-radius:var(--r); }
.tom h2{ margin:0; font-family:var(--disp); font-size:16px; font-weight:600; }
.tom p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }

.bunn{ flex:none; padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  border-top:1px solid var(--border); background:var(--surface); }
.bunn .hint{ display:block; font-family:var(--body); font-size:12px; color:var(--muted);
  margin-bottom:var(--s2); }

.faner{ flex:none; display:flex; background:var(--rail); z-index:var(--z-rail);
  padding-bottom:env(safe-area-inset-bottom); }
.faner a{ flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; color:var(--rail-fg); text-decoration:none;
  font-size:10px; position:relative; }
.faner a svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.faner a[aria-current="page"]{ color:var(--rail-on); }
.faner a[aria-current="page"]::before{ content:""; position:absolute; top:0; left:24%; right:24%;
  height:2px; background:var(--rail-on); border-radius:var(--r-pill); }
.faner .badge{ position:absolute; top:8px; right:50%; margin-right:-24px;
  font-family:var(--mono); font-size:9px; min-width:16px; height:16px; display:grid;
  place-items:center; border-radius:var(--r-pill); background:var(--rail-on); color:var(--rail); }

/* ── Arket ───────────────────────────────────────────────────── */
.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:var(--z-sheet); display:none; }
.scrim.on{ display:block; }
.ark{ position:fixed; left:0; right:0; bottom:0; z-index:calc(var(--z-sheet) + 1);
  max-height:88%; background:var(--surface); border-top:1px solid var(--border);
  border-radius:var(--r-lg) var(--r-lg) 0 0; display:none; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom); }
.ark.on{ display:flex; }
.grab{ flex:none; width:36px; height:4px; border-radius:var(--r-pill);
  background:var(--border); margin:var(--s3) auto var(--s2); }
.ahead{ flex:none; display:flex; align-items:flex-start; gap:var(--s2);
  padding:0 var(--s4) var(--s3); border-bottom:1px solid var(--border); }
.ahead h2{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.ahead .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.abody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }
.afoot{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  border-top:1px solid var(--border); }
.afoot .btn{ flex:1; }

.varsel{ padding:var(--s3) var(--s4); background:var(--accent-soft);
  border:1px solid var(--border); border-left:3px solid var(--accent);
  border-radius:var(--r); margin-bottom:var(--s4); font-size:13px; }
.blokk{ margin-bottom:var(--s4); }
.blokk .flab{ display:block; font-family:var(--mono); font-size:var(--text-label);
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:var(--s2); }
.blokk p{ margin:0; font-family:var(--body); font-size:13.5px; }
.linje{ display:flex; align-items:center; gap:var(--s3); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:13.5px; }
.linje:last-child{ border-bottom:0; }
.linje .v{ margin-left:auto; font-family:var(--mono); font-size:12.5px; text-align:right; }
.why{ border:1px solid var(--border); border-radius:var(--r); background:var(--softer);
  margin-bottom:var(--s4); }
.why summary{ padding:var(--s3) var(--s4); cursor:pointer; font-size:13px;
  display:flex; align-items:center; min-height:var(--tap); }
.why ul{ margin:0; padding:0 var(--s4) var(--s3) var(--s5); }
.why li{ font-family:var(--body); font-size:12.5px; color:var(--muted); margin-bottom:var(--s1); }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,.chip,summary,a.btn,.visning button,.dagstrip button{ min-height:var(--tap); }
.num,.eyebrow,.maal .v,.maal .k,.maal .w,.ev,.ev .t,.ev .m,.tag,.mdag .d,.ukerad .pct{ min-height:0; }

<script>
(function(){
'use strict';

/* ═══ Kalender · AgencyOS · mobil ═══
   T_START, EVENTS, DAGER, DAGKOL, FILTRE, kollisjoner() og belegg() er
   kopiert verbatim fra agencyos-kalender.html. Én datamodell, to flater.
   Ressursen er coachens tid. Simulator vises aldri. */

var T_START = 5*60, T_SLUTT = 23*60, SLOT = 30, SLOT_H = 22;
var N_SLOT = (T_SLUTT - T_START) / SLOT;
function min2(s){ var p = String(s).split(':'); return (+p[0])*60 + (+p[1]); }
function klokke(m){ var t = Math.floor(m/60), r = m%60;
  return (t<10?'0':'')+t+':'+(r<10?'0':'')+r; }
function yFor(m){ return (m - T_START) / SLOT * SLOT_H; }
function tid(m){ var t = Math.floor(m/60), r = m%60;
  return t ? (r ? t+' t '+r+' min' : t+' t') : r+' min'; }
function komma(n){ return String(n).replace('.', ','); }

/* Én ressurs: coachens dag. Ingen kolonner per rom eller enhet. */
var DAGKOL = [{k:'dag', n:'Anders Kristiansen', sub:'coachens dag'}];
var DAGER = [{k:0,dw:'man',dd:'28.7'},{k:1,dw:'tir',dd:'29.7'},{k:2,dw:'ons',dd:'30.7'},
             {k:3,dw:'tor',dd:'31.7',idag:true},{k:4,dw:'fre',dd:'1.8'},
             {k:5,dw:'lør',dd:'2.8'},{k:6,dw:'søn',dd:'3.8'}];

/* type: coaching | ledig | holdt | sperret
   «sperret» er egen tid som ikke er bookbar (møte, transport, egen trening).
   `sted` er anlegget. Aldri en enhet i anlegget. */
var EVENTS = [
  {id:'e1', dag:3, fra:'08:00', til:'09:00', type:'coaching',
   tittel:'Øyvind Rohjan', sub:'Innspill · 1:1', selskap:'AK Golf Academy', sted:'Mulligan Indoor'},
  {id:'e2', dag:3, fra:'09:00', til:'10:30', type:'coaching',
   tittel:'WANG · gruppe A', sub:'4 elever · teknikk', selskap:'WANG Toppidrett', sted:'Mulligan Indoor'},
  {id:'e3', dag:3, fra:'11:00', til:'12:00', type:'holdt',
   tittel:'Holdt · prøvetime', sub:'ny spiller · svar innen 48 t', selskap:'Ekstern', sted:'Mulligan Indoor'},
  {id:'e4', dag:3, fra:'12:00', til:'13:00', type:'sperret',
   tittel:'Egen trening', sub:'ikke bookbar', selskap:'—', sted:'Mulligan Indoor'},
  {id:'e5', dag:3, fra:'16:00', til:'17:30', type:'coaching',
   tittel:'Øyvind Rohjan', sub:'Innspill · lengdekontroll', selskap:'AK Golf Academy', sted:'Mulligan Indoor'},
  {id:'e6', dag:3, fra:'16:30', til:'17:30', type:'coaching',
   tittel:'GFGK junior · gruppe', sub:'6 elever · nærspill', selskap:'GFGK Junior', sted:'Mulligan Indoor'},
  {id:'e7', dag:3, fra:'18:00', til:'19:00', type:'ledig',
   tittel:'Ledig coachingtime', sub:'kan bookes', selskap:'—', sted:'Mulligan Indoor'},
  {id:'e8', dag:3, fra:'19:00', til:'20:00', type:'ledig',
   tittel:'Ledig coachingtime', sub:'kan bookes', selskap:'—', sted:'Mulligan Indoor'},
  {id:'e9', dag:2, fra:'15:00', til:'16:00', type:'coaching',
   tittel:'Øyvind Rohjan', sub:'Nærspill', selskap:'AK Golf Academy', sted:'Mulligan Indoor'},
  {id:'e10', dag:4, fra:'10:00', til:'11:30', type:'coaching',
   tittel:'WANG · gruppe B', sub:'5 elever', selskap:'WANG Toppidrett', sted:'Mulligan Indoor'},
  {id:'e11', dag:5, fra:'09:00', til:'13:00', type:'coaching',
   tittel:'Testrunde · 18 hull', sub:'Øyvind · hovedbanen', selskap:'AK Golf Academy', sted:'Gamle Fredrikstad'}
];

var FILTRE = [
  {k:'alle', n:'Alle', f:function(){ return true; }},
  {k:'akademi', n:'Akademi', f:function(e){ return e.selskap === 'AK Golf Academy'; }},
  {k:'wang', n:'WANG', f:function(e){ return e.selskap === 'WANG Toppidrett'; }},
  {k:'gfgk', n:'GFGK', f:function(e){ return e.selskap === 'GFGK Junior'; }},
  {k:'ledig', n:'Ledige timer', f:function(e){ return e.type === 'ledig'; }}
];


/* ── Kollisjon regnes, aldri skrives ────────────────────────────
   Coachen er ressursen. To coachingtimer som overlapper i tid er en kollisjon
   uansett hvor de foregår — Anders kan ikke være to steder samtidig.
   Gruppeøkter er ÉN avtale med flere deltakere, ikke flere avtaler. */
function kollisjoner(){
  var ut = [], e = synlige().filter(function(x){ return x.type === 'coaching'; });
  for (var i = 0; i < e.length; i++){
    for (var j = i+1; j < e.length; j++){
      if (e[i].dag !== e[j].dag) continue;
      var a1 = min2(e[i].fra), a2 = min2(e[i].til), b1 = min2(e[j].fra), b2 = min2(e[j].til);
      if (a1 < b2 && b1 < a2) ut.push({a:e[i], b:e[j], fra:Math.max(a1,b1), til:Math.min(a2,b2)});
    }
  }
  return ut;
}

/* Belegg = booket coachingtid delt på tilgjengelig tid, per dag.
   Sperret tid er ikke tilgjengelig og teller ikke i nevneren. */
function belegg(dag){
  var e = synlige().filter(function(x){ return x.dag === dag; });
  var booket = 0, sperret = 0;
  e.forEach(function(x){
    var d = min2(x.til) - min2(x.fra);
    if (x.type === 'coaching' || x.type === 'holdt') booket += d;
    if (x.type === 'sperret') sperret += d;
  });
  var tilgjengelig = (T_SLUTT - T_START) - sperret;
  return { booket:booket, sperret:sperret, tilgjengelig:tilgjengelig,
           pst: tilgjengelig ? Math.round(booket / tilgjengelig * 100) : 0 };
}


/* Mobilens slothøyde. Desktop bruker 22 px; på telefon blir den korteste
   avtalen da 22 px høy — under enhver treffgrense. 30 px gir 30 min = 30 px,
   1 time = 60 px. Oppløsningen er den samme, skalaen er større. */
SLOT_H = 30;

var visning = 'dag', filter = 'alle', valgtDag = 3, valgtId = null, lost = false;
var tilstand = 'fylt';   /* fylt · tom · laster · feil — demo-stillas */

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function synlige(){
  if (tilstand !== 'fylt') return [];
  return EVENTS.filter(FILTRE.filter(function(x){ return x.k === filter; })[0].f);
}
function hendelse(id){ return EVENTS.filter(function(x){ return x.id === id; })[0]; }
function dagNavn(k){
  var d = DAGER[k];
  var full = {man:'mandag',tir:'tirsdag',ons:'onsdag',tor:'torsdag',
              fre:'fredag',lør:'lørdag',søn:'søndag'}[d.dw];
  return full + ' ' + d.dd;
}

/* ── Filtre ──────────────────────────────────────────────────── */
function renderFiltre(){
  var w = document.getElementById('filtre'); w.innerHTML = '';
  FILTRE.forEach(function(x){
    var c = el('button','chip', x.n); c.type = 'button';
    c.setAttribute('aria-pressed', String(x.k === filter));
    c.dataset.odId = 'kam-filter-' + x.k;
    c.addEventListener('click', function(){ filter = x.k; render();
      si(x.n + ': ' + synlige().length + ' avtaler i uka.'); });
    w.appendChild(c);
  });
}

/* ── Dagpiller ───────────────────────────────────────────────── */
function renderDagstrip(){
  var w = document.getElementById('dagstrip'); w.innerHTML = '';
  DAGER.forEach(function(d){
    var n = synlige().filter(function(e){ return e.dag === d.k; }).length;
    var b = el('button', d.idag ? 'idag' : ''); b.type = 'button';
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(d.k === valgtDag));
    b.dataset.odId = 'kam-dag-' + d.k;
    b.appendChild(el('span', null, d.dw));
    b.appendChild(el('span','dd', d.dd));
    if (n) b.appendChild(el('span','prikk'));
    b.addEventListener('click', function(){
      valgtDag = d.k;
      if (visning === 'maaned' || visning === 'uke') settVisning('dag');
      else render();
      si(dagNavn(d.k) + ' · ' + n + ' avtaler.');
    });
    w.appendChild(b);
  });
}

/* ── Måltall ─────────────────────────────────────────────────── */
function renderMaal(){
  var w = document.getElementById('maal'); w.innerHTML = '';
  if (tilstand !== 'fylt'){ w.hidden = true; return; }
  w.hidden = false;
  var b = belegg(valgtDag);
  var k = kollisjoner().filter(function(x){ return x.a.dag === valgtDag; });
  var ledige = synlige().filter(function(e){ return e.dag === valgtDag && e.type === 'ledig'; }).length;
  [['belegg', b.pst + ' %', dagNavn(valgtDag)],
   ['booket', tid(b.booket), 'coachingtid'],
   ['ledige timer', String(ledige), 'kan bookes'],
   ['kollisjoner', String(k.length), k.length ? 'overlapper i tid' : 'ingen']].forEach(function(p){
    var d = el('div','m');
    d.appendChild(el('span','k', p[0]));
    d.appendChild(el('span','v num', p[1]));
    d.appendChild(el('span','w', p[2]));
    w.appendChild(d);
  });
}

/* ── Lerret ──────────────────────────────────────────────────── */
function tegnAkse(){
  var a = el('div','tg-axis');
  for (var k = 0; k <= N_SLOT; k++){
    var m = T_START + k * SLOT;
    var t = el('div','tg-tick' + (m % 60 === 0 ? ' hel' : ''));
    t.appendChild(el('span', null, klokke(m)));
    a.appendChild(t);
  }
  a.style.height = (N_SLOT * SLOT_H) + 'px';
  return a;
}
function tegnEvent(e, koll){
  var b = el('button','ev ' + e.type + (koll ? ' kollisjon' : '')); b.type = 'button';
  b.dataset.odId = 'kam-ev-' + e.id;
  b.setAttribute('aria-current', e.id === valgtId ? 'true' : 'false');
  var fra = min2(e.fra), varighet = min2(e.til) - fra;
  b.style.top = yFor(fra) + 'px';
  b.style.height = (varighet / SLOT * SLOT_H - 2) + 'px';
  b.appendChild(el('span','t', e.tittel));
  b.appendChild(el('span','m', e.fra + '–' + e.til + ' · ' + tid(varighet)));
  b.addEventListener('click', function(){ apneEvent(e.id); });
  return b;
}
function tomFlate(tittel, tekst, knapp){
  var e = el('div','tom');
  e.appendChild(el('h2', null, tittel));
  e.appendChild(el('p', null, tekst));
  var b = el('button','btn', knapp || 'Vis alle'); b.type = 'button';
  b.dataset.odId = 'kam-tom-alle';
  b.addEventListener('click', function(){ filter = 'alle'; render(); });
  e.appendChild(b);
  return e;
}

function renderLerret(){
  var w = document.getElementById('lerret'); w.innerHTML = '';

  if (tilstand === 'laster'){
    var l = el('div','tom');
    l.appendChild(el('h2', null, 'Henter kalenderen'));
    l.appendChild(el('p', null, 'Henter avtaler fra AgencyOS. Det tar sjelden mer enn et par sekunder.'));
    w.appendChild(l); w.appendChild(demobryter()); return;
  }
  if (tilstand === 'feil'){
    var f = el('div','tom');
    f.appendChild(el('h2', null, 'Fikk ikke kontakt'));
    f.appendChild(el('p', null,
      'Vi fikk ikke hentet kalenderen. Ingen avtale er endret — dette er kun visningen.'));
    var pr = el('button','btn','Prøv på nytt'); pr.type = 'button';
    pr.dataset.odId = 'kam-prov-igjen';
    pr.addEventListener('click', function(){ tilstand = 'laster'; render();
      setTimeout(function(){ tilstand = 'fylt'; render(); si('Kalenderen er hentet.'); }, 700); });
    f.appendChild(pr);
    w.appendChild(f); w.appendChild(demobryter()); return;
  }
  if (tilstand === 'tom'){
    var t0 = el('div','tom');
    t0.appendChild(el('h2', null, 'Ingen avtaler denne uka'));
    t0.appendChild(el('p', null,
      'Kalenderen er tom. Legg ut ledige coachingtimer fra Innboks, så kan spillere booke seg inn.'));
    var ib = el('button','btn','Åpne Innboks'); ib.type = 'button';
    ib.dataset.odId = 'kam-tom-innboks';
    ib.addEventListener('click', function(){ location.href = 'agencyos-innboks-mobil.html'; });
    t0.appendChild(ib);
    w.appendChild(t0); w.appendChild(demobryter()); return;
  }

  var vis = synlige();
  var koll = kollisjoner();

  if (visning === 'dag'){
    var dagens = vis.filter(function(e){ return e.dag === valgtDag; });
    if (!dagens.length){
      w.appendChild(tomFlate('Ingen avtaler ' + dagNavn(valgtDag),
        'Ingenting er booket denne dagen med dette filteret. Ledige coachingtimer legges ut fra Innboks.'));
      w.appendChild(demobryter()); return;
    }
    var g = el('div','tg');
    g.appendChild(el('div','tg-corner'));
    var h = el('div','tg-head');
    var tx = el('span');
    tx.appendChild(el('span','h', DAGKOL[0].n));
    tx.appendChild(el('span','sub', ' · ' + DAGKOL[0].sub));
    h.appendChild(tx);
    g.appendChild(h);
    g.appendChild(tegnAkse());
    var col = el('div','tg-col');
    col.style.height = (N_SLOT * SLOT_H) + 'px';
    dagens.forEach(function(e){
      col.appendChild(tegnEvent(e, koll.some(function(x){ return x.a.id === e.id || x.b.id === e.id; })));
    });
    if (DAGER[valgtDag].idag){
      var n = el('div','naa');
      n.style.top = yFor(9*60 + 12) + 'px';
      n.appendChild(el('span', null, 'nå 09:12'));
      col.appendChild(n);
    }
    g.appendChild(col);
    w.appendChild(g);

  } else if (visning === 'agenda'){
    var dagens2 = vis.filter(function(e){ return e.dag === valgtDag; })
      .sort(function(x,y){ return min2(x.fra) - min2(y.fra); });
    if (!dagens2.length){
      w.appendChild(tomFlate('Ingen avtaler ' + dagNavn(valgtDag),
        'Prøv et annet filter, eller legg ut ledige coachingtimer.'));
      w.appendChild(demobryter()); return;
    }
    var a = el('div','agenda');
    dagens2.forEach(function(e){
      var erKoll = koll.some(function(x){ return x.a.id === e.id || x.b.id === e.id; });
      var r = el('button','agrad' + (e.type === 'ledig' ? ' ledig' : '') + (erKoll ? ' kollisjon' : ''));
      r.type = 'button';
      r.dataset.odId = 'kam-ag-' + e.id;
      r.appendChild(el('span','kl', e.fra + '–' + e.til));
      var mid = el('span');
      mid.appendChild(el('span','t', e.tittel));
      mid.appendChild(el('span','s', e.sub));
      var meta = el('span','meta');
      meta.appendChild(el('span','tag', e.sted));
      if (erKoll) meta.appendChild(el('span','tag','kollisjon'));
      mid.appendChild(meta);
      r.appendChild(mid);
      r.addEventListener('click', function(){ apneEvent(e.id); });
      a.appendChild(r);
    });
    w.appendChild(a);

  } else if (visning === 'uke'){
    /* Sju kolonner får ikke plass. Uke på mobil er én rad per dag:
       belegg, antall avtaler og kollisjoner. Tapp for å gå inn i dagen. */
    var u = el('div','uke');
    DAGER.forEach(function(d){
      var e = vis.filter(function(x){ return x.dag === d.k; });
      var b = belegg(d.k);
      var kd = koll.filter(function(x){ return x.a.dag === d.k; }).length;
      var r = el('button','ukerad' + (d.idag ? ' idag' : '')); r.type = 'button';
      r.dataset.odId = 'kam-ukerad-' + d.k;
      var dg = el('span','dag');
      dg.appendChild(el('b', null, d.dw));
      dg.appendChild(document.createTextNode(d.dd));
      r.appendChild(dg);
      var mid = el('span');
      mid.appendChild(el('span','s', e.length
        ? e.length + (e.length === 1 ? ' avtale · ' : ' avtaler · ') + tid(b.booket) + ' booket'
        : 'ingen avtaler'));
      if (kd) mid.appendChild(el('span','adv', kd + ' kollisjon' + (kd > 1 ? 'er' : '')));
      var bar = el('span','bar');
      var fyll = el('i'); fyll.style.width = Math.min(100, b.pst) + '%';
      bar.appendChild(fyll); mid.appendChild(bar);
      r.appendChild(mid);
      r.appendChild(el('span','pct num', b.pst + ' %'));
      r.addEventListener('click', function(){ valgtDag = d.k; settVisning('dag'); });
      u.appendChild(r);
    });
    w.appendChild(u);

  } else {
    var m = el('div','maaned');
    ['man','tir','ons','tor','fre','lør','søn'].forEach(function(d){
      m.appendChild(el('div','ukedag', d)); });
    for (var i = 1; i <= 35; i++){
      var dato = i - 3;
      var utenfor = dato < 1 || dato > 31;
      var d2 = el('button','mdag' + (utenfor ? ' utenfor' : '') + (dato === 31 ? ' idag' : ''));
      d2.type = 'button';
      d2.dataset.odId = 'kam-mdag-' + i;
      d2.appendChild(el('span','d', dato < 1 ? String(30 + dato) : dato > 31 ? String(dato - 31) : String(dato)));
      var n2 = (dato === 31) ? vis.filter(function(e){ return e.dag === 3; }).length
             : (!utenfor ? (dato % 4 === 0 ? 3 : dato % 3 === 0 ? 2 : dato % 5 === 0 ? 1 : 0) : 0);
      var t2 = el('span','tetthet');
      for (var j = 0; j < n2 && j < 4; j++) t2.appendChild(document.createElement('i'));
      d2.appendChild(t2);
      d2.setAttribute('aria-label', (utenfor ? 'utenfor måneden' : dato + '. juli') +
        ' · ' + n2 + (n2 === 1 ? ' avtale' : ' avtaler'));
      d2.addEventListener('click', function(){ settVisning('dag'); });
      m.appendChild(d2);
    }
    w.appendChild(m);
  }

  w.appendChild(demobryter());
}

/* Demo-stillas: bytt datatilstand. Skal bort ved integrasjon. */
function demobryter(){
  var d = el('div','tom');
  d.dataset.demoOnly = 'true';
  d.appendChild(el('span','eyebrow','Demo · datatilstand'));
  var rekke = el('div');
  rekke.style.display = 'flex'; rekke.style.gap = 'var(--s2)'; rekke.style.flexWrap = 'wrap';
  ['fylt','tom','laster','feil'].forEach(function(t){
    var b = el('button','btn sm', t); b.type = 'button';
    b.dataset.odId = 'kam-demo-' + t;
    b.setAttribute('aria-pressed', String(t === tilstand));
    b.addEventListener('click', function(){ tilstand = t; render(); si('Viser tilstand ' + t + '.'); });
    rekke.appendChild(b);
  });
  d.appendChild(rekke);
  return d;
}

/* ── Bunn: Én ting nå ────────────────────────────────────────── */
function renderBunn(){
  var w = document.getElementById('bunn'); w.innerHTML = '';
  if (tilstand !== 'fylt'){ w.hidden = true; return; }
  w.hidden = false;
  var k = kollisjoner();
  if (k.length){
    /* Kollisjonen er dagens ene handling. Den løses i TID — den eneste
       dimensjonen som finnes når coachen er ressursen. */
    var x = k[0];
    w.appendChild(el('span','hint', 'Kollisjon ' + klokke(x.fra) + '–' + klokke(x.til) +
      ': «' + x.a.tittel + '» og «' + x.b.tittel + '». Du kan ikke ta begge.'));
    var b = el('button','btn now full','Løs kollisjonen'); b.type = 'button';
    b.dataset.odId = 'kam-one-thing-now';
    b.addEventListener('click', function(){ valgtDag = x.b.dag; apneEvent(x.b.id); });
    w.appendChild(b);
    return;
  }
  var ledige = synlige().filter(function(e){ return e.type === 'ledig'; }).length;
  w.appendChild(el('span','hint', ledige
    ? 'Ingen kollisjoner. ' + ledige + ' ledige coachingtimer kan legges ut.'
    : 'Ingen kollisjoner, ingen ledige timer.'));
  var g = el('button','btn full','Åpne Innboks'); g.type = 'button';
  g.dataset.odId = 'kam-bunn-innboks';
  g.addEventListener('click', function(){ location.href = 'agencyos-innboks-mobil.html'; });
  w.appendChild(g);
}

/* ── Arket ───────────────────────────────────────────────────── */
var ark = document.getElementById('ark'), scrim = document.getElementById('scrim'),
    arkBody = document.getElementById('arkBody'), arkFoot = document.getElementById('arkFoot'),
    sisteFokus = null;

function apneEvent(id){
  valgtId = id;
  sisteFokus = document.activeElement;
  render();
  renderArk();
  ark.hidden = false; scrim.hidden = false;
  ark.classList.add('on'); scrim.classList.add('on');
  var f = ark.querySelector('button'); if (f) f.focus();
}
function lukkArk(){
  ark.classList.remove('on'); scrim.classList.remove('on');
  ark.hidden = true; scrim.hidden = true;
  if (sisteFokus && sisteFokus.isConnected) sisteFokus.focus();
}
scrim.addEventListener('click', lukkArk);
ark.querySelector('[data-lukk]').addEventListener('click', lukkArk);
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && !ark.hidden){ ev.preventDefault(); lukkArk(); }
  if (ev.key === 'Tab' && !ark.hidden){
    var f = ark.querySelectorAll('button, [href], summary, [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var forste = f[0], siste = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === forste){ ev.preventDefault(); siste.focus(); }
    else if (!ev.shiftKey && document.activeElement === siste){ ev.preventDefault(); forste.focus(); }
  }
});

function renderArk(){
  var e = hendelse(valgtId);
  if (!e) return;
  document.getElementById('arkTitle').textContent = e.tittel;
  document.getElementById('arkSub').textContent =
    dagNavn(e.dag) + ' · ' + e.fra + '–' + e.til;
  arkBody.innerHTML = ''; arkFoot.innerHTML = '';

  var erKoll = kollisjoner().filter(function(x){ return x.a.id === e.id || x.b.id === e.id; })[0];
  if (erKoll){
    var v = el('div','varsel');
    v.textContent = 'Kollisjon i din kalender — «' + erKoll.a.tittel + '» og «' + erKoll.b.tittel +
      '» overlapper ' + klokke(erKoll.fra) + '–' + klokke(erKoll.til) + '. Du kan ikke ta begge.';
    arkBody.appendChild(v);
  }

  var blk = el('div','blokk');
  blk.appendChild(el('span','flab','avtalen'));
  [['Tid', e.fra + '–' + e.til], ['Varighet', tid(min2(e.til) - min2(e.fra))],
   ['Sted', e.sted],
   ['Type', e.type === 'coaching' ? 'Coachingtime' : e.type === 'ledig' ? 'Ledig coachingtime'
     : e.type === 'holdt' ? 'Holdt luke' : 'Sperret egen tid'],
   ['Selskap', e.selskap], ['Innhold', e.sub]].forEach(function(p){
    var l = el('div','linje');
    l.appendChild(el('span','k', p[0]));
    l.appendChild(el('span','v', p[1]));
    blk.appendChild(l);
  });
  arkBody.appendChild(blk);

  var b2 = belegg(e.dag);
  var why = el('details','why'); why.dataset.odId = 'kam-why-belegg';
  why.appendChild(el('summary', null, 'Hvorfor belegget er ' + b2.pst + ' %'));
  var ul = document.createElement('ul');
  ['Kilde: alle avtaler ' + dagNavn(e.dag) + ' i din kalender, filtrert på «' +
     FILTRE.filter(function(x){ return x.k === filter; })[0].n.toLowerCase() + '».',
   'Beregning: booket coachingtid (' + tid(b2.booket) + ') delt på tilgjengelig tid (' +
     tid(b2.tilgjengelig) + '). Tilgjengelig = 18 timer minus sperret egen tid.',
   'Forbehold: holdte luker teller som booket. Ledige timer teller ikke — de er en mulighet, ikke en avtale.']
   .forEach(function(t){ ul.appendChild(el('li', null, t)); });
  why.appendChild(ul);
  arkBody.appendChild(why);

  if (e.type === 'ledig'){
    var n = el('div','blokk');
    n.appendChild(el('span','flab','merk'));
    n.appendChild(el('p', null,
      'Dette er en bookbar coachingtime, ikke utleie av simulator. Simulatortid selges ikke.'));
    arkBody.appendChild(n);
  }

  if (erKoll){
    var flytt = erKoll.b;
    var nyFra = Math.max(min2(erKoll.a.til), min2(erKoll.b.fra));
    var lengde = min2(flytt.til) - min2(flytt.fra);
    var avb = el('button','btn','Behold begge'); avb.type = 'button';
    avb.dataset.odId = 'kam-behold';
    avb.addEventListener('click', function(){
      toast('Begge står. Kollisjonen er fortsatt der.');
      si('Ingenting er flyttet. Kollisjonen står fortsatt i kalenderen.');
    });
    var fix = el('button','btn ink', 'Flytt til ' + klokke(nyFra) + '–' + klokke(nyFra + lengde));
    fix.type = 'button'; fix.dataset.odId = 'kam-los-kollisjon';
    fix.addEventListener('click', function(){
      flytt.fra = klokke(nyFra); flytt.til = klokke(nyFra + lengde);
      lost = true; valgtId = flytt.id;
      render(); renderArk();
      si('Kollisjonen er løst. ' + flytt.tittel + ' er flyttet til ' + flytt.fra +
         '. Belegget er regnet på nytt.');
      toast('Flyttet til ' + flytt.fra);
    });
    arkFoot.appendChild(avb); arkFoot.appendChild(fix);
  } else if (e.type === 'ledig'){
    var bk = el('button','btn ink','Legg ut i booking'); bk.type = 'button';
    bk.dataset.odId = 'kam-book';
    bk.addEventListener('click', function(){
      toast('Luka er lagt ut som bookbar coachingtime.');
      si('Luka er lagt ut som bookbar coachingtime.');
    });
    arkFoot.appendChild(bk);
  } else {
    var sp = el('button','btn ink','Åpne spiller'); sp.type = 'button';
    sp.dataset.odId = 'kam-spiller';
    sp.addEventListener('click', function(){ location.href = 'spillerprofil.html'; });
    arkFoot.appendChild(sp);
  }
}

/* ── Visningsvelger ──────────────────────────────────────────── */
function settVisning(v){
  visning = v;
  document.querySelectorAll('.visning button').forEach(function(x){
    x.setAttribute('aria-current', String(x.dataset.visning === v)); });
  render();
}
document.querySelectorAll('.visning button').forEach(function(b){
  b.addEventListener('click', function(){
    settVisning(b.dataset.visning);
    si('Visning byttet til ' + b.textContent + '.');
  });
});

/* ── Tema ────────────────────────────────────────────────────── */
var KEY = 'akhq-theme-agencyos';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

function render(){
  renderFiltre(); renderDagstrip(); renderMaal(); renderLerret(); renderBunn();
  document.getElementById('toppSub').textContent = dagNavn(valgtDag) + ' · 09:12';
}
render();
})();

</script>

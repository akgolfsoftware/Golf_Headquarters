<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalender · AgencyOS · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }
/* ═══ Kalender · AgencyOS · desktop + iPad ═══
   Tid og kapasitet. Booking i AK Golf HQ gjelder KUN coachingtjenester —
   det selges ikke simulatortid. Ledige luker er bookbare coachingtimer,
   ikke utleie av Mulligan Indoor (Anders 01.08.2026).

   Tidsakse 05:00–23:00 i 30-minutters intervaller, samme som Workbench.
   Fire visninger: Dag (sim som kolonner) · Uke (dager) · Måned · Agenda.
   Belegg og kollisjon REGNES, aldri skrives for hånd. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-agency); line-height:1.5; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,select,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap); padding:0 var(--s4); font-size:13px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  min-height:var(--tap-lg); font-weight:600; padding:0 var(--s5); }
.btn.sm{ min-height:var(--tap); padding:0 var(--s3); font-size:12px; }
.btn.icon{ width:var(--tap); padding:0; }
.chip{ display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  padding:0 var(--s4); font-size:12.5px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-pill); cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.app{ display:grid; grid-template-columns:64px minmax(0,1fr) 340px; height:100vh; }
.stage{ display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden;
  border-right:1px solid var(--border); }

.rail{ background:var(--rail); display:flex; flex-direction:column; align-items:center;
  gap:var(--s1); padding:var(--s3) 0; z-index:var(--z-rail); }
.logo{ font-family:var(--disp); font-size:15px; font-weight:700; color:var(--rail-on); margin-bottom:var(--s4); }
.logo span{ color:var(--logo-dot); }
.rbtn{ width:52px; min-height:52px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; background:transparent; border:0; border-radius:var(--r);
  color:var(--rail-fg); font-size:9px; cursor:pointer; position:relative; }
.rbtn:hover{ background:var(--rail-hover); color:var(--rail-on); }
.rbtn[aria-current="page"]{ background:var(--rail-active); color:var(--rail-on); }
.rbtn svg{ width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.rbtn .cnt{ position:absolute; top:4px; right:6px; font-family:var(--mono); font-size:9px;
  min-width:15px; height:15px; display:grid; place-items:center; border-radius:var(--r-pill);
  background:var(--rail-on); color:var(--rail); }

.top{ flex:none; display:flex; align-items:center; gap:var(--s3);
  padding:var(--s3) var(--s4); border-bottom:1px solid var(--border); background:var(--surface); }
.top h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.visning{ display:flex; gap:2px; padding:3px; background:var(--soft); border-radius:var(--r-pill); }
.visning button{ min-height:var(--tap); padding:0 var(--s4); border:0; background:transparent;
  border-radius:var(--r-pill); font-size:12.5px; cursor:pointer; color:var(--muted); }
.visning button[aria-current="true"]{ background:var(--surface); color:var(--fg); font-weight:600; }
.nav{ display:flex; align-items:center; gap:var(--s2); }

.maalrad{ flex:none; display:flex; gap:0; border-bottom:1px solid var(--border);
  background:var(--softer); overflow-x:auto; scrollbar-width:none; }
.maalrad::-webkit-scrollbar{ display:none; }
.m{ display:flex; flex-direction:column; gap:2px; padding:var(--s3) var(--s4);
  border-right:1px solid var(--border-soft); min-width:112px; }
.m .k{ font-family:var(--mono); font-size:var(--text-label); letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); }
.m .v{ font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.02em; }
.m .w{ font-size:10.5px; color:var(--muted); }
.filtre{ display:flex; align-items:center; gap:var(--s2); padding:var(--s3) var(--s4); margin-left:auto; }

.lerret{ flex:1; min-height:0; overflow:auto; }

/* ── Tidsrutenett ────────────────────────────────────────────── */
.tg{ display:grid; position:relative; min-width:760px; }
.tg-corner{ position:sticky; top:0; left:0; z-index:4; background:var(--bg);
  border-bottom:1px solid var(--border); border-right:1px solid var(--border); }
.tg-head{ position:sticky; top:0; z-index:3; background:var(--bg);
  border-bottom:1px solid var(--border); border-left:1px solid var(--border-soft);
  padding:var(--s2) var(--s3); display:flex; align-items:baseline; gap:var(--s2); }
.tg-head .h{ font-size:12.5px; font-weight:600; }
.tg-head .sub{ font-family:var(--mono); font-size:10px; color:var(--muted); }
.tg-head .pct{ margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.tg-head.idag{ background:var(--soft); }
.tg-axis{ position:sticky; left:0; z-index:2; background:var(--bg); border-right:1px solid var(--border); }
.tg-tick{ height:22px; position:relative; }
.tg-tick span{ position:absolute; top:-6px; right:var(--s2); font-family:var(--mono);
  font-size:10px; color:var(--muted); background:var(--bg); padding:0 2px;
  font-variant-numeric:tabular-nums; }
.tg-tick.hel span{ color:var(--fg); font-weight:500; }
.tg-col{ position:relative; border-left:1px solid var(--border-soft);
  background:
    repeating-linear-gradient(to bottom, var(--hairline) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(to bottom, var(--border-soft) 0 1px, transparent 1px 22px);
  background-color:var(--surface); }

.ev{ position:absolute; left:3px; right:3px; z-index:2; text-align:left; padding:4px 6px;
  border-radius:var(--r-sm); background:var(--bg); border:1px solid var(--border);
  border-left:3px solid var(--mid); cursor:pointer; overflow:hidden; }
.ev:hover{ border-color:var(--mid); }
.ev[aria-current="true"]{ border-color:var(--fg); background:var(--soft); }
.ev .t{ display:block; font-size:11.5px; font-weight:600; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ev .m{ display:block; font-family:var(--mono); font-size:9.5px; color:var(--muted); }
/* Ledig coachingtime — stiplet, ikke fylt. Det er en mulighet, ikke en avtale. */
.ev.ledig{ background:transparent; border:1px dashed var(--border); border-left:1px dashed var(--border); }
.ev.ledig .t{ color:var(--muted); font-weight:500; }
.ev.holdt{ border-left-color:var(--info); }
.ev.kollisjon{ border-left-color:var(--dn); background:var(--soft); }
.ev.sperret{ background:var(--soft); border:1px dashed var(--border);
  border-left:1px dashed var(--border); }
.ev.sperret .t{ color:var(--muted); font-weight:500; }

.naa{ position:absolute; left:0; right:0; border-top:1px solid var(--fg); z-index:3; pointer-events:none; }
.naa::before{ content:""; position:absolute; left:-3px; top:-3px; width:6px; height:6px;
  border-radius:var(--r-pill); background:var(--fg); }
.naa span{ position:absolute; right:3px; top:-14px; font-family:var(--mono); font-size:9px;
  color:var(--fg); background:var(--bg); padding:0 3px; }

/* Måned */
.maaned{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border);
  border:1px solid var(--border); margin:var(--s4); border-radius:var(--r); overflow:hidden; }
.mdag{ background:var(--surface); min-height:96px; padding:var(--s2); display:flex;
  flex-direction:column; gap:3px; text-align:left; border:0; cursor:pointer; }
.mdag:hover{ background:var(--soft); }
.mdag .d{ font-family:var(--mono); font-size:12px; font-weight:600; }
.mdag.utenfor .d{ color:var(--mid); }
.mdag.idag .d{ text-decoration:underline; text-underline-offset:3px; }
.mdag .p{ font-family:var(--mono); font-size:10px; color:var(--muted); }
.tetthet{ display:flex; gap:2px; margin-top:auto; }
.tetthet i{ width:5px; height:5px; border-radius:var(--r-pill); background:var(--mid); }
.ukedag{ background:var(--softer); padding:var(--s2); font-family:var(--mono);
  font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:center; }

/* Agenda */
.agenda{ padding:var(--s4); }
.agrad{ display:grid; grid-template-columns:78px minmax(0,1fr) auto; gap:var(--s3);
  width:100%; text-align:left; align-items:center; min-height:var(--tap-lg);
  padding:var(--s3); margin-bottom:var(--s2); background:var(--surface);
  border:1px solid var(--border); border-left:3px solid var(--mid);
  border-radius:var(--r); cursor:pointer; }
.agrad:hover{ border-color:var(--mid); }
.agrad .kl{ font-family:var(--mono); font-size:12px; }
.agrad .t{ font-size:13px; font-weight:600; }
.agrad .s{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.agrad.ledig{ border-style:dashed; border-left-style:dashed; }

.empty{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--s3);
  padding:var(--s6) var(--s5); margin:var(--s4); background:var(--soft);
  border:1px dashed var(--border); border-radius:var(--r); }
.empty h3{ margin:0; font-family:var(--disp); font-size:15px; font-weight:600; }
.empty p{ margin:0; max-width:44ch; font-family:var(--body); font-size:13.5px; color:var(--muted); }

/* Detalj */
.detail{ display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg); }
.dhead{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:var(--s3) var(--s4); border-bottom:1px solid var(--border); }
.dhead .t{ font-family:var(--disp); font-size:13.5px; font-weight:600; }
.dbody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }
.dfoot{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  border-top:1px solid var(--border); background:var(--surface);
  padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom)); }
.dfoot .btn{ flex:1; }
.linje{ display:flex; align-items:baseline; gap:var(--s3); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:12.5px; }
.linje:last-child{ border-bottom:0; }
.linje .k{ color:var(--muted); }
.linje .v{ margin-left:auto; font-family:var(--mono); text-align:right; }
.blokk{ margin-bottom:var(--s4); }
.blokk .flab{ display:block; font-family:var(--mono); font-size:var(--text-label);
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:var(--s2); }
.blokk p{ margin:0; font-family:var(--body); font-size:13.5px; }
.varsel{ display:flex; flex-direction:column; gap:var(--s2); padding:var(--s3) var(--s4);
  background:var(--accent-soft); border:1px solid var(--border);
  border-left:3px solid var(--accent); border-radius:var(--r); margin-bottom:var(--s4);
  font-size:12.5px; }
.why{ margin:var(--s2) 0 0; border:1px solid var(--border); border-radius:var(--r-sm); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s3);
  cursor:pointer; list-style:none; font-size:12px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s2) var(--s3) var(--s3) var(--s5);
  font-family:var(--body); font-size:12.5px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

#detOpen{ display:none; }
#detScrim{ display:none; position:fixed; inset:0; background:var(--scrim); z-index:var(--z-sheet); }
@media (max-width:1180px){
  .app{ grid-template-columns:64px minmax(0,1fr); }
  #detOpen{ display:inline-flex; }
  .detail{ position:fixed; left:0; right:0; bottom:0; z-index:calc(var(--z-sheet) + 1);
    max-height:88vh; background:var(--surface); border-top:1px solid var(--border);
    border-radius:var(--r) var(--r) 0 0; box-shadow:var(--shadow);
    transform:translateY(100%); transition:transform var(--dur-slow) var(--ease);
    padding-bottom:env(safe-area-inset-bottom); }
  .detail::before{ content:""; display:block; width:36px; height:4px; flex:none;
    border-radius:var(--r-pill); background:var(--border); margin:var(--s3) auto var(--s1); }
  body.det-open .detail{ transform:translateY(0); }
  body.det-open #detScrim{ display:block; }
  .dbody{ max-height:56vh; }
}
@media (min-width:1181px){ .detail{ transform:none !important; } }
.toast{ position:fixed; left:50%; bottom:var(--s5); transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:12.5px; }
.btn,.chip,button,[role="button"],summary{ min-height:var(--tap); }
.tag,.num,.eyebrow,.m .v,.tg-tick span,.ev,.mdag,.naa span{ min-height:0; }

</style>
</head>
<body>
<div class="app">

  <nav class="rail" aria-label="Hovednavigasjon">
    <div class="logo">AK<span>.</span></div>
    <button class="rbtn" data-od-id="rail-konsoll" onclick="location.href='agencyos-konsoll-desktop.html'">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Konsoll</button>
    <button class="rbtn" data-od-id="rail-innboks" onclick="location.href='agencyos-innboks.html'">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Innboks
      <span class="cnt num" id="railCount">7</span></button>
    <button class="rbtn" data-od-id="rail-spillere" onclick="location.href='agencyos-spillere.html'">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Spillere</button>
    <button class="rbtn" aria-current="page" data-od-id="rail-kalender">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalender</button>
    <button class="rbtn" data-od-id="rail-workbench" onclick="location.href='workbench-desktop.html'">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h7v6H4zM15 14h5v6h-5z"/></svg>Workbench</button>
  </nav>

  <main class="stage">
    <header class="top">
      <div>
        <h1>Kalender</h1>
        <div class="eyebrow">torsdag 31. juli · din kalender</div>
      </div>
      <div class="visning" role="group" aria-label="Visning">
        <button data-visning="dag" aria-current="true" data-od-id="kal-vis-dag">Dag</button>
        <button data-visning="uke" aria-current="false" data-od-id="kal-vis-uke">Uke</button>
        <button data-visning="maaned" aria-current="false" data-od-id="kal-vis-maaned">Måned</button>
        <button data-visning="agenda" aria-current="false" data-od-id="kal-vis-agenda">Agenda</button>
      </div>
      <span style="flex:1"></span>
      <button class="btn sm" id="detOpen" aria-controls="detail" aria-expanded="false" data-od-id="kal-open-sheet">Se detaljer</button>
      <button class="btn icon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="kal-theme">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>

    <div class="maalrad" id="maal" role="group" aria-label="Belegg og filtre"></div>
    <div class="lerret" id="lerret" aria-label="Kalenderlerret"></div>
  </main>

  <div id="detScrim" data-od-id="kal-scrim"></div>
  <aside class="detail" id="detail" aria-label="Detaljer">
    <div class="dhead"><span class="t" id="dTitle">—</span></div>
    <div class="dbody" id="dBody"></div>
    <div class="dfoot" id="dFoot"></div>
  </aside>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ Kalender · datamodell ═══
   Booking gjelder KUN coachingtjenester. Ressursen i denne kalenderen er
   COACHENS TID — ikke et rom, en bane eller en simulator. Anders kan ikke
   være to steder samtidig; det er hele kollisjonsregelen.
   Simulator vises ALDRI som ressurs eller kolonne (Anders 01.08.2026).
   Sted er anlegget, ikke en enhet i anlegget.
   Kilder: Booking · CoachingSession · CoachAvailability · TrainingPlanSession */

var T_START = 5*60, T_SLUTT = 23*60, SLOT = 30, SLOT_H = 22;
var N_SLOT = (T_SLUTT - T_START) / SLOT;
function min2(s){ var p = String(s).split(':'); return (+p[0])*60 + (+p[1]); }
function klokke(m){ var t = Math.floor(m/60), r = m%60;
  return (t<10?'0':'')+t+':'+(r<10?'0':'')+r; }
function yFor(m){ return (m - T_START) / SLOT * SLOT_H; }
function tid(m){ var t = Math.floor(m/60), r = m%60;
  return t ? (r ? t+' t '+r+' min' : t+' t') : r+' min'; }
function komma(n){ return String(n).replace('.', ','); }

/* Én ressurs: coachens dag. Ingen kolonner per rom eller enhet. */
var DAGKOL = [{k:'dag', n:'Anders Kristiansen', sub:'coachens dag'}];
var DAGER = [{k:0,dw:'man',dd:'28.7'},{k:1,dw:'tir',dd:'29.7'},{k:2,dw:'ons',dd:'30.7'},
             {k:3,dw:'tor',dd:'31.7',idag:true},{k:4,dw:'fre',dd:'1.8'},
             {k:5,dw:'lør',dd:'2.8'},{k:6,dw:'søn',dd:'3.8'}];

/* type: coaching | ledig | holdt | sperret
   «sperret» er egen tid som ikke er bookbar (møte, transport, egen trening).
   `sted` er anlegget. Aldri en enhet i anlegget. */
var EVENTS = [
  {id:'e1', dag:3, fra:'08:00', til:'09:00', type:'coaching',
   tittel:'Øyvind Rohjan', sub:'Innspill · 1:1', selskap:'AK Golf Academy', sted:'Mulligan Indoor'},
  {id:'e2', dag:3, fra:'09:00', til:'10:30', type:'coaching',
   tittel:'WANG · gruppe A', sub:'4 elever · teknikk', selskap:'WANG Toppidrett', sted:'Mulligan Indoor'},
  {id:'e3', dag:3, fra:'11:00', til:'12:00', type:'holdt',
   tittel:'Holdt · prøvetime', sub:'ny spiller · svar innen 48 t', selskap:'Ekstern', sted:'Mulligan Indoor'},
  {id:'e4', dag:3, fra:'12:00', til:'13:00', type:'sperret',
   tittel:'Egen trening', sub:'ikke bookbar', selskap:'—', sted:'Mulligan Indoor'},
  {id:'e5', dag:3, fra:'16:00', til:'17:30', type:'coaching',
   tittel:'Øyvind Rohjan', sub:'Innspill · lengdekontroll', selskap:'AK Golf Academy', sted:'Mulligan Indoor'},
  {id:'e6', dag:3, fra:'16:30', til:'17:30', type:'coaching',
   tittel:'GFGK junior · gruppe', sub:'6 elever · nærspill', selskap:'GFGK Junior', sted:'Mulligan Indoor'},
  {id:'e7', dag:3, fra:'18:00', til:'19:00', type:'ledig',
   tittel:'Ledig coachingtime', sub:'kan bookes', selskap:'—', sted:'Mulligan Indoor'},
  {id:'e8', dag:3, fra:'19:00', til:'20:00', type:'ledig',
   tittel:'Ledig coachingtime', sub:'kan bookes', selskap:'—', sted:'Mulligan Indoor'},
  {id:'e9', dag:2, fra:'15:00', til:'16:00', type:'coaching',
   tittel:'Øyvind Rohjan', sub:'Nærspill', selskap:'AK Golf Academy', sted:'Mulligan Indoor'},
  {id:'e10', dag:4, fra:'10:00', til:'11:30', type:'coaching',
   tittel:'WANG · gruppe B', sub:'5 elever', selskap:'WANG Toppidrett', sted:'Mulligan Indoor'},
  {id:'e11', dag:5, fra:'09:00', til:'13:00', type:'coaching',
   tittel:'Testrunde · 18 hull', sub:'Øyvind · hovedbanen', selskap:'AK Golf Academy', sted:'Gamle Fredrikstad'}
];

var FILTRE = [
  {k:'alle', n:'Alle', f:function(){ return true; }},
  {k:'akademi', n:'Akademi', f:function(e){ return e.selskap === 'AK Golf Academy'; }},
  {k:'wang', n:'WANG', f:function(e){ return e.selskap === 'WANG Toppidrett'; }},
  {k:'gfgk', n:'GFGK', f:function(e){ return e.selskap === 'GFGK Junior'; }},
  {k:'ledig', n:'Ledige timer', f:function(e){ return e.type === 'ledig'; }}
];

var visning = 'dag', filter = 'alle', valgtDag = 3, valgtId = null, lost = false;

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function synlige(){ return EVENTS.filter(FILTRE.filter(function(x){ return x.k === filter; })[0].f); }

/* ── Kollisjon regnes, aldri skrives ────────────────────────────
   Coachen er ressursen. To coachingtimer som overlapper i tid er en kollisjon
   uansett hvor de foregår — Anders kan ikke være to steder samtidig.
   Gruppeøkter er ÉN avtale med flere deltakere, ikke flere avtaler. */
function kollisjoner(){
  var ut = [], e = synlige().filter(function(x){ return x.type === 'coaching'; });
  for (var i = 0; i < e.length; i++){
    for (var j = i+1; j < e.length; j++){
      if (e[i].dag !== e[j].dag) continue;
      var a1 = min2(e[i].fra), a2 = min2(e[i].til), b1 = min2(e[j].fra), b2 = min2(e[j].til);
      if (a1 < b2 && b1 < a2) ut.push({a:e[i], b:e[j], fra:Math.max(a1,b1), til:Math.min(a2,b2)});
    }
  }
  return ut;
}

/* Belegg = booket coachingtid delt på tilgjengelig tid, per dag.
   Sperret tid er ikke tilgjengelig og teller ikke i nevneren. */
function belegg(dag){
  var e = synlige().filter(function(x){ return x.dag === dag; });
  var booket = 0, sperret = 0;
  e.forEach(function(x){
    var d = min2(x.til) - min2(x.fra);
    if (x.type === 'coaching' || x.type === 'holdt') booket += d;
    if (x.type === 'sperret') sperret += d;
  });
  var tilgjengelig = (T_SLUTT - T_START) - sperret;
  return { booket:booket, sperret:sperret, tilgjengelig:tilgjengelig,
           pst: tilgjengelig ? Math.round(booket / tilgjengelig * 100) : 0 };
}

function renderMaal(){
  var b = belegg(valgtDag), k = kollisjoner().filter(function(x){ return x.a.dag === valgtDag; });
  var ledige = synlige().filter(function(e){ return e.dag === valgtDag && e.type === 'ledig'; }).length;
  var w = document.getElementById('maal'); w.innerHTML = '';
  [['belegg', b.pst + ' %', 'torsdag 31.07'],
   ['booket', tid(b.booket), 'coachingtid'],
   ['ledige timer', String(ledige), 'kan bookes'],
   ['kollisjoner', String(k.length), k.length ? 'overlapper i tid' : 'ingen']].forEach(function(p){
    var d = el('div', 'm');
    d.appendChild(el('span', 'k', p[0]));
    d.appendChild(el('span', 'v num', p[1]));
    d.appendChild(el('span', 'w', p[2]));
    w.appendChild(d);
  });
  var f = el('div', 'filtre');
  FILTRE.forEach(function(x){
    var c = el('button', 'chip', x.n);
    c.setAttribute('aria-pressed', String(x.k === filter));
    c.dataset.odId = 'kal-filter-' + x.k;
    c.addEventListener('click', function(){ filter = x.k; render(); });
    f.appendChild(c);
  });
  w.appendChild(f);
}

function tegnAkse(){
  var a = el('div', 'tg-axis');
  for (var k = 0; k <= N_SLOT; k++){
    var m = T_START + k * SLOT;
    var t = el('div', 'tg-tick' + (m % 60 === 0 ? ' hel' : ''));
    t.appendChild(el('span', null, klokke(m)));
    a.appendChild(t);
  }
  a.style.height = (N_SLOT * SLOT_H) + 'px';
  return a;
}

function tegnEvent(e, koll){
  var b = el('button', 'ev ' + e.type + (koll ? ' kollisjon' : ''));
  b.dataset.odId = 'kal-ev-' + e.id;
  b.setAttribute('aria-current', e.id === valgtId ? 'true' : 'false');
  var fra = min2(e.fra), varighet = min2(e.til) - fra;
  b.style.top = yFor(fra) + 'px';
  b.style.height = Math.max(SLOT_H - 2, varighet / SLOT * SLOT_H - 2) + 'px';
  b.appendChild(el('span', 't', e.tittel));
  b.appendChild(el('span', 'm', e.fra + '–' + e.til + ' · ' + tid(varighet)));
  b.addEventListener('click', function(){
    valgtId = e.id; render();
    if (window.matchMedia('(max-width:1180px)').matches) apneDet();
  });
  return b;
}

function tegnGrid(kolonner, hentEvents, hodeTekst){
  var g = el('div', 'tg');
  g.style.gridTemplateColumns = '62px repeat(' + kolonner.length + ', minmax(140px,1fr))';
  g.appendChild(el('div', 'tg-corner'));
  kolonner.forEach(function(c){
    var h = el('div', 'tg-head' + (c.idag ? ' idag' : ''));
    var tx = el('span');
    tx.appendChild(el('span', 'h', c.n || c.dw));
    if (c.dd) tx.appendChild(el('span', 'sub', ' ' + c.dd));
    if (c.sub) tx.appendChild(el('span', 'sub', ' · ' + c.sub));
    h.appendChild(tx);
    if (hodeTekst) h.appendChild(el('span', 'pct num', hodeTekst(c)));
    g.appendChild(h);
  });
  g.appendChild(tegnAkse());
  var koll = kollisjoner();
  kolonner.forEach(function(c){
    var col = el('div', 'tg-col');
    col.style.height = (N_SLOT * SLOT_H) + 'px';
    hentEvents(c).forEach(function(e){
      var erKoll = koll.some(function(x){ return x.a.id === e.id || x.b.id === e.id; });
      col.appendChild(tegnEvent(e, erKoll));
    });
    if (c.idag || (visning === 'dag' && DAGER[valgtDag].idag)){
      var n = el('div', 'naa');
      n.style.top = yFor(9*60 + 12) + 'px';
      n.appendChild(el('span', null, 'nå 09:12'));
      col.appendChild(n);
    }
    g.appendChild(col);
  });
  return g;
}

function renderLerret(){
  var w = document.getElementById('lerret'); w.innerHTML = '';
  var vis = synlige();

  if (visning === 'dag'){
    var dagens = vis.filter(function(e){ return e.dag === valgtDag; });
    if (!dagens.length){ w.appendChild(tomFlate('Ingen avtaler denne dagen',
      'Ingenting er booket torsdag med dette filteret. Ledige coachingtimer legges ut fra Innboks.')); return; }
    w.appendChild(tegnGrid(DAGKOL, function(){ return dagens; }));

  } else if (visning === 'uke'){
    w.appendChild(tegnGrid(DAGER, function(c){
      return vis.filter(function(e){ return e.dag === c.k; }); },
      function(c){ return belegg(c.k).pst + ' %'; }));

  } else if (visning === 'maaned'){
    var m = el('div', 'maaned');
    ['man','tir','ons','tor','fre','lør','søn'].forEach(function(d){
      m.appendChild(el('div', 'ukedag', d)); });
    for (var i = 1; i <= 35; i++){
      var dato = i - 3;
      var d = el('button', 'mdag' + (dato < 1 || dato > 31 ? ' utenfor' : '') + (dato === 31 ? ' idag' : ''));
      d.dataset.odId = 'kal-mdag-' + i;
      d.appendChild(el('span', 'd', dato < 1 ? String(30 + dato) : dato > 31 ? String(dato - 31) : String(dato)));
      var n = (dato === 31) ? vis.filter(function(e){ return e.dag === 3; }).length : (dato > 0 && dato < 32 ? (dato % 4 === 0 ? 3 : dato % 3 === 0 ? 2 : dato % 5 === 0 ? 1 : 0) : 0);
      if (n) d.appendChild(el('span', 'p num', n + ' avtaler'));
      var t = el('span', 'tetthet');
      for (var j = 0; j < n && j < 5; j++) t.appendChild(document.createElement('i'));
      d.appendChild(t);
      d.addEventListener('click', function(){ visning = 'dag'; render(); });
      m.appendChild(d);
    }
    w.appendChild(m);

  } else {
    var a = el('div', 'agenda');
    var dagens2 = vis.filter(function(e){ return e.dag === valgtDag; })
      .sort(function(x,y){ return min2(x.fra) - min2(y.fra); });
    if (!dagens2.length){ w.appendChild(tomFlate('Ingen avtaler denne dagen',
      'Prøv et annet filter, eller legg ut ledige coachingtimer.')); return; }
    dagens2.forEach(function(e){
      var r = el('button', 'agrad' + (e.type === 'ledig' ? ' ledig' : ''));
      r.dataset.odId = 'kal-ag-' + e.id;
      r.appendChild(el('span', 'kl num', e.fra + '–' + e.til));
      var mid = el('span');
      mid.appendChild(el('span', 't', e.tittel));
      mid.appendChild(el('span', 's', e.sub));
      r.appendChild(mid);
      r.appendChild(el('span', 'tag', e.sted));
      r.addEventListener('click', function(){
        valgtId = e.id; render();
        if (window.matchMedia('(max-width:1180px)').matches) apneDet();
      });
      a.appendChild(r);
    });
    w.appendChild(a);
  }
}

function tomFlate(tittel, tekst){
  var e = el('div', 'empty');
  e.appendChild(el('h3', null, tittel));
  e.appendChild(el('p', null, tekst));
  var b = el('button', 'btn', 'Vis alle');
  b.dataset.odId = 'kal-tom-alle';
  b.addEventListener('click', function(){ filter = 'alle'; render(); });
  e.appendChild(b);
  return e;
}

function renderDetalj(){
  var e = EVENTS.filter(function(x){ return x.id === valgtId; })[0];
  var b = document.getElementById('dBody'), foot = document.getElementById('dFoot');
  b.innerHTML = ''; foot.innerHTML = '';
  var koll = kollisjoner();

  if (!e){
    document.getElementById('dTitle').textContent = 'Torsdag 31. juli';
    var bl = belegg(valgtDag);
    var blk = el('div', 'blokk');
    blk.appendChild(el('span', 'flab', 'dagen'));
    [['Belegg', bl.pst + ' %'], ['Booket coachingtid', tid(bl.booket)],
     ['Sperret egen tid', tid(bl.sperret)], ['Tilgjengelig', tid(bl.tilgjengelig)]].forEach(function(p){
      var l = el('div', 'linje');
      l.appendChild(el('span', 'k', p[0]));
      l.appendChild(el('span', 'v', p[1]));
      blk.appendChild(l);
    });
    b.appendChild(blk);
    var wd = el('details', 'why'); wd.dataset.odId = 'kal-why-belegg';
    wd.appendChild(el('summary', null, 'Hvorfor dette tallet'));
    var ul = document.createElement('ul');
    ['Kilde: alle avtaler torsdag 31.07 i din kalender, filtrert på «' +
       FILTRE.filter(function(x){ return x.k === filter; })[0].n.toLowerCase() + '».',
     'Beregning: booket coachingtid delt på tilgjengelig tid. Tilgjengelig = 18 timer minus sperret egen tid.',
     'Forbehold: holdte luker teller som booket. Ledige timer teller ikke — de er en mulighet, ikke en avtale.']
     .forEach(function(t){ ul.appendChild(el('li', null, t)); });
    wd.appendChild(ul);
    b.appendChild(wd);
    var p = el('p', 'blokk');
    p.style.fontFamily = 'var(--body)'; p.style.fontSize = '12.5px'; p.style.color = 'var(--muted)';
    p.textContent = 'Velg en avtale i lerretet for å se den her.';
    b.appendChild(p);
    return;
  }

  document.getElementById('dTitle').textContent = e.tittel;
  var erKoll = koll.filter(function(x){ return x.a.id === e.id || x.b.id === e.id; })[0];
  if (erKoll && !lost){
    var v = el('div', 'varsel');
    v.appendChild(el('span', null, 'Kollisjon i din kalender — «' + erKoll.a.tittel +
      '» og «' + erKoll.b.tittel + '» overlapper ' +
      klokke(erKoll.fra) + '–' + klokke(erKoll.til) + '. Du kan ikke ta begge.'));
    b.appendChild(v);
  }

  var blk2 = el('div', 'blokk');
  blk2.appendChild(el('span', 'flab', 'avtalen'));
  [['Tid', e.fra + '–' + e.til], ['Varighet', tid(min2(e.til) - min2(e.fra))],
   ['Sted', e.sted],
   ['Type', e.type === 'coaching' ? 'Coachingtime' : e.type === 'ledig' ? 'Ledig coachingtime'
     : e.type === 'holdt' ? 'Holdt luke' : 'Sperret egen tid'],
   ['Selskap', e.selskap], ['Innhold', e.sub]].forEach(function(p){
    var l = el('div', 'linje');
    l.appendChild(el('span', 'k', p[0]));
    l.appendChild(el('span', 'v', p[1]));
    blk2.appendChild(l);
  });
  b.appendChild(blk2);

  if (e.type === 'ledig'){
    var n = el('div', 'blokk');
    n.appendChild(el('span', 'flab', 'merk'));
    n.appendChild(el('p', null,
      'Dette er en bookbar coachingtime, ikke utleie av simulator. Simulatortid selges ikke.'));
    b.appendChild(n);
  }

  /* Én ting nå: kollisjonen. Løsningen flytter faktisk hendelsen. */
  if (erKoll && !lost){
    /* Løsningen flytter i TID — den eneste dimensjonen som finnes når
       coachen er ressursen. Ny tid regnes fra første ledige luke etter
       den lengste av de to avtalene. */
    var flytt = erKoll.b;
    var nyFra = Math.max(min2(erKoll.a.til), min2(erKoll.b.fra));
    var lengde = min2(flytt.til) - min2(flytt.fra);
    var fix = el('button', 'btn now', 'Flytt til ' + klokke(nyFra) + '–' + klokke(nyFra + lengde));
    fix.dataset.odId = 'kal-los-kollisjon';
    fix.addEventListener('click', function(){
      flytt.fra = klokke(nyFra); flytt.til = klokke(nyFra + lengde);
      lost = true; valgtId = flytt.id;
      render();
      si('Kollisjonen er løst. ' + flytt.tittel + ' er flyttet til ' + flytt.fra +
         '. Belegget er regnet på nytt.');
      toast('Flyttet til ' + flytt.fra);
    });
    foot.appendChild(fix);
  } else if (e.type === 'ledig'){
    var bk = el('button', 'btn ink', 'Legg ut i booking');
    bk.dataset.odId = 'kal-book';
    bk.addEventListener('click', function(){ toast('Luka er lagt ut som bookbar coachingtime.'); });
    foot.appendChild(bk);
  } else {
    var sp = el('a', 'btn ink', 'Åpne spiller');
    sp.href = 'spillerprofil.html'; sp.dataset.odId = 'kal-spiller';
    foot.appendChild(sp);
  }
}

var detEl = document.getElementById('detail'), detScrim = document.getElementById('detScrim'),
    detBtn = document.getElementById('detOpen'), detFokus = null;
function erArk(){ return window.matchMedia('(max-width:1180px)').matches; }
function apneDet(){ if (!erArk()) return;
  detFokus = document.activeElement;
  document.body.classList.add('det-open');
  detBtn.setAttribute('aria-expanded','true');
  detEl.setAttribute('role','dialog'); detEl.setAttribute('aria-modal','true');
  var f = detEl.querySelector('button, a, summary'); if (f) f.focus(); }
function lukkDet(){ document.body.classList.remove('det-open');
  detBtn.setAttribute('aria-expanded','false');
  detEl.removeAttribute('role'); detEl.removeAttribute('aria-modal');
  if (detFokus && detFokus.focus) detFokus.focus(); }
detBtn.addEventListener('click', function(){
  document.body.classList.contains('det-open') ? lukkDet() : apneDet(); });
detScrim.addEventListener('click', lukkDet);
detEl.addEventListener('keydown', function(ev){
  if (ev.key !== 'Tab' || !document.body.classList.contains('det-open')) return;
  var f = detEl.querySelectorAll('button, a, summary'); if (!f.length) return;
  var first = f[0], last = f[f.length-1];
  if (ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); } });
window.addEventListener('resize', function(){
  if (!erArk() && document.body.classList.contains('det-open')) lukkDet(); });
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && document.body.classList.contains('det-open')){ ev.preventDefault(); lukkDet(); } });

document.querySelectorAll('.visning button').forEach(function(b){
  b.addEventListener('click', function(){
    visning = b.dataset.visning;
    document.querySelectorAll('.visning button').forEach(function(x){ x.setAttribute('aria-current','false'); });
    b.setAttribute('aria-current','true');
    render();
    si('Visning byttet til ' + b.textContent + '.');
  });
});

var KEY = 'akhq-theme-agencyos';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

function render(){ renderMaal(); renderLerret(); renderDetalj(); }

/* Dagens ene handling skal være synlig ved ankomst. Finnes en kollisjon,
   er DEN dagens ene handling — og da skal den valgte avtalen være den som
   kolliderer, ikke ingenting. Uten dette åpner kalenderen med null clay
   og en uløst kollisjon i lerretet. */
(function forsteHandling(){
  var k = kollisjoner();
  if (k.length) valgtId = k[0].b.id;
})();
render();
})();

</script>

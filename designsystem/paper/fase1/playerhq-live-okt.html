<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live-økt · PlayerHQ · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
:root {
  --bg: #faf9f5;
  --surface: #ffffff;
  --soft: #f0eee6;
  --soft-hover: #e8e6dc;
  --surface-warm: #e3dacc;
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;
  --hairline: #d1cfc5;
  --inverse: #000000;

  --fg: #141413;
  --ink-soft: #3d3d3a;
  --muted: #5e5d59;
  --mid: #b0aea5;
  --text-tertiary: #87867f;

  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);
  --rail-active: rgba(250, 249, 245, 0.14);

  --cta: #141413;
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;
  --on-accent: #141413;
  --accent-deep: #c6613f;

  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  --up: #63784a;
  --up-raw: #788c5d;
  --dn: #a85536;
  --info: #46719f;
  --info-raw: #6a9bcc;

  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;
  --text-body-player: 14px;
  --text-label: 10px;
  --text-kpi: 40px;

  --text-hero: 56px;
  --text-section: 40px;
  --text-prose: 18px;
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;

  --r-none: 0px;
  --r-sm: 8px;
  --r: 12px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;

  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;

  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }
/* ═══ PlayerHQ · Live-økt (UNDER i sløyfa) ═══
   Gjennomføre-flyten, skjerm 2 av 3: brief → live → oppsummering.
   Brukes PÅ rangen med én hånd — store treffmål, tre moduser:
   Sjekkliste (hva gjenstår) · Reps (telle slag) · Logg (notere).

   Ingenting sperrer: å hoppe over en drill, avslutte tidlig eller
   trene forbi planen er lov. Avvik forklares i ETTER, aldri hindres. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; color:inherit; text-decoration:none; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.loop{ flex:none; display:flex; align-items:stretch; gap:var(--s1);
  padding:var(--s2) var(--s4); border-bottom:1px solid var(--border);
  background:var(--surface); overflow-x:auto; scrollbar-width:none; }
.loop::-webkit-scrollbar{ display:none; }
.loop a{ flex:1; min-height:var(--tap); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px; text-decoration:none;
  color:var(--muted); font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; border-radius:var(--r-sm); }
.loop a small{ font-family:var(--ui); font-size:10px; letter-spacing:0;
  text-transform:none; color:var(--mid); }
.loop a[aria-current="step"]{ color:var(--fg); box-shadow:inset 0 -2px 0 0 var(--fg); }
.loop .arw{ align-self:center; color:var(--mid); font-family:var(--mono); font-size:11px; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(96px + env(safe-area-inset-bottom)); }

/* Øktklokka — mono, tabulære tall. Pause er informasjon, ikke sperre. */
.klokke{ display:flex; align-items:center; gap:var(--s3);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s3) var(--s4); margin-bottom:var(--s4); }
.klokke .t{ font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:40px; font-weight:500; line-height:1; }
.klokke .m{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.klokke.pauset .t{ color:var(--muted); }

/* Modusveksler: Sjekkliste · Reps · Logg */
.moduser{ display:flex; gap:var(--s1); background:var(--soft);
  border:1px solid var(--border); border-radius:var(--r); padding:var(--s1);
  margin-bottom:var(--s4); }
.moduser button{ flex:1; min-height:var(--tap); border:0; background:transparent;
  border-radius:var(--r-sm); font-size:13px; font-weight:500; cursor:pointer;
  color:var(--muted); }
.moduser button[aria-pressed="true"]{ background:var(--surface); color:var(--fg);
  box-shadow:var(--shadow); border:1px solid var(--border); }

/* Sjekkliste */
.sjekk{ display:flex; align-items:flex-start; gap:var(--s3); width:100%;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s3); margin-bottom:var(--s2); text-align:left; }
.sjekk .tick{ flex:none; width:var(--tap); height:var(--tap); display:grid;
  place-items:center; border:1px solid var(--border); border-radius:var(--r-pill);
  background:transparent; cursor:pointer; }
.sjekk .tick svg{ width:18px; height:18px; fill:none; stroke:var(--mid);
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.sjekk .tick[aria-pressed="true"]{ background:var(--soft); border-color:var(--up); }
.sjekk .tick[aria-pressed="true"] svg{ stroke:var(--up); }
.sjekk .inn{ min-width:0; flex:1; }
.sjekk .dn{ display:block; font-size:13.5px; font-weight:600; }
.sjekk.ferdig .dn{ text-decoration:line-through; color:var(--muted); }
.sjekk .dm{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.sjekk .df{ display:block; font-family:var(--mono); font-size:9.5px; color:var(--mid);
  margin-top:var(--s1); word-break:break-all; }
.sjekk .tell{ flex:none; align-self:center; }

/* Rep-telling — store treffmål for én hånd på rangen */
.repvelger{ display:flex; gap:var(--s2); overflow-x:auto; scrollbar-width:none;
  margin-bottom:var(--s3); padding-bottom:2px; }
.repvelger::-webkit-scrollbar{ display:none; }
.repvelger button{ flex:none; min-height:var(--tap); padding:0 var(--s3);
  border:1px solid var(--border); border-radius:var(--r-pill); background:var(--surface);
  font-size:12.5px; cursor:pointer; color:var(--muted); }
.repvelger button[aria-pressed="true"]{ background:var(--fg); color:var(--bg);
  border-color:var(--fg); }
.repkort{ background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:var(--s4); margin-bottom:var(--s4); }
.repkort .status{ display:flex; align-items:baseline; gap:var(--s3);
  margin-bottom:var(--s3); flex-wrap:wrap; }
.repkort .status .stor{ font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:40px; font-weight:500; line-height:1; }
.repkort .status .av{ font-family:var(--mono); font-size:13px; color:var(--muted); }
.tappere{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); }
.tapper{ min-height:88px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; border:1px solid var(--border);
  border-radius:var(--r); background:var(--soft); cursor:pointer;
  font-family:var(--disp); font-size:15px; font-weight:600; }
.tapper:active{ background:var(--soft-hover); transform:translateY(1px); }
.tapper small{ font-family:var(--mono); font-size:10px; font-weight:400;
  color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.tapper.treff{ border-color:var(--up); }
.angre{ margin-top:var(--s2); }
/* Hurtigtapp +5/+10/+25 (20.08.2026) */
.hurtig{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2); margin-top:var(--s2); }
.hurtig button{ min-height:56px; border:1px solid var(--border); border-radius:var(--r);
  background:var(--surface); font-family:var(--mono); font-size:15px; font-weight:600; cursor:pointer; }
.hurtig button:active{ background:var(--soft-hover); transform:translateY(1px); }
/* FYS-serielogging */
.settrad{ display:flex; align-items:baseline; gap:var(--s3); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-family:var(--mono); font-size:13px; }
.settrad:last-child{ border-bottom:0; }
.settrad .sv{ margin-left:auto; }
.juster{ display:flex; align-items:center; gap:var(--s2); }
.juster button{ width:var(--tap); height:var(--tap); display:grid; place-items:center;
  border:1px solid var(--border); border-radius:var(--r-sm); background:var(--surface);
  font-family:var(--mono); font-size:16px; cursor:pointer; }
.juster .jv{ font-family:var(--mono); font-size:15px; font-weight:600; min-width:5ch; text-align:center; }
.juster .jl{ font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); min-width:34px; }
/* Kondisjon · sone-segmenter */
.sone{ display:flex; gap:var(--s1); }
.sone button{ flex:1; min-height:var(--tap); border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface); font-family:var(--mono); font-size:12.5px; cursor:pointer; color:var(--muted); }
.sone button[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
.segknapper{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2); margin-top:var(--s2); }
.segknapper button{ min-height:56px; border:1px solid var(--border); border-radius:var(--r);
  background:var(--surface); font-size:13.5px; font-weight:600; cursor:pointer; }
.segknapper button[aria-pressed="true"]{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.segrad{ display:flex; gap:var(--s3); padding:var(--s2) 0; border-bottom:1px solid var(--border-soft);
  font-family:var(--mono); font-size:12.5px; }
.segrad:last-child{ border-bottom:0; }
.segrad .sv{ margin-left:auto; }

/* Logg */
.loggfelt{ width:100%; min-height:110px; padding:var(--s3); font-family:var(--body);
  font-size:15px; background:var(--surface); color:var(--fg);
  border:1px solid var(--border); border-radius:var(--r); resize:vertical; }
.notat{ border:1px solid var(--border); border-radius:var(--r); background:var(--surface);
  padding:var(--s3); margin-top:var(--s2); font-family:var(--body); font-size:13.5px; }
.notat .nt{ display:block; font-family:var(--mono); font-size:10px; color:var(--muted);
  margin-bottom:2px; }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s4); }

.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.tom .valg{ display:flex; flex-direction:column; gap:var(--s2); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s2); animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }

.why{ margin:var(--s3) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

.dokk{ position:absolute; left:0; right:0; bottom:0;
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 70%, transparent); }
@media (min-width:1024px){ .dokk{ position:sticky; background:var(--bg);
  border-top:1px solid var(--border); } .dokk .btn{ max-width:720px; margin:0 auto; display:flex; } }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,summary,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow,.sjekk .df{ min-height:0; }
</style>
</head>
<body>
<p class="framehint">PlayerHQ · Live-økt · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">
    <a class="ikon" href="playerhq-live-brief.html" aria-label="Til før økta" data-od-id="live-tilbake">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="min-width:0">
      <h1>Økta pågår</h1>
      <span class="sub">Innspill · lengdekontroll · Gamle Fredrikstad GK</span>
    </div>
    <span style="flex:1"></span>
    <!-- demo-bryter · fjernes før koding -->
    <div data-demo-only="true" style="display:flex;gap:4px">
      <button class="ikon" data-tilstand="fylt" aria-pressed="true" aria-label="Demo: suksess" data-od-id="live-demo-fylt"><span class="num" style="font-size:10px">F</span></button>
      <button class="ikon" data-tilstand="tom" aria-pressed="false" aria-label="Demo: tom" data-od-id="live-demo-tom"><span class="num" style="font-size:10px">T</span></button>
      <button class="ikon" data-tilstand="laster" aria-pressed="false" aria-label="Demo: laster" data-od-id="live-demo-laster"><span class="num" style="font-size:10px">L</span></button>
      <button class="ikon" data-tilstand="feil" aria-pressed="false" aria-label="Demo: feil" data-od-id="live-demo-feil"><span class="num" style="font-size:10px">E</span></button>
    </div>
    <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="live-theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <nav class="loop" aria-label="Sløyfen før, under og etter økta">
    <a href="playerhq-live-brief.html" data-od-id="live-loop-for">FØR<small>planlegg</small></a>
    <span class="arw" aria-hidden="true">→</span>
    <a href="playerhq-live-okt.html" aria-current="step" data-od-id="live-loop-under">UNDER<small>live-økt</small></a>
    <span class="arw" aria-hidden="true">→</span>
    <a href="playerhq-live-summary.html" data-od-id="live-loop-etter">ETTER<small>oppsummer</small></a>
  </nav>

  <main class="kropp" id="kropp"></main>
  <div class="dokk" id="dokk"></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ PlayerHQ · Live-økt · datamodell ═══
   Kilder: TrainingPlanSession (økta + drills) · TrainingLog (reps,
   treff og notater skrives hit fortløpende — lagres lokalt først,
   synkes når nettet er der) · IUP (målet).
   AK-formel v2. Ingen L-fase, ingen CS, ingen M0–M5/PR1–PR5.
   Økta er o2 fra workbench-desktop.html — samme data, samme formler.
   Demo-kanon: Øyvind Rohjan. */

var OKT = {
  navn:'Innspill · lengdekontroll', start:'15:00',
  maal:'Ni av tolv innenfor fire meter fra 50–100 m.',
  drills:[
    { navn:'Halv sving · kalibrering', type:'golf', repsMaal:15, tidMin:30,
      f:'TEK_INNSPILL_50_UTEN_BALL_INNENDORS_ALENE', done:true,  reps:15, treff:0 },
    { navn:'Avstandsstige 50–100 m', type:'golf', repsMaal:30, tidMin:35,
      f:'TEK_INNSPILL_50_LAV_HAST_TRENINGSOMRADE_ALENE', done:false, reps:18, treff:11 },
    { navn:'Én ball · én sjanse', type:'golf', repsMaal:12, tidMin:25,
      f:'SLAG_INNSPILL_100_AUTO_BANE_KONKURRANSE', done:false, reps:0, treff:0 },
    /* Spontane drills (20.08.2026) — lagt til av spilleren underveis.
       FYS-serielogging: reps + vekt per sett. Kondisjon: sone-segmenter. */
    { navn:'Styrke · markløft', type:'fys', spontan:true, tidMin:15,
      f:'FYS_STYRKE_TRENINGSOMRADE_ALENE', done:false,
      sett:[{reps:8,vekt:60},{reps:8,vekt:70}], nesteReps:8, nesteVekt:70 },
    { navn:'Kondisjon · intervall', type:'kond', spontan:true, tidMin:20,
      f:'FYS_KONDISJON_TRENINGSOMRADE_ALENE', done:false,
      segmenter:[{typ:'Oppvarming',sone:1,sek:600},{typ:'Drag',sone:4,sek:240},{typ:'Hvile',sone:1,sek:120}],
      aktivTyp:'Drag', aktivSone:4, aktivSek:132 }
  ]
};
var NOTATER = [];

var tilstand = 'fylt', modus = 'sjekk', valgtDrill = 1, pauset = false;
var liveSecs = 22 * 60 + 14, pauseSecs = 3 * 60 + 40, klokkeInt = null;

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function mmss(s){ var m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0'); }

/* Øktklokka. Pause stopper telleren — aldri økta. */
function startKlokke(){
  stopKlokke();
  klokkeInt = setInterval(function(){
    if (!pauset){ liveSecs++;
      var t = document.getElementById('klokkeT');
      if (t) t.textContent = mmss(liveSecs); }
    else { pauseSecs++; }
  }, 1000);
}
function stopKlokke(){ if (klokkeInt){ clearInterval(klokkeInt); klokkeInt = null; } }

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';
  var dokk = document.getElementById('dokk'); dokk.innerHTML = '';

  if (tilstand === 'laster'){
    stopKlokke();
    for (var i = 0; i < 7; i++){ var s = el('div', 'skel'); s.style.width = (95 - i*7) + '%'; w.appendChild(s); }
    return;
  }
  if (tilstand === 'tom'){
    stopKlokke();
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Ingen økt pågår'));
    t.appendChild(el('p', null,
      'Du har ikke startet noen økt. Dagens økt ligger klar under FØR — ' +
      'eller du kan trene fritt og logge etterpå.'));
    var v = el('div', 'valg');
    /* Kontrakt §3: i tom tilstand er start skjermens ene aksenthandling. */
    var st = el('a', 'btn now full', 'Start dagens økt');
    st.href = 'playerhq-live-brief.html'; st.dataset.odId = 'live-tom-start';
    var pl = el('a', 'btn full', 'Åpne planen');
    pl.href = 'playerhq-plan.html'; pl.dataset.odId = 'live-tom-plan';
    v.appendChild(st); v.appendChild(pl);
    t.appendChild(v); w.appendChild(t); return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Mistet forbindelsen'));
    f.appendChild(el('p', null,
      'Alt du teller og noterer lagres på telefonen og synkes når nettet er ' +
      'tilbake. Fortsett å trene — ingenting går tapt.'));
    /* Kontrakt §3: i feiltilstand er «Prøv igjen» skjermens ene aksenthandling. */
    var fb = el('button', 'btn now full', 'Prøv igjen'); fb.dataset.odId = 'live-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f); return;
  }

  /* ── Suksess: økt pågår ── */
  startKlokke();

  var kl = el('div', 'klokke' + (pauset ? ' pauset' : ''));
  var kt = el('span', 't num', mmss(liveSecs)); kt.id = 'klokkeT';
  kl.appendChild(kt);
  var km = el('div');
  km.appendChild(el('span', 'm', 'startet ' + OKT.start + ' · planlagt 1 t 30 min' +
    (pauseSecs ? ' · pause ' + mmss(pauseSecs) : '')));
  kl.appendChild(km);
  var sp = el('span'); sp.style.flex = '1'; kl.appendChild(sp);
  var pb = el('button', 'btn sm', pauset ? 'Fortsett' : 'Pause');
  pb.dataset.odId = 'live-pause';
  pb.addEventListener('click', function(){
    pauset = !pauset; render();
    si(pauset ? 'Klokka er pauset. Økta står åpen.' : 'Klokka går igjen.');
  });
  kl.appendChild(pb);
  w.appendChild(kl);

  /* Modusveksler */
  var mv = el('div', 'moduser');
  [['sjekk','Sjekkliste'],['reps','Reps'],['logg','Logg']].forEach(function(p){
    var b = el('button', null, p[1]);
    b.setAttribute('aria-pressed', String(modus === p[0]));
    b.dataset.odId = 'live-modus-' + p[0];
    b.addEventListener('click', function(){ modus = p[0]; render(); });
    mv.appendChild(b);
  });
  w.appendChild(mv);

  if (modus === 'sjekk') renderSjekk(w);
  else if (modus === 'reps') renderReps(w);
  else renderLogg(w);

  /* Kontrakt §3: skjermens ene aksenthandling — avslutter og går til ETTER. */
  var slutt = el('button', 'btn now full', 'Avslutt og logg økta');
  slutt.dataset.odId = 'live-avslutt';
  slutt.addEventListener('click', function(){ location.href = 'playerhq-live-summary.html'; });
  dokk.appendChild(slutt);
}

/* ── Sjekkliste ── */
function renderSjekk(w){
  var ferdig = OKT.drills.filter(function(d){ return d.done; }).length;
  w.appendChild(el('div', 'eyebrow', 'drills · ' + ferdig + ' av ' + OKT.drills.length + ' gjennomført'));
  var liste = el('div'); liste.style.marginTop = 'var(--s2)';
  OKT.drills.forEach(function(d, i){
    var r = el('div', 'sjekk' + (d.done ? ' ferdig' : ''));
    var tick = el('button', 'tick');
    tick.setAttribute('aria-pressed', String(d.done));
    tick.setAttribute('aria-label', (d.done ? 'Fjern hake: ' : 'Marker gjennomført: ') + d.navn);
    tick.dataset.odId = 'live-sjekk-' + i;
    tick.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
    tick.addEventListener('click', function(){
      d.done = !d.done; render();
      si(d.navn + (d.done ? ' er merket gjennomført.' : ' er ikke lenger merket.'));
    });
    var inn = el('div', 'inn');
    inn.appendChild(el('span', 'dn', d.navn + (d.spontan ? ' · spontan' : '')));
    var dmTxt = d.type === 'fys' ? d.sett.length + ' sett logget · ' + d.tidMin + ' min'
      : d.type === 'kond' ? d.segmenter.length + ' segmenter · ' + d.tidMin + ' min'
      : d.reps + ' av ' + d.repsMaal + ' reps · ' + d.tidMin + ' min';
    inn.appendChild(el('span', 'dm', dmTxt));
    inn.appendChild(el('span', 'df', d.f));
    var tell = el('button', 'btn sm tell', 'Tell');
    tell.dataset.odId = 'live-tell-' + i;
    tell.setAttribute('aria-label', 'Tell reps for ' + d.navn);
    tell.addEventListener('click', function(){ valgtDrill = i; modus = 'reps'; render(); });
    r.appendChild(tick); r.appendChild(inn); r.appendChild(tell);
    liste.appendChild(r);
  });
  w.appendChild(liste);

  /* Spontan drill — spilleren utvider økta underveis. Aldri en sperre. */
  var spont = el('button', 'btn full', 'Legg til spontan drill');
  spont.dataset.odId = 'live-spontan-drill';
  spont.style.marginTop = 'var(--s2)';
  spont.addEventListener('click', function(){
    OKT.drills.push({ navn:'Spontan · putt 3–5 fot', type:'golf', spontan:true, repsMaal:20,
      tidMin:10, f:'SLAG_PUTT_3_5_TRENINGSOMRADE_ALENE', done:false, reps:0, treff:0 });
    valgtDrill = OKT.drills.length - 1; modus = 'reps'; render();
    si('Spontan drill lagt til. Telleren står klar.');
  });
  w.appendChild(spont);

  var hint = el('p', 'prose'); hint.style.cssText = 'font-size:12.5px;color:var(--muted);margin:var(--s3) 0 0';
  hint.textContent = 'Å hoppe over en drill er lov. Det du ikke rekker, følger med til oppsummeringen som avvik — ikke som feil.';
  w.appendChild(hint);
}

/* ── Rep-telling ── */
function renderReps(w){
  var velger = el('div', 'repvelger');
  velger.setAttribute('role', 'group'); velger.setAttribute('aria-label', 'Velg drill');
  OKT.drills.forEach(function(d, i){
    var b = el('button', null, d.navn);
    b.setAttribute('aria-pressed', String(i === valgtDrill));
    b.dataset.odId = 'live-repdrill-' + i;
    b.addEventListener('click', function(){ valgtDrill = i; render(); });
    velger.appendChild(b);
  });
  w.appendChild(velger);

  var d = OKT.drills[valgtDrill];
  if (d.type === 'fys'){ renderFys(w, d); return; }
  if (d.type === 'kond'){ renderKond(w, d); return; }
  var k = el('div', 'repkort');
  k.appendChild(el('div', 'eyebrow', d.navn));
  var st = el('div', 'status');
  var stor = el('span', 'stor num', String(d.reps));
  var av = el('span', 'av', 'av ' + d.repsMaal + ' reps' +
    (d.treff ? ' · ' + d.treff + ' innenfor 4 m' : ''));
  st.appendChild(stor); st.appendChild(av); k.appendChild(st);

  var tp = el('div', 'tappere');
  var t1 = el('button', 'tapper');
  t1.dataset.odId = 'live-tap-rep';
  t1.appendChild(document.createTextNode('+1'));
  t1.appendChild(el('small', null, 'rep'));
  t1.addEventListener('click', function(){
    d.reps++; render(); si(d.reps + ' reps på ' + d.navn + '.'); });
  var t2 = el('button', 'tapper treff');
  t2.dataset.odId = 'live-tap-treff';
  t2.appendChild(document.createTextNode('+1'));
  t2.appendChild(el('small', null, 'innenfor 4 m'));
  t2.addEventListener('click', function(){
    d.reps++; d.treff++; render();
    si(d.treff + ' innenfor av ' + d.reps + ' slag.'); });
  tp.appendChild(t1); tp.appendChild(t2); k.appendChild(tp);

  /* Hurtigtapp: slo du en kurv uten å telle, tar du dem i bolker. */
  var hu = el('div', 'hurtig'); hu.setAttribute('role', 'group'); hu.setAttribute('aria-label', 'Legg til flere reps');
  [5, 10, 25].forEach(function(n){
    var b = el('button', null, '+' + n);
    b.dataset.odId = 'live-tap-' + n;
    b.addEventListener('click', function(){ d.reps += n; render(); si(d.reps + ' reps på ' + d.navn + '.'); });
    hu.appendChild(b);
  });
  k.appendChild(hu);

  var angre = el('button', 'btn sm full angre', 'Angre siste');
  angre.dataset.odId = 'live-angre';
  angre.addEventListener('click', function(){
    if (d.reps > 0){ if (d.treff >= d.reps) d.treff--; d.reps--; render(); si('Siste rep er fjernet.'); }
    else toast('Ingenting å angre.');
  });
  k.appendChild(angre);
  w.appendChild(k);

  /* Målet + «Hvorfor dette tallet» — alltid synlig der det telles */
  var mk = el('div', 'kort');
  mk.appendChild(el('div', 'eyebrow', 'mål i dag'));
  mk.appendChild(el('p', 'prose', OKT.maal)).style.margin = '0';
  var wd = el('details', 'why'); wd.dataset.odId = 'live-why-maal';
  wd.appendChild(el('summary', null, 'Hvorfor dette tallet'));
  var ul = document.createElement('ul');
  ['Kilde: økta 30.07 — 7 av 12 innenfor 4 m på samme drill.',
   'Beregning: målet er sist gang pluss to.',
   'Forbehold: foreslått fra IUP-en din, aldri låst. Telle uten mål er også lov.']
   .forEach(function(x){ ul.appendChild(el('li', null, x)); });
  wd.appendChild(ul); mk.appendChild(wd);
  w.appendChild(mk);
}

/* ── FYS-serielogging: reps + vekt per sett ── */
function renderFys(w, d){
  var k = el('div', 'repkort');
  k.appendChild(el('div', 'eyebrow', d.navn + ' · serielogging'));
  var st = el('div', 'status');
  st.appendChild(el('span', 'stor num', String(d.sett.length)));
  st.appendChild(el('span', 'av', 'sett logget'));
  k.appendChild(st);
  var jr = el('div', 'juster'); jr.style.marginBottom = 'var(--s2)';
  jr.appendChild(el('span', 'jl', 'reps'));
  var rm = el('button', null, '−'); rm.setAttribute('aria-label', 'Færre reps'); rm.dataset.odId = 'live-fys-reps-ned';
  var rv = el('span', 'jv num', String(d.nesteReps));
  var rp = el('button', null, '+'); rp.setAttribute('aria-label', 'Flere reps'); rp.dataset.odId = 'live-fys-reps-opp';
  rm.addEventListener('click', function(){ if (d.nesteReps > 1){ d.nesteReps--; rv.textContent = String(d.nesteReps); } });
  rp.addEventListener('click', function(){ d.nesteReps++; rv.textContent = String(d.nesteReps); });
  jr.appendChild(rm); jr.appendChild(rv); jr.appendChild(rp);
  k.appendChild(jr);
  var jv2 = el('div', 'juster'); jv2.style.marginBottom = 'var(--s3)';
  jv2.appendChild(el('span', 'jl', 'vekt'));
  var vm = el('button', null, '−'); vm.setAttribute('aria-label', 'Lavere vekt'); vm.dataset.odId = 'live-fys-vekt-ned';
  var vv = el('span', 'jv num', d.nesteVekt.toLocaleString('nb-NO') + ' kg');
  var vp = el('button', null, '+'); vp.setAttribute('aria-label', 'Høyere vekt'); vp.dataset.odId = 'live-fys-vekt-opp';
  vm.addEventListener('click', function(){ if (d.nesteVekt > 2.5){ d.nesteVekt -= 2.5; vv.textContent = d.nesteVekt.toLocaleString('nb-NO') + ' kg'; } });
  vp.addEventListener('click', function(){ d.nesteVekt += 2.5; vv.textContent = d.nesteVekt.toLocaleString('nb-NO') + ' kg'; });
  jv2.appendChild(vm); jv2.appendChild(vv); jv2.appendChild(vp);
  k.appendChild(jv2);
  var logg = el('button', 'tapper', null); logg.style.width = '100%';
  logg.appendChild(document.createTextNode('Logg sett'));
  logg.appendChild(el('small', null, d.nesteReps + ' reps · ' + d.nesteVekt.toLocaleString('nb-NO') + ' kg'));
  logg.dataset.odId = 'live-fys-logg-sett';
  logg.addEventListener('click', function(){
    d.sett.push({ reps:d.nesteReps, vekt:d.nesteVekt }); render();
    si('Sett ' + d.sett.length + ' logget: ' + d.nesteReps + ' reps på ' + d.nesteVekt.toLocaleString('nb-NO') + ' kg.');
  });
  k.appendChild(logg);
  w.appendChild(k);
  if (d.sett.length){
    var lk = el('div', 'kort');
    lk.appendChild(el('div', 'eyebrow', 'sett i denne økta'));
    d.sett.forEach(function(s2, i){
      var r2 = el('div', 'settrad');
      r2.appendChild(el('span', null, 'Sett ' + (i + 1)));
      r2.appendChild(el('span', 'sv num', s2.reps + ' × ' + s2.vekt.toLocaleString('nb-NO') + ' kg'));
      lk.appendChild(r2);
    });
    w.appendChild(lk);
  }
}

/* ── Kondisjon: Timer → Oppvarming → Drag → Hvile → Sone 1–5 ── */
function renderKond(w, d){
  var k = el('div', 'repkort');
  k.appendChild(el('div', 'eyebrow', d.navn + ' · pågående segment'));
  var st = el('div', 'status');
  st.appendChild(el('span', 'stor num', mmss(d.aktivSek)));
  st.appendChild(el('span', 'av', d.aktivTyp.toLowerCase() + ' · sone ' + d.aktivSone));
  k.appendChild(st);
  var sk = el('div', 'segknapper'); sk.setAttribute('role', 'group'); sk.setAttribute('aria-label', 'Segmenttype');
  ['Oppvarming', 'Drag', 'Hvile'].forEach(function(typ){
    var b = el('button', null, typ);
    b.setAttribute('aria-pressed', String(d.aktivTyp === typ));
    b.dataset.odId = 'live-kond-' + typ.toLowerCase();
    b.addEventListener('click', function(){
      if (d.aktivTyp === typ) return;
      d.segmenter.push({ typ:d.aktivTyp, sone:d.aktivSone, sek:d.aktivSek });
      d.aktivTyp = typ; d.aktivSek = 0; if (typ === 'Hvile') d.aktivSone = 1;
      render(); si('Nytt segment: ' + typ.toLowerCase() + '.');
    });
    sk.appendChild(b);
  });
  k.appendChild(sk);
  var sl = el('div', 'felt2'); sl.style.marginTop = 'var(--s3)';
  var slb = el('div', 'eyebrow', 'sone'); slb.style.marginBottom = 'var(--s1)'; sl.appendChild(slb);
  var so = el('div', 'sone'); so.setAttribute('role', 'group'); so.setAttribute('aria-label', 'Puls-sone');
  [1, 2, 3, 4, 5].forEach(function(n){
    var b = el('button', null, String(n));
    b.setAttribute('aria-pressed', String(d.aktivSone === n));
    b.dataset.odId = 'live-kond-sone-' + n;
    b.addEventListener('click', function(){ d.aktivSone = n; render(); });
    so.appendChild(b);
  });
  sl.appendChild(so); k.appendChild(sl);
  w.appendChild(k);
  if (d.segmenter.length){
    var lk = el('div', 'kort');
    lk.appendChild(el('div', 'eyebrow', 'segmenter · ' + d.segmenter.length));
    d.segmenter.forEach(function(s2){
      var r2 = el('div', 'segrad');
      r2.appendChild(el('span', null, s2.typ));
      r2.appendChild(el('span', 'sv', 'sone ' + s2.sone + ' · ' + mmss(s2.sek)));
      lk.appendChild(r2);
    });
    w.appendChild(lk);
  }
}

/* ── Logg ── */
function renderLogg(w){
  w.appendChild(el('div', 'eyebrow', 'notat til loggen'));
  var ta = document.createElement('textarea');
  ta.className = 'loggfelt'; ta.id = 'loggfelt';
  ta.placeholder = 'Hva skjedde? Skriv kort — «traff tynt på 70 m når jeg ble sliten» er nok.';
  ta.setAttribute('aria-label', 'Notat til loggen');
  ta.dataset.odId = 'live-loggfelt';
  ta.style.marginTop = 'var(--s2)';
  w.appendChild(ta);
  var lagre = el('button', 'btn ink full', 'Lagre notat');
  lagre.style.marginTop = 'var(--s2)';
  lagre.dataset.odId = 'live-lagre-notat';
  lagre.addEventListener('click', function(){
    var v = ta.value.trim();
    if (!v){ toast('Skriv noe først — ett ord er nok.'); return; }
    NOTATER.unshift({ t: mmss(liveSecs), tekst: v });
    ta.value = ''; render();
    si('Notatet er lagret i loggen.'); toast('Lagret i loggen');
  });
  w.appendChild(lagre);

  var hint = el('p', 'prose');
  hint.style.cssText = 'font-size:12.5px;color:var(--muted);margin:var(--s3) 0';
  hint.textContent = 'Notatene legges på økta i loggen og blir med i oppsummeringen. Stemmefangst finnes på I dag-skjermen.';
  w.appendChild(hint);

  if (NOTATER.length){
    w.appendChild(el('div', 'eyebrow', 'notater i denne økta · ' + NOTATER.length));
    NOTATER.forEach(function(n){
      var nd = el('div', 'notat');
      nd.appendChild(el('span', 'nt num', n.t + ' inn i økta'));
      nd.appendChild(document.createTextNode(n.tekst));
      w.appendChild(nd);
    });
  }
}

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){ tilstand = b.dataset.tilstand; settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(KEY, next); } catch(e){}
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();
</script>
</body>
</html>

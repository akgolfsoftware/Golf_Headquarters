<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meg · PlayerHQ · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }

/* ═══ PlayerHQ · Meg ═══
   Profil, varsler, abonnement, samtykker og personvern.
   Spilleren eier sine egne data — også retten til å ta dem med seg
   eller slette dem. Ingen av valgene her krever coachens godkjenning. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.full{ width:100%; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }
.phone .scrim,.phone .ark{ position:absolute; }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s3);
  padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) var(--s4);
  border-bottom:1px solid var(--border); background:var(--surface); }
.av{ width:52px; height:52px; flex:none; border-radius:var(--r-pill); background:var(--soft);
  display:grid; place-items:center; font-family:var(--mono); font-size:16px; font-weight:600;
  color:var(--muted); }
.topp h1{ margin:0; font-family:var(--disp); font-size:18px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(var(--s8) + env(safe-area-inset-bottom)); }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s3); }
.kort > .eyebrow{ display:block; margin-bottom:var(--s2); }
.kilde{ display:block; font-family:var(--mono); font-size:9px; color:var(--mid);
  letter-spacing:.04em; margin-bottom:var(--s3); }

.rad{ display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 0;
  border-bottom:1px solid var(--border-soft); font-size:13.5px; min-height:var(--tap); }
.rad:last-of-type{ border-bottom:0; }
.rad .k{ min-width:0; }
.rad .k small{ display:block; font-size:11.5px; color:var(--muted); font-family:var(--body); }
.rad .v{ margin-left:auto; font-family:var(--mono); font-size:13px; text-align:right; flex:none; }
.rad .v.pos{ color:var(--up); } .rad .v.neg{ color:var(--dn); }

/* Bryter — 44px treffområde selv om selve sporet er mindre */
.bryter{ margin-left:auto; flex:none; width:52px; height:var(--tap); padding:0; border:0;
  background:transparent; cursor:pointer; display:grid; place-items:center; }
.bryter i{ display:block; width:44px; height:26px; border-radius:var(--r-pill);
  background:var(--soft); border:1px solid var(--border); position:relative;
  transition:background var(--dur) var(--ease); }
.bryter i::after{ content:""; position:absolute; top:2px; left:2px; width:20px; height:20px;
  border-radius:var(--r-pill); background:var(--surface); border:1px solid var(--border);
  transition:transform var(--dur) var(--ease); }
.bryter[aria-pressed="true"] i{ background:var(--fg); border-color:var(--fg); }
.bryter[aria-pressed="true"] i::after{ transform:translateX(18px); border-color:var(--fg); }

.lenkerad{ display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
  padding:var(--s3) 0; border:0; border-bottom:1px solid var(--border-soft);
  background:transparent; cursor:pointer; font-size:13.5px; min-height:var(--tap); }
.lenkerad:last-of-type{ border-bottom:0; }
.lenkerad .pil{ margin-left:auto; color:var(--muted); }
.lenkerad small{ display:block; font-size:11.5px; color:var(--muted); font-family:var(--body); }

.varselblokk{ background:var(--accent-soft); border:1px solid var(--border);
  border-left:3px solid var(--accent); border-radius:var(--r); padding:var(--s4);
  margin-bottom:var(--s3); }
.varselblokk .eyebrow{ color:var(--accent-fg); }
.varselblokk h2{ margin:var(--s1) 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.varselblokk p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13px; color:var(--muted); }

.farlig{ border-color:var(--dn); }
.farlig .k{ color:var(--dn); }
.merknad{ font-family:var(--body); font-size:12px; color:var(--muted);
  padding:var(--s2) var(--s3); background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s3); }

.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:var(--z-sheet); display:none; }
.scrim.on{ display:block; }
.ark{ position:fixed; left:0; right:0; bottom:0; z-index:calc(var(--z-sheet) + 1);
  max-height:88%; background:var(--surface); border-top:1px solid var(--border);
  border-radius:var(--r-lg) var(--r-lg) 0 0; display:none; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom); }
.ark.on{ display:flex; }
.grab{ flex:none; width:36px; height:4px; border-radius:var(--r-pill);
  background:var(--border); margin:var(--s3) auto var(--s2); }
.ahead{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:0 var(--s4) var(--s3); border-bottom:1px solid var(--border); }
.ahead h2{ margin:0; font-family:var(--disp); font-size:16px; font-weight:600; }
.abody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }
.afoot{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  border-top:1px solid var(--border); }
.afoot .btn{ flex:1; }

.faner{ flex:none; display:flex; background:var(--rail); z-index:var(--z-rail);
  padding-bottom:env(safe-area-inset-bottom); }
.faner a{ flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; color:var(--rail-fg); text-decoration:none;
  font-size:10px; position:relative; }
.faner a svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.faner a[aria-current="page"]{ color:var(--rail-on); }
.faner a[aria-current="page"]::before{ content:""; position:absolute; top:0; left:24%; right:24%;
  height:2px; background:var(--rail-on); border-radius:var(--r-pill); }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,summary,a.btn,.lenkerad,.bryter{ min-height:var(--tap); }
.tag,.num,.eyebrow,.rad .v,.kilde{ min-height:0; }

</style>
</head>
<body>
<p class="framehint">PlayerHQ · Meg · 430 px. Under 641 px fyller den skjermen.</p>

<div class="scrim" id="scrim" hidden></div>

<section class="ark" id="ark" role="dialog" aria-modal="true" aria-labelledby="arkTitle" hidden>

  <div class="ahead">
    <h2 id="arkTitle">Detaljer</h2>

    <button class="ikon" data-lukk="1" aria-label="Lukk" data-od-id="mg-ark-lukk">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="abody" id="arkBody"></div>
  <div class="afoot" id="arkFoot"></div>
</section>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
/* ═══ PlayerHQ · Meg ═══
   Eierskapsmodellen (Anders 01.08.2026): spilleren eier sine egne data.
   Ingen bryter her ber om godkjenning. Samtykker gis og trekkes av
   spilleren selv; coachen får varsling, ikke vetorett.
   Regler og låser er ute — skjermen viser tilstand, ikke dom. */
(function(){
'use strict';

var toast = document.getElementById('toast');
var live  = document.getElementById('live');
var tRef  = null;
function si(t){ live.textContent = t; }
function melding(t){
  toast.textContent = t; toast.hidden = false; si(t);
  clearTimeout(tRef); tRef = setTimeout(function(){ toast.hidden = true; }, 2600);
}
function heltall(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

/* ── Tilstand ────────────────────────────────────────────────── */
var tilstand = 'fylt';          /* fylt · tom · laster · feil */
var lydSamtykke = false;        /* Én ting nå henger på denne */
var varsler = { plan:true, okt:true, tilbakemelding:true, turnering:false };

/* ── Abonnementet ────────────────────────────────────────────────
   HENTET FRA SUPABASE 02.08.2026 (service_types, slug anders-performance).
   Sto tidligere som «Pro · 299 kr/mnd» med tre trekk à 299 kr. Den planen
   finnes ikke og har aldri gjort det — samme spiller sto som Performance i
   bookingflata og som Pro her, i samme bølge.

   Prisen skrives ikke to steder. ABO er eneste kilde på denne skjermen, og
   både abonnementskortet og betalingshistorikken regnes fra den. */
var ABO = {
  plan: 'Performance',
  pris: 1300,
  okter: 2,
  min: 20,
  playerhq: true,
  rullerer: false,
  nesteTrekk: '01.09.2026',
  betalingsmate: 'Visa •••• 4417',
  status: 'Aktiv',
  trekk: ['01.07.2026', '01.06.2026', '01.05.2026']
};

/* ── Demo-data. Alt herfra skal komme fra ekte modeller. ─────── */
var D = {
  identitet: [
    ['Født', '14.03.2008'],
    ['Klubb', 'Gamle Fredrikstad GK'],
    ['Skole', 'WANG Toppidrett Fredrikstad · Vg2'],
    ['År med golf', '9'],
    ['Snittscore forrige sesong', '74,8'],
    ['Ambisjon', 'College i USA 2027']
  ],
  coach: [
    ['Coach', 'Anders Kristiansen'],
    ['Program', 'AK Golf Academy · 1:1'],
    ['Startet', '12.08.2024'],
    ['Neste time', 'tirsdag 04.08 kl. 09:00']
  ],
  utstyr: [
    ['Driver', 'TaylorMade Qi10 · 9° · X'],
    ['Jern', 'Titleist T150 4–PW'],
    ['Wedger', '50° · 54° · 60°'],
    ['Putter', 'Scotty Cameron Phantom 5,5'],
    ['Ball', 'Titleist Pro V1x'],
    ['Sist oppdatert', '11.06.2026']
  ],
  /* Bare Gamle Fredrikstad GK er synlig ved lansering. Miklagard og Mulligan
     er active = false i locations, og skal ikke stå her heller. */
  anlegg: [
    ['Hjemmebane', 'Gamle Fredrikstad GK'],
    ['Treningsområde', 'GFGK range + nærspillområde']
  ],
  foreldre: [
    ['Foresatt', 'registrert 12.08.2024'],
    ['Innsyn i plan', 'Ja'],
    ['Innsyn i helse', 'Nei']
  ]
};

/* ── Byggeklosser ────────────────────────────────────────────── */
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function kort(tittel, kilde, demoUsikker){
  var k = el('section','kort');
  k.appendChild(document.createComment(' kilde: ' + kilde + ' '));
  k.appendChild(el('span','eyebrow', tittel));
  k.appendChild(el('span','kilde', 'kilde: ' + kilde));
  if (demoUsikker){
    k.dataset.demoOnly = 'true';
    k.appendChild(el('p','merknad',
      'Modellkilde ikke verifisert mot schema.prisma. Må bekreftes før koding.'));
  }
  return k;
}
function rad(k, v, sub){
  var r = el('div','rad');
  var kd = el('div','k'); kd.appendChild(document.createTextNode(k));
  if (sub) kd.appendChild(el('small', null, sub));
  r.appendChild(kd);
  r.appendChild(el('div','v num', v));
  return r;
}
function rader(kortEl, liste){
  liste.forEach(function(p){ kortEl.appendChild(rad(p[0], p[1])); });
  return kortEl;
}
function lenkerad(tekst, sub, id, handling){
  var b = el('button','lenkerad');
  b.dataset.odId = id;
  var d = el('div','k'); d.appendChild(document.createTextNode(tekst));
  if (sub) d.appendChild(el('small', null, sub));
  b.appendChild(d);
  var p = el('span','pil','›');
  b.appendChild(p);
  b.addEventListener('click', handling);
  return b;
}
function bryter(navn, forklaring, nokkel){
  var r = el('div','rad');
  var d = el('div','k'); d.appendChild(document.createTextNode(navn));
  if (forklaring) d.appendChild(el('small', null, forklaring));
  r.appendChild(d);
  var b = el('button','bryter');
  b.type = 'button';
  b.dataset.odId = 'mg-varsel-' + nokkel;
  b.setAttribute('aria-pressed', String(varsler[nokkel]));
  b.setAttribute('aria-label', navn);
  b.appendChild(el('i'));
  b.addEventListener('click', function(){
    varsler[nokkel] = !varsler[nokkel];
    b.setAttribute('aria-pressed', String(varsler[nokkel]));
    melding(navn + (varsler[nokkel] ? ' er på.' : ' er av.'));
  });
  r.appendChild(b);
  return r;
}

/* ── Ark ─────────────────────────────────────────────────────── */
var ark = document.getElementById('ark');
var scrim = document.getElementById('scrim');
var arkBody = document.getElementById('arkBody');
var arkFoot = document.getElementById('arkFoot');
var sisteFokus = null;

function apneArk(tittel, byggBody, knapper){
  sisteFokus = document.activeElement;
  document.getElementById('arkTitle').textContent = tittel;
  arkBody.innerHTML = ''; arkFoot.innerHTML = '';
  byggBody(arkBody);
  (knapper || []).forEach(function(k){
    var b = el('button','btn' + (k.ink ? ' ink' : ''), k.tekst);
    b.type = 'button';
    b.dataset.odId = k.id;
    b.addEventListener('click', k.gjor);
    arkFoot.appendChild(b);
  });
  if (!arkFoot.children.length){
    var lukk = el('button','btn','Lukk');
    lukk.type = 'button'; lukk.dataset.odId = 'mg-ark-lukk-2';
    lukk.addEventListener('click', lukkArk);
    arkFoot.appendChild(lukk);
  }
  ark.hidden = false; scrim.hidden = false;
  ark.classList.add('on'); scrim.classList.add('on');
  var f = ark.querySelector('button');
  if (f) f.focus();
}
function lukkArk(){
  ark.classList.remove('on'); scrim.classList.remove('on');
  ark.hidden = true; scrim.hidden = true;
  if (sisteFokus && sisteFokus.isConnected) sisteFokus.focus();
}
scrim.addEventListener('click', lukkArk);
ark.querySelector('[data-lukk]').addEventListener('click', lukkArk);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !ark.hidden) lukkArk();
  if (e.key === 'Tab' && !ark.hidden){
    var f = ark.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var forste = f[0], siste = f[f.length - 1];
    if (e.shiftKey && document.activeElement === forste){ e.preventDefault(); siste.focus(); }
    else if (!e.shiftKey && document.activeElement === siste){ e.preventDefault(); forste.focus(); }
  }
});

/* ── Render ──────────────────────────────────────────────────── */
var kropp = document.getElementById('kropp');

function render(){
  kropp.innerHTML = '';

  if (tilstand === 'laster'){
    var l = el('div','kort');
    l.appendChild(el('span','eyebrow','Henter profilen'));
    l.appendChild(el('p','merknad','Henter profilen din. Det tar sjelden mer enn et par sekunder.'));
    kropp.appendChild(l);
    kropp.appendChild(demobryter());
    return;
  }
  if (tilstand === 'feil'){
    var f = el('div','kort');
    f.appendChild(el('span','eyebrow','Fikk ikke kontakt'));
    f.appendChild(el('p','merknad',
      'Vi fikk ikke kontakt med serveren. Profilen din er trygg — dette er kun visningen.'));
    var pr = el('button','btn full','Prøv på nytt');
    pr.type = 'button'; pr.dataset.odId = 'mg-prov-igjen';
    pr.addEventListener('click', function(){ tilstand = 'laster'; render();
      setTimeout(function(){ tilstand = 'fylt'; render(); si('Profilen er hentet.'); }, 700); });
    f.appendChild(pr);
    kropp.appendChild(f);
    kropp.appendChild(demobryter());
    return;
  }

  /* ── Én ting nå — eneste clay-flate på skjermen ────────────── */
  if (!lydSamtykke){
    var v = el('div','varselblokk');
    v.appendChild(document.createComment(' kilde: lyd_samtykker '));
    v.appendChild(el('span','eyebrow','Én ting nå'));
    var h = el('h2','','Lydsamtykke mangler');
    v.appendChild(h);
    v.appendChild(el('p','',
      'Uten lydsamtykke kan Anders ikke dele videoanalyse med lyd med deg. ' +
      'Du gir det selv — ingen godkjenning, og du kan trekke det når du vil.'));
    var gi = el('button','btn now full','Gi lydsamtykke');
    gi.type = 'button'; gi.dataset.odId = 'mg-one-thing-now';
    gi.addEventListener('click', function(){
      lydSamtykke = true;
      melding('Lydsamtykke gitt 01.08.2026. Anders har fått varsel.');
      render();
    });
    v.appendChild(gi);
    kropp.appendChild(v);
  }

  if (tilstand === 'tom'){
    var t = el('section','kort');
    t.appendChild(el('span','eyebrow','Profilen er ikke fylt ut'));
    t.appendChild(el('p','merknad',
      'Vi vet hvem du er, men ikke mer enn det. Fyller du ut klubb, skole og utstyr, ' +
      'kan Anders planlegge mot riktig utgangspunkt fra første økt.'));
    t.appendChild(lenkerad('Fyll ut profilen', 'Tar under to minutter', 'mg-fyll-profil', function(){
      tilstand = 'fylt'; render(); melding('Profilen er fylt ut.');
    }));
    kropp.appendChild(t);
    kropp.appendChild(demobryter());
    return;
  }

  /* ── Identitet ─────────────────────────────────────────────── */
  kropp.appendChild(rader(kort('Om deg', 'users, player_enrollments'), D.identitet));

  /* ── Coach ─────────────────────────────────────────────────── */
  kropp.appendChild(rader(kort('Coach og program', 'player_enrollments, coaching_sessions'), D.coach));

  /* ── Varsler ───────────────────────────────────────────────── */
  var kv = kort('Varsler', 'push_subscriptions', true);
  kv.appendChild(bryter('Ny plan fra Anders', 'Når uka er publisert', 'plan'));
  kv.appendChild(bryter('Påminnelse før økt', 'To timer før', 'okt'));
  kv.appendChild(bryter('Tilbakemelding på økt', 'Når Anders har sett gjennom', 'tilbakemelding'));
  kv.appendChild(bryter('Turneringspåminnelse', 'Kvelden før første runde', 'turnering'));
  kropp.appendChild(kv);

  /* ── Abonnement ────────────────────────────────────────────── */
  var ka = kort('Abonnement', 'service_types, subscriptions, payments');
  ka.appendChild(rad('Plan', ABO.plan));
  ka.appendChild(rad('Pris', heltall(ABO.pris) + ' kr/mnd'));
  /* «2 × 20 min», aldri «40 min». Antallet økter er poenget. */
  ka.appendChild(rad('Inkludert', ABO.okter + ' × ' + ABO.min + ' min per måned'));
  if (ABO.playerhq) ka.appendChild(rad('PlayerHQ', 'inkludert'));
  ka.appendChild(rad('Ubrukte økter',
    ABO.rullerer ? 'overføres' : 'nullstilles ved månedsskifte'));
  ka.appendChild(rad('Neste trekk', ABO.nesteTrekk));
  ka.appendChild(rad('Betalingsmåte', ABO.betalingsmate));
  ka.appendChild(rad('Status', ABO.status));
  ka.appendChild(lenkerad('Betalingshistorikk', ABO.trekk.length + ' trekk', 'mg-betalinger', function(){
    apneArk('Betalingshistorikk', function(b){
      b.appendChild(document.createComment(' kilde: payments '));
      /* Beløpet regnes fra ABO.pris. Skrives det inn her også, spriker de to
         tallene første gang prisen endres. */
      ABO.trekk.forEach(function(dato){
        b.appendChild(rad(dato, heltall(ABO.pris) + ' kr'));
      });
    });
  }));
  ka.appendChild(lenkerad('Endre eller si opp', 'Åpner Stripe-portalen', 'mg-stripe', function(){
    melding('Åpner Stripe-portalen. Ingen endring skjer før du bekrefter der.');
  }));
  kropp.appendChild(ka);

  /* ── Utstyr og anlegg ──────────────────────────────────────── */
  kropp.appendChild(rader(kort('Utstyr', 'equipment_bags'), D.utstyr));
  kropp.appendChild(rader(kort('Anlegg', 'locations, bookings'), D.anlegg));

  /* ── Samtykker ─────────────────────────────────────────────── */
  var ks = kort('Samtykker', 'lyd_samtykker, helse_samtykker, parent_relations');
  ks.appendChild(rad('Lydsamtykke', lydSamtykke ? 'Gitt 01.08.2026' : 'Mangler'));
  ks.appendChild(rad('Helsesamtykke', 'Gitt 12.08.2024'));
  ks.appendChild(rad('Foresattsamtykke', 'Gitt 12.08.2024'));
  if (lydSamtykke){
    ks.appendChild(lenkerad('Trekk lydsamtykke', 'Gjelder fra du trykker', 'mg-trekk-lyd', function(){
      apneArk('Trekk lydsamtykke', function(b){
        b.appendChild(el('p','merknad',
          'Trekker du samtykket, slutter Anders å dele videoanalyse med lyd. ' +
          'Allerede delt materiale fjernes innen 24 timer. Du kan gi det igjen når som helst.'));
      }, [
        { tekst:'Avbryt', id:'mg-trekk-avbryt', gjor:lukkArk },
        { tekst:'Trekk samtykket', id:'mg-trekk-bekreft', ink:true, gjor:function(){
            lydSamtykke = false; lukkArk(); render();
            /* Én ting nå kommer tilbake øverst. Uten dette blir den stående
               to skjermhøyder over der brukeren faktisk står. */
            kropp.scrollTop = 0;
            melding('Lydsamtykket er trukket. Anders har fått varsel.'); } }
      ]);
    }));
  }
  kropp.appendChild(ks);

  /* ── Foreldre ──────────────────────────────────────────────── */
  var kf = rader(kort('Foresatt', 'parent_relations'), D.foreldre);
  kf.appendChild(lenkerad('Foreldreportalen', 'Det foresatt ser og kan gjøre', 'mg-foreldreportal', function(){
    location.href = 'foreldreportal.html';
  }));
  kropp.appendChild(kf);

  /* ── Personvern ────────────────────────────────────────────── */
  var kp = kort('Dine data', 'data_export_requests');
  kp.appendChild(el('p','merknad',
    'Dataene dine er dine. Du kan ta dem med deg, og du kan be om at de slettes.'));
  kp.appendChild(lenkerad('Last ned alt om meg', 'Kommer på e-post innen 24 timer', 'mg-eksport', function(){
    melding('Eksporten er bestilt. Du får e-post når fila er klar.');
  }));
  kp.appendChild(lenkerad('Personvernerklæring', 'Hva vi lagrer og hvorfor', 'mg-personvern', function(){
    apneArk('Personvern', function(b){
      b.appendChild(el('p','merknad',
        'Vi lagrer treningsdata, resultater, TrackMan-økter og notatene coachen skriver om deg. ' +
        'Helsedata lagres bare hvis du har gitt helsesamtykke, og deles aldri med andre spillere.'));
    });
  }));
  var kd = el('div','rad farlig');
  var kdk = el('div','k'); kdk.appendChild(document.createTextNode('Slett kontoen min'));
  kdk.appendChild(el('small', null, 'Kan ikke angres etter 30 dager'));
  kd.appendChild(kdk);
  var slett = el('button','btn sm','Slett');
  slett.type = 'button'; slett.dataset.odId = 'mg-slett-konto';
  slett.addEventListener('click', function(){
    apneArk('Slett kontoen', function(b){
      b.appendChild(el('p','merknad',
        'Kontoen låses med én gang og slettes endelig etter 30 dager. ' +
        'I mellomtiden kan du angre ved å logge inn. Abonnementet stanses samtidig.'));
    }, [
      { tekst:'Avbryt', id:'mg-slett-avbryt', gjor:lukkArk },
      { tekst:'Slett kontoen', id:'mg-slett-bekreft', ink:true, gjor:function(){
          lukkArk(); melding('Sletting bestilt. Du har 30 dager på å angre.'); } }
    ]);
  });
  kd.appendChild(slett);
  kp.appendChild(kd);
  kropp.appendChild(kp);

  /* ── Logg ut ───────────────────────────────────────────────── */
  var ku = el('section','kort');
  var ut = el('button','btn full','Logg ut');
  ut.type = 'button'; ut.dataset.odId = 'mg-logg-ut';
  ut.addEventListener('click', function(){ location.href = 'innlogging.html'; });
  ku.appendChild(ut);
  kropp.appendChild(ku);

  kropp.appendChild(demobryter());
}

/* Demo-stillas: bytt datatilstand. Skal bort ved integrasjon. */
function demobryter(){
  var d = el('section','kort');
  d.dataset.demoOnly = 'true';
  d.appendChild(el('span','eyebrow','Demo · datatilstand'));
  var rekke = el('div','rad');
  ['fylt','tom','laster','feil'].forEach(function(t){
    var b = el('button','btn sm', t);
    b.type = 'button'; b.dataset.odId = 'mg-demo-' + t;
    b.style.marginRight = 'var(--s2)';
    b.setAttribute('aria-pressed', String(t === tilstand));
    b.addEventListener('click', function(){ tilstand = t; render(); si('Viser tilstand ' + t + '.'); });
    rekke.appendChild(b);
  });
  d.appendChild(rekke);
  return d;
}

/* ── Tema ────────────────────────────────────────────────────── */
var KEY = 'akhq-theme-playerhq';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();

</script>
</body>
</html>

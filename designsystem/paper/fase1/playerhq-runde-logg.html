<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
:root {
  --bg: #faf9f5;
  --surface: #ffffff;
  --soft: #f0eee6;
  --soft-hover: #e8e6dc;

  --fg: #141413;

  --rail: #141413;

  --rail-active: rgba(250, 249, 245, 0.14);

  --cta: #141413;

  --cta-hover: #3d3d3a;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.12);

  --accent-coral: #ebcece;

  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  --up: #63784a;
  --up-raw: #788c5d;
  --dn: #a85536;
  --info: #46719f;
  --info-raw: #6a9bcc;

  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;
  --text-body-player: 14px;
  --text-label: 10px;
  --text-kpi: 40px;

  --text-hero: 56px;
  --text-section: 40px;
  --text-prose: 18px;
  --text-prose-lg: 22px;
  --text-nav: 16px;

  --s1: 4px;
  --s2: 8px;
  --s3: 12px;

  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;

  --r-none: 0px;
  --r-sm: 8px;
  --r: 12px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;

  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);

  --tap: 44px;

  --logo-mark: #141413;

[data-theme="dark"] {

  --fg: #faf9f5;

:root{ --softer:#f6f4ee; --border-soft:#efede4; }

/* ═══ PlayerHQ · Logg en runde (etterregistrering) ═══
   For runder spilt uten live-føring. KUN brutto score.
   Hull for hull gir mest (SG per hull i Analyse) — men bare totalen
   er også lov og teller i snittet. Ingenting sperrer. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,select,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; color:inherit; text-decoration:none; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(96px + env(safe-area-inset-bottom)); }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s4); }

.feltrad{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s2);
  margin-bottom:var(--s2); }
.felt{ width:100%; min-height:var(--tap-lg); padding:0 var(--s3); font:inherit; font-size:15px;
  background:var(--bg); color:var(--fg); border:1px solid var(--border);
  border-radius:var(--r-sm); }
.feltlab{ display:block; font-family:var(--mono); font-size:var(--text-label);
  font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  margin:0 0 var(--s1); }

/* Modusveksler: hull for hull / bare totalen */
.moduser{ display:flex; gap:var(--s1); background:var(--soft);
  border:1px solid var(--border); border-radius:var(--r); padding:var(--s1);
  margin-bottom:var(--s4); }
.moduser button{ flex:1; min-height:var(--tap); border:0; background:transparent;
  border-radius:var(--r-sm); font-size:13px; font-weight:500; cursor:pointer;
  color:var(--muted); }
.moduser button[aria-pressed="true"]{ background:var(--surface); color:var(--fg);
  box-shadow:var(--shadow); border:1px solid var(--border); }

/* Hull-rutenett for innfylling */
.hgrid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--s2); }
.hcelle .hlab{ display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:9.5px; color:var(--muted); margin-bottom:2px; }
.hcelle input{ width:100%; min-height:var(--tap); padding:0; text-align:center;
  font-family:var(--mono); font-size:16px; background:var(--bg); color:var(--fg);
  border:1px solid var(--border); border-radius:var(--r-sm); }
.hcelle input::-webkit-outer-spin-button,.hcelle input::-webkit-inner-spin-button{
  -webkit-appearance:none; margin:0; }
.hcelle input[type=number]{ -moz-appearance:textfield; appearance:textfield; }

.sumlinje{ display:flex; align-items:baseline; gap:var(--s3); margin-top:var(--s3); }
.sumlinje .slag{ font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:32px; font-weight:500; line-height:1; }
.sumlinje .rel{ font-family:var(--mono); font-size:14px; color:var(--muted); }

.totfelt{ width:100%; min-height:72px; text-align:center; font-family:var(--mono);
  font-size:32px; background:var(--bg); color:var(--fg); border:1px solid var(--border);
  border-radius:var(--r); }

.histrad{ display:flex; align-items:baseline; gap:var(--s2); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:13px; }
.histrad:last-child{ border-bottom:0; }
.histrad .v{ margin-left:auto; font-family:var(--mono); }

.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); margin-bottom:var(--s4); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s2); animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }

.why{ margin:var(--s3) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

.kvitt{ padding:var(--s5) var(--s4); background:var(--surface);
  border:1px solid var(--up); border-radius:var(--r); margin-bottom:var(--s4); }
.kvitt h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:16px; font-weight:600;
  display:flex; align-items:center; gap:var(--s2); }
.kvitt h3 svg{ width:20px; height:20px; fill:none; stroke:var(--up); stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; }
.kvitt p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }

.dokk{ position:absolute; left:0; right:0; bottom:0;
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 70%, transparent); }
@media (min-width:1024px){ .dokk{ position:sticky; background:var(--bg);
  border-top:1px solid var(--border); } .dokk .btn{ max-width:720px; margin:0 auto; display:flex; } }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,summary,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow{ min-height:0; }
</style>
</head>

<div class="phone" data-demo-only="true">

<script>
(function(){
'use strict';

/* ═══ PlayerHQ · Logg en runde · datamodell ═══
   Kilder: Round (etterregistrert runde: bane, dato) → HoleScore
   (brutto slag per hull). «Bare totalen» lagrer Round uten HoleScore-
   rader — lov, men da finnes ingen SG per hull i Analyse.
   Golf-regel (CLAUDE.md): KUN brutto score, aldri netto.
   Demo-kanon: Øyvind Rohjan · Gamle Fredrikstad GK. */

var PAR = [4,4,3,5,4,4,3,4,5, 4,3,4,5,4,4,3,5,4];  /* par 72 */
var DEMO_SCORES = [5,4,4,6,4,5,3,4,5, 4,3,5,6,4,4,3,5,4];  /* 78 slag · +6 */
var SISTE = [
  { d:'02.08', bane:'Gamle Fredrikstad GK', slag:76 },
  { d:'26.07', bane:'Gamle Fredrikstad GK', slag:79 }
];

var tilstand = 'fylt', modus = 'hull', lagretVisning = false;
var scores = DEMO_SCORES.slice();
var total = null;

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function fylte(){ return scores.filter(function(s){ return s != null; }).length; }
function sumSlag(){ return scores.reduce(function(a, s){ return a + (s || 0); }, 0); }
function sumPar(){ var p = 0;
  scores.forEach(function(s, i){ if (s != null) p += PAR[i]; }); return p; }
function relStr(sum, par){ var d = sum - par;
  return d === 0 ? 'E' : (d > 0 ? '+' + d : String(d)); }

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';
  var dokk = document.getElementById('dokk'); dokk.innerHTML = '';

  if (tilstand === 'laster'){
    for (var i = 0; i < 7; i++){ var s = el('div', 'skel'); s.style.width = (95 - i*7) + '%'; w.appendChild(s); }
    return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Klarte ikke å lagre runden'));
    var fp = el('p', null,
      'Alt du har tastet ligger trygt på telefonen. Prøv igjen når som helst — ' +
      'ingenting må tastes på nytt.');
    fp.style.marginBottom = 'var(--s3)';
    f.appendChild(fp);
    /* Kontrakt §3: i feiltilstand er «Prøv igjen» skjermens ene aksenthandling. */
    var fb = el('button', 'btn now full', 'Prøv igjen'); fb.dataset.odId = 'rlogg-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f); return;
  }

  if (lagretVisning){ renderKvittering(w); return; }

  /* Tom = første gang: ingen runder loggført ennå. Skjemaet er veien videre. */
  if (tilstand === 'tom'){
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Ingen runder loggført ennå'));
    t.appendChild(el('p', null,
      'Den første runden gir Analyse noe å jobbe med. Fyll inn under — ' +
      'hull for hull gir mest, men bare totalen teller også.'));
    w.appendChild(t);
  }

  /* ── Skjemaet (fylt og tom deler det — tom starter blankt) ── */
  var blank = tilstand === 'tom';
  if (blank && scores.some(function(s){ return s != null; }) && !window.__rloggBlanket){
    scores = PAR.map(function(){ return null; }); total = null; window.__rloggBlanket = true;
  }

  /* Runde-fakta — kilde: Round */
  var k = el('div', 'kort');
  k.appendChild(el('div', 'eyebrow', 'runden'));
  var fr = el('div', 'feltrad'); fr.style.marginTop = 'var(--s2)';
  var d1 = el('div');
  var l1 = el('label', 'feltlab', 'Dato'); l1.setAttribute('for', 'rdato');
  var inD = document.createElement('input');
  inD.type = 'date'; inD.id = 'rdato'; inD.className = 'felt';
  inD.value = blank ? '' : '2026-08-02'; inD.dataset.odId = 'rlogg-dato';
  d1.appendChild(l1); d1.appendChild(inD);
  var d2 = el('div');
  var l2 = el('label', 'feltlab', 'Bane'); l2.setAttribute('for', 'rbane');
  var sel = document.createElement('select');
  sel.id = 'rbane'; sel.className = 'felt'; sel.dataset.odId = 'rlogg-bane';
  var op = document.createElement('option');
  op.textContent = 'Gamle Fredrikstad GK'; sel.appendChild(op);
  d2.appendChild(l2); d2.appendChild(sel);
  fr.appendChild(d1); fr.appendChild(d2);
  k.appendChild(fr);
  w.appendChild(k);

  /* Modus: hull for hull / bare totalen */
  var mv = el('div', 'moduser');
  [['hull','Hull for hull'],['total','Bare totalen']].forEach(function(p){
    var b = el('button', null, p[1]);
    b.setAttribute('aria-pressed', String(modus === p[0]));
    b.dataset.odId = 'rlogg-modus-' + p[0];
    b.addEventListener('click', function(){ modus = p[0]; render(); });
    mv.appendChild(b);
  });
  w.appendChild(mv);

  if (modus === 'hull'){
    var hk = el('div', 'kort');
    hk.appendChild(el('div', 'eyebrow', 'brutto slag per hull'));
    var grid = el('div', 'hgrid'); grid.style.marginTop = 'var(--s2)';
    PAR.forEach(function(par, i){
      var c = el('div', 'hcelle');
      var lab = el('div', 'hlab');
      lab.appendChild(el('span', null, 'hull ' + (i+1)));
      lab.appendChild(el('span', null, 'par ' + par));
      c.appendChild(lab);
      var inp = document.createElement('input');
      inp.type = 'number'; inp.min = '1'; inp.max = '15';
      inp.inputMode = 'numeric';
      inp.value = scores[i] != null ? scores[i] : '';
      inp.setAttribute('aria-label', 'Hull ' + (i+1) + ', par ' + par);
      inp.dataset.odId = 'rlogg-hull-' + (i+1);
      inp.addEventListener('input', function(){
        var v = parseInt(inp.value, 10);
        scores[i] = (v >= 1 && v <= 15) ? v : null;
        oppdaterSum();
      });
      c.appendChild(inp);
      grid.appendChild(c);
    });
    hk.appendChild(grid);

    var sl = el('div', 'sumlinje'); sl.id = 'sumlinje';
    hk.appendChild(sl);
    var wd = el('details', 'why'); wd.dataset.odId = 'rlogg-why-sum';
    wd.appendChild(el('summary', null, 'Hvorfor dette tallet'));
    var ul = document.createElement('ul'); ul.id = 'whysum';
    wd.appendChild(ul); hk.appendChild(wd);
    w.appendChild(hk);
    oppdaterSum();
  } else {
    var tk = el('div', 'kort');
    tk.appendChild(el('div', 'eyebrow', 'brutto totalt · 18 hull'));
    var inT = document.createElement('input');
    inT.type = 'number'; inT.min = '18'; inT.max = '160';
    inT.inputMode = 'numeric'; inT.className = 'totfelt';
    inT.placeholder = '—';
    inT.value = total != null ? total : '';
    inT.setAttribute('aria-label', 'Brutto totalscore');
    inT.dataset.odId = 'rlogg-total';
    inT.style.marginTop = 'var(--s2)';
    inT.addEventListener('input', function(){
      var v = parseInt(inT.value, 10);
      total = (v >= 18 && v <= 160) ? v : null;
    });
    tk.appendChild(inT);
    var hint = el('p', 'prose');
    hint.style.cssText = 'font-size:12.5px;color:var(--muted);margin:var(--s3) 0 0';
    hint.textContent = 'Uten hull for hull kan ikke Analyse regne SG per hull — ' +
      'men totalen teller fortsatt i snittet ditt. Helt greit å bruke den.';
    tk.appendChild(hint);
    w.appendChild(tk);
  }

  /* Sist loggført — kilde: Round. Vises bare når det finnes noe. */
  if (!blank && SISTE.length){
    var hs = el('div', 'kort');
    hs.appendChild(el('div', 'eyebrow', 'sist loggført'));
    SISTE.forEach(function(r){
      var rr = el('div', 'histrad');
      rr.appendChild(el('span', null, r.bane));
      rr.appendChild(el('span', 'v num', r.d + ' · ' + r.slag + ' slag'));
      hs.appendChild(rr);
    });
    w.appendChild(hs);
  }

  /* Kontrakt §3: skjermens ene aksenthandling — logger runden. */
  var lagre = el('button', 'btn now full', 'Logg runden');
  lagre.dataset.odId = 'rlogg-lagre';
  lagre.addEventListener('click', function(){
    if (modus === 'hull' && !fylte()){ toast('Tast minst ett hull først.'); return; }
    if (modus === 'total' && total == null){ toast('Tast totalscoren først.'); return; }
    lagretVisning = true; render();
    si('Runden er lagret i loggen.');
  });
  dokk.appendChild(lagre);
}

function oppdaterSum(){
  var sl = document.getElementById('sumlinje');
  var ul = document.getElementById('whysum');
  if (!sl) return;
  sl.innerHTML = '';
  sl.appendChild(el('span', 'slag num', String(sumSlag())));
  sl.appendChild(el('span', 'rel num',
    relStr(sumSlag(), sumPar()) + ' · ' + fylte() + ' av 18 hull'));
  if (ul){
    ul.innerHTML = '';
    ['Kilde: hullene du har tastet — ' + fylte() + ' av 18.',
     'Beregning: ' + sumSlag() + ' slag minus par ' + sumPar() + ' på utfylte hull = ' + relStr(sumSlag(), sumPar()) + '.',
     'Forbehold: kun brutto — ekte slag. Netto og poeng finnes ikke i denne appen.']
     .forEach(function(x){ ul.appendChild(el('li', null, x)); });
  }
}

function renderKvittering(w){
  var kv = el('div', 'kvitt');
  var h = el('h3');
  h.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
  h.appendChild(document.createTextNode('Runden er lagret'));
  kv.appendChild(h);
  var tekst = modus === 'hull'
    ? fylte() + ' hull · ' + sumSlag() + ' slag (' + relStr(sumSlag(), sumPar()) + ') · brutto.'
    : '18 hull · ' + total + ' slag · brutto totalt.';
  kv.appendChild(el('p', null, tekst +
    ' Runden ligger i Analyse og teller i statistikken din. Anders ser den i stallen.'));
  w.appendChild(kv);

  var v = el('div');
  v.style.cssText = 'display:flex;flex-direction:column;gap:var(--s2)';
  var p1 = el('a', 'btn full', 'Se runden i Analyse');
  p1.href = 'playerhq-analyse.html'; p1.dataset.odId = 'rlogg-kvitt-analyse';
  var p2 = el('button', 'btn full', 'Logg en runde til');
  p2.dataset.odId = 'rlogg-kvitt-ny';
  p2.addEventListener('click', function(){
    scores = PAR.map(function(){ return null; }); total = null;
    lagretVisning = false; render();
  });
  v.appendChild(p1); v.appendChild(p2);
  w.appendChild(v);
}

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){
    tilstand = b.dataset.tilstand; lagretVisning = false;
    window.__rloggBlanket = false;
    if (tilstand === 'fylt'){ scores = DEMO_SCORES.slice(); total = null; }
    settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(KEY, next); } catch(e){}
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analyse · PlayerHQ · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }
/* ═══ PlayerHQ · Analyse ═══
   Der Øyvind skal stole på tall han ikke selv har regnet.
   Derfor bærer HVERT regnet tall «Hvorfor dette tallet» med tre linjer:
   kilde · beregning · forbehold. Uten forbeholdet er tallet en påstand.

   Regler og låser er ute — ingen farge sier bra eller dårlig utover
   fortegnet på SG. Ingen terskler, ingen karakterer.
   Data-viz følger data-viz-katalog: SgBreakdown, Sparkline, DataTable,
   PyramidProgress. Ingen nye chart-stiler oppfunnet. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }
.phone .scrim,.phone .ark{ position:absolute; }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; }

.segs{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); }
.segs::-webkit-scrollbar{ display:none; }
.segs button{ flex:none; min-height:var(--tap); padding:0 var(--s4); font-size:13px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-pill);
  color:var(--muted); cursor:pointer; }
.segs button[aria-current="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(var(--s8) + env(safe-area-inset-bottom)); }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s3); }
.kort > .eyebrow{ display:block; margin-bottom:var(--s2); }
.hero{ display:flex; align-items:baseline; gap:var(--s2); }
.hero .v{ font-family:var(--mono); font-size:40px; font-weight:600; letter-spacing:-.03em; line-height:1; }
.hero .v.pos{ color:var(--up); } .hero .v.neg{ color:var(--dn); }
.hero .u{ font-family:var(--mono); font-size:12px; color:var(--muted); }
.vindu{ display:block; font-size:11.5px; color:var(--muted); margin-top:var(--s1); }

/* SgBreakdown — horisontale stolper med nullinje i midten */
.sg{ margin-top:var(--s3); }
.sgrad{ display:grid; grid-template-columns:82px minmax(0,1fr) 58px; gap:var(--s2);
  align-items:center; min-height:34px; }
.sgrad .n{ font-size:12.5px; }
.sgrad .v{ font-family:var(--mono); font-size:13px; text-align:right; }
.sgrad .v.pos{ color:var(--up); } .sgrad .v.neg{ color:var(--dn); }
.spor{ position:relative; height:10px; background:var(--soft); border-radius:var(--r-pill); }
.spor .null{ position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--hairline); }
.spor i{ position:absolute; top:0; bottom:0; border-radius:var(--r-pill); }
.spor i.pos{ background:var(--up-raw); left:50%; }
.spor i.neg{ background:var(--dn); right:50%; }
.sgsvak{ margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--border-soft);
  font-family:var(--body); font-size:12.5px; color:var(--muted); }

/* Sparkline / trend */
.trend{ margin-top:var(--s2); }
.trend svg{ display:block; width:100%; height:72px; overflow:visible; }
.trend .akse{ stroke:var(--border); stroke-width:1; }
.trend .linje{ fill:none; stroke:var(--fg); stroke-width:1.5; stroke-linejoin:round; }
.trend .flate{ fill:var(--accent-soft); }
.trend .pkt{ fill:var(--surface); stroke:var(--fg); stroke-width:1.5; }
.trendmeta{ display:flex; gap:var(--s3); margin-top:var(--s2); font-family:var(--mono);
  font-size:10.5px; color:var(--muted); }
.trendmeta span:last-child{ margin-left:auto; }

/* Pyramide-fordeling */
.pyr{ display:flex; flex-direction:column; gap:var(--s2); margin-top:var(--s2); }
.pyrad{ display:grid; grid-template-columns:64px minmax(0,1fr) 62px; gap:var(--s2);
  align-items:center; min-height:30px; font-size:12.5px; }
.pyrad .b{ height:10px; background:var(--soft); border-radius:var(--r-pill); overflow:hidden; }
.pyrad .b i{ display:block; height:100%; border-radius:var(--r-pill); }
.pyrad .v{ font-family:var(--mono); font-size:12px; text-align:right; color:var(--muted); }
.f-FYS{ background:var(--accent-sky); } .f-TEK{ background:var(--accent-olive); }
.f-SLAG{ background:var(--accent-fig); } .f-SPILL{ background:var(--accent-cactus); }
.f-TURN{ background:var(--accent-heather); }

/* Tabell */
.tab{ width:100%; border-collapse:collapse; margin-top:var(--s2); }
.tab th{ text-align:left; font-family:var(--mono); font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); font-weight:500;
  padding:var(--s2) 0; border-bottom:1px solid var(--border); }
.tab td{ padding:var(--s3) 0; border-bottom:1px solid var(--border-soft); font-size:12.5px;
  vertical-align:top; }
.tab tr:last-child td{ border-bottom:0; }
.tab td.r{ text-align:right; font-family:var(--mono); }
.tab td .d{ display:block; font-family:var(--mono); font-size:10px; color:var(--muted); }
.ikketatt{ color:var(--muted); }

.why{ margin:var(--s3) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why summary::after{ content:"›"; margin-left:auto; transition:transform var(--dur) var(--ease); }
.why[open] summary::after{ transform:rotate(90deg); }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }
.why li:last-child{ margin-bottom:0; }

.merknad{ font-family:var(--body); font-size:12px; color:var(--muted);
  padding:var(--s2) var(--s3); background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s3); }
.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm); margin-bottom:var(--s2);
  animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }

.dokk{ position:absolute; left:0; right:0; bottom:56px; padding:var(--s3) var(--s4);
  background:linear-gradient(to top, var(--bg) 70%, transparent); }
@media (min-width:1024px){ .dokk{ position:sticky; bottom:0; background:var(--bg);
  border-top:1px solid var(--border); } .dokk .btn{ max-width:720px; margin:0 auto; display:flex; } }

.faner{ flex:none; display:flex; background:var(--rail); z-index:var(--z-rail);
  padding-bottom:env(safe-area-inset-bottom); }
.faner a{ flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; color:var(--rail-fg); text-decoration:none;
  font-size:10px; position:relative; }
.faner a svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.faner a[aria-current="page"]{ color:var(--rail-on); }
.faner a[aria-current="page"]::before{ content:""; position:absolute; top:0; left:24%; right:24%;
  height:2px; background:var(--rail-on); border-radius:var(--r-pill); }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,summary,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow,.hero .v,.sgrad .v,.pyrad .v,.tab td,.tab th{ min-height:0; }

</style>
</head>
<body>
<p class="framehint">PlayerHQ · Analyse · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">
    <div style="min-width:0">
      <h1>Analyse</h1>
      <span class="sub">Øyvind Rohjan · kat. D</span>
    </div>
    <span style="flex:1"></span>
    <!-- demo-bryter · fjernes før koding -->
    <div data-demo-only="true" style="display:flex;gap:4px">
      <button class="ikon" data-tilstand="fylt" aria-pressed="true" aria-label="Demo: fylt" data-od-id="an-demo-fylt"><span class="num" style="font-size:10px">F</span></button>
      <button class="ikon" data-tilstand="tom" aria-pressed="false" aria-label="Demo: tom" data-od-id="an-demo-tom"><span class="num" style="font-size:10px">T</span></button>
      <button class="ikon" data-tilstand="laster" aria-pressed="false" aria-label="Demo: laster" data-od-id="an-demo-laster"><span class="num" style="font-size:10px">L</span></button>
      <button class="ikon" data-tilstand="feil" aria-pressed="false" aria-label="Demo: feil" data-od-id="an-demo-feil"><span class="num" style="font-size:10px">E</span></button>
    </div>
    <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="an-theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="segs" role="group" aria-label="Hva du ser på">
    <button data-fane="sg" aria-current="true" data-od-id="an-fane-sg">Strokes Gained</button>
    <button data-fane="trening" aria-current="false" data-od-id="an-fane-trening">Trening</button>
    <button data-fane="tester" aria-current="false" data-od-id="an-fane-tester">Tester</button>
  </div>
  <main class="kropp" id="kropp"></main>
  <div class="dokk" id="dokk"></div>

  <nav class="faner" aria-label="Hovednavigasjon">
    <a href="playerhq-chat-mobil.html" data-od-id="tab-idag">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>I dag</a>
    <a href="playerhq-plan.html" data-od-id="tab-plan">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</a>
    <a href="playerhq-analyse.html" aria-current="page" data-od-id="tab-analyse">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Analyse</a>
    <a href="playerhq-analyse.html#meg" data-od-id="tab-meg">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Meg</a>
  </nav>

  <div class="scrim" id="scrim"></div>


</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ PlayerHQ · Analyse · datamodell ═══
   Kilder: Round · Shot · HoleScore · SgInsight · TestResult · TrainingLog
   Kun brutto score. Norsk tallformat med komma. Putt i fot med meter i parentes. */

var SG = {
  total: 2.92,
  deler: [ {n:'Tee', v:0.81}, {n:'Innspill', v:-0.44}, {n:'Nærspill', v:1.20}, {n:'Putt', v:1.35} ],
  runder: 10, vindu: '01.05–31.07'
};

/* Ti runder, brutto score. Eldst først. */
var RUNDER = [76, 74, 75, 71, 73, 68, 74, 72, 70, 71];

var TRENING = {
  timer: 21.5, okter: 21, vindu: 'siste 30 dager',
  pyr: [ {k:'FYS', v:26}, {k:'TEK', v:31}, {k:'SLAG', v:22}, {k:'SPILL', v:13}, {k:'TURN', v:8} ],
  omrader: [ ['Innspill 50–100', '6 t 10 min'], ['Putt 3–5 ft (0,9–1,5 m)', '3 t 40 min'],
             ['Chip', '2 t 50 min'], ['Tee Total', '2 t 20 min'], ['Bunker', '1 t 10 min'] ]
};

var TESTER = [
  ['Inspill Basic', '7 av 12 innenfor 4 m', '30.07'],
  ['Putt Gate', '24 av 30', '28.07'],
  ['Nærspill Gate', '15 av 20', '26.07'],
  ['Putt Speed Control', '18 av 24', '15.07'],
  ['Clubhead Speed (CHS)', null, null],
  ['Trapbarmarkløft', null, null]
];

var fane = 'sg', tilstand = 'fylt', lagtTil = false;

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function komma(n){ return String(n).replace('.', ','); }
/* Minus-tegn (−), ikke bindestrek. Pluss alltid med. Ordliste B23. */
function sgTekst(v){ return (v > 0 ? '+' : v < 0 ? '−' : '') + komma(Math.abs(v).toFixed(2)); }
function svakest(){ return SG.deler.slice().sort(function(a,b){ return a.v - b.v; })[0]; }

function why(id, linjer){
  var d = el('details', 'why'); d.dataset.odId = 'an-why-' + id;
  d.appendChild(el('summary', null, 'Hvorfor dette tallet'));
  var ul = document.createElement('ul');
  linjer.forEach(function(t){ ul.appendChild(el('li', null, t)); });
  d.appendChild(ul);
  return d;
}

function renderSG(w){
  var k = el('div', 'kort');
  k.appendChild(el('span', 'eyebrow', 'sg total'));
  var h = el('div', 'hero');
  h.appendChild(el('span', 'v num ' + (SG.total >= 0 ? 'pos' : 'neg'), sgTekst(SG.total)));
  h.appendChild(el('span', 'u', 'slag mot kat. D-referansen'));
  k.appendChild(h);
  k.appendChild(el('span', 'vindu num', SG.runder + ' runder · ' + SG.vindu));

  /* SgBreakdown: nullinje i midten, positivt til høyre, negativt til venstre.
     Skala er felles for alle fire, ellers kan man ikke sammenligne dem. */
  var maks = Math.max.apply(null, SG.deler.map(function(d){ return Math.abs(d.v); }));
  var sg = el('div', 'sg');
  SG.deler.forEach(function(d){
    var r = el('div', 'sgrad');
    r.appendChild(el('span', 'n', d.n));
    var sp = el('span', 'spor');
    sp.appendChild(el('span', 'null'));
    var i = document.createElement('i');
    i.className = d.v >= 0 ? 'pos' : 'neg';
    i.style.width = (Math.abs(d.v) / maks * 48) + '%';
    sp.appendChild(i);
    r.appendChild(sp);
    r.appendChild(el('span', 'v num ' + (d.v >= 0 ? 'pos' : 'neg'), sgTekst(d.v)));
    sg.appendChild(r);
  });
  k.appendChild(sg);

  var s = svakest();
  var note = el('p', 'sgsvak');
  note.textContent = s.v < 0
    ? s.n + ' er det eneste området som koster deg slag. De tre andre sparer slag.'
    : s.n + ' er området som sparer minst. Ingen av områdene koster deg slag.';
  k.appendChild(note);

  k.appendChild(why('sg', [
    'Kilde: dine ' + SG.runder + ' siste registrerte runder, brutto score. Tidsvindu ' + SG.vindu + '.',
    'Beregning: SG måler slag spart mot kat. D-referansen, ikke mot par. Delene summerer til totalen.',
    'Forbehold: tre av rundene mangler puttdata. SG putt er anslag, og totalen bærer det anslaget.'
  ]));
  w.appendChild(k);

  /* Sparkline over ti runder */
  var t = el('div', 'kort');
  t.appendChild(el('span', 'eyebrow', 'score · siste ti runder'));
  var maksS = Math.max.apply(null, RUNDER), minS = Math.min.apply(null, RUNDER);
  var bredde = 300, hoyde = 60;
  var pts = RUNDER.map(function(v, i){
    var x = i / (RUNDER.length - 1) * bredde;
    var y = hoyde - (maksS - v) / (maksS - minS) * hoyde;
    return [x, y];
  });
  var svg = '<svg viewBox="0 0 ' + bredde + ' ' + (hoyde + 8) + '" preserveAspectRatio="none" role="img" ' +
    'aria-label="Score siste ti runder, fra ' + RUNDER[0] + ' til ' + RUNDER[RUNDER.length-1] + '">' +
    '<polyline class="flate" points="0,' + (hoyde+8) + ' ' +
      pts.map(function(p){ return p[0]+','+p[1]; }).join(' ') + ' ' + bredde + ',' + (hoyde+8) + '"/>' +
    '<polyline class="linje" points="' + pts.map(function(p){ return p[0]+','+p[1]; }).join(' ') + '"/>' +
    pts.map(function(p, i){ return i === pts.length-1
      ? '<circle class="pkt" cx="'+p[0]+'" cy="'+p[1]+'" r="3.5"/>' : ''; }).join('') +
    '</svg>';
  var tw = el('div', 'trend'); tw.innerHTML = svg; t.appendChild(tw);
  var tm = el('div', 'trendmeta');
  tm.appendChild(el('span', null, 'beste ' + minS));
  tm.appendChild(el('span', null, 'snitt ' + komma((RUNDER.reduce(function(a,b){return a+b;},0)/RUNDER.length).toFixed(1))));
  tm.appendChild(el('span', null, 'siste ' + RUNDER[RUNDER.length-1]));
  t.appendChild(tm);
  t.appendChild(why('score', [
    'Kilde: brutto score fra de ' + RUNDER.length + ' siste registrerte rundene. Eldste til venstre.',
    'Beregning: ingen justering for banevanskelighet. Grafen viser tallene slik de ble spilt.',
    'Forbehold: uten course rating er en 71 på en lett bane og en 71 på en vanskelig bane samme punkt her.'
  ]));
  w.appendChild(t);
}

function renderTrening(w){
  var k = el('div', 'kort');
  k.appendChild(el('span', 'eyebrow', 'trening · ' + TRENING.vindu));
  var h = el('div', 'hero');
  h.appendChild(el('span', 'v num', komma(TRENING.timer)));
  h.appendChild(el('span', 'u', 'timer · ' + TRENING.okter + ' økter'));
  k.appendChild(h);

  var p = el('div', 'pyr');
  TRENING.pyr.forEach(function(x){
    var r = el('div', 'pyrad');
    r.appendChild(el('span', null, x.k));
    var b = el('span', 'b'); var i = document.createElement('i');
    i.className = 'f-' + x.k; i.style.width = x.v + '%'; b.appendChild(i);
    r.appendChild(b);
    r.appendChild(el('span', 'v', x.v + ' %'));
    p.appendChild(r);
  });
  k.appendChild(p);
  k.appendChild(why('pyramide', [
    'Kilde: ' + TRENING.okter + ' loggede økter ' + TRENING.vindu + '. Bare økter du har markert som ferdige teller.',
    'Beregning: andel av samlet treningstid per pyramideakse. Turneringsrunder er holdt utenfor.',
    'Forbehold: en økt med drills fra flere akser fordeles på drill-tid, ikke på øktas hovedakse.'
  ]));
  w.appendChild(k);

  var o = el('div', 'kort');
  o.appendChild(el('span', 'eyebrow', 'mest trente områder'));
  var tab = el('table', 'tab');
  var thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Område</th><th style="text-align:right">Tid</th></tr>';
  tab.appendChild(thead);
  var tb = document.createElement('tbody');
  TRENING.omrader.forEach(function(row){
    var tr = document.createElement('tr');
    tr.appendChild(el('td', null, row[0]));
    tr.appendChild(el('td', 'r', row[1]));
    tb.appendChild(tr);
  });
  tab.appendChild(tb); o.appendChild(tab);
  w.appendChild(o);
}

function renderTester(w){
  var k = el('div', 'kort');
  k.appendChild(el('span', 'eyebrow', 'tester'));
  var tatt = TESTER.filter(function(t){ return t[1]; });
  var tab = el('table', 'tab');
  var thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Test</th><th style="text-align:right">Resultat</th></tr>';
  tab.appendChild(thead);
  var tb = document.createElement('tbody');
  TESTER.forEach(function(t){
    var tr = document.createElement('tr');
    tr.appendChild(el('td', t[1] ? null : 'ikketatt', t[0]));
    var td = el('td', 'r');
    if (t[1]){ td.appendChild(document.createTextNode(t[1]));
      td.appendChild(el('span', 'd', t[2])); }
    else { td.className = 'r ikketatt'; td.textContent = 'ikke tatt'; }
    tr.appendChild(td);
    tb.appendChild(tr);
  });
  tab.appendChild(tb); k.appendChild(tab);
  k.appendChild(why('tester', [
    'Kilde: TestResult — ' + tatt.length + ' av ' + TESTER.length + ' protokoller gjennomført.',
    'Beregning: ingen. Tallene er registrert slik de ble målt, uten omregning.',
    'Forbehold: terskelverdiene per kategori er ikke verifisert mot dagens A–K-tabell. Resultatet står, vurderingen mangler.'
  ]));
  w.appendChild(k);
}

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';

  if (tilstand === 'laster'){
    for (var i = 0; i < 7; i++){ var s = el('div', 'skel'); s.style.width = (95 - i*7) + '%'; w.appendChild(s); }
    document.getElementById('dokk').innerHTML = ''; return;
  }
  if (tilstand === 'tom'){
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Ingen runder registrert ennå'));
    t.appendChild(el('p', null,
      'Analysen bygger på registrerte runder. Logg én, så har du et utgangspunkt å måle mot.'));
    var b = el('button', 'btn full', 'Logg en runde'); b.dataset.odId = 'an-tom-logg';
    b.addEventListener('click', function(){ toast('Runde-logging åpnes fra I dag.'); });
    t.appendChild(b); w.appendChild(t);
    document.getElementById('dokk').innerHTML = ''; return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Noe gikk galt'));
    f.appendChild(el('p', null, 'Klarte ikke å hente analysen. Rundene dine er ikke berørt.'));
    var fb = el('button', 'btn full', 'Prøv igjen'); fb.dataset.odId = 'an-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f);
    document.getElementById('dokk').innerHTML = ''; return;
  }

  w.appendChild(el('p', 'merknad',
    'Tallene er målinger, ikke karakterer. Ingen terskler er vurdert — regler og låser er midlertidig ute.'));

  if (fane === 'sg') renderSG(w);
  else if (fane === 'trening') renderTrening(w);
  else renderTester(w);

  renderDokk();
}

/* Én ting nå: analysen peker på ett område, og handlingen følger av den.
   Spilleren kan legge inn økta selv — Anders får varsling. */
function renderDokk(){
  var w = document.getElementById('dokk'); w.innerHTML = '';
  var s = svakest();
  if (lagtTil){
    var b2 = el('button', 'btn ink full', 'Se uka i Plan');
    b2.dataset.odId = 'an-se-plan';
    b2.addEventListener('click', function(){ window.location.href = 'playerhq-plan.html'; });
    w.appendChild(b2); return;
  }
  var b = el('button', 'btn now full', 'Legg inn ' + s.n.toLowerCase() + '-økt denne uka');
  b.dataset.odId = 'an-en-ting-na';
  b.addEventListener('click', function(){
    lagtTil = true; renderDokk();
    si('Økt på ' + s.n.toLowerCase() + ' er lagt inn i uke 32. Anders har fått varsling.');
    toast('Lagt inn · Anders har fått beskjed');
  });
  w.appendChild(b);
}

document.querySelectorAll('.segs button').forEach(function(b){
  b.addEventListener('click', function(){
    fane = b.dataset.fane;
    document.querySelectorAll('.segs button').forEach(function(x){ x.setAttribute('aria-current','false'); });
    b.setAttribute('aria-current','true');
    render(); si('Viser ' + b.textContent + '.');
  });
});

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){ tilstand = b.dataset.tilstand; settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();

</script>
</body>
</html>

<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book time · PlayerHQ · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }

/* ═══ Booking · PlayerHQ ═══
   Øyvind har allerede konto, abonnement og en coach. Derfor er dette en
   kortere flyt enn den offentlige siden: ingen tjenestevalg, ingen
   opplysninger å fylle ut, ingen vilkår å godta. Bare tid.

   EIERSKAPET (Anders 01.08.2026): lukene her er tider Anders selv har lagt
   ut som ledige. Å ta en av dem er ikke å be om lov — det er å ta en time
   han allerede har åpnet. Derfor bekreftes bookingen med én gang, og Anders
   får VARSLING. Den offentlige siden er motsatt: en fremmed har ingen
   relasjon, og der er det en forespørsel som må besvares.

   LÅST: kun coachingtid. Simulatortid selges ikke. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button,input,select,textarea{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.full{ width:100%; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.btn.farlig{ color:var(--dn); border-color:var(--dn); }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.info{ color:var(--info); }

.phone{ width:430px; max-width:100%; height:932px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }
.phone .scrim,.phone .ark{ position:absolute; }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s3);
  padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:18px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) var(--s5); }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s3); }
.kort > .eyebrow{ display:block; margin-bottom:var(--s2); }
.kilde{ display:block; font-family:var(--mono); font-size:9px; color:var(--mid);
  letter-spacing:.04em; margin-bottom:var(--s3); }
.kort h2{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.kort p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13px; color:var(--muted); }

.nowblock{ background:var(--accent-soft); border:1px solid var(--border);
  border-left:3px solid var(--accent); border-radius:var(--r); padding:var(--s4);
  margin-bottom:var(--s3); }
.nowblock .eyebrow{ color:var(--accent-fg); }
.nowblock h2{ margin:var(--s1) 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.nowblock p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13px; color:var(--muted); }

/* Dagpiller — samme komponent som Plan og Workbench mobil */
.dager{ display:flex; gap:var(--s2); overflow-x:auto; scrollbar-width:none;
  margin-bottom:var(--s4); padding-bottom:var(--s1); }
.dager::-webkit-scrollbar{ display:none; }
.dpill{ flex:none; width:60px; min-height:72px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.dpill .dw{ font-family:var(--mono); font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); }
.dpill .dd{ font-family:var(--mono); font-size:16px; font-weight:600; }
.dpill .n{ font-family:var(--mono); font-size:9.5px; color:var(--muted); }
.dpill[aria-pressed="true"]{ background:var(--fg); border-color:var(--fg); }
.dpill[aria-pressed="true"] .dw,.dpill[aria-pressed="true"] .dd,.dpill[aria-pressed="true"] .n{ color:var(--bg); }
.dpill[aria-disabled="true"]{ opacity:.42; cursor:not-allowed; }
.dpill.harokt::after{ content:""; width:5px; height:5px; border-radius:var(--r-pill);
  background:var(--info); }

.tider{ display:grid; grid-template-columns:repeat(auto-fill, minmax(124px,1fr)); gap:var(--s2); }
.tid{ min-height:56px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); cursor:pointer; font-family:var(--mono); font-size:15px; }
.tid small{ font-family:var(--body); font-size:11px; color:var(--muted); margin-top:1px; }
.tid[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
.tid[aria-pressed="true"] small{ color:var(--bg); opacity:.82; }

/* Egne timer */
.min{ display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
  padding:var(--s3) var(--s4); margin-bottom:var(--s2); background:var(--surface);
  border:1px solid var(--border); border-left:3px solid var(--info);
  border-radius:var(--r); cursor:pointer; min-height:var(--tap); }
.min .kl{ font-family:var(--mono); font-size:12.5px; color:var(--muted); white-space:nowrap; }
.min .t{ display:block; font-size:13.5px; font-weight:600; }
.min .s{ display:block; font-family:var(--body); font-size:12px; color:var(--muted); }
.min .pil{ margin-left:auto; color:var(--muted); }

.rad{ display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 0;
  border-bottom:1px solid var(--border-soft); font-size:13.5px; min-height:var(--tap); }
.rad:last-of-type{ border-bottom:0; }
.rad .v{ margin-left:auto; font-family:var(--mono); font-size:13px; text-align:right; }

.tom{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--s3);
  padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); margin-bottom:var(--s3); }
.tom h2{ margin:0; font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }

.merk{ display:flex; gap:var(--s3); padding:var(--s3) var(--s4); background:var(--soft);
  border:1px solid var(--border); border-radius:var(--r); margin-bottom:var(--s3); }
.merk svg{ width:16px; height:16px; flex:none; margin-top:2px; fill:none;
  stroke:var(--muted); stroke-width:1.7; }
.merk p{ margin:0; font-family:var(--body); font-size:12.5px; color:var(--muted); }

.bunn{ flex:none; padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  border-top:1px solid var(--border); background:var(--surface); }
.bunn .hint{ display:block; font-family:var(--body); font-size:12px; color:var(--muted);
  margin-bottom:var(--s2); }

.faner{ flex:none; display:flex; background:var(--rail); z-index:var(--z-rail);
  padding-bottom:env(safe-area-inset-bottom); }
.faner a{ flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; color:var(--rail-fg); text-decoration:none;
  font-size:10px; position:relative; }
.faner a svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.faner a[aria-current="page"]{ color:var(--rail-on); }
.faner a[aria-current="page"]::before{ content:""; position:absolute; top:0; left:24%; right:24%;
  height:2px; background:var(--rail-on); border-radius:var(--r-pill); }

.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:var(--z-sheet); display:none; }
.scrim.on{ display:block; }
.ark{ position:fixed; left:0; right:0; bottom:0; z-index:calc(var(--z-sheet) + 1);
  max-height:88%; background:var(--surface); border-top:1px solid var(--border);
  border-radius:var(--r-lg) var(--r-lg) 0 0; display:none; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom); }
.ark.on{ display:flex; }
.grab{ flex:none; width:36px; height:4px; border-radius:var(--r-pill);
  background:var(--border); margin:var(--s3) auto var(--s2); }
.ahead{ flex:none; display:flex; align-items:flex-start; gap:var(--s2);
  padding:0 var(--s4) var(--s3); border-bottom:1px solid var(--border); }
.ahead h2{ margin:0; font-family:var(--disp); font-size:16px; font-weight:600; }
.ahead .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.abody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }
.afoot{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  border-top:1px solid var(--border); }
.afoot .btn{ flex:1; }
.felt{ margin-bottom:var(--s3); }
.felt label{ display:block; font-size:13px; font-weight:500; margin-bottom:var(--s1); }
.felt textarea{ width:100%; min-height:80px; padding:var(--s2) var(--s3); background:var(--bg);
  border:1px solid var(--border); border-radius:var(--r-sm); font-size:15px; resize:vertical; }
.felt .hjelp{ display:block; font-family:var(--body); font-size:12px; color:var(--muted);
  margin-top:var(--s1); }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,summary,textarea,.dpill,.tid,.min{ min-height:var(--tap); }
.tag,.num,.eyebrow,.kilde,.rad .v,.dpill .dw,.dpill .dd,.dpill .n,.min .kl{ min-height:0; }

</style>
</head>
<body>
<p class="framehint">PlayerHQ · Book time · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">

    </button>
  </header>

  <main class="kropp" id="kropp"></main>

  <div class="bunn" id="bunn"></div>

  <nav class="faner" aria-label="Hovedmeny">

      I dag</a>
    <a href="playerhq-plan.html" aria-current="page" data-od-id="pb-fane-plan">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Plan</a>
    <a href="playerhq-analyse.html" data-od-id="pb-fane-analyse">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Analyse</a>
    <a href="playerhq-meg.html" data-od-id="pb-fane-meg">

<section class="ark" id="ark" role="dialog" aria-modal="true" aria-labelledby="arkTitle" hidden>
  <div class="grab"></div>
  <div class="ahead">

      <span class="sub" id="arkSub">—</span>
    </div>
    <span style="flex:1"></span>

      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="abody" id="arkBody"></div>
  <div class="afoot" id="arkFoot"></div>
</section>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ Booking · PlayerHQ ═══
   Kilder: coach_availability · Booking · CoachingSession · Subscription · User

   Lukene er tider Anders har lagt ut som ledige i Innstillinger
   (coach_availability, arbeidsuke 08:00–18:00 man–fre, minus det som allerede
   er booket). Å ta en av dem bekreftes med én gang — Anders har åpnet dem
   selv, og da er det ikke noe å be om lov til. Han får VARSLING.

   Dette skiller seg fra booking.html: der er avsenderen en fremmed uten
   relasjon, og der er det en forespørsel som må besvares innen 48 timer.

   LÅST: kun coachingtid. Simulatortid selges ikke og finnes ikke her. */

var DAGER = [
  { dw:'man', dd:'4.8',  n:'mandag 4. august',   ledig:['12:00','13:00'],          minOkt:null },
  { dw:'tir', dd:'5.8',  n:'tirsdag 5. august',  ledig:['13:00','14:00'],          minOkt:'15:00 · Innspill · lengdekontroll' },
  { dw:'ons', dd:'6.8',  n:'onsdag 6. august',   ledig:[],                         minOkt:null },
  { dw:'tor', dd:'7.8',  n:'torsdag 7. august',  ledig:['13:00','14:00','15:00'],  minOkt:'16:00 · Nærspill · landingspunkt' },
  { dw:'fre', dd:'8.8',  n:'fredag 8. august',   ledig:['10:00','11:00'],          minOkt:null },
  { dw:'lør', dd:'9.8',  n:'lørdag 9. august',   ledig:[],                         minOkt:'09:00 · Testrunde 18 hull' },
  { dw:'søn', dd:'10.8', n:'søndag 10. august',  ledig:[],                         minOkt:null }
];

/* Én lokasjon ved lansering. Miklagard og Mulligan er active = false i
   locations og skal ikke vises noe sted. */
var LOKASJON = 'Gamle Fredrikstad GK';
function stedFor(){ return LOKASJON; }

/* Øktene Øyvind allerede har booket. Varigheten er 20 minutter fordi det er
   det abonnementsøkta ER — ikke fordi noen valgte 20 i en nedtrekksliste. */
var MINE = [
  { id:'b1', dag:'5.8', kl:'15:00', varighet:20, sted:LOKASJON,
    tema:'Innspill · lengdekontroll', status:'bekreftet' }
];

/* Abonnementet fra service_types: Performance = 2 × 20 min per måned,
   Performance Pro = 4 × 20 min. Aldri «40 min» eller «80 min» — antallet
   økter er poenget, ikke summen av minutter. */
var ABO = { plan:'Performance', pris:1300, okter:2, brukt:1, min:20,
            periode:'august', playerhq:true, rullerer:false };

var SJEKKPUNKT = { dato:'14.08', tema:'innspill 50–100 m' };

var valgtDag = null, valgtTid = null, notat = '', bookingId = 2;

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2800); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function heltall(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function dag(dd){ return DAGER.filter(function(d){ return d.dd === dd; })[0]; }
function ledigeTotalt(){ return DAGER.reduce(function(s,d){ return s + d.ledig.length; }, 0); }
/* Første ledige luke i uka — grunnlaget for Én ting nå. */
function forsteLedige(){
  for (var i = 0; i < DAGER.length; i++)
    if (DAGER[i].ledig.length) return { dag:DAGER[i], kl:DAGER[i].ledig[0] };
  return null;
}

/* ── Kropp ───────────────────────────────────────────────────── */
function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';

  /* Én ting nå: sjekkpunktet 14.08 nærmer seg, og det er ledige timer før det.
     Peker på en konkret luke, ikke på «book en time» generelt. */
  var f = forsteLedige();
  if (f && !valgtTid){
    var v = el('div','nowblock');
    v.appendChild(document.createComment(' kilde: coach_availability, training_plans '));
    v.appendChild(el('span','eyebrow','Én ting nå'));
    v.appendChild(el('h2', null, 'Sjekkpunktet ' + SJEKKPUNKT.dato + ' er om to uker'));
    /* Restsaldoen regnes, aldri skrives. Sto det «én time igjen» som fast
       tekst, løy blokka i det øyeblikket du booket den siste. */
    var igjen = ABO.okter - ABO.brukt;
    var saldo = igjen > 0
      ? 'Du har ' + (igjen === 1 ? 'én økt' : igjen + ' økter') +
        ' igjen i abonnementet denne måneden, og første ledige er '
      : 'Abonnementsøktene dine er brukt opp denne måneden. En økt til ' +
        'avtales med Anders. Første ledige er ';
    v.appendChild(el('p', null,
      'Det måler ' + SJEKKPUNKT.tema + '. ' + saldo + f.dag.n + ' kl. ' + f.kl +
      ' på ' + (stedFor()) + '.'));
    var b = el('button','btn now full', 'Ta ' + f.dag.dw + ' ' + f.kl);
    b.type = 'button'; b.dataset.odId = 'pb-one-thing-now';
    b.addEventListener('click', function(){
      valgtDag = f.dag.dd; valgtTid = f.kl; render(); apneArk();
    });
    v.appendChild(b);
    w.appendChild(v);
  }

  /* Mine timer */
  var m = el('section','kort');
  m.appendChild(document.createComment(' kilde: bookings '));
  m.appendChild(el('span','eyebrow','Dine timer'));
  m.appendChild(el('span','kilde','kilde: bookings'));
  if (!MINE.length){
    var tm = el('div','tom');
    tm.appendChild(el('h2', null, 'Ingen timer booket'));
    tm.appendChild(el('p', null,
      'Du har ingen coachingtime med Anders denne uka. Ledige tider ligger under.'));
    m.appendChild(tm);
  } else {
    MINE.forEach(function(t){
      var b = el('button','min'); b.type = 'button';
      b.dataset.odId = 'pb-min-' + t.id;
      b.appendChild(el('span','kl', dag(t.dag).dw + ' ' + t.kl));
      var d = el('span');
      d.appendChild(el('span','t', t.tema));
      d.appendChild(el('span','s', t.sted + ' · ' + t.varighet + ' min'));
      b.appendChild(d);
      b.appendChild(el('span','pil','›'));
      b.addEventListener('click', function(){ apneMin(t); });
      m.appendChild(b);
    });
  }
  w.appendChild(m);

  /* Abonnement */
  var a = el('section','kort');
  a.appendChild(document.createComment(' kilde: service_types '));
  a.appendChild(el('span','eyebrow','Abonnement'));
  a.appendChild(el('span','kilde','kilde: service_types'));
  a.appendChild(rad(ABO.plan, heltall(ABO.pris) + ' kr/mnd'));
  /* «2 × 20 min», aldri «40 min». */
  a.appendChild(rad('Inkludert', ABO.okter + ' × ' + ABO.min + ' min per måned'));
  a.appendChild(rad('Brukt i ' + ABO.periode, ABO.brukt + ' av ' + ABO.okter));
  if (ABO.playerhq) a.appendChild(rad('PlayerHQ', 'inkludert'));
  a.appendChild(rad('Ubrukte økter', ABO.rullerer ? 'overføres' : 'nullstilles ved månedsskifte'));
  w.appendChild(a);

  /* Ledige tider */
  var l = el('section','kort');
  l.appendChild(document.createComment(' kilde: coach_availability, bookings '));
  l.appendChild(el('span','eyebrow','Ledige tider'));
  l.appendChild(el('span','kilde','kilde: coach_availability, bookings'));

  if (!ledigeTotalt()){
    var tl = el('div','tom');
    tl.appendChild(el('h2', null, 'Ingen ledige tider denne uka'));
    tl.appendChild(el('p', null,
      'Anders har ikke lagt ut flere luker. Skriv til ham i tråden, så finner ' +
      'dere en tid sammen.'));
    var sb = el('button','btn','Skriv til Anders'); sb.type = 'button';
    sb.dataset.odId = 'pb-tom-skriv';
    sb.addEventListener('click', function(){ location.href = 'playerhq-chat-mobil.html'; });
    tl.appendChild(sb);
    l.appendChild(tl);
    w.appendChild(l);
    renderBunn(); return;
  }

  var dw = el('div','dager'); dw.setAttribute('role','group');
  dw.setAttribute('aria-label','Velg dag');
  DAGER.forEach(function(d){
    var b = el('button','dpill' + (d.minOkt ? ' harokt' : '')); b.type = 'button';
    b.dataset.odId = 'pb-dag-' + d.dd;
    b.setAttribute('aria-pressed', String(valgtDag === d.dd));
    if (!d.ledig.length) b.setAttribute('aria-disabled','true');
    b.appendChild(el('span','dw', d.dw));
    b.appendChild(el('span','dd', d.dd));
    b.appendChild(el('span','n', d.ledig.length ? d.ledig.length + ' ledig' : '—'));
    b.setAttribute('aria-label', d.n + ' · ' +
      (d.ledig.length ? d.ledig.length + (d.ledig.length === 1 ? ' ledig tid' : ' ledige tider')
                      : 'ingen ledige tider') +
      (d.minOkt ? ' · du har økt denne dagen' : ''));
    b.addEventListener('click', function(){
      if (!d.ledig.length){
        toast('Ingen ledige tider ' + d.n + '.');
        si('Ingen ledige tider ' + d.n + '.'); return;
      }
      valgtDag = d.dd; valgtTid = null; render();
      si(d.n + ' · ' + d.ledig.length +
         (d.ledig.length === 1 ? ' ledig tid.' : ' ledige tider.'));
    });
    dw.appendChild(b);
  });
  l.appendChild(dw);

  if (!valgtDag){
    var mk = el('div','merk');
    mk.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
    mk.appendChild(el('p', null,
      'Velg en dag. Blå prikk betyr at du allerede har en økt den dagen — ' +
      'du kan fortsatt booke, men da blir det to.'));
    l.appendChild(mk);
  } else {
    var d2 = dag(valgtDag);
    if (d2.minOkt){
      var mo = el('div','merk');
      mo.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>';
      mo.appendChild(el('p', null,
        'Du har allerede ' + d2.minOkt + ' denne dagen. Booker du en time til, ' +
        'blir det to økter samme dag.'));
      l.appendChild(mo);
    }
    var tw = el('div','tider'); tw.setAttribute('role','group');
    tw.setAttribute('aria-label','Velg klokkeslett ' + d2.n);
    d2.ledig.forEach(function(kl){
      var b = el('button','tid'); b.type = 'button';
      b.dataset.odId = 'pb-tid-' + kl.replace(':','');
      b.setAttribute('aria-pressed', String(valgtTid === kl));
      b.appendChild(document.createTextNode(kl));
      b.appendChild(el('small', null, stedFor()));
      b.addEventListener('click', function(){
        valgtTid = kl; render();
        si(kl + ' valgt på ' + (stedFor()) + '.');
      });
      tw.appendChild(b);
    });
    l.appendChild(tw);
  }
  w.appendChild(l);

  var s = el('div','merk');
  s.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
  s.appendChild(el('p', null,
    'Tidene over er luker Anders har lagt ut selv. Tar du en av dem, er den ' +
    'din med én gang — han får beskjed, du skal ikke vente på svar.'));
  w.appendChild(s);

  renderBunn();
}

function rad(k, v){
  var r = el('div','rad');
  r.appendChild(el('span', null, k));
  r.appendChild(el('span','v num', v));
  return r;
}

/* ── Bunn ────────────────────────────────────────────────────── */
function renderBunn(){
  var w = document.getElementById('bunn'); w.innerHTML = '';
  if (!ledigeTotalt()){ w.hidden = true; return; }
  w.hidden = false;
  if (valgtTid){
    var d = dag(valgtDag);
    w.appendChild(el('span','hint', d.n + ' kl. ' + valgtTid + ' · ' + (stedFor())));
    var b = el('button','btn ink full','Se over og book'); b.type = 'button';
    b.dataset.odId = 'pb-book';
    b.addEventListener('click', apneArk);
    w.appendChild(b);
  } else {
    w.appendChild(el('span','hint', valgtDag
      ? 'Velg et klokkeslett ' + dag(valgtDag).n + '.'
      : 'Velg en dag med ledig tid.'));
    var b2 = el('button','btn full', valgtDag ? 'Velg et klokkeslett' : 'Velg en dag');
    b2.type = 'button'; b2.dataset.odId = 'pb-neste';
    b2.addEventListener('click', function(){
      var mål = document.querySelector(valgtDag ? '.tider' : '.dager');
      if (mål){ mål.scrollIntoView({behavior:'smooth', block:'center'});
                var f = mål.querySelector('button'); if (f) f.focus(); }
      si(valgtDag ? 'Velg et klokkeslett i lista.' : 'Velg en dag i rekka.');
    });
    w.appendChild(b2);
  }
}

/* ── Ark ─────────────────────────────────────────────────────── */
var ark = document.getElementById('ark'), scrim = document.getElementById('scrim'),
    arkBody = document.getElementById('arkBody'), arkFoot = document.getElementById('arkFoot'),
    sisteFokus = null;
function apne(){
  sisteFokus = document.activeElement;
  ark.hidden = false; scrim.hidden = false;
  ark.classList.add('on'); scrim.classList.add('on');
  var f = ark.querySelector('button, textarea'); if (f) f.focus();
}
function lukk(){
  ark.classList.remove('on'); scrim.classList.remove('on');
  ark.hidden = true; scrim.hidden = true;
  if (sisteFokus && sisteFokus.isConnected) sisteFokus.focus();
}
scrim.addEventListener('click', lukk);
ark.querySelector('[data-lukk]').addEventListener('click', lukk);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !ark.hidden){ e.preventDefault(); lukk(); }
  if (e.key === 'Tab' && !ark.hidden){
    var f = ark.querySelectorAll('button, textarea, [href], [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var a = f[0], b = f[f.length-1];
    if (e.shiftKey && document.activeElement === a){ e.preventDefault(); b.focus(); }
    else if (!e.shiftKey && document.activeElement === b){ e.preventDefault(); a.focus(); }
  }
});

function apneArk(){
  var d = dag(valgtDag);
  document.getElementById('arkTitle').textContent = 'Book ' + d.dw + ' ' + valgtTid;
  document.getElementById('arkSub').textContent = d.n + ' · ' + (stedFor());
  arkBody.innerHTML = ''; arkFoot.innerHTML = '';

  var k = el('div','kort');
  k.appendChild(rad('Coach','Anders Kristiansen'));
  k.appendChild(rad('Varighet', ABO.min + ' min'));
  k.appendChild(rad('Sted', stedFor()));
  k.appendChild(rad('Denne måneden',
    ABO.brukt + 1 <= ABO.okter
      ? 'økt ' + (ABO.brukt + 1) + ' av ' + ABO.okter + ' · inkludert'
      : 'utover abonnementet · avtales med Anders'));
  arkBody.appendChild(k);

  var f = el('div','felt');
  var l = el('label', null, 'Hva vil du jobbe med?'); l.setAttribute('for','pb-notat');
  f.appendChild(l);
  var ta = document.createElement('textarea');
  ta.id = 'pb-notat'; ta.value = notat; ta.dataset.odId = 'pb-notat';
  ta.placeholder = 'Valgfritt.';
  ta.addEventListener('input', function(){ notat = ta.value; });
  f.appendChild(ta);
  f.appendChild(el('span','hjelp',
    'Skriver du noe her, ser Anders det før timen — og det havner i tråden din.'));
  arkBody.appendChild(f);

  var m = el('div','merk');
  m.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
  m.appendChild(el('p', null,
    'Timen er bekreftet med én gang. Anders får varsling. Du kan avbestille ' +
    'gratis fram til 24 timer før.'));
  arkBody.appendChild(m);

  var avbryt = el('button','btn','Avbryt'); avbryt.type = 'button';
  avbryt.dataset.odId = 'pb-avbryt';
  avbryt.addEventListener('click', lukk);
  var ok = el('button','btn ink','Book timen'); ok.type = 'button';
  ok.dataset.odId = 'pb-bekreft';
  ok.addEventListener('click', function(){
    var d2 = dag(valgtDag);
    MINE.push({ id:'b' + (bookingId++), dag:valgtDag, kl:valgtTid, varighet:ABO.min,
                sted: stedFor(),
                tema: notat.trim() || 'Coachingøkt', status:'bekreftet' });
    d2.ledig = d2.ledig.filter(function(x){ return x !== valgtTid; });
    /* minOkt settes IKKE her. Den betyr «treningsøkt fra planen din», ikke
       «coachingtime du nettopp booket» — den bookede timen står allerede
       under Dine timer. Blandet man dem, ble prikken stående igjen på dagen
       etter at timen var avbestilt. */
    ABO.brukt++;
    var kl = valgtTid;
    valgtTid = null; notat = '';
    lukk(); render();
    si('Timen er booket ' + d2.n + ' kl. ' + kl + '. Anders har fått varsling. ' +
       'Luka er borte fra ledige tider.');
    toast('Booket · Anders har fått beskjed');
  });
  arkFoot.appendChild(avbryt); arkFoot.appendChild(ok);
  apne();
}

function apneMin(t){
  var d = dag(t.dag);
  document.getElementById('arkTitle').textContent = t.tema;
  document.getElementById('arkSub').textContent = d.n + ' kl. ' + t.kl + ' · ' + t.sted;
  arkBody.innerHTML = ''; arkFoot.innerHTML = '';
  var k = el('div','kort');
  k.appendChild(rad('Status', t.status));
  k.appendChild(rad('Varighet', t.varighet + ' min'));
  k.appendChild(rad('Coach','Anders Kristiansen'));
  arkBody.appendChild(k);
  var m = el('div','merk');
  m.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  m.appendChild(el('p', null,
    'Avbestiller du senere enn 24 timer før, faktureres timen. Anders får ' +
    'beskjed uansett når du avbestiller.'));
  arkBody.appendChild(m);

  var lukkB = el('button','btn','Lukk'); lukkB.type = 'button';
  lukkB.dataset.odId = 'pb-min-lukk';
  lukkB.addEventListener('click', lukk);
  var avb = el('button','btn farlig','Avbestill'); avb.type = 'button';
  avb.dataset.odId = 'pb-avbestill';
  avb.addEventListener('click', function(){
    MINE = MINE.filter(function(x){ return x.id !== t.id; });
    var d2 = dag(t.dag);
    if (d2.ledig.indexOf(t.kl) === -1 && stedFor()){
      d2.ledig.push(t.kl);
      d2.ledig.sort();
    }
    if (ABO.brukt > 0) ABO.brukt--;
    lukk(); render();
    si('Timen er avbestilt. Luka er tilbake blant ledige tider, og Anders har fått beskjed.');
    toast('Avbestilt · luka er ledig igjen');
  });
  arkFoot.appendChild(lukkB); arkFoot.appendChild(avb);
  apne();
}

document.getElementById('tilbake').addEventListener('click', function(){
  location.href = 'playerhq-plan.html';
});

/* ── Tema ────────────────────────────────────────────────────── */
var KEY = 'akhq-theme-playerhq';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();

</script>

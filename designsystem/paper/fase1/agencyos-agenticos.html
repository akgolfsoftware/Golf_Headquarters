<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgenticOS · AgencyOS · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }

/* ═══ AgenticOS · AgencyOS ═══
   Flata der Anders styrer AI-en, ikke bare bruker den. Seks modeller, én
   ruting, én promptekspert, og agentene som kjører av seg selv.

   To ting som ikke er kosmetikk:

   1. PII-REGELEN ER SYNLIG, IKKE SKJULT. En rutingregel som sier at
      personopplysninger skal til Ollama lokalt, er verdiløs hvis den bare
      finnes i en konfigfil. Den står i lista, med hvilke modeller den
      utelukker, og den kan ikke slås av med samme bryter som resten.

   2. AGENTFEIL HAR EN FLATE Å PEKE TIL. «Agentfeil · Faktura-vakten 03:14»
      ligger allerede som sak i Innboksen. Uten denne skjermen er den saken
      en blindvei. Kolonnen Agenter er målet for den lenken.

   Ingen modell er «best». Rack-et viser målinger — kostnad, latens, oppgave —
   ikke en rangering. Regler og låser er ute i hele systemet; det gjelder her
   også. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-agency); line-height:1.5; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button,input,select,textarea{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap); padding:0 var(--s4); font-size:13px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  min-height:var(--tap-lg); font-weight:600; padding:0 var(--s5); }
.btn.sm{ min-height:var(--tap); padding:0 var(--s3); font-size:12.5px; }
.btn.icon{ width:var(--tap); padding:0; }
.btn.full{ width:100%; }
.chip{ display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  padding:0 var(--s4); font-size:12.5px; background:var(--surface); flex:none;
  border:1px solid var(--border); border-radius:var(--r-pill); cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.app{ display:grid; grid-template-columns:64px minmax(0,1fr); height:100vh; }
.rail{ background:var(--rail); display:flex; flex-direction:column; align-items:center;
  gap:var(--s1); padding:var(--s3) 0; z-index:var(--z-rail); }
.logo{ font-family:var(--disp); font-size:15px; font-weight:700; color:var(--rail-on);
  margin-bottom:var(--s4); }
.logo span{ color:var(--logo-dot); }
.rbtn{ width:52px; min-height:52px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; background:transparent; border:0; border-radius:var(--r);
  color:var(--rail-fg); font-size:9px; cursor:pointer; position:relative; }
.rbtn:hover{ background:var(--rail-hover); color:var(--rail-on); }
.rbtn[aria-current="page"]{ background:var(--rail-active); color:var(--rail-on); }
.rbtn svg{ width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.rbtn .cnt{ position:absolute; top:4px; right:6px; font-family:var(--mono); font-size:9px;
  min-width:15px; height:15px; display:grid; place-items:center; border-radius:var(--r-pill);
  background:var(--rail-on); color:var(--rail); }

.stage{ display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
.top{ flex:none; display:flex; align-items:center; gap:var(--s3);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.top h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.top .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.faner{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border-soft);
  background:var(--softer); }
.faner::-webkit-scrollbar{ display:none; }
.kropp{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4)
  calc(var(--s4) + env(safe-area-inset-bottom)); }
.kropp > *{ max-width:1080px; }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s3); }
.kort > .eyebrow{ display:block; margin-bottom:var(--s1); }
.kilde{ display:block; font-family:var(--mono); font-size:9px; color:var(--mid);
  letter-spacing:.04em; margin-bottom:var(--s3); }
.kort h2{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.kort p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13px; color:var(--muted); }

.nowblock{ background:var(--accent-soft); border:1px solid var(--border);
  border-left:3px solid var(--accent); border-radius:var(--r); padding:var(--s4);
  margin-bottom:var(--s3); }
.nowblock .eyebrow{ color:var(--accent-fg); }
.nowblock h2{ margin:var(--s1) 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.nowblock p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13px; color:var(--muted); }

/* ── Modellrack ──────────────────────────────────────────────── */
.rack{ display:grid; grid-template-columns:repeat(auto-fill, minmax(252px,1fr)); gap:var(--s3); }
.mod{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--s2);
  text-align:left; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); padding:var(--s4); cursor:pointer; }
.mod:hover{ border-color:var(--mid); }
.mod[aria-current="true"]{ border-color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg); }
.mod .navn{ display:flex; align-items:baseline; gap:var(--s2); width:100%; }
.mod h3{ margin:0; font-family:var(--disp); font-size:14.5px; font-weight:600; }
.mod .vert{ margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--mid); }
.mod .oppg{ font-family:var(--body); font-size:12.5px; color:var(--muted); }
.mod .tall{ display:flex; gap:var(--s4); width:100%; margin-top:var(--s1);
  padding-top:var(--s2); border-top:1px solid var(--border-soft); }
.mod .tall div{ min-width:0; }
.mod .tall .k{ display:block; font-family:var(--mono); font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--mid); }
.mod .tall .v{ display:block; font-family:var(--mono); font-size:15px; }

.status{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono);
  font-size:10.5px; color:var(--muted); }
.status::before{ content:""; width:7px; height:7px; border-radius:var(--r-pill);
  background:var(--mid); flex:none; }
.status.pa::before{ background:var(--up-raw); }
.status.feil::before{ background:var(--dn); }
.status.lokal::before{ background:var(--info-raw); }

/* ── Rader og lister ─────────────────────────────────────────── */
.liste{ border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
.lrad{ display:flex; align-items:center; gap:var(--s3); padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--border-soft); background:var(--surface);
  min-height:var(--tap); font-size:13.5px; width:100%; text-align:left; }
.lrad:last-child{ border-bottom:0; }
button.lrad{ cursor:pointer; border-left:0; border-right:0; border-top:0; }
button.lrad:hover{ background:var(--soft); }
.lrad small{ display:block; font-family:var(--body); font-size:12px; color:var(--muted); }
.lrad .h{ margin-left:auto; flex:none; display:flex; gap:var(--s2); align-items:center; }
.lrad.laas{ background:var(--softer); }

.rad{ display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 0;
  border-bottom:1px solid var(--border-soft); min-height:var(--tap); font-size:13.5px; }
.rad:last-of-type{ border-bottom:0; }
.rad .v{ margin-left:auto; font-family:var(--mono); font-size:13px; text-align:right; }

.bryter{ margin-left:auto; flex:none; width:52px; height:var(--tap); padding:0; border:0;
  background:transparent; cursor:pointer; display:grid; place-items:center; }
.bryter i{ display:block; width:44px; height:26px; border-radius:var(--r-pill);
  background:var(--soft); border:1px solid var(--border); position:relative;
  transition:background var(--dur) var(--ease); }
.bryter i::after{ content:""; position:absolute; top:2px; left:2px; width:20px; height:20px;
  border-radius:var(--r-pill); background:var(--surface); border:1px solid var(--border);
  transition:transform var(--dur) var(--ease); }
.bryter[aria-pressed="true"] i{ background:var(--fg); border-color:var(--fg); }
.bryter[aria-pressed="true"] i::after{ transform:translateX(18px); border-color:var(--fg); }

/* Kostnadsstolper — måling, ikke pynt */
.stolper{ display:flex; flex-direction:column; gap:var(--s2); }
.stolpe{ display:grid; grid-template-columns:112px minmax(0,1fr) 84px; gap:var(--s3);
  align-items:center; font-size:13px; }
.stolpe .bar{ height:10px; border-radius:var(--r-pill); background:var(--soft); overflow:hidden; }
.stolpe .bar i{ display:block; height:100%; background:var(--mid); border-radius:var(--r-pill); }
.stolpe .bar i.lokal{ background:var(--info-raw); }
.stolpe .kr{ font-family:var(--mono); text-align:right; }

.merk{ display:flex; gap:var(--s3); padding:var(--s3) var(--s4); background:var(--soft);
  border:1px solid var(--border); border-radius:var(--r); margin-bottom:var(--s3); }
.merk svg{ width:16px; height:16px; flex:none; margin-top:2px; fill:none;
  stroke:var(--muted); stroke-width:1.7; }
.merk p{ margin:0; font-family:var(--body); font-size:12.5px; color:var(--muted); }

.felt{ margin-bottom:var(--s3); }
.felt label{ display:block; font-size:12.5px; font-weight:500; margin-bottom:var(--s1); }
.felt textarea,.felt select,.felt input{ width:100%; min-height:var(--tap);
  padding:var(--s2) var(--s3); background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-sm); font-size:14px; }
.felt textarea{ min-height:96px; resize:vertical; }

.ark{ position:fixed; left:0; right:0; bottom:0; z-index:calc(var(--z-sheet) + 1);

}

.ahead .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.abody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }
.afoot{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  border-top:1px solid var(--border); }
.afoot .btn{ flex:1; }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; }

.toast{ position:fixed; left:50%; bottom:var(--s5); transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:12.5px; }
@media (max-width:640px){ .toast{ bottom:76px; } }
button,.btn,.chip,summary,textarea,select,input,.mod,.lrad,.bryter{ min-height:var(--tap); }
.tag,.num,.eyebrow,.kilde,.rad .v,.status,.mod .tall .v,.mod .tall .k,.mod .vert,
.stolpe .kr,.logg .tid{ min-height:0; }

<script>
(function(){
'use strict';

/* ═══ AgenticOS ═══
   Kilder: AiModel · RoutingRule · AiPrompt · AiRun · AiCost · AiMemory ·
   CaddieConversation · CaddieDraft

   MERK: bare CaddieConversation, CaddieDraft og AiMemory er bekreftet i
   schema.prisma. Resten er IKKE verifisert og er merket i UI. Denne flata
   beskriver et system som i stor grad ennå ikke har databasetabeller —
   det skal en utvikler se med én gang, ikke oppdage under migrasjonen. */

var MODELLER = [
  { k:'hermes', n:'Hermes', vert:'egen agent', s:'pa', lokal:false,
    oppg:'Orkestrering — bryter oppgaver ned og fordeler dem',
    kost:0, latens:'—', kall:412 },
  { k:'ollama', n:'Ollama', vert:'lokal maskin', s:'lokal', lokal:true,
    oppg:'Alt med personopplysninger. Forlater aldri maskinen.',
    kost:0, latens:'2,4 s', kall:186 },
  { k:'claude', n:'Claude', vert:'Anthropic', s:'pa', lokal:false,
    oppg:'Treningsplaner, tekst til spillere, kode',
    kost:842, latens:'4,7 s', kall:1240 },
  { k:'gemini', n:'Gemini', vert:'Google', s:'pa', lokal:false,
    oppg:'Video- og bildeanalyse av sving',
    kost:210, latens:'6,1 s', kall:96 },
  { k:'grok', n:'Grok', vert:'xAI', s:'av', lokal:false,
    oppg:'Ikke i bruk ennå',
    kost:0, latens:'—', kall:0 },
  { k:'kimi', n:'Kimi', vert:'Moonshot', s:'pa', lokal:false,
    oppg:'Lange dokumenter — CANON, ordlista, sportsplaner',
    kost:96, latens:'8,3 s', kall:34 }
];

var RUTING = [
  { k:'pii', n:'Personopplysninger går lokalt', laast:true, pa:true,
    d:'Navn, fødselsdato, helse, foreldrekontakt og alt om spillere under 18 ' +
      'rutes til Ollama på egen maskin. Utelukker Claude, Gemini, Grok og Kimi.' },
  { k:'plan', n:'Treningsplaner til Claude', laast:false, pa:true,
    d:'Anonymisert: spiller-ID, ikke navn. Faller tilbake til Ollama hvis Claude er nede.' },
  { k:'video', n:'Video og bilde til Gemini', laast:false, pa:true,
    d:'Svingvideo uten ansikt. Med ansikt i bildet gjelder PII-regelen.' },
  { k:'lang', n:'Dokumenter over 200 sider til Kimi', laast:false, pa:true,
    d:'CANON v3.5 og sportsplaner. Billigst per token på lange kontekster.' },
  { k:'kode', n:'Kode til Claude', laast:false, pa:true,
    d:'Repoet akgolf-hq. Kjøres i Claude Code, ikke herfra.' }
];

var AGENTER = [
  { k:'faktura', n:'Faktura-vakten', plan:'daglig 03:00', s:'feil',
    sist:'i natt 03:14', res:'Tidsavbrudd mot Stripe etter 30 s', neste:'i natt 03:00',
    modell:'Hermes → Ollama', kjor:31 },
  { k:'ukeplan', n:'Ukeplan-agenten', plan:'søndag 20:00', s:'ok',
    sist:'søndag 20:04', res:'5 utkast skrevet, alle venter på godkjenning', neste:'søndag 20:00',
    modell:'Claude', kjor:12 },
  { k:'fangst', n:'Fangst-pipelinen', plan:'ved ny fangst', s:'ok',
    sist:'i dag 09:14', res:'Transkribert, lagret i tråd og Notion', neste:'ved ny fangst',
    modell:'Ollama', kjor:186 },
  { k:'synk', n:'Notion-synk', plan:'hvert 15. min', s:'ok',
    sist:'i dag 09:00', res:'Projects-DB oppdatert', neste:'09:15',
    modell:'ingen — ren API', kjor:2880 }
];

var LOGG = [
  { t:'09:14', m:'Ollama',  o:'Transkriberte fangst · Øyvind Rohjan', kr:0 },
  { t:'09:04', m:'Claude',  o:'Skrev ukeplan uke 32 · anonymisert',   kr:2.40 },
  { t:'09:00', m:'—',       o:'Notion-synk · Projects-DB',            kr:0 },
  { t:'08:41', m:'Kimi',    o:'Leste CANON v3.5 · 214 sider',         kr:1.10 },
  { t:'03:14', m:'Hermes',  o:'Faktura-vakten stoppet · tidsavbrudd', kr:0 }
];

var FANER = [
  { k:'rack',   n:'Modeller' },
  { k:'ruting', n:'Ruting' },
  { k:'prompt', n:'Promptekspert' },
  { k:'agent',  n:'Agenter' },
  { k:'kost',   n:'Kostnad' },
  { k:'logg',   n:'Logg' }
];

var fane = 'rack', valgtModell = null;
var promptInn = '', promptModell = 'auto', promptUt = null, promptPii = false;

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2800); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function kr(n){ return n.toFixed(2).replace('.', ','); }
function heltall(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function totalKost(){ return MODELLER.reduce(function(s,m){ return s + m.kost; }, 0); }
function feilAgenter(){ return AGENTER.filter(function(a){ return a.s === 'feil'; }); }

/* ── Faner ───────────────────────────────────────────────────── */
function renderFaner(){
  var w = document.getElementById('faner'); w.innerHTML = '';
  FANER.forEach(function(f){
    var c = el('button','chip'); c.type = 'button';
    c.setAttribute('role','tab');
    c.setAttribute('aria-pressed', String(f.k === fane));
    c.dataset.odId = 'ag-fane-' + f.k;
    c.appendChild(el('span', null, f.n));
    if (f.k === 'agent' && feilAgenter().length)
      c.appendChild(el('span','tag dn', String(feilAgenter().length)));
    c.addEventListener('click', function(){ fane = f.k; render(); si(f.n + ' åpnet.'); });
    w.appendChild(c);
  });
}

function kort(tittel, kilde, uverifisert){
  var k = el('section','kort');
  k.appendChild(document.createComment(' kilde: ' + kilde + ' '));
  if (tittel) k.appendChild(el('span','eyebrow', tittel));
  k.appendChild(el('span','kilde','kilde: ' + kilde));
  if (uverifisert){
    k.dataset.demoOnly = 'true';
    k.appendChild(el('p', null,
      'Modellkilden finnes ikke i schema.prisma i dag. Denne seksjonen ' +
      'beskriver et system som må bygges, ikke ett som finnes.'));
  }
  return k;
}
function rad(k, v, sub){
  var r = el('div','rad');
  var d = el('div'); d.appendChild(document.createTextNode(k));
  if (sub) d.appendChild(el('small', null, sub));
  r.appendChild(d);
  if (v != null) r.appendChild(el('span','v num', v));
  return r;
}

/* ── Én ting nå: agenten som feilet ──────────────────────────── */
function enTingNa(w){
  var f = feilAgenter()[0];
  if (!f) return;
  var v = el('div','nowblock');
  v.appendChild(document.createComment(' kilde: AiRun '));
  v.appendChild(el('span','eyebrow','Én ting nå'));
  v.appendChild(el('h2', null, f.n + ' stoppet ' + f.sist));
  v.appendChild(el('p', null,
    f.res + '. Den prøver igjen ' + f.neste + ' av seg selv, men feilen står ' +
    'til noen ser på den — og fakturaene den skulle sjekket, ble ikke sjekket i natt.'));
  var b = el('button','btn now','Kjør ' + f.n + ' på nytt nå');
  b.type = 'button'; b.dataset.odId = 'ag-one-thing-now';
  b.addEventListener('click', function(){
    f.s = 'ok'; f.sist = 'i dag 09:16';
    f.res = 'Kjørte ferdig · 1 forfalt faktura funnet';
    f.kjor++;
    LOGG.unshift({ t:'09:16', m:'Hermes', o:'Faktura-vakten kjørt manuelt · 1 forfall', kr:0 });
    render();
    si(f.n + ' kjørte ferdig. Én forfalt faktura funnet, og den ligger nå i innboksen.');
    toast('Kjørte ferdig · 1 forfall funnet');
  });
  v.appendChild(b);
  w.appendChild(v);
}

/* ── Visninger ───────────────────────────────────────────────── */
var VIS = {

rack: function(w){
  enTingNa(w);
  var k = kort('Modellrack', 'AiModel', true);
  k.appendChild(el('p', null,
    'Ingen modell er «best». Rack-et viser hva hver av dem faktisk gjør, hva ' +
    'den koster og hvor lang tid den bruker — ikke en rangering.'));
  var r = el('div','rack');
  MODELLER.forEach(function(m){
    var b = el('button','mod'); b.type = 'button';
    b.dataset.odId = 'ag-mod-' + m.k;
    b.setAttribute('aria-current', String(valgtModell === m.k));
    var n = el('div','navn');
    n.appendChild(el('h3', null, m.n));
    n.appendChild(el('span','vert', m.vert));
    b.appendChild(n);
    b.appendChild(el('span','status ' + (m.s === 'pa' ? 'pa' : m.s === 'lokal' ? 'lokal' : ''),
      m.s === 'pa' ? 'i bruk' : m.s === 'lokal' ? 'lokal · i bruk' : 'ikke i bruk'));
    b.appendChild(el('span','oppg', m.oppg));
    var t = el('div','tall');
    [['kall', heltall(m.kall)], ['kr i august', m.kost ? heltall(m.kost) : '0'],
     ['snittid', m.latens]].forEach(function(p){
      var d = el('div');
      d.appendChild(el('span','k', p[0]));
      d.appendChild(el('span','v', p[1]));
      t.appendChild(d);
    });
    b.appendChild(t);
    b.addEventListener('click', function(){ valgtModell = m.k; render(); apneModell(m); });
    r.appendChild(b);
  });
  k.appendChild(r);
  w.appendChild(k);
},

ruting: function(w){
  var k = kort('Rutingregler', 'RoutingRule', true);
  k.appendChild(el('p', null,
    'Hvilken modell tar hvilken oppgave. Reglene leses ovenfra og ned — ' +
    'første regel som treffer, vinner.'));
  var l = el('div','liste');
  RUTING.forEach(function(r){
    var row = el('div','lrad' + (r.laast ? ' laas' : ''));
    var d = el('div');
    var tittel = document.createElement('div');
    tittel.appendChild(document.createTextNode(r.n));
    if (r.laast){
      var t = el('span','tag dn','låst'); t.style.marginLeft = 'var(--s2)';
      tittel.appendChild(t);
    }
    d.appendChild(tittel);
    d.appendChild(el('small', null, r.d));
    row.appendChild(d);
    if (r.laast){
      /* PII-regelen har ingen bryter. En regel som beskytter personopplysninger
         og kan slås av med samme bryter som «send lange dokumenter til Kimi»,
         er ikke en beskyttelse — den er en innstilling. */
      var s = el('span','status pa','alltid på');
      s.style.marginLeft = 'auto'; s.style.flex = 'none';
      row.appendChild(s);
    } else {
      var b = el('button','bryter'); b.type = 'button';
      b.dataset.odId = 'ag-rute-' + r.k;
      b.setAttribute('aria-pressed', String(r.pa));
      b.setAttribute('aria-label', r.n);
      b.appendChild(el('i'));
      b.addEventListener('click', function(){
        r.pa = !r.pa; b.setAttribute('aria-pressed', String(r.pa));
        toast(r.n + (r.pa ? ' er på.' : ' er av.'));
        si(r.n + (r.pa ? ' er på.' : ' er av. Oppgaven faller tilbake til Hermes.'));
      });
      row.appendChild(b);
    }
    l.appendChild(row);
  });
  k.appendChild(l);
  w.appendChild(k);

  var m = el('div','merk');
  m.innerHTML = '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
  m.appendChild(el('p', null,
    'PII-regelen kan ikke slås av herfra. Skal den endres, må det gjøres i ' +
    'repoet med en commit som kan spores — ikke med en bryter i et grensesnitt.'));
  w.appendChild(m);
},

prompt: function(w){
  var k = kort('Promptekspert', 'AiPrompt', true);
  k.appendChild(el('p', null,
    'Skriv oppgaven rått. Eksperten velger modell etter rutingreglene og ' +
    'skriver om prompten til den modellen — og sier hvorfor.'));

  var f = el('div','felt');
  var l = el('label', null, 'Oppgave'); l.setAttribute('for','ag-inn'); f.appendChild(l);
  var ta = document.createElement('textarea');
  ta.id = 'ag-inn'; ta.value = promptInn; ta.dataset.odId = 'ag-prompt-inn';
  ta.placeholder = 'For eksempel: lag en ukeplan for Øyvind med vekt på innspill.';
  ta.addEventListener('input', function(){ promptInn = ta.value; });
  f.appendChild(ta);
  k.appendChild(f);

  var mf = el('div','felt');
  var ml = el('label', null, 'Modell'); ml.setAttribute('for','ag-mvalg'); mf.appendChild(ml);
  var sel = document.createElement('select');
  sel.id = 'ag-mvalg'; sel.dataset.odId = 'ag-prompt-modell';
  var o0 = document.createElement('option'); o0.value = 'auto';
  o0.textContent = 'Velg for meg (etter rutingreglene)'; sel.appendChild(o0);
  MODELLER.filter(function(m){ return m.s !== 'av'; }).forEach(function(m){
    var o = document.createElement('option'); o.value = m.k; o.textContent = m.n;
    sel.appendChild(o);
  });
  sel.value = promptModell;
  sel.addEventListener('change', function(){ promptModell = sel.value; });
  mf.appendChild(sel);
  mf.appendChild(el('span','hjelp',
    'Velger du selv, gjelder PII-regelen likevel. Den overstyrer valget ditt.'));
  k.appendChild(mf);

  var b = el('button','btn ink','Optimaliser'); b.type = 'button';
  b.dataset.odId = 'ag-optimaliser';
  b.addEventListener('click', function(){
    if (!promptInn.trim()){
      toast('Skriv oppgaven først.'); si('Skriv inn en oppgave før du optimaliserer.');
      ta.focus(); return;
    }
    /* PII-deteksjon. \b er ASCII-basert i JS: «\bØyvind\b» treffer ALDRI,
       fordi Ø ikke er et ordtegn — og «\bhelse\b» treffer ikke «helseloggen».
       Målt 02.08: «Lag et sammendrag av helseloggen til Øyvind» ble rutet til
       Claude. En PII-vakt som feiler stille er verre enn ingen vakt.
       Derfor stammer, ikke ordgrenser.
       MERK: dette er demo. Ekte PII-deteksjon hører hjemme på serveren, ikke
       i et regulæruttrykk i en nettleser. */
    promptPii = /(navn|f\u00f8dt|f\u00f8dsel|helse|forelder|foresatt|p\u00e5rørende|personnummer|adresse|samtykke|diagnose|\u00f8yvind|spiller)/i
                  .test(promptInn);
    var m = promptPii ? MODELLER[1]
          : promptModell !== 'auto' ? MODELLER.filter(function(x){ return x.k === promptModell; })[0]
          : /(video|sving|bilde|opptak)/i.test(promptInn) ? MODELLER[3]
          : /(canon|ordlist|sportsplan|dokument)/i.test(promptInn) ? MODELLER[5]
          : MODELLER[2];
    promptUt = {
      modell: m,
      grunn: promptPii
        ? 'Oppgaven inneholder personopplysninger. PII-regelen er låst og sender den til Ollama lokalt, uansett hva du valgte.'
        : promptModell !== 'auto'
          ? 'Du valgte ' + m.n + ' selv. Ingen rutingregel overstyrer det her.'
          : 'Rutingreglene peker på ' + m.n + ' for denne typen oppgave.',
      tekst: byggPrompt(promptInn, m)
    };
    render();
    si('Optimalisert for ' + m.n + '. ' + promptUt.grunn);
    toast('Optimalisert for ' + m.n);
  });
  k.appendChild(b);
  w.appendChild(k);

  if (promptUt){
    var u = el('div','utdata');
    u.appendChild(el('span','flab','valgt modell · ' + promptUt.modell.n));
    u.appendChild(el('p','prose', promptUt.grunn));
    var pre = document.createElement('pre');
    pre.textContent = promptUt.tekst;
    u.appendChild(pre);
    var kop = el('button','btn sm','Kopier'); kop.type = 'button';
    kop.dataset.odId = 'ag-kopier';
    kop.style.marginTop = 'var(--s3)';
    kop.addEventListener('click', function(){
      if (navigator.clipboard) navigator.clipboard.writeText(promptUt.tekst);
      toast('Kopiert'); si('Prompten er kopiert.');
    });
    u.appendChild(kop);
    w.appendChild(u);

    if (promptPii){
      var pm = el('div','merk');
      pm.innerHTML = '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
      pm.appendChild(el('p', null,
        'Denne oppgaven forlater ikke maskinen din. Ingen tokens sendes til ' +
        'Anthropic, Google, xAI eller Moonshot.'));
      w.appendChild(pm);
    }
  }
},

agent: function(w){
  enTingNa(w);
  var k = kort('Agenter', 'AiRun', true);
  k.appendChild(el('p', null,
    'Agentene kjører av seg selv. Her ser du når de sist kjørte, hva de fant, ' +
    'og når de kjører igjen.'));
  var l = el('div','liste');
  AGENTER.forEach(function(a){
    var b = el('button','lrad'); b.type = 'button';
    b.dataset.odId = 'ag-agent-' + a.k;
    var d = el('div');
    d.appendChild(document.createTextNode(a.n));
    d.appendChild(el('small', null, a.plan + ' · ' + a.modell + ' · sist ' + a.sist));
    b.appendChild(d);
    var h = el('span','h');
    h.appendChild(el('span','status ' + (a.s === 'ok' ? 'pa' : 'feil'),
      a.s === 'ok' ? 'ok' : 'feilet'));
    b.appendChild(h);
    b.addEventListener('click', function(){ apneAgent(a); });
    l.appendChild(b);
  });
  k.appendChild(l);
  w.appendChild(k);
},

kost: function(w){
  var k = kort('Kostnad i august', 'AiCost', true);
  var tot = totalKost();
  k.appendChild(rad('Totalt hittil', heltall(tot) + ' kr'));
  k.appendChild(rad('Lokalt (Ollama)', '0 kr', 'kjører på egen maskin'));
  k.appendChild(rad('Kall totalt', heltall(MODELLER.reduce(function(s,m){ return s + m.kall; }, 0))));
  w.appendChild(k);

  var s = kort('Per modell', 'AiCost, AiModel', true);
  var st = el('div','stolper');
  var maks = Math.max.apply(null, MODELLER.map(function(m){ return m.kost; })) || 1;
  MODELLER.slice().sort(function(a,b){ return b.kost - a.kost; }).forEach(function(m){
    var r = el('div','stolpe');
    r.appendChild(el('span', null, m.n));
    var bar = el('span','bar');
    var i = document.createElement('i');
    i.style.width = Math.max(m.kost ? 3 : 0, Math.round(m.kost / maks * 100)) + '%';
    if (m.lokal) i.className = 'lokal';
    bar.appendChild(i);
    r.appendChild(bar);
    r.appendChild(el('span','kr', m.kost ? heltall(m.kost) + ' kr' : '0'));
    st.appendChild(r);
  });
  s.appendChild(st);
  s.appendChild(el('p', null,
    'Blå stolpe er lokal kjøring. Den koster ingenting per kall, men den ' +
    'koster maskintid — og den er tregere.'));
  w.appendChild(s);
},

logg: function(w){
  var k = kort('Siste kjøringer', 'AiRun', true);
  var l = el('div','liste logg');
  LOGG.forEach(function(r){
    var row = el('div','lrad');
    row.appendChild(el('span','tid', r.t));
    var d = el('div');
    d.appendChild(document.createTextNode(r.o));
    d.appendChild(el('small', null, r.m === '—' ? 'ingen modell' : r.m));
    row.appendChild(d);
    row.appendChild(el('span','h', r.kr ? kr(r.kr) + ' kr' : '0'));
    l.appendChild(row);
  });
  k.appendChild(l);
  w.appendChild(k);
  var m = el('div','merk');
  m.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  m.appendChild(el('p', null,
    'Loggen viser i dag. Eldre kjøringer ligger i AgenticOS-loggen og hentes ved behov.'));

};

function byggPrompt(inn, m){
  var stil = {
    ollama: 'Kort, konkret, ingen pynt. Kjør lokalt.',
    claude: 'Strukturer med XML-tagger. Be om resonnement før konklusjon.',
    gemini: 'Beskriv bildet eller videoen først, still spørsmålet etterpå.',
    kimi:   'Legg hele dokumentet i konteksten. Referer til sidetall.',
    hermes: 'Bryt oppgaven ned i deloppgaver før du fordeler dem.',
    grok:   'Kort og direkte.'
  }[m.k] || 'Kort og direkte.';
  return '<oppgave>\n' + inn.trim() + '\n</oppgave>\n\n' +
    '<kontekst>\nAK Golf HQ. AK-formel v2: Pyramide_Område_Motorikk_Belastning_Press,\n' +
    '17 områder. L-faser, CS-nivå, M0–M5 og PR1–PR5 finnes ikke.\n' +
    'Ordlista er stavefasit. Norsk bokmål. Demo-kanon: Øyvind Rohjan.\n</kontekst>\n\n' +
    '<stil>\n' + stil + '\n</stil>\n\n' +
    '<krav>\nSvar på norsk. Ingen emoji. Ingen oppfunne tall — mangler du et\n' +
    'tall, si at det mangler.\n</krav>';
}

/* ── Ark ─────────────────────────────────────────────────────── */
var ark = document.getElementById('ark'), scrim = document.getElementById('scrim'),
    arkBody = document.getElementById('arkBody'), arkFoot = document.getElementById('arkFoot'),
    sisteFokus = null;
function apne(){
  sisteFokus = document.activeElement;
  ark.hidden = false; scrim.hidden = false;
  ark.classList.add('on'); scrim.classList.add('on');
  var f = ark.querySelector('button'); if (f) f.focus();
}
function lukk(){
  ark.classList.remove('on'); scrim.classList.remove('on');
  ark.hidden = true; scrim.hidden = true;
  if (sisteFokus && sisteFokus.isConnected) sisteFokus.focus();
}
scrim.addEventListener('click', lukk);
ark.querySelector('[data-lukk]').addEventListener('click', lukk);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !ark.hidden){ e.preventDefault(); lukk(); }
  if (e.key === 'Tab' && !ark.hidden){
    var f = ark.querySelectorAll('button, textarea, select, [href], [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var a = f[0], b = f[f.length-1];
    if (e.shiftKey && document.activeElement === a){ e.preventDefault(); b.focus(); }
    else if (!e.shiftKey && document.activeElement === b){ e.preventDefault(); a.focus(); }
  }
});

function apneModell(m){
  document.getElementById('arkTitle').textContent = m.n;
  document.getElementById('arkSub').textContent = m.vert;
  arkBody.innerHTML = ''; arkFoot.innerHTML = '';
  var k = el('div','kort');
  k.appendChild(rad('Oppgave', null, m.oppg));
  k.appendChild(rad('Kall i august', heltall(m.kall)));
  k.appendChild(rad('Kostnad', m.kost ? heltall(m.kost) + ' kr' : '0 kr'));
  k.appendChild(rad('Snittid', m.latens));
  k.appendChild(rad('Status', m.s === 'pa' ? 'i bruk' : m.s === 'lokal' ? 'lokal · i bruk' : 'ikke i bruk'));
  arkBody.appendChild(k);
  if (m.lokal){
    var mm = el('div','merk');
    mm.innerHTML = '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
    mm.appendChild(el('p', null,
      'Alt med personopplysninger går hit. Ingen tokens forlater maskinen.'));
    arkBody.appendChild(mm);
  }
  var lukkB = el('button','btn','Lukk'); lukkB.type = 'button';
  lukkB.dataset.odId = 'ag-mod-lukk';
  lukkB.addEventListener('click', lukk);
  var toggle = el('button','btn ink', m.s === 'av' ? 'Ta i bruk' : 'Sett på pause');
  toggle.type = 'button'; toggle.dataset.odId = 'ag-mod-toggle';
  toggle.addEventListener('click', function(){
    if (m.lokal){
      toast('Ollama kan ikke settes på pause — PII-regelen krever den.');
      si('Ollama kan ikke settes på pause. PII-regelen krever en lokal modell.');
      return;
    }
    m.s = m.s === 'av' ? 'pa' : 'av';
    lukk(); render();
    si(m.n + ' er ' + (m.s === 'av' ? 'satt på pause' : 'tatt i bruk') + '.');
    toast(m.n + ' · ' + (m.s === 'av' ? 'på pause' : 'i bruk'));
  });
  arkFoot.appendChild(lukkB); arkFoot.appendChild(toggle);
  apne();
}

function apneAgent(a){
  document.getElementById('arkTitle').textContent = a.n;
  document.getElementById('arkSub').textContent = a.plan + ' · ' + a.modell;
  arkBody.innerHTML = ''; arkFoot.innerHTML = '';
  var k = el('div','kort');
  k.appendChild(rad('Sist kjørt', a.sist));
  k.appendChild(rad('Resultat', null, a.res));
  k.appendChild(rad('Neste', a.neste));
  k.appendChild(rad('Kjøringer totalt', heltall(a.kjor)));
  k.appendChild(rad('Status', a.s === 'ok' ? 'ok' : 'feilet'));
  arkBody.appendChild(k);
  var lukkB = el('button','btn','Lukk'); lukkB.type = 'button';
  lukkB.dataset.odId = 'ag-agent-lukk';
  lukkB.addEventListener('click', lukk);
  var kjor = el('button','btn ink','Kjør nå'); kjor.type = 'button';
  kjor.dataset.odId = 'ag-agent-kjor';
  kjor.addEventListener('click', function(){
    a.s = 'ok'; a.sist = 'i dag 09:16'; a.kjor++;
    a.res = 'Kjørte ferdig manuelt';
    LOGG.unshift({ t:'09:16', m:a.modell.split(' ')[0], o:a.n + ' kjørt manuelt', kr:0 });
    lukk(); render();
    si(a.n + ' kjørte ferdig.'); toast(a.n + ' · kjørte ferdig');
  });
  arkFoot.appendChild(lukkB); arkFoot.appendChild(kjor);
  apne();
}

/* ── Tema ────────────────────────────────────────────────────── */
var KEY = 'akhq-theme-agencyos';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

function render(){
  renderFaner();
  var w = document.getElementById('kropp'); w.innerHTML = '';
  VIS[fane](w);
  document.getElementById('antModeller').textContent =
    MODELLER.filter(function(m){ return m.s !== 'av'; }).length;
  document.getElementById('antAgenter').textContent = AGENTER.length;
  document.getElementById('kostMnd').textContent = heltall(totalKost()) + ' kr';
}

/* Ankomst: feiler en agent, er DET dagens ene handling — og da åpner flata
   på Agenter, ikke på Modeller. */
(function ankomst(){
  var p = new URLSearchParams(location.search);
  if (p.get('fane') && VIS[p.get('fane')]) fane = p.get('fane');
  else if (feilAgenter().length) fane = 'agent';
  render();
})();
})();

<style>

/* ═══ PlayerHQ · Test-gjennomføring (scorekort) ═══
   Én test fra testbatteriet gjennomføres og lagres. Scorekortet
   rendres fra ScorekortSpec (src/lib/portal-tester/protocol.ts):
   forsøk = [{nr, label, target?, felter[]}], felt = {key, type, label, unit?}.
   Demoen viser TN Putt Gate — 10 forsøk, checkbox OK per putt.

   Målverdien er FORESLÅTT fra IUP — aldri låst fasit. Etter lagring
   synkes resultatet til TalentHQ (kvitteringen, ikke TalentHQ-skjermen
   — den er et eget oppdrag). */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; color:inherit; text-decoration:none; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(96px + env(safe-area-inset-bottom)); }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s4); }
.kort .rad{ display:flex; align-items:baseline; gap:var(--s2); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:13px; }
.kort .rad:last-child{ border-bottom:0; }
.kort .rad .v{ margin-left:auto; font-family:var(--mono); text-align:right; }

/* Løpende score */
.score{ display:flex; align-items:baseline; gap:var(--s3); }
.score .stor{ font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:40px; font-weight:500; line-height:1; }
.score .av{ font-family:var(--mono); font-size:13px; color:var(--muted); }

/* Scorekortrader — én rad per forsøk fra ScorekortSpec */
.forsok{ display:flex; align-items:center; gap:var(--s3); padding:var(--s1) 0;
  border-bottom:1px solid var(--border-soft); }
.forsok:last-child{ border-bottom:0; }
.forsok .fnr{ flex:none; width:24px; font-family:var(--mono); font-size:11px;
  color:var(--muted); text-align:right; }
.forsok .flab{ min-width:0; flex:1; font-size:13px; }
.forsok .ok{ flex:none; min-width:64px; min-height:var(--tap); display:inline-flex;
  align-items:center; justify-content:center; gap:var(--s1);
  border:1px solid var(--border); border-radius:var(--r-pill);
  background:transparent; cursor:pointer; font-family:var(--mono); font-size:11px;
  color:var(--muted); }
.forsok .ok[aria-pressed="true"]{ background:var(--soft); border-color:var(--up);
  color:var(--up); }
.forsok .ok[aria-pressed="true"] svg{ stroke:var(--up); }
.forsok .ok svg{ width:14px; height:14px; fill:none; stroke:var(--mid);
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.forsok .ok.bom{ color:var(--dn); }

.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.tom .valg{ display:flex; flex-direction:column; gap:var(--s2); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s2); animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }

.why{ margin:var(--s3) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

.kvitt{ padding:var(--s5) var(--s4); background:var(--surface);
  border:1px solid var(--up); border-radius:var(--r); margin-bottom:var(--s4); }
.kvitt h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:16px; font-weight:600;
  display:flex; align-items:center; gap:var(--s2); }
.kvitt h3 svg{ width:20px; height:20px; fill:none; stroke:var(--up); stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; }
.kvitt p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }

.dokk{ position:absolute; left:0; right:0; bottom:0;
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 70%, transparent); }
@media (min-width:1024px){ .dokk{ position:sticky; background:var(--bg);
  border-top:1px solid var(--border); } .dokk .btn{ max-width:720px; margin:0 auto; display:flex; } }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,summary,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow{ min-height:0; }
</style>

<body>
<p class="framehint">PlayerHQ · Test-gjennomføring · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">
    <a class="ikon" href="playerhq-live-okt.html" aria-label="Til live-økta" data-od-id="test-tilbake">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="min-width:0">
      <h1>Test</h1>
      <span class="sub">TN Putt Gate · Putting · TEK</span>
    </div>
    <span style="flex:1"></span>
    <!-- demo-bryter · fjernes før koding -->
    <div data-demo-only="true" style="display:flex;gap:4px">
      <button class="ikon" data-tilstand="fylt" aria-pressed="true" aria-label="Demo: suksess" data-od-id="test-demo-fylt"><span class="num" style="font-size:10px">F</span></button>
      <button class="ikon" data-tilstand="tom" aria-pressed="false" aria-label="Demo: tom" data-od-id="test-demo-tom"><span class="num" style="font-size:10px">T</span></button>

      <button class="ikon" data-tilstand="feil" aria-pressed="false" aria-label="Demo: feil" data-od-id="test-demo-feil"><span class="num" style="font-size:10px">E</span></button>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ PlayerHQ · Test-gjennomføring · datamodell ═══
   Kilder: TestDefinition.protocol (variant B, Team Norway) →
   parseProtocol() → ScorekortSpec — dette scorekortet er rendret fra
   spec-en, ikke håndtegnet. Resultatet lagres som TestResult og synkes
   til TalentHQ. Foreslått mål kommer fra IUP + forrige TestResult.

   Protokollen er TN Putt Gate fra scripts/seed-test-definitions.ts
   (verbatim beskrivelse og scoringsregel) — IKKE en oppdiktet test.
   Spørsmålet om testlista (21 vs 20 vs 36) er uavklart hos Anders;
   denne skjermen viser ÉN protokoll og tar ikke stilling til lista. */

var TEST = {
  navn: 'TN Putt Gate',
  omraade: 'Putting · TEK',
  beskrivelse: '10 putter gjennom en 40cm gate. Tester start-retning og evnen ' +
    'til å starte ballen på riktig linje konsistent. Fundamental putting-teknikk.',
  scoringRule: 'Registrer OK/ikke OK per putt. Score = antall OK av 10. Maks 10 poeng.',
  /* ScorekortSpec normalisert fra protocol — samme form som protocol.ts gir. */
  spec: {
    forsok: Array.from({length: 10}, function(_, i){
      return { nr: i+1, label: 'Putt Gate 40cm #' + (i+1),
        felter: [{ key:'ok', type:'checkbox', label:'OK' }] };
    })
  },
  foreslaattMaal: 8, sist: 7, sistDato: '21.06'
};

/* Registrerte forsøk: true = OK, false = ikke OK, null = ikke slått ennå. */
var svar = [true, true, false, true, true, true, null, null, null, null];

var tilstand = 'fylt', lagretVisning = false;

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function antOk(){ return svar.filter(function(s){ return s === true; }).length; }
function antSatt(){ return svar.filter(function(s){ return s !== null; }).length; }

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';
  var dokk = document.getElementById('dokk'); dokk.innerHTML = '';

  if (tilstand === 'laster'){
    for (var i = 0; i < 7; i++){ var s = el('div', 'skel'); s.style.width = (95 - i*7) + '%'; w.appendChild(s); }
    return;
  }
  if (tilstand === 'tom'){
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Ingen test valgt'));
    t.appendChild(el('p', null,
      'Tester velges fra testbatteriet i økta. Åpne økta i Workbench og ' +
      'legg til en test — så ligger scorekortet klart her.'));
    var v = el('div', 'valg');
    /* Kontrakt §3: i tom tilstand er testbatteriet skjermens ene aksenthandling. */
    var tb = el('a', 'btn now full', 'Åpne testbatteriet');
    tb.href = 'workbench-desktop.html'; tb.dataset.odId = 'test-tom-batteri';
    var ok = el('a', 'btn full', 'Tilbake til økta');
    ok.href = 'playerhq-live-okt.html'; ok.dataset.odId = 'test-tom-okt';
    v.appendChild(tb); v.appendChild(ok);
    t.appendChild(v); w.appendChild(t); return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Klarte ikke å lagre testen'));
    f.appendChild(el('p', null,
      'Resultatet ligger trygt på telefonen og synkes til TalentHQ når ' +
      'nettet er tilbake. Puttene dine er ikke tapt.'));
    /* Kontrakt §3: i feiltilstand er «Prøv igjen» skjermens ene aksenthandling. */
    var fb = el('button', 'btn now full', 'Prøv igjen'); fb.dataset.odId = 'test-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f); return;
  }

  if (lagretVisning){ renderKvittering(w); return; }

  /* ── Suksess: scorekortet ── */

  /* Protokollen — kilde: TestDefinition */
  var pk = el('div', 'kort');
  pk.appendChild(el('div', 'eyebrow', 'protokoll'));
  var pp = el('p', 'prose', TEST.beskrivelse);
  pp.style.cssText = 'margin:var(--s2) 0; font-size:13.5px';
  pk.appendChild(pp);
  [['Scoring', 'antall OK av 10'],
   ['Område', TEST.omraade],
   ['Foreslått mål', TEST.foreslaattMaal + ' av 10']].forEach(function(p){
    var r = el('div', 'rad');
    r.appendChild(el('span', null, p[0]));
    r.appendChild(el('span', 'v num', p[1]));
    pk.appendChild(r);
  });
  var wd = el('details', 'why'); wd.dataset.odId = 'test-why-maal';
  wd.appendChild(el('summary', null, 'Hvorfor dette tallet'));
  var ul = document.createElement('ul');
  ['Kilde: forrige TN Putt Gate ' + TEST.sistDato + ' — ' + TEST.sist + ' av 10 — og IUP-en din.',
   'Beregning: målet er forrige resultat pluss én.',
   'Forbehold: foreslått, aldri låst fasit. Testen er like gyldig uansett hva resultatet blir.']
   .forEach(function(x){ ul.appendChild(el('li', null, x)); });
  wd.appendChild(ul); pk.appendChild(wd);
  w.appendChild(pk);

  /* Løpende score — regnet fra radene under */
  var sk = el('div', 'kort');
  sk.appendChild(el('div', 'eyebrow', 'scorekort'));
  var sc = el('div', 'score'); sc.style.margin = 'var(--s2) 0 var(--s3)';
  sc.appendChild(el('span', 'stor num', String(antOk())));
  sc.appendChild(el('span', 'av', 'OK · ' + antSatt() + ' av 10 putter registrert'));
  sk.appendChild(sc);

  /* Én rad per forsøk — rendret fra ScorekortSpec, ikke håndtegnet */
  TEST.spec.forsok.forEach(function(fo, i){
    var r = el('div', 'forsok');
    r.appendChild(el('span', 'fnr num', String(fo.nr)));
    r.appendChild(el('span', 'flab', fo.label));
    var ok = el('button', 'ok' + (svar[i] === false ? ' bom' : ''));
    ok.setAttribute('aria-pressed', String(svar[i] === true));
    ok.setAttribute('aria-label', fo.label + ': ' +
      (svar[i] === true ? 'OK — trykk for å endre' :
       svar[i] === false ? 'ikke OK — trykk for å endre' : 'ikke registrert — trykk for OK'));
    ok.dataset.odId = 'test-forsok-' + fo.nr;
    ok.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
    ok.appendChild(document.createTextNode(
      svar[i] === true ? 'OK' : svar[i] === false ? 'bom' : '—'));
    /* Trykk sykler: uregistrert → OK → ikke OK → uregistrert */
    ok.addEventListener('click', function(){
      svar[i] = svar[i] === null ? true : (svar[i] === true ? false : null);
      render();
      si(fo.label + ': ' + (svar[i] === true ? 'OK.' :
        svar[i] === false ? 'ikke OK.' : 'fjernet.') +
        ' ' + antOk() + ' OK av ' + antSatt() + ' registrert.');
    });
    r.appendChild(ok);
    sk.appendChild(r);
  });
  w.appendChild(sk);

  var hint = el('p', 'prose');
  hint.style.cssText = 'font-size:12.5px;color:var(--muted);margin:0';
  hint.textContent = 'Du kan lagre når som helst — også en avbrutt test. ' +
    'Det som er registrert, telles og merkes med antall putter.';
  w.appendChild(hint);

  /* Kontrakt §3: skjermens ene aksenthandling — lagrer TestResult. */
  var lagre = el('button', 'btn now full', 'Lagre testen');
  lagre.dataset.odId = 'test-lagre';
  lagre.addEventListener('click', function(){
    if (!antSatt()){ toast('Registrer minst én putt først.'); return; }
    lagretVisning = true; render();
    si('Testen er lagret: ' + antOk() + ' av ' + antSatt() + '. Synket til TalentHQ.');
  });
  dokk.appendChild(lagre);
}

/* Kvittering: lagret + synket til TalentHQ. TalentHQ-skjermene tegnes
   IKKE her — eget oppdrag, venter på Anders' menybeslutning. Lenken
   er målpunktet. */
function renderKvittering(w){
  var kv = el('div', 'kvitt');
  var h = el('h3');
  h.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
  h.appendChild(document.createTextNode('Lagret · oppdatert i TalentHQ'));
  kv.appendChild(h);
  kv.appendChild(el('p', null,
    TEST.navn + ': ' + antOk() + ' av ' + antSatt() + ' OK' +
    (antSatt() < 10 ? ' (' + antSatt() + ' av 10 putter registrert)' : '') +
    '. Resultatet er lagret og synket til TalentHQ — der måles det mot ' +
    'kravet for kategorien din. Anders ser det i stallen.'));
  w.appendChild(kv);

  var sml = el('div', 'kort');
  sml.appendChild(el('div', 'eyebrow', 'mot forrige'));
  [['Denne testen', antOk() + ' av ' + antSatt()],
   ['Forrige · ' + TEST.sistDato, TEST.sist + ' av 10'],
   ['Foreslått mål', TEST.foreslaattMaal + ' av 10']].forEach(function(p){
    var r = el('div', 'rad');
    r.appendChild(el('span', null, p[0]));
    r.appendChild(el('span', 'v num', p[1]));
    sml.appendChild(r);
  });
  w.appendChild(sml);

  var v = el('div');
  v.style.cssText = 'display:flex;flex-direction:column;gap:var(--s2)';
  var p1 = el('a', 'btn full', 'Se utviklingen i TalentHQ →');
  p1.href = '#'; p1.dataset.odId = 'test-kvitt-talenthq';
  p1.addEventListener('click', function(e){ e.preventDefault();
    toast('TalentHQ-skjermene er et eget oppdrag — lenken er målpunktet.'); });
  var p2 = el('a', 'btn full', 'Tilbake til økta');
  p2.href = 'playerhq-live-okt.html'; p2.dataset.odId = 'test-kvitt-okt';
  var p3 = el('button', 'btn sm full', 'Angre — tilbake til scorekortet');
  p3.dataset.odId = 'test-kvitt-angre';
  p3.addEventListener('click', function(){ lagretVisning = false; render(); });
  v.appendChild(p1); v.appendChild(p2); v.appendChild(p3);
  w.appendChild(v);
}

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){
    tilstand = b.dataset.tilstand; lagretVisning = false;
    if (tilstand === 'fylt') svar = [true, true, false, true, true, true, null, null, null, null];
    settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(KEY, next); } catch(e){}
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();
</script>
</body>
</html>

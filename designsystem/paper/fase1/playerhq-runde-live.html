<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
:root {
  --bg: #faf9f5;
  --surface: #ffffff;
  --soft: #f0eee6;
  --soft-hover: #e8e6dc;
  --surface-warm: #e3dacc;
  --surface-manilla: #ebdbbc;

  --border: #e8e6dc;
  --hairline: #d1cfc5;
  --inverse: #000000;

  --fg: #141413;
  --ink-soft: #3d3d3a;
  --muted: #5e5d59;
  --mid: #b0aea5;
  --text-tertiary: #87867f;

  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);
  --rail-active: rgba(250, 249, 245, 0.14);

  --cta: #141413;
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;
  --on-accent: #141413;
  --accent-deep: #c6613f;

  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  --up: #63784a;
  --up-raw: #788c5d;
  --dn: #a85536;
  --info: #46719f;
  --info-raw: #6a9bcc;

  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;
  --text-body-player: 14px;
  --text-label: 10px;
  --text-kpi: 40px;

  --text-hero: 56px;
  --text-section: 40px;
  --text-prose: 18px;
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;

  --r-none: 0px;
  --r-sm: 8px;
  --r: 12px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;

  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;

  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;

  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;

}

  *, *::before, *::after {
    animation-duration: 0.01ms !important;

  }
}

@media (pointer: coarse) {

    --floor: var(--tap);
  }

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }
/* ═══ PlayerHQ · Runde live ═══
   Live golfrunde hull for hull. KUN brutto score (ekte slag) —
   netto finnes ikke i denne appen. Bygget for én hånd på banen:
   store treffmål, ett hull om gangen, løpende sum.

   Lagring sperrer aldri: runden kan lagres når som helst —
   også etter 9 hull eller midt i. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; color:inherit; text-decoration:none; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(96px + env(safe-area-inset-bottom)); }

/* Sumkort — løpende brutto */
.sum{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s4); }
.sum .stor{ display:flex; align-items:baseline; gap:var(--s3); }
.sum .stor .slag{ font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:40px; font-weight:500; line-height:1; }
.sum .stor .rel{ font-family:var(--mono); font-size:16px; color:var(--muted); }
.sum .m{ font-family:var(--mono); font-size:10.5px; color:var(--muted);
  display:block; margin-top:var(--s1); }

/* Hullstripe — 18 celler, trykk for å hoppe */
.strip{ display:grid; grid-template-columns:repeat(9, 1fr); gap:var(--s1);
  margin-bottom:var(--s4); }
.strip button{ min-height:var(--tap); border:1px solid var(--border);
  border-radius:var(--r-sm); background:var(--surface); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:2px 0; }
.strip .hn{ font-family:var(--mono); font-size:8.5px; color:var(--mid); line-height:1.2; }
.strip .hs{ font-family:var(--mono); font-size:13px; font-weight:600; line-height:1.2; }
.strip .hs.tomt{ color:var(--mid); font-weight:400; }
.strip button[aria-current="true"]{ border-color:var(--fg); background:var(--soft); }
.strip .hs.over{ color:var(--dn); }
.strip .hs.under{ color:var(--up); }

/* Gjeldende hull — store treffmål */
.hull{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s4); }
.hull .hh{ display:flex; align-items:baseline; gap:var(--s2); margin-bottom:var(--s3); }
.hull .hh h2{ margin:0; font-family:var(--disp); font-size:16px; font-weight:600; }
.hull .hh .par{ font-family:var(--mono); font-size:12px; color:var(--muted); }
.stepper{ display:grid; grid-template-columns:1fr auto 1fr; gap:var(--s2);
  align-items:center; margin-bottom:var(--s3); }
.stepper button{ min-height:88px; border:1px solid var(--border); border-radius:var(--r);
  background:var(--soft); font-family:var(--mono); font-size:28px; cursor:pointer; }
.stepper button:active{ background:var(--soft-hover); transform:translateY(1px); }
.stepper .vis{ min-width:96px; text-align:center; }
.stepper .vis .sc{ font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:56px; font-weight:500; line-height:1; }
.stepper .vis .navn{ display:block; font-family:var(--mono); font-size:10.5px;
  color:var(--muted); margin-top:var(--s1); }
.hullnav{ display:flex; gap:var(--s2); }
.hullnav .btn{ flex:1; }

.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.tom .valg{ display:flex; flex-direction:column; gap:var(--s2); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s2); animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }

.why{ margin:var(--s3) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

.kvitt{ padding:var(--s5) var(--s4); background:var(--surface);
  border:1px solid var(--up); border-radius:var(--r); margin-bottom:var(--s4); }
.kvitt h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:16px; font-weight:600;
  display:flex; align-items:center; gap:var(--s2); }
.kvitt h3 svg{ width:20px; height:20px; fill:none; stroke:var(--up); stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; }
.kvitt p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }

.dokk{ position:absolute; left:0; right:0; bottom:0;
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 70%, transparent); }
@media (min-width:1024px){ .dokk{ position:sticky; background:var(--bg);
  border-top:1px solid var(--border); } .dokk .btn{ max-width:720px; margin:0 auto; display:flex; } }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,summary,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow{ min-height:0; }
</style>
</head>
<body>
<p class="framehint">PlayerHQ · Runde live · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">
    <a class="ikon" href="playerhq-plan.html" aria-label="Til planen" data-od-id="runde-tilbake">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div style="min-width:0">
      <h1>Runde · live</h1>
      <span class="sub">Gamle Fredrikstad GK · 18 hull · brutto</span>
    </div>
    <span style="flex:1"></span>
    <!-- demo-bryter · fjernes før koding -->
    <div data-demo-only="true" style="display:flex;gap:4px">
      <button class="ikon" data-tilstand="fylt" aria-pressed="true" aria-label="Demo: suksess" data-od-id="runde-demo-fylt"><span class="num" style="font-size:10px">F</span></button>
      <button class="ikon" data-tilstand="tom" aria-pressed="false" aria-label="Demo: tom" data-od-id="runde-demo-tom"><span class="num" style="font-size:10px">T</span></button>
      <button class="ikon" data-tilstand="laster" aria-pressed="false" aria-label="Demo: laster" data-od-id="runde-demo-laster"><span class="num" style="font-size:10px">L</span></button>
      <button class="ikon" data-tilstand="feil" aria-pressed="false" aria-label="Demo: feil" data-od-id="runde-demo-feil"><span class="num" style="font-size:10px">E</span></button>
    </div>
    <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="runde-theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="kropp" id="kropp"></main>
  <div class="dokk" id="dokk"></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ PlayerHQ · Runde live · datamodell ═══
   Kilder: Round (runden: bane, dato, type) → HoleScore (brutto slag
   per hull — det eneste som lagres). Par-verdiene kommer fra banens
   oppsett i basen, ikke fra spilleren.
   Golf-regel (CLAUDE.md): KUN brutto score, aldri netto.
   Demo-kanon: Øyvind Rohjan · Gamle Fredrikstad GK (eneste synlige
   lokasjon ved lansering). */

var PAR = [4,4,3,5,4,4,3,4,5, 4,3,4,5,4,4,3,5,4];  /* 36 ut + 36 inn = 72 */
var scores = [5,4,3,6,4,4, null,null,null, null,null,null,null,null,null,null,null,null];
var hull = 6;            /* 0-indeksert — hull 7 */
var tilstand = 'fylt', lagretVisning = false;

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function spilte(){ return scores.filter(function(s){ return s != null; }).length; }
function sumSlag(){ return scores.reduce(function(a, s){ return a + (s || 0); }, 0); }
function sumPar(){ var p = 0;
  scores.forEach(function(s, i){ if (s != null) p += PAR[i]; }); return p; }
function relStr(){ var d = sumSlag() - sumPar();
  return d === 0 ? 'E' : (d > 0 ? '+' + d : String(d)); }

/* Scorenavn på norsk — avledet av par, bare visning */
function scoreNavn(s, par){
  var d = s - par;
  if (d <= -2) return 'eagle'; if (d === -1) return 'birdie';
  if (d === 0) return 'par'; if (d === 1) return 'bogey';
  if (d === 2) return 'dobbeltbogey'; return d + ' over';
}

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';
  var dokk = document.getElementById('dokk'); dokk.innerHTML = '';

  if (tilstand === 'laster'){
    for (var i = 0; i < 7; i++){ var s = el('div', 'skel'); s.style.width = (95 - i*7) + '%'; w.appendChild(s); }
    return;
  }
  if (tilstand === 'tom'){
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Ingen runde pågår'));
    t.appendChild(el('p', null,
      'Start en runde når du står på første tee — eller etterregistrer ' +
      'en runde du allerede har spilt.'));
    var v = el('div', 'valg');
    /* Kontrakt §3: i tom tilstand er start skjermens ene aksenthandling. */
    var st = el('button', 'btn now full', 'Start runden · Gamle Fredrikstad GK');
    st.dataset.odId = 'runde-tom-start';
    st.addEventListener('click', function(){
      scores = scores.map(function(){ return null; }); hull = 0;
      tilstand = 'fylt'; settDemo();
      si('Runden er startet på hull 1.');
    });
    var et = el('a', 'btn full', 'Etterregistrer en spilt runde');
    et.href = 'playerhq-runde-logg.html'; et.dataset.odId = 'runde-tom-logg';
    v.appendChild(st); v.appendChild(et);
    t.appendChild(v); w.appendChild(t); return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Mistet forbindelsen'));
    f.appendChild(el('p', null,
      'Scoren ligger trygt på telefonen og synkes når nettet er tilbake. ' +
      'Spill videre — ingenting går tapt.'));
    /* Kontrakt §3: i feiltilstand er «Prøv igjen» skjermens ene aksenthandling. */
    var fb = el('button', 'btn now full', 'Prøv igjen'); fb.dataset.odId = 'runde-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f); return;
  }

  if (lagretVisning){ renderKvittering(w); return; }

  /* ── Suksess: runde pågår ── */

  /* Løpende sum — regnet, ikke skrevet */
  var sum = el('div', 'sum');
  sum.appendChild(el('div', 'eyebrow', 'etter ' + spilte() + ' av 18 hull'));
  var stor = el('div', 'stor');
  stor.appendChild(el('span', 'slag num', String(sumSlag())));
  stor.appendChild(el('span', 'rel num', relStr() + ' · brutto'));
  sum.appendChild(stor);
  sum.appendChild(el('span', 'm', 'Gamle Fredrikstad GK · par ' + sumPar() + ' på spilte hull'));
  var wd = el('details', 'why'); wd.dataset.odId = 'runde-why-sum';
  wd.appendChild(el('summary', null, 'Hvorfor dette tallet'));
  var ul = document.createElement('ul');
  ['Kilde: slagene du har tastet inn, hull for hull. Ingenting annet.',
   'Beregning: ' + sumSlag() + ' slag minus par ' + sumPar() + ' på de ' + spilte() + ' spilte hullene = ' + relStr() + '.',
   'Forbehold: kun brutto — ekte slag. Netto og poeng finnes ikke i denne appen.']
   .forEach(function(x){ ul.appendChild(el('li', null, x)); });
  wd.appendChild(ul); sum.appendChild(wd);
  w.appendChild(sum);

  /* Hullstripe */
  var strip = el('div', 'strip');
  strip.setAttribute('role', 'group'); strip.setAttribute('aria-label', 'Hopp til hull');
  scores.forEach(function(s, i){
    var b = document.createElement('button');
    b.dataset.odId = 'runde-hull-' + (i+1);
    b.setAttribute('aria-current', String(i === hull));
    b.setAttribute('aria-label', 'Hull ' + (i+1) + (s != null ? ', ' + s + ' slag' : ', ikke spilt'));
    b.appendChild(el('span', 'hn', String(i+1)));
    var hs = el('span', 'hs num' + (s == null ? ' tomt' : (s > PAR[i] ? ' over' : (s < PAR[i] ? ' under' : ''))),
      s == null ? '·' : String(s));
    b.appendChild(hs);
    b.addEventListener('click', function(){ hull = i; render(); });
    strip.appendChild(b);
  });
  w.appendChild(strip);

  /* Gjeldende hull — score settes med to store knapper */
  var hk = el('div', 'hull');
  var hh = el('div', 'hh');
  var h2 = el('h2', null, 'Hull ' + (hull+1));
  hh.appendChild(h2);
  hh.appendChild(el('span', 'par num', 'par ' + PAR[hull]));
  hk.appendChild(hh);
  var scoreNaa = scores[hull] != null ? scores[hull] : PAR[hull];
  var stp = el('div', 'stepper');
  var minus = el('button', null, '−');
  minus.dataset.odId = 'runde-minus';
  minus.setAttribute('aria-label', 'Ett slag mindre');
  minus.addEventListener('click', function(){
    if (scoreNaa > 1){ scores[hull] = scoreNaa - 1; render();
      si('Hull ' + (hull+1) + ': ' + scores[hull] + ' slag.'); }
  });
  var vis = el('div', 'vis');
  vis.appendChild(el('span', 'sc num', String(scoreNaa)));
  vis.appendChild(el('span', 'navn',
    scores[hull] != null ? scoreNavn(scoreNaa, PAR[hull]) : 'trykk + eller − for å sette'));
  var pluss = el('button', null, '+');
  pluss.dataset.odId = 'runde-pluss';
  pluss.setAttribute('aria-label', 'Ett slag mer');
  pluss.addEventListener('click', function(){
    scores[hull] = scoreNaa + (scores[hull] != null ? 1 : 0); render();
    si('Hull ' + (hull+1) + ': ' + scores[hull] + ' slag.');
  });
  stp.appendChild(minus); stp.appendChild(vis); stp.appendChild(pluss);
  hk.appendChild(stp);

  var nav = el('div', 'hullnav');
  var forrige = el('button', 'btn', '← Forrige');
  forrige.dataset.odId = 'runde-forrige';
  forrige.disabled = hull === 0;
  if (forrige.disabled) forrige.style.opacity = '.4';
  forrige.addEventListener('click', function(){ if (hull > 0){ hull--; render(); } });
  var neste = el('button', 'btn ink', 'Neste hull →');
  neste.dataset.odId = 'runde-neste';
  neste.addEventListener('click', function(){
    if (scores[hull] == null) scores[hull] = PAR[hull];  /* uendret stepper = par */
    if (hull < 17){ hull++; render();
      si('Hull ' + (hull+1) + ', par ' + PAR[hull] + '.'); }
    else { render(); toast('Siste hull — lagre runden når du er klar.'); }
  });
  nav.appendChild(forrige); nav.appendChild(neste);
  hk.appendChild(nav);
  w.appendChild(hk);

  var hint = el('p', 'prose');
  hint.style.cssText = 'font-size:12.5px;color:var(--muted);margin:0';
  hint.textContent = 'Du kan lagre når som helst — også etter 9 hull eller midt i runden. Det som er tastet, telles.';
  w.appendChild(hint);

  /* Kontrakt §3: skjermens ene aksenthandling — lagrer runden. */
  var lagre = el('button', 'btn now full', 'Lagre runden');
  lagre.dataset.odId = 'runde-lagre';
  lagre.addEventListener('click', function(){
    if (!spilte()){ toast('Tast minst ett hull først.'); return; }
    lagretVisning = true; render();
    si('Runden er lagret: ' + spilte() + ' hull, ' + sumSlag() + ' slag.');
  });
  dokk.appendChild(lagre);
}

function renderKvittering(w){
  var kv = el('div', 'kvitt');
  var h = el('h3');
  h.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
  h.appendChild(document.createTextNode('Runden er lagret'));
  kv.appendChild(h);
  kv.appendChild(el('p', null,
    spilte() + ' av 18 hull · ' + sumSlag() + ' slag (' + relStr() + ') · brutto. ' +
    'Runden ligger i Analyse og teller i statistikken din. Anders ser den i stallen.'));
  w.appendChild(kv);

  var v = el('div');
  v.style.cssText = 'display:flex;flex-direction:column;gap:var(--s2)';
  var p1 = el('a', 'btn full', 'Se runden i Analyse');
  p1.href = 'playerhq-analyse.html'; p1.dataset.odId = 'runde-kvitt-analyse';
  var p2 = el('a', 'btn full', 'Til planen');
  p2.href = 'playerhq-plan.html'; p2.dataset.odId = 'runde-kvitt-plan';
  var p3 = el('button', 'btn sm full', 'Tilbake — runden står fortsatt åpen');
  p3.dataset.odId = 'runde-kvitt-tilbake';
  p3.addEventListener('click', function(){ lagretVisning = false; render(); });
  v.appendChild(p1); v.appendChild(p2); v.appendChild(p3);
  w.appendChild(v);
}

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){
    tilstand = b.dataset.tilstand; lagretVisning = false;
    if (tilstand === 'fylt'){ scores = [5,4,3,6,4,4, null,null,null,
      null,null,null,null,null,null,null,null,null]; hull = 6; }
    settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(KEY, next); } catch(e){}
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foreldreportal · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }

/* ═══ Foreldreportal · AK Golf HQ ═══
   Mobil-først. Foresatt åpner denne på telefonen, som regel fordi noe
   mangler — et samtykke, en faktura.

   TRE TING SOM IKKE ER KOSMETIKK:

   1. HELSEDATA VISES IKKE. Foresatt kan gi helsesamtykke på vegne av en
      mindreårig, men det gir ikke innsyn i innholdet. Skjermen sier det
      rett ut i stedet for å la fraværet se ut som en feil.

   2. SPILLEREN EIER PLANEN. Foresatt ser den, men endrer den ikke.
      Ingen godkjenn-knapp på treningsinnhold.

   3. ETT SAMTYKKE ER IKKE ALLE. Lyd, helse og foresattbekreftelse er tre
      selvstendige valg med hver sin konsekvens, ikke én bryter for «alt». */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button,input,textarea{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.full{ width:100%; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.phone{ width:430px; max-width:100%; height:932px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }
.phone .scrim,.phone .ark{ position:absolute; }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s3);
  padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) var(--s4);
  border-bottom:1px solid var(--border); background:var(--surface); }
.av{ width:48px; height:48px; flex:none; border-radius:var(--r-pill); background:var(--soft);
  display:grid; place-items:center; font-family:var(--mono); font-size:15px; font-weight:600;
  color:var(--muted); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.faner{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border-soft);
  background:var(--softer); }
.faner::-webkit-scrollbar{ display:none; }
.chip{ display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  padding:0 var(--s4); font-size:12.5px; background:var(--surface); flex:none;
  border:1px solid var(--border); border-radius:var(--r-pill); cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(var(--s7) + env(safe-area-inset-bottom)); }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s3); }
.kort > .eyebrow{ display:block; margin-bottom:var(--s2); }
.kilde{ display:block; font-family:var(--mono); font-size:9px; color:var(--mid);
  letter-spacing:.04em; margin-bottom:var(--s3); }
.kort h2{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.kort p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13px; color:var(--muted); }

.nowblock{ background:var(--accent-soft); border:1px solid var(--border);
  border-left:3px solid var(--accent); border-radius:var(--r); padding:var(--s4);
  margin-bottom:var(--s3); }
.nowblock .eyebrow{ color:var(--accent-fg); }
.nowblock h2{ margin:var(--s1) 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.nowblock p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13px; color:var(--muted); }

.rad{ display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 0;
  border-bottom:1px solid var(--border-soft); font-size:13.5px; min-height:var(--tap); }
.rad:last-of-type{ border-bottom:0; }
.rad .k{ min-width:0; }
.rad .k small{ display:block; font-size:11.5px; color:var(--muted); font-family:var(--body); }
.rad .v{ margin-left:auto; font-family:var(--mono); font-size:13px; text-align:right; flex:none; }
.rad .v.pos{ color:var(--up); } .rad .v.neg{ color:var(--dn); }

.lenkerad{ display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
  padding:var(--s3) 0; border:0; border-bottom:1px solid var(--border-soft);
  background:transparent; cursor:pointer; font-size:13.5px; min-height:var(--tap); }
.lenkerad:last-of-type{ border-bottom:0; }
.lenkerad .pil{ margin-left:auto; color:var(--muted); }
.lenkerad small{ display:block; font-size:11.5px; color:var(--muted); font-family:var(--body); }

/* Samtykkerad — hvert samtykke er sitt eget valg med sin egen konsekvens */
.samtykke{ padding:var(--s3) 0; border-bottom:1px solid var(--border-soft); }
.samtykke:last-of-type{ border-bottom:0; }
.samtykke .hode{ display:flex; align-items:center; gap:var(--s3); min-height:var(--tap); }
.samtykke .navn{ font-size:13.5px; font-weight:500; }
.samtykke .status{ margin-left:auto; flex:none; display:inline-flex; align-items:center;
  gap:6px; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.samtykke .status::before{ content:""; width:7px; height:7px; border-radius:var(--r-pill);
  background:var(--mid); }
.samtykke .status.gitt::before{ background:var(--up-raw); }
.samtykke .status.mangler::before{ background:var(--dn); }
.samtykke p{ margin:var(--s1) 0 var(--s2); font-family:var(--body); font-size:12.5px;
  color:var(--muted); }

.merk{ display:flex; gap:var(--s3); padding:var(--s3) var(--s4); background:var(--soft);
  border:1px solid var(--border); border-radius:var(--r); margin-bottom:var(--s3); }
.merk svg{ width:16px; height:16px; flex:none; margin-top:2px; fill:none;
  stroke:var(--muted); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.merk p{ margin:0; font-family:var(--body); font-size:12.5px; color:var(--muted); }
.merk.laas svg{ stroke:var(--dn); }

.tom{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--s3);
  padding:var(--s6) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h2{ margin:0; font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }

.uke{ display:flex; flex-direction:column; gap:var(--s2); }
.okt{ display:flex; align-items:flex-start; gap:var(--s3); padding:var(--s3);
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--info);
  border-radius:var(--r); font-size:13px; }
.okt .dag{ font-family:var(--mono); font-size:11.5px; color:var(--muted); flex:none;
  min-width:64px; }
.okt .t{ display:block; font-weight:500; }
.okt .s{ display:block; font-family:var(--body); font-size:12px; color:var(--muted); }

.faktura{ display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
  padding:var(--s3) var(--s4); margin-bottom:var(--s2); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r); cursor:pointer;
  min-height:var(--tap); font-size:13.5px; }
.faktura.forfalt{ border-left:3px solid var(--dn); }
.faktura .b{ margin-left:auto; font-family:var(--mono); font-size:13px; flex:none; }
.faktura small{ display:block; font-family:var(--body); font-size:11.5px; color:var(--muted); }

.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:var(--z-sheet); display:none; }
.scrim.on{ display:block; }
.ark{ position:fixed; left:0; right:0; bottom:0; z-index:calc(var(--z-sheet) + 1);
  max-height:88%; background:var(--surface); border-top:1px solid var(--border);
  border-radius:var(--r-lg) var(--r-lg) 0 0; display:none; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom); }
.ark.on{ display:flex; }
.grab{ flex:none; width:36px; height:4px; border-radius:var(--r-pill);
  background:var(--border); margin:var(--s3) auto var(--s2); }
.ahead{ flex:none; display:flex; align-items:flex-start; gap:var(--s2);
  padding:0 var(--s4) var(--s3); border-bottom:1px solid var(--border); }
.ahead h2{ margin:0; font-family:var(--disp); font-size:16px; font-weight:600; }
.ahead .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.abody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }
.afoot{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  border-top:1px solid var(--border); }
.afoot .btn{ flex:1; }
.felt{ margin-bottom:var(--s3); }
.felt label{ display:block; font-size:13px; font-weight:500; margin-bottom:var(--s1); }
.felt textarea{ width:100%; min-height:96px; padding:var(--s2) var(--s3); background:var(--bg);
  border:1px solid var(--border); border-radius:var(--r-sm); font-size:15px; resize:vertical; }
.felt .hjelp{ display:block; font-family:var(--body); font-size:12px; color:var(--muted);
  margin-top:var(--s1); }

.toast{ position:fixed; left:50%; bottom:var(--s6); transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,.chip,summary,textarea,.lenkerad,.faktura{ min-height:var(--tap); }
.tag,.num,.eyebrow,.kilde,.rad .v,.samtykke .status,.okt .dag,.faktura .b{ min-height:0; }

</style>
</head>
<body>
<p class="framehint">Foreldreportal · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">
    <div class="av" aria-hidden="true">ØR</div>
    <div style="min-width:0">
      <h1>Øyvind Rohjan</h1>
      <span class="sub">du er registrert som foresatt</span>
    </div>
    <span style="flex:1"></span>
    <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="fp-theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="faner" id="faner" role="tablist" aria-label="Visning"></div>
  <main class="kropp" id="kropp"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="ark" id="ark" role="dialog" aria-modal="true" aria-labelledby="arkTitle" hidden>
  <div class="grab"></div>
  <div class="ahead">
    <div style="min-width:0">
      <h2 id="arkTitle">—</h2>
      <span class="sub" id="arkSub">—</span>
    </div>
    <span style="flex:1"></span>
    <button class="ikon" data-lukk="1" aria-label="Lukk" data-od-id="fp-ark-lukk">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="abody" id="arkBody"></div>
  <div class="afoot" id="arkFoot"></div>
</section>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ Foreldreportal ═══
   Kilder: parent_relations · parent_invitations · lyd_samtykker ·
   helse_samtykker · payments · training_plans · users

   HVORFOR DENNE FLATA FINNES: foresatt har allerede forpliktelser i tre andre
   skjermer — samtykke i spillerprofilen, «Lydsamtykke mangler · forelder» i
   Innboksen, og forfalt faktura med forelder som mottaker. Uten et sted å
   gjøre noe med det, er de sakene blindveier.

   HELSEDATA VISES IKKE HER. Foresatt kan gi helsesamtykke på vegne av en
   mindreårig — det er et juridisk samtykke, ikke en innsynsrett. Skjermen
   sier det rett ut, i stedet for å la fraværet se ut som en feil.

   PLANEN SES, IKKE ENDRES. Spilleren eier planen sin (eierskapsmodellen
   01.08). Foresatt har ingen godkjenn-knapp på treningsinnhold. */

var SPILLER = { navn:'Øyvind Rohjan', alder:18, klubb:'Gamle Fredrikstad GK',
                coach:'Anders Kristiansen' };

var SAMTYKKER = [
  { k:'foresatt', n:'Foresattbekreftelse', gitt:true, dato:'12.08.2024',
    d:'Bekrefter at du er foresatt og har godkjent at Øyvind er spiller hos AK Golf Academy.',
    kanTrekke:false,
    laasGrunn:'Kan ikke trekkes her. Skal avtalen avsluttes, gjøres det med Anders direkte.' },
  { k:'lyd', n:'Lydopptak i videoanalyse', gitt:false, dato:null,
    d:'Lar Anders dele videoanalyse med lyd. Uten dette får Øyvind video uten kommentar.',
    kanTrekke:true },
  { k:'helse', n:'Helsedata', gitt:true, dato:'12.08.2024',
    d:'Lar Anders registrere skader, belastning og søvn i planleggingen.',
    kanTrekke:true,
    merknad:'Du gir samtykket, men ser ikke innholdet. Helsedata er Øyvinds egne.' }
];

var FAKTURA = [
  { id:'f1', nr:'2026-084', tekst:'Performance · august', bel:1300, forfall:'01.08.2026',
    status:'forfalt' },
  { id:'f2', nr:'2026-071', tekst:'Performance · juli',   bel:1300, forfall:'01.07.2026',
    status:'betalt' },
  { id:'f3', nr:'2026-058', tekst:'Performance · juni',   bel:1300, forfall:'01.06.2026',
    status:'betalt' }
];

var UKE = [
  { dag:'man 4.8',  t:'Innspill · lengdekontroll', s:'Gamle Fredrikstad GK · 90 min' },
  { dag:'tir 5.8',  t:'Coachingtime med Anders',   s:'Gamle Fredrikstad GK · 20 min' },
  { dag:'tor 7.8',  t:'Nærspill · landingspunkt',  s:'Gamle Fredrikstad GK · 75 min' },
  { dag:'lør 9.8',  t:'Testrunde 18 hull',         s:'Gamle Fredrikstad GK' }
];

var FANER = [
  { k:'oversikt',   n:'Oversikt' },
  { k:'samtykker',  n:'Samtykker' },
  { k:'betaling',   n:'Betaling' },
  { k:'plan',       n:'Plan' },
  { k:'kontakt',    n:'Kontakt' }
];

var fane = 'oversikt', melding = '';

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2800); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function heltall(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function samt(k){ return SAMTYKKER.filter(function(s){ return s.k === k; })[0]; }
function manglende(){ return SAMTYKKER.filter(function(s){ return !s.gitt; }); }
function forfalte(){ return FAKTURA.filter(function(f){ return f.status === 'forfalt'; }); }

function kort(tittel, kilde){
  var k = el('section','kort');
  k.appendChild(document.createComment(' kilde: ' + kilde + ' '));
  if (tittel) k.appendChild(el('span','eyebrow', tittel));
  k.appendChild(el('span','kilde','kilde: ' + kilde));
  return k;
}
function rad(k, v, sub){
  var r = el('div','rad');
  var d = el('div','k'); d.appendChild(document.createTextNode(k));
  if (sub) d.appendChild(el('small', null, sub));
  r.appendChild(d);
  if (v != null) r.appendChild(el('div','v num', v));
  return r;
}
function lenkerad(tekst, sub, id, handling){
  var b = el('button','lenkerad'); b.type = 'button'; b.dataset.odId = id;
  var d = el('div','k'); d.appendChild(document.createTextNode(tekst));
  if (sub) d.appendChild(el('small', null, sub));
  b.appendChild(d);
  b.appendChild(el('span','pil','›'));
  b.addEventListener('click', handling);
  return b;
}

/* ── Faner ───────────────────────────────────────────────────── */
function renderFaner(){
  var w = document.getElementById('faner'); w.innerHTML = '';
  FANER.forEach(function(f){
    var c = el('button','chip'); c.type = 'button';
    c.setAttribute('role','tab');
    c.setAttribute('aria-pressed', String(f.k === fane));
    c.dataset.odId = 'fp-fane-' + f.k;
    c.appendChild(el('span', null, f.n));
    if (f.k === 'samtykker' && manglende().length)
      c.appendChild(el('span','tag dn', String(manglende().length)));
    if (f.k === 'betaling' && forfalte().length)
      c.appendChild(el('span','tag dn', String(forfalte().length)));
    c.addEventListener('click', function(){ fane = f.k; render(); si(f.n + ' åpnet.'); });
    w.appendChild(c);
  });
}

/* ── Én ting nå ──────────────────────────────────────────────────
   Rangeringen er bevisst: en forfalt faktura stanser abonnementet,
   et manglende samtykke stanser bare én type materiale. Penger først. */
function enTingNa(w){
  var f = forfalte()[0];
  if (f){
    var v = el('div','nowblock');
    v.appendChild(document.createComment(' kilde: payments '));
    v.appendChild(el('span','eyebrow','Én ting nå'));
    v.appendChild(el('h2', null, 'Faktura ' + f.nr + ' forfalt ' + f.forfall));
    v.appendChild(el('p', null,
      f.tekst + ' · ' + heltall(f.bel) + ' kr. Blir den stående ubetalt, stanses ' +
      'abonnementet — og da mister Øyvind både øktene og PlayerHQ.'));
    var b = el('button','btn now full','Betal ' + heltall(f.bel) + ' kr');
    b.type = 'button'; b.dataset.odId = 'fp-one-thing-now';
    b.addEventListener('click', function(){ betal(f); });
    v.appendChild(b);
    w.appendChild(v);
    return;
  }
  var s = manglende()[0];
  if (s){
    var v2 = el('div','nowblock');
    v2.appendChild(document.createComment(' kilde: lyd_samtykker, helse_samtykker '));
    v2.appendChild(el('span','eyebrow','Én ting nå'));
    v2.appendChild(el('h2', null, s.n + ' mangler'));
    v2.appendChild(el('p', null, s.d));
    var b2 = el('button','btn now full','Gi samtykke');
    b2.type = 'button'; b2.dataset.odId = 'fp-one-thing-now';
    b2.addEventListener('click', function(){ giSamtykke(s); });
    v2.appendChild(b2);
    w.appendChild(v2);
  }
}

function giSamtykke(s){
  s.gitt = true;
  s.dato = '02.08.2026';
  render();
  si(s.n + ' er gitt. Anders har fått varsel, og Øyvind ser det i PlayerHQ.');
  toast(s.n + ' gitt');
}

function betal(f){
  apneArk('Betal faktura ' + f.nr, f.tekst, function(b){
    b.appendChild(document.createComment(' kilde: payments, Stripe '));
    var k = el('div','kort');
    k.appendChild(rad('Beløp', heltall(f.bel) + ' kr'));
    k.appendChild(rad('Forfall', f.forfall));
    k.appendChild(rad('Gjelder', null, f.tekst));
    b.appendChild(k);
    var m = el('div','merk');
    m.innerHTML = '<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>';
    m.appendChild(el('p', null,
      'Betalingen går via Stripe. Ingen kortopplysninger lagres hos AK Golf.'));
    b.appendChild(m);
  }, [
    { tekst:'Avbryt', id:'fp-betal-avbryt', gjor:lukkArk },
    { tekst:'Til betaling', id:'fp-betal-bekreft', ink:true, gjor:function(){
        f.status = 'betalt';
        lukkArk(); render();
        si('Faktura ' + f.nr + ' er betalt. Kvittering kommer på e-post.');
        toast('Betalt · kvittering på e-post'); } }
  ]);
}

/* ── Visninger ───────────────────────────────────────────────── */
var VIS = {

oversikt: function(w){
  enTingNa(w);

  var k = kort('Spilleren', 'users, parent_relations');
  k.appendChild(rad('Navn', SPILLER.navn));
  k.appendChild(rad('Klubb', SPILLER.klubb));
  k.appendChild(rad('Coach', SPILLER.coach));
  k.appendChild(rad('Din rolle', 'foresatt'));
  w.appendChild(k);

  var st = kort('Status', 'lyd_samtykker, helse_samtykker, payments');
  st.appendChild(rad('Samtykker',
    manglende().length ? manglende().length + ' mangler' : 'alle gitt'));
  st.appendChild(rad('Betaling',
    forfalte().length ? forfalte().length + ' forfalt' : 'ingen utestående'));
  st.appendChild(rad('Neste økt', UKE[0].dag + ' · ' + UKE[0].t.split(' · ')[0]));
  w.appendChild(st);

  /* Grensen sies rett ut. Uten dette ser fraværet av helsedata ut som en feil. */
  var m = el('div','merk laas');
  m.innerHTML = '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
  m.appendChild(el('p', null,
    'Du ser status, betaling og plan. Du ser ikke helsedata, notatene Anders ' +
    'skriver om Øyvind, eller innholdet i samtalene deres. Det er hans.'));
  w.appendChild(m);
},

samtykker: function(w){
  var k = kort('Samtykker', 'lyd_samtykker, helse_samtykker, parent_relations');
  k.appendChild(el('p', null,
    'Tre selvstendige valg. Hvert av dem gjelder én ting, og hvert av dem ' +
    'kan stå alene.'));
  SAMTYKKER.forEach(function(s){
    var d = el('div','samtykke');
    var h = el('div','hode');
    h.appendChild(el('span','navn', s.n));
    h.appendChild(el('span','status ' + (s.gitt ? 'gitt' : 'mangler'),
      s.gitt ? 'gitt ' + s.dato : 'mangler'));
    d.appendChild(h);
    d.appendChild(el('p', null, s.d));
    if (s.merknad){
      var mn = el('div','merk laas');
      mn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
      mn.appendChild(el('p', null, s.merknad));
      mn.style.marginBottom = 'var(--s2)';
      d.appendChild(mn);
    }
    if (!s.gitt){
      var g = el('button','btn sm','Gi samtykke'); g.type = 'button';
      g.dataset.odId = 'fp-gi-' + s.k;
      g.addEventListener('click', function(){ giSamtykke(s); });
      d.appendChild(g);
    } else if (s.kanTrekke){
      var t = el('button','btn sm','Trekk samtykket'); t.type = 'button';
      t.dataset.odId = 'fp-trekk-' + s.k;
      t.addEventListener('click', function(){
        apneArk('Trekk ' + s.n.toLowerCase(), 'gjelder fra du trykker', function(b){
          b.appendChild(el('p','prose', s.k === 'lyd'
            ? 'Anders slutter å dele videoanalyse med lyd. Allerede delt materiale ' +
              'fjernes innen 24 timer.'
            : 'Anders slutter å registrere skader, belastning og søvn. ' +
              'Eksisterende oppføringer slettes innen 30 dager.'));
          b.appendChild(el('p','prose',
            'Du kan gi samtykket igjen når som helst. Øyvind får beskjed.'));
        }, [
          { tekst:'Avbryt', id:'fp-trekk-avbryt', gjor:lukkArk },
          { tekst:'Trekk samtykket', id:'fp-trekk-bekreft', ink:true, gjor:function(){
              s.gitt = false; s.dato = null;
              lukkArk(); render();
              document.getElementById('kropp').scrollTop = 0;
              si(s.n + ' er trukket. Anders og Øyvind har fått varsel.');
              toast(s.n + ' trukket'); } }
        ]);
      });
      d.appendChild(t);
    } else {
      var l = el('div','merk');
      l.innerHTML = '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
      l.appendChild(el('p', null, s.laasGrunn));
      d.appendChild(l);
    }
    k.appendChild(d);
  });
  w.appendChild(k);
},

betaling: function(w){
  var k = kort('Fakturaer', 'payments, subscriptions');
  if (!FAKTURA.length){
    var t = el('div','tom');
    t.appendChild(el('h2', null, 'Ingen fakturaer ennå'));
    t.appendChild(el('p', null, 'Første faktura kommer når abonnementet starter.'));
    k.appendChild(t);
    w.appendChild(k); return;
  }
  FAKTURA.forEach(function(f){
    var b = el('button','faktura' + (f.status === 'forfalt' ? ' forfalt' : ''));
    b.type = 'button'; b.dataset.odId = 'fp-faktura-' + f.id;
    var d = el('div');
    d.appendChild(document.createTextNode(f.tekst));
    d.appendChild(el('small', null, f.nr + ' · forfall ' + f.forfall + ' · ' + f.status));
    b.appendChild(d);
    b.appendChild(el('span','b', heltall(f.bel) + ' kr'));
    b.addEventListener('click', function(){
      if (f.status === 'forfalt') betal(f);
      else {
        apneArk('Faktura ' + f.nr, f.tekst, function(bd){
          var kk = el('div','kort');
          kk.appendChild(rad('Beløp', heltall(f.bel) + ' kr'));
          kk.appendChild(rad('Status', f.status));
          kk.appendChild(rad('Forfall', f.forfall));
          bd.appendChild(kk);
        });
      }
    });
    k.appendChild(b);
  });
  w.appendChild(k);

  var a = kort('Abonnement', 'service_types, subscriptions');
  a.appendChild(rad('Plan', 'Performance'));
  a.appendChild(rad('Pris', '1 300 kr/mnd'));
  a.appendChild(rad('Inkludert', '2 × 20 min per måned'));
  a.appendChild(rad('PlayerHQ', 'inkludert'));
  a.appendChild(lenkerad('Endre eller si opp', 'Åpner Stripe-portalen', 'fp-stripe', function(){
    toast('Åpner Stripe-portalen.');
    si('Stripe-portalen åpnes. Ingen endring skjer før du bekrefter der.');
  }));
  w.appendChild(a);
},

plan: function(w){
  var k = kort('Denne uka', 'training_plans, bookings');
  k.appendChild(el('p', null,
    'Slik ser uka til Øyvind ut. Du ser den — du endrer den ikke.'));
  var u = el('div','uke');
  UKE.forEach(function(o){
    var r = el('div','okt');
    r.appendChild(el('span','dag', o.dag));
    var d = el('div');
    d.appendChild(el('span','t', o.t));
    d.appendChild(el('span','s', o.s));
    r.appendChild(d);
    u.appendChild(r);
  });
  k.appendChild(u);
  w.appendChild(k);

  /* Ingen godkjenn-knapp. Spilleren eier planen sin. */
  var m = el('div','merk');
  m.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>';
  m.appendChild(el('p', null,
    'Øyvind styrer planen sin selv, sammen med Anders. Er du uenig i noe, ' +
    'ta det opp med Anders — det løses i samtale, ikke med en knapp her.'));
  w.appendChild(m);
},

kontakt: function(w){
  var k = kort('Kontakt Anders', 'users');
  k.appendChild(rad('Coach', SPILLER.coach));
  k.appendChild(rad('E-post', 'anders@akgolf.no'));
  k.appendChild(rad('Svartid', 'innen 48 timer'));
  w.appendChild(k);

  var s = kort('Send en melding', 'me_conversation');
  var f = el('div','felt');
  var l = el('label', null, 'Hva gjelder det?'); l.setAttribute('for','fp-melding');
  f.appendChild(l);
  var ta = document.createElement('textarea');
  ta.id = 'fp-melding'; ta.value = melding; ta.dataset.odId = 'fp-melding';
  ta.placeholder = 'Skriv her.';
  ta.addEventListener('input', function(){ melding = ta.value; });
  f.appendChild(ta);
  f.appendChild(el('span','hjelp',
    'Meldingen går til Anders, ikke til Øyvind. Gjelder det noe Øyvind bør ' +
    'vite om, si det til ham også.'));
  s.appendChild(f);
  var b = el('button','btn ink full','Send'); b.type = 'button';
  b.dataset.odId = 'fp-send';
  b.addEventListener('click', function(){
    if (!melding.trim()){
      toast('Skriv noe først.'); si('Skriv en melding før du sender.');
      ta.focus(); return;
    }
    melding = ''; render();
    si('Meldingen er sendt. Anders svarer innen 48 timer.');
    toast('Sendt · svar innen 48 timer');
  });
  s.appendChild(b);
  w.appendChild(s);
}
};

/* ── Ark ─────────────────────────────────────────────────────── */
var ark = document.getElementById('ark'), scrim = document.getElementById('scrim'),
    arkBody = document.getElementById('arkBody'), arkFoot = document.getElementById('arkFoot'),
    sisteFokus = null;

function apneArk(tittel, sub, byggBody, knapper){
  sisteFokus = document.activeElement;
  document.getElementById('arkTitle').textContent = tittel;
  document.getElementById('arkSub').textContent = sub || '';
  arkBody.innerHTML = ''; arkFoot.innerHTML = '';
  byggBody(arkBody);
  (knapper || []).forEach(function(k){
    var b = el('button','btn' + (k.ink ? ' ink' : ''), k.tekst);
    b.type = 'button'; b.dataset.odId = k.id;
    b.addEventListener('click', k.gjor);
    arkFoot.appendChild(b);
  });
  if (!arkFoot.children.length){
    var lukk = el('button','btn','Lukk'); lukk.type = 'button';
    lukk.dataset.odId = 'fp-ark-lukk-2';
    lukk.addEventListener('click', lukkArk);
    arkFoot.appendChild(lukk);
  }
  ark.hidden = false; scrim.hidden = false;
  ark.classList.add('on'); scrim.classList.add('on');
  var f = ark.querySelector('button'); if (f) f.focus();
}
function lukkArk(){
  ark.classList.remove('on'); scrim.classList.remove('on');
  ark.hidden = true; scrim.hidden = true;
  if (sisteFokus && sisteFokus.isConnected) sisteFokus.focus();
}
scrim.addEventListener('click', lukkArk);
ark.querySelector('[data-lukk]').addEventListener('click', lukkArk);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !ark.hidden){ e.preventDefault(); lukkArk(); }
  if (e.key === 'Tab' && !ark.hidden){
    var f = ark.querySelectorAll('button, textarea, [href], [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var a = f[0], b = f[f.length-1];
    if (e.shiftKey && document.activeElement === a){ e.preventDefault(); b.focus(); }
    else if (!e.shiftKey && document.activeElement === b){ e.preventDefault(); a.focus(); }
  }
});

/* ── Tema ────────────────────────────────────────────────────── */
var KEY = 'akhq-theme-foreldreportal';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

function render(){
  renderFaner();
  var w = document.getElementById('kropp'); w.innerHTML = '';
  VIS[fane](w);
}

/* Ankomst: er noe forfalt eller manglende, er DET dagens ene handling, og
   oversikten er stedet den står. */

<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Innboks · AgencyOS · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

/* v3.1-tillegg foreslått fra agencyoshq.html — mellomtrinn i cream-stigen.
   Skal inn i tokens-fila hvis Anders godkjenner. */
:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }

/* ═══ Innboks · AgencyOS · mobil ═══
   Samme sløyfe som desktop, men telefonen er ikke et smalt skrivebord.
   To forskjeller som betyr noe:
   1. Detaljpanelet finnes ikke som kolonne — det er et ark. Én sak av gangen.
   2. Handlingene ligger i arkets bunn, over tommelen, aldri i lista.
   Ingen funksjon er fjernet: filtre, grunnlag, kontrakt, angre og neste sak
   er alle med. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.5; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.full{ width:100%; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.chip{ display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  padding:0 var(--s4); font-size:13px; background:var(--surface); flex:none;
  border:1px solid var(--border); border-radius:var(--r-pill); cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
.chip .n{ font-family:var(--mono); font-size:11px; opacity:.7; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); }

.phone{ width:430px; max-width:100%; height:932px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }
.phone .scrim,.phone .ark{ position:absolute; }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s3);
  padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:20px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

/* Filtre: sveipbar rad. Ingen «mer»-meny som skjuler halve settet. */
.filtre{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border-soft);
  background:var(--softer); }
.filtre::-webkit-scrollbar{ display:none; }

.liste{ flex:1; min-height:0; overflow-y:auto; padding:var(--s3) var(--s4) var(--s5); }

/* Rad: hele raden er treffflate. Ingen handling ligger i lista — den ligger
   i arket, der eier ser grunnlaget før han bestemmer seg. */
.rad{ display:grid; grid-template-columns:36px minmax(0,1fr); gap:var(--s3);
  width:100%; text-align:left; padding:var(--s3) var(--s4); margin-bottom:var(--s2);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; align-items:start; }
.rad:active{ background:var(--soft); }
.rad.lost{ opacity:.62; }
.rad.lost .t{ text-decoration:line-through; }
.rad .ic{ width:36px; height:36px; display:grid; place-items:center; border-radius:var(--r-sm);
  background:var(--soft); }
.rad .ic svg{ width:17px; height:17px; fill:none; stroke:var(--muted); stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }
.rad .t{ display:block; font-size:14px; font-weight:600; margin-bottom:2px; }
.rad .s{ display:block; font-family:var(--body); font-size:13px; color:var(--muted); }
.rad .meta{ display:flex; gap:var(--s2); align-items:center; margin-top:var(--s2); flex-wrap:wrap; }
.rad .frist{ font-family:var(--mono); font-size:11px; color:var(--muted); }
.rad .frist.snart{ color:var(--dn); }

.tom{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--s3);
  padding:var(--s6) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h2{ margin:0; font-family:var(--disp); font-size:16px; font-weight:600; }
.tom p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }

/* Bunn: Én ting nå. Peker alltid på den øverste ubehandlede saken. */
.bunn{ flex:none; padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  border-top:1px solid var(--border); background:var(--surface); }
.bunn .hint{ display:block; font-family:var(--body); font-size:12px; color:var(--muted);
  margin-bottom:var(--s2); }

.faner{ flex:none; display:flex; background:var(--rail); z-index:var(--z-rail);
  padding-bottom:env(safe-area-inset-bottom); }
.faner a{ flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; color:var(--rail-fg); text-decoration:none;
  font-size:10px; position:relative; }
.faner a svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.faner a[aria-current="page"]{ color:var(--rail-on); }
.faner a[aria-current="page"]::before{ content:""; position:absolute; top:0; left:24%; right:24%;
  height:2px; background:var(--rail-on); border-radius:var(--r-pill); }
.faner .badge{ position:absolute; top:8px; right:50%; margin-right:-24px;
  font-family:var(--mono); font-size:9px; min-width:16px; height:16px; display:grid;
  place-items:center; border-radius:var(--r-pill); background:var(--rail-on); color:var(--rail); }

/* ── Saksarket ───────────────────────────────────────────────── */
.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:var(--z-sheet); display:none; }
.scrim.on{ display:block; }
.ark{ position:fixed; left:0; right:0; bottom:0; z-index:calc(var(--z-sheet) + 1);
  height:92%; background:var(--surface); border-top:1px solid var(--border);
  border-radius:var(--r-lg) var(--r-lg) 0 0; display:none; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom); }
.ark.on{ display:flex; }
.grab{ flex:none; width:36px; height:4px; border-radius:var(--r-pill);
  background:var(--border); margin:var(--s3) auto var(--s2); }
.ahead{ flex:none; display:flex; align-items:flex-start; gap:var(--s2);
  padding:0 var(--s4) var(--s3); border-bottom:1px solid var(--border); }
.ahead h2{ margin:0; font-family:var(--disp); font-size:16px; font-weight:600; }
.ahead .sub{ display:block; font-family:var(--mono); font-size:11px; color:var(--muted); }
.abody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }
.afoot{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  border-top:1px solid var(--border); }
.afoot .btn{ flex:1; }
.afoot .eyebrow{ align-self:center; }

/* Anbefalingskontrakten: fire deler, alltid samme rekkefølge.
   Uten alle fire må eier undersøke selv — og da har forslaget kostet mer enn det ga. */
.kontrakt{ border:1px solid var(--border); border-radius:var(--r); overflow:hidden;
  margin-bottom:var(--s4); }
.kontrakt div{ padding:var(--s3) var(--s4); border-bottom:1px solid var(--border-soft); }
.kontrakt div:last-child{ border-bottom:0; }
.kontrakt .k{ display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
.kontrakt .v{ font-family:var(--body); font-size:13.5px; }

.blokk{ margin-bottom:var(--s4); }
.blokk .flab{ display:block; font-family:var(--mono); font-size:var(--text-label);
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:var(--s2); }
.blokk p{ margin:0; font-family:var(--body); font-size:13.5px; }

.prov{ background:var(--softer); border:1px solid var(--border-soft); border-radius:var(--r);
  padding:var(--s3) var(--s4); margin-bottom:var(--s4); }
.prov ul{ margin:0; padding:0; }
.prov li{ font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-bottom:4px;
  list-style:none; }

.angre{ display:flex; align-items:center; gap:var(--s3); padding:var(--s3) var(--s4);
  background:var(--accent-soft); border:1px solid var(--border); border-left:3px solid var(--accent);
  border-radius:var(--r); margin-bottom:var(--s4); font-size:13px; }
.angre .btn{ margin-left:auto; }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,.chip,summary,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow,.rad .frist{ min-height:0; }

</style>
</head>
<body>
<p class="framehint">AgencyOS · Innboks mobil · 430 px. Under 641 px fyller den skjermen.</p>
<!-- Telefonramme = demo-chrome, skal bort ved integrasjon -->
<div class="phone" data-demo-only="true">

  <header class="topp">
    <div style="min-width:0">
      <h1>Innboks</h1>
      <span class="sub"><span class="num" id="innCount">7</span> åpne · fre 31.07 <span class="num">09:12</span></span>
    </div>
    <span style="flex:1"></span>
    <button class="ikon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="inm-theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="filtre" id="filtre" role="group" aria-label="Filtre"></div>

  <main class="liste" id="liste" aria-label="Saker"></main>

  <div class="bunn" id="bunn"></div>

  <nav class="faner" aria-label="Hovednavigasjon">
    <a href="agencyos-konsoll-mobil.html" data-od-id="inm-fane-konsoll">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 9h8M8 13h5M9 18v2h6v-2"/></svg>
      Konsoll</a>
    <a href="agencyos-innboks-mobil.html" aria-current="page" data-od-id="inm-fane-innboks">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Innboks<span class="badge num" id="faneBadge">7</span></a>
    <a href="agencyos-spillere-mobil.html" data-od-id="inm-fane-spillere">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></svg>
      Spillere</a>
    <a href="agencyos-kalender-mobil.html" data-od-id="inm-fane-kalender">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Kalender</a>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="ark" id="ark" role="dialog" aria-modal="true" aria-labelledby="arkTitle" hidden>
  <div class="grab"></div>
  <div class="ahead">
    <div style="min-width:0">
      <h2 id="arkTitle">—</h2>
      <span class="sub" id="arkSub">—</span>
    </div>
    <span style="flex:1"></span>
    <button class="ikon" data-lukk="1" aria-label="Lukk" data-od-id="inm-ark-lukk">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="abody" id="arkBody"></div>
  <div class="afoot" id="arkFoot"></div>
</section>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ Innboks · AgencyOS · mobil ═══
   SAKER, FILTRE og IKON er kopiert verbatim fra agencyos-innboks.html.
   Én datamodell, to flater. Endres den ene, endres begge. */

var SAKER = [
  { id:'s1', type:'forslag', tittel:'Ukeplan uke 32 · Øyvind Rohjan',
    sub:'Agenten har skrevet et utkast. Ingenting er sendt til Øyvind.',
    hvem:'Øyvind Rohjan', frist:'i dag 16:00', snart:true, lost:false,
    kontrakt:{
      hvorfor:'SG innspill er Øyvinds svakeste område over de ti siste rundene.',
      hva:'Fem økter, 3 t 45 min trening pluss testrunde lørdag. Tre av øktene er innspill.',
      effekt:'Innspill får mest tid av alle områder denne uka, uten at totalvolumet øker.',
      hvorforNa:'Sjekkpunktet 14.08 måler nettopp innspill. Det er to uker igjen.'
    },
    prov:['Kilde: 142 loggede økter siste 90 dager',
          'Kilde: kalender uke 32 · 3 låste ankere',
          'Kilde: sjekkpunkt 14.08 · innspill 50–100 m',
          'Skrevet 09:04 · Claude · 4,7 s'] },

  /* Spilleren endret selv. Dette er en VARSLING, ikke en godkjenning.
     Anders skal vite hva som skjedde — han skal ikke si ja. */
  { id:'s2', type:'varsel', tittel:'Øyvind flyttet torsdagsøkta til fredag',
    sub:'Han endret selv i PlayerHQ. Planen er allerede oppdatert.',
    hvem:'Øyvind Rohjan', frist:'til orientering', snart:false, lost:false,
    prov:['Kilde: PlayerHQ · Plan · endret 31.07 08:12',
          'Fra: torsdag 16:00 · Til: fredag 07:00',
          'Grunn oppgitt: heldagsprøve torsdag',
          'Volum og innhold er uendret'] },

  { id:'s3', type:'forespørsel', tittel:'Lydsamtykke mangler · forelder',
    sub:'Videoanalyse kan ikke deles før samtykket er signert.',
    hvem:'Forelder · Øyvind Rohjan', frist:'ingen frist', snart:false, lost:false,
    prov:['Kilde: GDPR-modul · samtykke ikke registrert',
          'Sendt 28.07 · ikke besvart'] },

  { id:'s4', type:'forespørsel', tittel:'Øyvind ber om ekstra økt lørdag',
    sub:'«Kan jeg få en putt-økt før testrunden?»',
    hvem:'Øyvind Rohjan', frist:'i dag', snart:true, lost:false,
    prov:['Kilde: PlayerHQ-tråd 31.07 08:12',
          'Kilde: kalender lørdag · testrunde 09:00'] },

  { id:'s5', type:'drift', tittel:'Faktura forfalt · 800 kr',
    sub:'Coachingtimer juli. Purring er ikke sendt.',
    hvem:'Forelder · Øyvind Rohjan', frist:'forfalt 5 dager', snart:true, lost:false,
    prov:['Kilde: Stripe · faktura 2026-07-114',
          'Forfall 27.07 · ingen purring sendt'] },

  { id:'s6', type:'drift', tittel:'Booking-forespørsel · ny spiller',
    sub:'Prøvetime, ønsker tirsdag ettermiddag.',
    hvem:'Ekstern', frist:'svar innen 48 t', snart:false, lost:false,
    prov:['Kilde: booking-skjema akgolf-hq.vercel.app',
          'Mottatt 31.07 07:40'] },

  { id:'s7', type:'varsel', tittel:'Agentfeil · Faktura-vakten 03:14',
    sub:'Kjøringen stoppet. Neste kjøring er i natt.',
    hvem:'System', frist:'ingen frist', snart:false, lost:false,
    prov:['Kilde: AgenticOS · Agenter · Faktura-vakten',
          'Feil: tidsavbrudd mot Stripe etter 30 s'] }
];

var FILTRE = [
  { k:'alle',      n:'Alle',                f:function(){ return true; } },
  { k:'godkjenn',  n:'Trenger godkjenning', f:function(s){ return s.type === 'forslag' && !s.lost; } },
  { k:'spiller',   n:'Fra spiller',         f:function(s){ return s.type === 'forespørsel' && !s.lost; } },
  { k:'drift',     n:'Drift',               f:function(s){ return (s.type === 'drift' || s.type === 'varsel') && !s.lost; } },
  { k:'lost',      n:'Løst',                f:function(s){ return s.lost; } }
];

var IKON = {
  forslag:'<path d="M12 3v18M5 10l7-7 7 7"/>',
  'forespørsel':'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  drift:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  varsel:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>'
};


var valgtId = null, filter = 'alle', angreTimer = null, sisteAngre = null;
var tilstand = 'fylt';   /* fylt · tom · laster · feil — demo-stillas */

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function apne(){ return SAKER.filter(function(s){ return !s.lost; }).length; }
function forsteApne(){ var a = SAKER.filter(function(s){ return !s.lost; });
  return a.length ? a[0].id : null; }
function sak(id){ return SAKER.filter(function(s){ return s.id === id; })[0]; }

/* ── Filtre ──────────────────────────────────────────────────── */
function renderFiltre(){
  var w = document.getElementById('filtre');
  w.innerHTML = '';
  FILTRE.forEach(function(f){
    var c = el('button', 'chip');
    c.type = 'button';
    c.setAttribute('aria-pressed', String(f.k === filter));
    c.dataset.odId = 'inm-filter-' + f.k;
    c.appendChild(el('span', null, f.n));
    c.appendChild(el('span', 'n', SAKER.filter(f.f).length));
    c.addEventListener('click', function(){ filter = f.k; renderAlt();
      si(f.n + ': ' + SAKER.filter(f.f).length + ' saker.'); });
    w.appendChild(c);
  });
}

/* ── Liste ───────────────────────────────────────────────────── */
function renderListe(){
  var w = document.getElementById('liste');
  w.innerHTML = '';

  if (tilstand === 'laster'){
    var l = el('div','tom');
    l.appendChild(el('h2', null, 'Henter innboksen'));
    l.appendChild(el('p', null, 'Henter saker fra AgencyOS. Det tar sjelden mer enn et par sekunder.'));
    w.appendChild(l); w.appendChild(demobryter()); return;
  }
  if (tilstand === 'feil'){
    var f2 = el('div','tom');
    f2.appendChild(el('h2', null, 'Fikk ikke kontakt'));
    f2.appendChild(el('p', null,
      'Vi fikk ikke hentet innboksen. Ingen sak er tapt — dette er kun visningen.'));
    var pr = el('button','btn','Prøv på nytt');
    pr.type = 'button'; pr.dataset.odId = 'inm-prov-igjen';
    pr.addEventListener('click', function(){ tilstand = 'laster'; renderAlt();
      setTimeout(function(){ tilstand = 'fylt'; renderAlt(); si('Innboksen er hentet.'); }, 700); });
    f2.appendChild(pr);
    w.appendChild(f2); w.appendChild(demobryter()); return;
  }

  var flt = FILTRE.filter(function(x){ return x.k === filter; })[0];
  var rader = tilstand === 'tom' ? [] : SAKER.filter(flt.f);

  if (!rader.length){
    var e = el('div', 'tom');
    var tomTittel = tilstand === 'tom' ? 'Innboksen er tom'
                  : filter === 'lost'  ? 'Ingenting er løst ennå' : 'Ingenting her';
    e.appendChild(el('h2', null, tomTittel));
    e.appendChild(el('p', null,
      tilstand === 'tom'
        ? 'Alt er behandlet. Neste sak dukker opp når en agent har skrevet noe, ' +
          'eller når en spiller ber om noe.'
        : filter === 'lost'
          ? 'Saker du godkjenner eller avviser havner her, med tidsstempel.'
          : 'Ingen saker treffer dette filteret. Det ligger ' + apne() + ' åpne saker i innboksen.'));
    if (tilstand === 'tom'){
      var k = el('button', 'btn', 'Åpne kalenderen');
      k.type = 'button'; k.dataset.odId = 'inm-tom-kalender';
      k.addEventListener('click', function(){ location.href = 'agencyos-kalender-mobil.html'; });
      e.appendChild(k);
    } else {
      var b = el('button', 'btn', 'Vis alle');
      b.type = 'button'; b.dataset.odId = 'inm-tom-alle';
      b.addEventListener('click', function(){ filter = 'alle'; renderAlt(); });
      e.appendChild(b);
    }
    w.appendChild(e); w.appendChild(demobryter()); return;
  }

  rader.forEach(function(s){
    var r = el('button', 'rad' + (s.lost ? ' lost' : ''));
    r.type = 'button';
    r.dataset.odId = 'inm-rad-' + s.id;

    var ic = el('span', 'ic');
    ic.innerHTML = '<svg viewBox="0 0 24 24">' + IKON[s.type] + '</svg>';
    r.appendChild(ic);

    var mid = el('span');
    mid.appendChild(el('span', 't', s.tittel));
    mid.appendChild(el('span', 's', s.sub));
    var meta = el('span', 'meta');
    meta.appendChild(el('span', 'tag', s.type));
    if (s.lost) meta.appendChild(el('span', 'tag up', s.lostTekst || 'løst'));
    meta.appendChild(el('span', 'frist num' + (s.snart && !s.lost ? ' snart' : ''), s.frist));
    mid.appendChild(meta);
    r.appendChild(mid);

    r.addEventListener('click', function(){ apneSak(s.id); });
    w.appendChild(r);
  });

  w.appendChild(demobryter());
}

/* Demo-stillas: bytt datatilstand. Skal bort ved integrasjon. */
function demobryter(){
  var d = el('div','tom');
  d.dataset.demoOnly = 'true';
  d.appendChild(el('span','eyebrow','Demo · datatilstand'));
  var rekke = el('div');
  rekke.style.display = 'flex'; rekke.style.gap = 'var(--s2)'; rekke.style.flexWrap = 'wrap';
  ['fylt','tom','laster','feil'].forEach(function(t){
    var b = el('button','btn sm', t);
    b.type = 'button'; b.dataset.odId = 'inm-demo-' + t;
    b.setAttribute('aria-pressed', String(t === tilstand));
    b.addEventListener('click', function(){ tilstand = t; renderAlt(); si('Viser tilstand ' + t + '.'); });
    rekke.appendChild(b);
  });
  d.appendChild(rekke);
  return d;
}

/* ── Bunn: Én ting nå ────────────────────────────────────────── */
function renderBunn(){
  var w = document.getElementById('bunn');
  w.innerHTML = '';
  if (tilstand !== 'fylt'){ w.hidden = true; return; }
  w.hidden = false;
  var id = forsteApne();
  if (!id){
    w.appendChild(el('span','hint','Innboksen er tom. Ingenting venter på deg.'));
    var kal = el('button','btn full','Åpne kalenderen');
    kal.type = 'button'; kal.dataset.odId = 'inm-bunn-kalender';
    kal.addEventListener('click', function(){ location.href = 'agencyos-kalender-mobil.html'; });
    w.appendChild(kal);
    return;
  }
  var s = sak(id);
  w.appendChild(el('span','hint','Øverste ubehandlede sak: ' + s.tittel));
  var b = el('button','btn now full', s.type === 'forslag' ? 'Se grunnlaget og godkjenn' : 'Åpne saken');
  b.type = 'button'; b.dataset.odId = 'inm-one-thing-now';
  b.addEventListener('click', function(){ apneSak(id); });
  w.appendChild(b);
}

/* ── Saksarket ───────────────────────────────────────────────── */
var ark = document.getElementById('ark'), scrim = document.getElementById('scrim'),
    arkBody = document.getElementById('arkBody'), arkFoot = document.getElementById('arkFoot'),
    sisteFokus = null;

function apneSak(id){
  valgtId = id;
  sisteFokus = document.activeElement;
  renderArk();
  ark.hidden = false; scrim.hidden = false;
  ark.classList.add('on'); scrim.classList.add('on');
  var f = ark.querySelector('button'); if (f) f.focus();
  si('Åpnet saken ' + sak(id).tittel + '.');
}
function lukkArk(){
  ark.classList.remove('on'); scrim.classList.remove('on');
  ark.hidden = true; scrim.hidden = true;
  if (sisteFokus && sisteFokus.isConnected) sisteFokus.focus();
}
scrim.addEventListener('click', lukkArk);
ark.querySelector('[data-lukk]').addEventListener('click', lukkArk);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !ark.hidden){ e.preventDefault(); lukkArk(); }
  if (e.key === 'Tab' && !ark.hidden){
    var f = ark.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var forste = f[0], siste = f[f.length - 1];
    if (e.shiftKey && document.activeElement === forste){ e.preventDefault(); siste.focus(); }
    else if (!e.shiftKey && document.activeElement === siste){ e.preventDefault(); forste.focus(); }
  }
});

function renderArk(){
  var s = sak(valgtId);
  if (!s) return;
  document.getElementById('arkTitle').textContent = s.tittel;
  document.getElementById('arkSub').textContent = s.hvem + ' · ' + s.frist;
  arkBody.innerHTML = ''; arkFoot.innerHTML = '';

  if (sisteAngre && sisteAngre.id === s.id){
    var a = el('div','angre');
    a.appendChild(el('span', null, sisteAngre.tekst));
    var ab = el('button','btn sm','Angre');
    ab.type = 'button'; ab.dataset.odId = 'inm-angre';
    ab.addEventListener('click', function(){
      s.lost = false; delete s.lostTekst;
      clearTimeout(angreTimer); sisteAngre = null;
      renderAlt(); renderArk(); si('Angret. Saken er tilbake i innboksen.');
    });
    a.appendChild(ab);
    arkBody.appendChild(a);
  }

  if (s.kontrakt){
    var k = el('div','kontrakt');
    [['hvorfor','Hvorfor'],['hva','Hva'],['effekt','Forventet effekt'],['hvorforNa','Hvorfor nå']]
    .forEach(function(p){
      var d = el('div');
      d.appendChild(el('span','k', p[1]));
      d.appendChild(el('span','v', s.kontrakt[p[0]]));
      k.appendChild(d);
    });
    arkBody.appendChild(k);
  } else {
    var n = el('div','blokk');
    n.appendChild(el('span','flab','hva dette er'));
    n.appendChild(el('p', null, s.sub));
    arkBody.appendChild(n);
  }

  var pv = el('div','prov');
  var pl = el('span','flab','grunnlag'); pl.style.marginBottom = 'var(--s2)';
  pv.appendChild(pl);
  var ul = document.createElement('ul');
  s.prov.forEach(function(x){ ul.appendChild(el('li', null, x)); });
  pv.appendChild(ul);
  arkBody.appendChild(pv);

  if (s.lost){
    /* Sløyfen stopper ikke her: en løst sak peker på den neste. */
    arkFoot.appendChild(el('span','eyebrow', s.lostTekst || 'løst'));
    var neste = forsteApne();
    var nb = el('button','btn ink', neste ? 'Neste sak' : 'Lukk');
    nb.type = 'button'; nb.dataset.odId = 'inm-neste';
    nb.addEventListener('click', function(){ neste ? apneSak(neste) : lukkArk(); });
    arkFoot.appendChild(nb);
    return;
  }

  if (s.type === 'varsel'){
    /* Et varsel har ingenting å godkjenne. Spilleren eier planen sin —
       Anders skal vite hva som skjedde, ikke si ja til det. */
    var ok2 = el('button','btn ink','Sett som lest');
    ok2.type = 'button'; ok2.dataset.odId = 'inm-lest';
    ok2.addEventListener('click', function(){ loes(s, 'lest'); });
    /* Et varsel om agentfeil hører hjemme i AgenticOS, ikke i Workbench.
       Uten denne forgreningen sendte «Agentfeil · Faktura-vakten» deg til
       treningsplanleggeren. */
    var erAgent = /[Aa]gentfeil/.test(s.tittel);
    var apn = el('button','btn', erAgent ? 'Åpne i AgenticOS' : 'Åpne i Workbench');
    apn.type = 'button'; apn.dataset.odId = erAgent ? 'inm-agenticos' : 'inm-workbench';
    apn.addEventListener('click', function(){
      location.href = erAgent ? 'agencyos-agenticos.html?fane=agent' : 'workbench-mobil.html'; });
    arkFoot.appendChild(apn); arkFoot.appendChild(ok2);
    return;
  }

  var ok = el('button','btn ink', s.type === 'forslag' ? 'Godkjenn og send' : 'Marker som løst');
  ok.type = 'button'; ok.dataset.odId = 'inm-godkjenn';
  ok.addEventListener('click', function(){ loes(s, s.type === 'forslag' ? 'godkjent' : 'løst'); });

  var av = el('button','btn', s.type === 'forslag' ? 'Avvis' : 'Utsett');
  av.type = 'button'; av.dataset.odId = 'inm-avvis';
  av.addEventListener('click', function(){
    if (s.type === 'forslag') loes(s, 'avvist');
    else { toast('Utsatt til i morgen.'); si('Saken er utsatt til i morgen.'); }
  });

  arkFoot.appendChild(av); arkFoot.appendChild(ok);
}

/* Godkjenning endrer faktisk tilstand: saken går til Løst, tellerne går ned,
   og angre reverserer i ti sekunder. */
function loes(s, hva){
  s.lost = true;
  s.lostTekst = hva + ' 09:12';
  sisteAngre = { id:s.id, tekst: hva === 'avvist'
    ? 'Avvist. Ingenting er sendt til ' + s.hvem.split(' ')[0] + '.'
    : hva === 'lest'
      ? 'Satt som lest. Saken ligger under Løst.'
      : 'Godkjent og sendt. ' + s.hvem.split(' ')[0] + ' ser det i PlayerHQ nå.' };
  clearTimeout(angreTimer);
  angreTimer = setTimeout(function(){ sisteAngre = null; if (!ark.hidden) renderArk(); }, 10000);
  renderAlt(); renderArk();
  si(hva + '. Innboksen er nede i ' + apne() + ' saker. Du kan angre i ti sekunder.');
  toast(hva === 'avvist' ? 'Avvist' : hva === 'lest' ? 'Satt som lest' : 'Godkjent · sendt');
}

/* ── Tema ────────────────────────────────────────────────────── */
var KEY = 'akhq-theme-agencyos';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

function renderAlt(){
  renderFiltre(); renderListe(); renderBunn();
  var n = tilstand === 'fylt' ? apne() : 0;
  document.getElementById('innCount').textContent = n;
  document.getElementById('faneBadge').textContent = n;
}
renderAlt();
})();

</script>
</body>
</html>

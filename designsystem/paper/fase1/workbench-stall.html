<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench · Coach-modusene · AgencyOS · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

/* v3.1-tillegg foreslått fra agencyoshq.html — mellomtrinn i cream-stigen.
   Skal inn i tokens-fila hvis Anders godkjenner. */
:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }
/* ═══ Workbench · AgencyOS · desktop full bredde ═══
   LOKASJON rettet 02.08.2026: Mulligan Indoor er active = false i locations og skal ikke vises ved lansering. Erstattet med Gamle Fredrikstad GK, som er eneste synlige lokasjon.
   Åpnes fra tråden i Konsoll. Ikke en flate man navigerer til blindt —
   man kommer hit med en intensjon («lag treningsplan for Filip»).
   Derfor har toppbaren tilbake-til-tråd, ikke bare en tittel. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--ui); font-size:var(--text-body-agency); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:where(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

/* ── Knapper ─────────────────────────────────────────────────── */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap); padding:0 var(--s4); font-size:13px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn[disabled],.btn[aria-disabled="true"]{ opacity:.45; pointer-events:none; }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.ink:hover{ background:var(--cta-hover); border-color:var(--cta-hover); }
/* Én ting nå — maks én per skjerm. Klikk MÅ endre tilstand. */
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  min-height:var(--tap-lg); font-weight:600; padding:0 var(--s5); }
.btn.now:hover{ filter:brightness(1.04); }
.btn.sm{ min-height:var(--tap); padding:0 var(--s3); font-size:12px; }
.btn.icon{ width:var(--tap); padding:0; }

.chip{ display:inline-flex; align-items:center; gap:var(--s1); min-height:var(--tap);
  padding:0 var(--s3); font-size:12.5px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-pill); cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
.chip.sm{ min-height:var(--tap); padding:0 var(--s3); font-size:11.5px; }
.tag{ display:inline-flex; align-items:center; gap:var(--s1); padding:3px var(--s2);
  border-radius:var(--r-pill); font-family:var(--mono); font-size:10.5px;
  letter-spacing:.04em; text-transform:uppercase; background:var(--soft);
  color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

/* ── Skall ───────────────────────────────────────────────────────
   Full bredde, ingen rail: Workbench åpnes FRA tråden og eier hele vinduet.
   Tilbake-til-tråd i toppbaren er utgangen. Bibliotek 232 + lerret + inspektør 340.
   min-height:0 på alle flex/grid-barn — uten det scroller dokumentet
   i stedet for sonene, og bunnsonen mister festet. */
.wb{ display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; height:100vh; }
.wbmid{ display:grid; grid-template-columns:232px minmax(0,1fr) 340px; min-height:0; }
@media (max-width:1400px){ .wbmid{ grid-template-columns:200px minmax(0,1fr) 320px; } }

/* ── Toppbar ─────────────────────────────────────────────────── */
.top{ display:flex; align-items:center; gap:var(--s3); padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--border); background:var(--surface); }
.back{ display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  padding:0 var(--s3); border:1px solid var(--border); border-radius:var(--r);
  background:transparent; cursor:pointer; font-size:12.5px; color:var(--muted); }
.back:hover{ background:var(--soft); color:var(--fg); }
.back svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; }
.who{ display:flex; align-items:baseline; gap:var(--s2); }
.who h1{ margin:0; font-family:var(--disp); font-size:15px; font-weight:600; }
.zooms{ display:flex; gap:2px; padding:3px; background:var(--soft);
  border-radius:var(--r-pill); margin-left:var(--s2); }
.zooms button{ min-height:var(--tap); padding:0 var(--s4); border:0; background:transparent;
  border-radius:var(--r-pill); font-size:12.5px; cursor:pointer; color:var(--muted); }
.zooms button[aria-current="true"]{ background:var(--surface); color:var(--fg); font-weight:600;
  box-shadow:0 1px 2px rgba(20,20,19,.06); }
.spacer{ flex:1; }

/* ── KPI-stripe ──────────────────────────────────────────────── */
.kpis{ display:flex; align-items:stretch; gap:0; border-bottom:1px solid var(--border);
  background:var(--softer); overflow-x:auto; }
.kpi{ display:flex; flex-direction:column; gap:2px; padding:var(--s3) var(--s4);
  border-right:1px solid var(--border-soft); min-width:118px; }
.kpi .k{ font-family:var(--mono); font-size:var(--text-label); letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); }
.kpi .v{ font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.02em; }
.kpi .v small{ font-size:11px; font-weight:400; color:var(--muted); margin-left:2px; }
.kpi .w{ font-size:10.5px; color:var(--muted); }
.kpiact{ display:flex; align-items:center; gap:var(--s2); padding:var(--s3) var(--s4); margin-left:auto; }

/* Ankomstbanner: sier hvor du kom fra og hva som skjer nå. */
.ankomst{ display:flex; align-items:center; gap:var(--s3);
  padding:var(--s2) var(--s4); background:var(--accent-soft);
  border-bottom:1px solid var(--border); font-size:12.5px; }
.ankomst .eyebrow{ flex:none; color:var(--accent-fg); }
.ankomst > span:nth-child(2){ font-family:var(--body); }
.ankomst .btn{ margin-left:auto; flex:none; }

/* ── Bibliotek (venstre) ─────────────────────────────────────── */
.lib{ display:flex; flex-direction:column; min-height:0; min-width:0;
  border-right:1px solid var(--border); background:var(--surface); }
.libtabs{ display:flex; border-bottom:1px solid var(--border); }
.libtabs button{ flex:1; min-height:var(--tap); border:0; background:transparent;
  font-size:12px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
.libtabs button[aria-selected="true"]{ color:var(--fg); font-weight:600; border-bottom-color:var(--fg); }
.libbody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s3); }
.libitem{ display:block; width:100%; text-align:left; padding:var(--s3);
  margin-bottom:var(--s2); background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r); cursor:grab; }
.libitem:hover{ border-color:var(--mid); }
.libitem:active{ cursor:grabbing; }
.libitem .n{ font-size:12.5px; font-weight:500; margin-bottom:2px; }
.libitem .f{ font-family:var(--mono); font-size:10px; color:var(--muted); word-break:break-all; }

/* ── Lerret (senter) ─────────────────────────────────────────── */
.canvas{ display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--bg); }
.period{ display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s4);
  border-bottom:1px solid var(--border-soft); background:var(--softer); font-size:11.5px; }
.pband{ display:inline-flex; align-items:center; gap:var(--s2); padding:2px var(--s3);
  border-radius:var(--r-pill); background:var(--surface); border:1px solid var(--border); }
.pband .dot{ width:7px; height:7px; border-radius:var(--r-pill); }
.canvasbody{ flex:1; min-height:0; overflow:auto; }

/* ── Tidsrutenett ────────────────────────────────────────────────
   Tidsakse i sidemenyen: 05:00–23:00 i 30-minutters intervaller.
   36 luker à 22px = 792px lerret. Aksen er sticky til venstre og
   dagoverskriftene sticky på toppen, slik at man aldri mister hvilken
   dag eller hvilket klokkeslett man ser på når man ruller.
   Blokkene posisjoneres av faktisk starttid og faktisk varighet —
   varigheten er summen av drill-tidene, ikke et tall man skriver inn. */
.tg{ display:grid; grid-template-columns:62px repeat(7, minmax(124px, 1fr));
  min-width:1000px; position:relative; }

.tg-corner{ position:sticky; top:0; left:0; z-index:4; background:var(--bg);
  border-bottom:1px solid var(--border); border-right:1px solid var(--border); }
.tg-dayhead{ position:sticky; top:0; z-index:3; background:var(--bg);
  border-bottom:1px solid var(--border); border-left:1px solid var(--border-soft);
  padding:var(--s2) var(--s3); display:flex; align-items:baseline; gap:var(--s2); }
.tg-dayhead .dw{ font-family:var(--mono); font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); }
.tg-dayhead .dd{ font-family:var(--mono); font-size:13px; font-weight:600; }
.tg-dayhead .dt{ margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.tg-dayhead.today{ background:var(--soft); }
.tg-dayhead.today .dd{ text-decoration:underline; text-underline-offset:3px; }

/* Tidsakse */
.tg-axis{ position:sticky; left:0; z-index:2; background:var(--bg);
  border-right:1px solid var(--border); }
.tg-tick{ height:22px; position:relative; }
.tg-tick span{ position:absolute; top:-6px; right:var(--s2);
  font-family:var(--mono); font-size:10px; color:var(--muted); background:var(--bg);
  padding:0 2px; font-variant-numeric:tabular-nums; }
.tg-tick.hel span{ color:var(--fg); font-weight:500; }

/* Dagkolonne. Hel time = tydeligere strek enn halvtime. */
.tg-col{ position:relative; border-left:1px solid var(--border-soft);
  background:
    repeating-linear-gradient(to bottom,
      var(--hairline) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(to bottom,
      var(--border-soft) 0 1px, transparent 1px 22px);
  background-color:var(--surface); }
.tg-col.drop{ background-color:var(--accent-soft); }

/* Opptatt tid — bakgrunnsvirkelighet, ikke plan */
.tg-busy{ position:absolute; left:2px; right:2px; border-radius:var(--r-sm);
  background:var(--soft); border:1px dashed var(--border);
  font-size:10px; color:var(--muted); padding:3px 5px; overflow:hidden; z-index:1; }

/* Øktblokk */
.tg-okt{ position:absolute; left:3px; right:3px; z-index:2; text-align:left;
  padding:4px 6px; border-radius:var(--r-sm); background:var(--bg);
  border:1px solid var(--border); border-left:3px solid var(--mid);
  cursor:pointer; overflow:hidden; }
.tg-okt:hover{ border-color:var(--mid); }
.tg-okt[aria-current="true"]{ border-color:var(--fg); background:var(--soft); }
.tg-okt .t{ display:block; font-size:11.5px; font-weight:600; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tg-okt .m{ display:block; font-family:var(--mono); font-size:9.5px; color:var(--muted); }
.tg-okt .f{ display:block; font-family:var(--mono); font-size:9px; color:var(--mid);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tg-okt.done{ opacity:.6; }
.tg-okt.done .t{ text-decoration:line-through; }

/* Nå-linje. Ikke lime (finnes ikke i Paper) og ikke clay (monopolet).
   Blekk med en liten prikk — den skal leses, ikke rope. */
.tg-now{ position:absolute; left:0; right:0; height:0; z-index:3;
  border-top:1px solid var(--fg); pointer-events:none; }
.tg-now::before{ content:""; position:absolute; left:-3px; top:-3px;
  width:6px; height:6px; border-radius:var(--r-pill); background:var(--fg); }
.tg-now span{ position:absolute; right:3px; top:-14px; font-family:var(--mono);
  font-size:9px; color:var(--fg); background:var(--bg); padding:0 3px; }

/* ── F1: flytt, resize, dupliser (Notion Calendar-paritet) ────── */
.tg-okt{ touch-action:none; }
.tg-okt.flyttes{ opacity:.75; z-index:5; cursor:grabbing; user-select:none;
  box-shadow:0 6px 18px rgba(20,20,19,.14); }
.tg-okt .rz{ position:absolute; left:0; right:0; height:7px; cursor:ns-resize; }
.tg-okt .rz.topp{ top:-2px; } .tg-okt .rz.bunn{ bottom:-2px; }
.tg-okt .rz::after{ content:""; position:absolute; left:50%; top:2px; width:22px; height:3px;
  margin-left:-11px; border-radius:var(--r-pill); background:var(--mid); opacity:0; }
.tg-okt:hover .rz::after{ opacity:.55; }

/* ── F2: kildeliste, heldagsbånd, konflikt, gjentakelse ─────── */
.kilder{ padding:var(--s2) var(--s3); border-bottom:1px solid var(--border); }
.kilder .flab{ display:block; font-family:var(--mono); font-size:var(--text-label);
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:var(--s1) 0 var(--s2); }
.krad{ display:flex; align-items:center; gap:var(--s2); width:100%; min-height:32px;
  padding:2px var(--s1); border:0; background:transparent; border-radius:var(--r-sm);
  cursor:pointer; font-size:12px; text-align:left; color:var(--fg); }
.krad:hover{ background:var(--soft); }
.krad .kdot{ flex:none; width:9px; height:9px; border-radius:2px; border:1px solid var(--border); }
.krad[aria-pressed="true"] .kdot{ border-color:transparent; }
.krad .kn{ min-width:0; }
.krad .khint{ margin-left:auto; font-family:var(--mono); font-size:9px; color:var(--muted); }
.krad[aria-pressed="false"]{ color:var(--muted); }
.krad[aria-pressed="false"] .kdot{ background:transparent !important; }

.tg-adcorner{ position:sticky; left:0; z-index:2; background:var(--bg);
  border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  font-family:var(--mono); font-size:8.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; justify-content:flex-end;
  padding-right:var(--s2); }
.tg-adcell{ border-left:1px solid var(--border-soft); border-bottom:1px solid var(--border);
  background:var(--softer); min-height:26px; padding:3px var(--s2);
  font-size:10.5px; color:var(--muted); font-family:var(--body); }
.tg-adcell .tband{ display:inline-flex; align-items:center; gap:var(--s1);
  font-family:var(--mono); font-size:9.5px; color:var(--fg);
  background:var(--surface); border:1px solid var(--accent-heather);
  border-left:3px solid var(--accent-heather); border-radius:var(--r-sm); padding:1px var(--s2); }

.tg-okt .konf{ display:block; font-family:var(--mono); font-size:9px;
  letter-spacing:.04em; text-transform:uppercase; color:var(--dn); }
.tg-okt .rep{ font-family:var(--mono); font-size:9px; color:var(--muted); }
.tg-okt .tmark{ display:inline-block; font-family:var(--mono); font-size:9px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--accent-fg); }

/* Mini-måned (Notion): datohopp i venstremargen */
.mini{ padding:var(--s3) var(--s3) var(--s2); border-bottom:1px solid var(--border); }
.mini .mh{ display:flex; align-items:baseline; gap:var(--s2); margin-bottom:var(--s1); }
.mini .mh .t{ font-size:12px; font-weight:600; white-space:nowrap; }
.mini .mh .u{ margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--muted); }
.mini table{ width:100%; border-collapse:collapse; }
.mini th{ font-family:var(--mono); font-size:9px; font-weight:500; color:var(--muted);
  text-transform:uppercase; padding:2px 0; text-align:center; }
.mini td{ padding:0; text-align:center; }
.mini td.un{ font-family:var(--mono); font-size:9px; color:var(--muted); }
.mini td button{ width:100%; min-height:24px; border:0; background:transparent;
  border-radius:var(--r-sm); font-family:var(--mono); font-size:10.5px;
  font-variant-numeric:tabular-nums; color:var(--muted); cursor:pointer; }
.mini td button:hover{ background:var(--soft); color:var(--fg); }
.mini tr.uke32 td button{ color:var(--fg); background:var(--softer); }
.mini td button[aria-current="date"]{ background:var(--fg); color:var(--bg); font-weight:600; }

/* Agenda-visningen: uka som liste */
.agenda{ padding:var(--s3) var(--s4) var(--s5); max-width:660px; }
.agenda .ad{ font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin:var(--s4) 0 var(--s2); }
.agenda .ar{ display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
  min-height:var(--tap); padding:var(--s2) var(--s3); margin-bottom:var(--s1);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r); cursor:pointer; }
.agenda .ar:hover{ border-color:var(--mid); }
.agenda .ar .at{ font-family:var(--mono); font-size:11px; flex:none; width:96px; }
.agenda .ar .an{ font-size:12.5px; font-weight:500; min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.agenda .ar .af{ margin-left:auto; flex:none; font-family:var(--mono); font-size:9.5px; color:var(--muted); }

/* ── Inspektør (høyre) ───────────────────────────────────────── */
.insp{ display:flex; flex-direction:column; min-height:0; min-width:0;
  border-left:1px solid var(--border); background:var(--surface); }
.insptabs{ display:flex; border-bottom:1px solid var(--border); }
.insptabs button{ flex:1; min-height:var(--tap); border:0; background:transparent;
  font-size:12px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.insptabs button[aria-selected="true"]{ color:var(--fg); font-weight:600; border-bottom-color:var(--fg); }
.insptabs .badge{ font-family:var(--mono); font-size:10px; min-width:17px; height:17px;
  display:inline-grid; place-items:center; border-radius:var(--r-pill);
  background:var(--fg); color:var(--bg); }
.inspbody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }
.field{ margin-bottom:var(--s4); }
.field > label,.flab{ display:block; font-family:var(--mono); font-size:var(--text-label);
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:var(--s2); }
.field input[type="text"],.field input[type="date"],.field textarea,.field select{
  width:100%; min-height:var(--tap); padding:var(--s2) var(--s3);
  background:var(--bg); color:var(--fg);
  border:1px solid var(--border); border-radius:var(--r-sm); font:inherit; font-size:13px; }
.field textarea{ min-height:64px; resize:vertical; font-family:var(--body); }
.segs{ display:flex; flex-wrap:wrap; gap:var(--s1); }
.hint{ font-size:11px; color:var(--muted); margin:var(--s1) 0 0; font-family:var(--body); }

/* ── Drills ──────────────────────────────────────────────────────
   <details> per drill: sammendrag alltid synlig, redigering på klikk.
   Gir tastatur og skjermleser gratis, og summary er ≥44px av seg selv. */
.drill{ border:1px solid var(--border); border-radius:var(--r);
  margin-bottom:var(--s2); background:var(--bg); overflow:hidden; }
.drill[open]{ border-color:var(--mid); }
.dsum{ display:flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  padding:var(--s2) var(--s3); cursor:pointer; list-style:none; }
.dsum::-webkit-details-marker{ display:none; }
.drill[open] .dsum{ border-bottom:1px solid var(--border); background:var(--soft); }
.drill .dn{ font-size:12.5px; font-weight:600; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dtyp{ flex:none; font-family:var(--mono); font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; padding:2px 6px; border-radius:var(--r-pill);
  border:1px solid var(--border); color:var(--muted); background:var(--surface); }
.dtyp.golf{ color:var(--up); }
.dtyp.fys{ color:var(--info); }
.drill .dtid{ margin-left:auto; flex:none; font-family:var(--mono); font-size:11.5px; }
.dbody{ padding:var(--s3); }
.dbody .field{ margin-bottom:var(--s3); }
.dbody .field:last-of-type{ margin-bottom:var(--s3); }
/* Formelen tilhører drillen — den vises inne i drillen, aldri på økta. */
.dformel{ padding:var(--s2) var(--s3); margin-bottom:var(--s3);
  background:var(--softer); border:1px solid var(--border-soft); border-radius:var(--r-sm); }
.dformel .df{ display:block; font-family:var(--mono); font-size:10.5px;
  color:var(--fg); word-break:break-all; }
/* Tre seksjoner under økta: Golf · Fysisk · Tester */
.sek{ margin-bottom:var(--s5); padding-bottom:var(--s4);
  border-bottom:1px solid var(--border-soft); }
.sek:last-of-type{ border-bottom:0; }
.sekhead{ display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2); }
.sekhead .flab{ margin-bottom:0; }
.sekn{ margin-left:auto; font-size:11px; color:var(--muted); }
.sek > .btn{ width:100%; margin-top:var(--s2); }
.dtyp.test{ color:var(--accent-fg); }
/* Gruppeskille i lange slot-lister (Tee · Innspill · Nærspill · Putt) */
.gsep{ flex-basis:100%; font-family:var(--mono); font-size:9px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--mid); margin:var(--s2) 0 2px; }
/* Testvelger */
.testliste{ max-height:46vh; overflow-y:auto; margin-bottom:var(--s4); }
.testrad{ display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
  min-height:var(--tap); padding:var(--s2) var(--s3); margin-bottom:var(--s1);
  background:var(--bg); border:1px solid var(--border); border-radius:var(--r-sm); cursor:pointer; }
.testrad:hover{ border-color:var(--mid); background:var(--soft); }
.testrad .tn{ font-size:12.5px; font-weight:500; }
.testrad .tk{ margin-left:auto; font-size:10px; color:var(--muted); }
.reps{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2); }
.rep{ text-align:center; padding:var(--s2) var(--s1); background:var(--surface);
  border:1px solid var(--border-soft); border-radius:var(--r-sm); }
.rep .rn{ display:block; width:100%; text-align:center; font-family:var(--mono);
  font-size:15px; font-weight:600; background:transparent; color:var(--fg);
  border:0; border-bottom:1px solid var(--border); padding:2px 0; }
.rep .rn:focus{ outline:2px solid var(--focus); outline-offset:2px; }
.rep .rl{ display:block; font-size:9px; color:var(--muted); letter-spacing:.02em; margin-top:1px; }
.logged{ margin-top:var(--s2); padding-top:var(--s2); border-top:1px dashed var(--border);
  font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.sumline{ display:flex; align-items:baseline; gap:var(--s2); padding:var(--s3);
  background:var(--soft); border-radius:var(--r); margin-top:var(--s3); }
.sumline .sv{ margin-left:auto; font-family:var(--mono); font-size:15px; font-weight:600; }

/* Tomtilstand — aldri en tom region uten neste steg */
.empty{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--s3);
  padding:var(--s5); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.empty h3{ margin:0; font-family:var(--disp); font-size:14px; font-weight:600; }
.empty p{ margin:0; max-width:40ch; font-family:var(--body); font-size:13px; color:var(--muted); }

/* Caddie-utkast */
.ghost{ border:1px dashed var(--accent); background:var(--accent-soft);
  border-radius:var(--r); padding:var(--s3); margin-bottom:var(--s2); }
/* Forklarings-? og forslag-diff */
.flabrad{ display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2); }
.flabrad .flab{ margin-bottom:0; }
.hjelp{ flex:none; width:18px; height:18px; padding:0; border-radius:var(--r-pill);
  border:1px solid var(--border); background:transparent; color:var(--muted);
  font:600 11px/1 var(--mono); cursor:pointer; }
.hjelp:hover,.hjelp[aria-expanded="true"]{ color:var(--fg); border-color:var(--mid); }
.hint.forklaring{ margin:0 0 var(--s2); }
.tg-okt.har-forslag{ border-style:dashed; border-color:var(--accent); }
.tg-okt .fslag{ display:block; font-family:var(--mono); font-size:9px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--accent-fg); }
.fdiff{ display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; margin:0 0 var(--s3); }
.fdiff .df{ font-family:var(--mono); font-size:10px; word-break:break-all; }
.fdiff .fra{ text-decoration:line-through; color:var(--muted); }
.fdiff .pil{ color:var(--muted); }
.ghost .gh{ font-family:var(--mono); font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--accent-fg); margin-bottom:var(--s2); }
.ghost h4{ margin:0 0 var(--s1); font-size:13px; font-weight:600; }
.ghost p{ margin:0 0 var(--s3); font-family:var(--body); font-size:12.5px; color:var(--muted); }
.gacts{ display:flex; gap:var(--s2); }

/* ── Bunnsone: brudd fra validatePlan() ──────────────────────── */
.bunn{ border-top:1px solid var(--border); background:var(--surface);
  padding:var(--s3) var(--s4); display:flex; align-items:center; gap:var(--s3);
  flex-wrap:wrap; padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom)); }
.brudd{ display:flex; gap:var(--s2); flex-wrap:wrap; flex:1; min-width:0; }
.bmyk{ display:inline-flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3);
  border-radius:var(--r-pill); background:var(--soft); border:1px solid var(--border);
  font-size:11.5px; color:var(--muted); }
.bok{ color:var(--up); }

/* Overlegg */
.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:var(--z-sheet); }
.dialog{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(560px,92vw); max-height:86vh; overflow:auto; z-index:var(--z-modal);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); padding:var(--s5); }
.dialog h2{ margin:0 0 var(--s2); font-family:var(--disp); font-size:16px; }
.dialog p{ margin:0 0 var(--s4); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.dacts{ display:flex; gap:var(--s2); justify-content:flex-end; }

.toast{ position:fixed; left:50%; bottom:var(--s5); transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:12.5px; }

/* Trykkflate-gulv — gjelder uansett pekertype */
.btn,.chip,button,[role="button"],summary,select,input:not([type="hidden"]),textarea{
  min-height:var(--tap); }
.tag,.num,.eyebrow,.kpi .v,.rep .rn,.dtyp{ min-height:0; }


/* ══ F3: COACH-MODUSENE ══════════════════════════════════════════
   Samme motor som workbench-desktop (samme tidsakse, samme snap,
   samme blokk-klasser). Det eneste som endres er HVEM SIN TID du ser:
   Stall = spillere som kolonner · Gruppe = gruppas uke · Spiller =
   én spillers uke med full redigering og coach-merking i loggen.
   Ingen nye farger, ingen nye radier — bare nye kolonnetyper. */

/* Kolonnehode når kolonnen er en person, ikke en dag */
.tg-dayhead .av{ flex:none; width:22px; height:22px; border-radius:var(--r-pill);
  background:var(--soft); border:1px solid var(--border); display:grid; place-items:center;
  font-family:var(--mono); font-size:9px; font-weight:600; color:var(--muted); }
.tg-dayhead{ flex-wrap:wrap; row-gap:2px; }
.tg-dayhead .nm{ flex:1; min-width:0; font-size:12px; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tg-dayhead .dt{ flex:none; white-space:nowrap; }
.tg-dayhead .ukjent{ flex-basis:100%; }
.tg-dayhead.coachkol{ background:var(--softer); }
.tg-dayhead .ukjent{ font-family:var(--mono); font-size:9px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--dn); }
/* F4c: etterlevelse per person — fullførte av publiserte økter med passert
   sluttid. Nevneren står i aria-label; tallet dømmer ikke, det teller. */
.tg-dayhead .ettl{ flex:none; font-family:var(--mono); font-size:9.5px; color:var(--muted); }
.hoplab,.floggr{ display:block; font-family:var(--mono); font-size:9px;
  letter-spacing:.05em; text-transform:uppercase; }
.hoplab{ color:var(--dn); }
.floggr{ color:var(--up); }

/* Tilgjengelighet og kapasitet er LAG, ikke blokker: de tegnes som skravur
   bak planen slik at man ser hva tiden er, ikke bare hva som står i den. */
.tg-lag{ position:absolute; left:0; right:0; z-index:0; pointer-events:none; }
.tg-lag.utenfor{ background:repeating-linear-gradient(45deg,
  rgba(20,20,19,.05) 0 5px, transparent 5px 10px); }
[data-theme="dark"] .tg-lag.utenfor{ background:repeating-linear-gradient(45deg,
  rgba(250,249,245,.06) 0 5px, transparent 5px 10px); }
.tg-lag.fullt{ background:repeating-linear-gradient(-45deg,
  rgba(70,113,159,.10) 0 5px, transparent 5px 10px); }

/* Blokktyper. Venstrekanten sier kilde — aldri farge for pynt.
   Clay er ikke i bruk her: monopolet tilhører «Én ting nå». */
.tg-okt.gruppeokt{ border-left-color:var(--accent-heather); }
.tg-okt.booking{ border-left-color:var(--accent-sky); }
.tg-okt.test{ border-left-color:var(--accent-fg); }
.tg-okt.rsvp{ border-style:dashed; border-left-style:solid;
  border-left-color:var(--accent-sky); background:var(--surface); }
.tg-okt.mal{ border-style:dashed; border-left-color:var(--mid); background:var(--softer); }
.tg-okt.laast{ cursor:default; }
.tg-okt .kn{ display:block; font-family:var(--mono); font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); }
.tg-okt.har-konflikt{ border-color:var(--dn); }

/* Tidsforslag: motorens svar tegnes i rutenettet, aldri bare i en liste */
.tg-slot{ position:absolute; left:3px; right:3px; z-index:2; text-align:left;
  padding:3px 5px; border-radius:var(--r-sm); border:1px dashed var(--accent);
  background:var(--accent-soft); cursor:pointer; overflow:hidden;
  font-family:var(--mono); font-size:9.5px; color:var(--accent-fg); }
.tg-slot[aria-pressed="true"]{ background:var(--surface); border-style:solid; }

/* Dagstripe (stall-modus ser én dag om gangen — spillerne er kolonnene) */
.dagstripe{ display:flex; gap:2px; padding:3px; background:var(--soft);
  border-radius:var(--r-pill); }
.dagstripe button{ min-height:var(--tap); padding:0 var(--s3); border:0; background:transparent;
  border-radius:var(--r-pill); font-family:var(--mono); font-size:11px; cursor:pointer;
  color:var(--muted); }
.dagstripe button[aria-current="true"]{ background:var(--surface); color:var(--fg);
  font-weight:600; box-shadow:0 1px 2px rgba(20,20,19,.06); }

/* Kontekstvelger: hvem sin tid vises. Stall = 2–6 spillere. */
.spvelg{ padding:var(--s2) var(--s3); border-bottom:1px solid var(--border); }
.spvelg .flabrad{ margin-bottom:var(--s1); }
.krad .kav{ flex:none; width:20px; height:20px; border-radius:var(--r-pill);
  background:var(--soft); border:1px solid var(--border); display:grid; place-items:center;
  font-family:var(--mono); font-size:8.5px; font-weight:600; color:var(--muted); }
.krad[aria-pressed="true"] .kav{ background:var(--fg); color:var(--bg); border-color:var(--fg); }

/* Tidsforslag-panelet */
.finn{ padding:var(--s3); border-bottom:1px solid var(--border);
  display:flex; flex-direction:column; gap:var(--s2); }
.finn .rad{ display:flex; gap:var(--s2); }
.finn select{ flex:1; min-width:0; min-height:var(--tap); font:inherit; font-size:12px;
  padding:0 var(--s2); background:var(--bg); color:var(--fg);
  border:1px solid var(--border); border-radius:var(--r-sm); }
.slotliste{ display:flex; flex-direction:column; gap:var(--s1); }
.slotrad{ display:flex; align-items:center; gap:var(--s2); width:100%; min-height:32px;
  padding:var(--s1) var(--s2); background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-sm); cursor:pointer; text-align:left;
  font-family:var(--mono); font-size:10.5px; }
.slotrad:hover{ border-color:var(--mid); }
.slotrad .sd{ font-weight:600; }
.slotrad .sh{ margin-left:auto; color:var(--muted); font-size:9px;
  letter-spacing:.05em; text-transform:uppercase; }

/* Konflikter: en liste over hva som kolliderer for HVEM — ingen venstrekant,
   ingen rød. Leire (--dn) på etiketten, aldri på flaten. */
.konf{ padding:var(--s3); margin-bottom:var(--s2); background:var(--bg);
  border:1px solid var(--border); border-radius:var(--r); }
.konf .kv{ font-family:var(--mono); font-size:9px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--dn); }
.konf .kn2{ display:block; font-size:12.5px; font-weight:600; margin-top:2px; }
.konf p{ margin:var(--s1) 0 0; font-family:var(--body); font-size:12px; color:var(--muted); }
.kacts{ display:flex; gap:var(--s2); margin-top:var(--s3); flex-wrap:wrap; }

/* Loggen spilleren ser. «coach» er merkingen som gjør endringen etterprøvbar. */
.logg{ list-style:none; margin:0; padding:0; }
.logg li{ display:flex; gap:var(--s3); padding:var(--s3) 0;
  border-bottom:1px solid var(--border-soft); }
.logg li:last-child{ border-bottom:0; }
.logg .lt{ flex:none; width:52px; font-family:var(--mono); font-size:10px; color:var(--muted); }
.logg .lb{ min-width:0; }
.logg .lx{ display:block; font-size:12.5px; }
.logg .lw{ font-family:var(--mono); font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--accent-fg); }
.logg .lv{ font-family:var(--mono); font-size:9px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); }

/* Coach-merknad: står FØR redigering, ikke etter — den forklarer hva som
   skjer med det du gjør, mens du fortsatt kan velge noe annet. */
.cvarsel{ padding:var(--s3); margin-bottom:var(--s4); background:var(--soft);
  border:1px solid var(--border); border-radius:var(--r); }
.cvarsel .flab{ margin-bottom:var(--s1); }
.cvarsel p{ margin:0; font-family:var(--body); font-size:12.5px; color:var(--muted); }

/* Deltakerliste på en gruppeøkt */
.delt{ display:flex; flex-wrap:wrap; gap:var(--s1); margin-top:var(--s2); }
.delt .dp{ display:inline-flex; align-items:center; gap:var(--s1); padding:2px var(--s2);
  border-radius:var(--r-pill); background:var(--surface); border:1px solid var(--border);
  font-size:11px; }
.delt .dp.kol{ border-color:var(--dn); color:var(--dn); }

</style>

<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════════
   Workbench · COACH-MODUSENE (F3)
   Fasit for /admin/workbench (stall + min tid) og
   /admin/grupper/[id]/workbench (gruppe + planlegge-for-spiller).

   Én sannhet om tid: alle lag ligger i SAMME hendelsesliste med et
   kilde-felt. En booking, en gruppeøkt og en skoletime er samme slags
   blokk i samme rutenett — aldri tre kalendere som stemmes av manuelt.

   Hendelse: { id, sp | gruppe, dag, start, min, n, omr, kilde, laast, mal }
   kilde: 'okt' (spillerens plan) · 'gruppe' (coach eier, skrives til alle)
          'booking' (bekreftet, låst) · 'rsvp' (forespørsel, tentativ)
          'test' · 'skole' (bakteppe, genereres) · 'turnering' (heldagsbånd)

   Varigheten (min) eies i den ekte modellen av summen av drill-tider —
   se workbench-desktop. I coach-modusene flyttes og strekkes økter; når
   en økt strekkes her, skrives differansen til siste drill i økta.
   Drill-redigering skjer i økt-inspektøren, ikke på stall-lerretet.
   ═══════════════════════════════════════════════════════════════ */

/* ── Stallen. Demo-kanon: Øyvind Rohjan (spiller), Anders Kristiansen
   (coach). Øvrige er demo-navn i samme akademi.
   skoletid: WANG-timeplanen har tid-på-dag. GFGK har det IKKE i dagens
   datamodell (åpent punkt 3 i masterplanen) — da tegnes ingen skoleblokk,
   og kolonnen sier det høyt. Vi gjetter ikke skoletid. */
var STALL = [
  { id:'oyvind', n:'Øyvind Rohjan', ini:'ØR', alder:17, skole:'WANG', gr:['perf'] },
  { id:'emma',   n:'Emma Sæther',   ini:'ES', alder:15, skole:'WANG', gr:['perf','jc'] },
  { id:'markus', n:'Markus Lien',   ini:'ML', alder:16, skole:'WANG', gr:['jc'] },
  { id:'sara',   n:'Sara Bø',       ini:'SB', alder:14, skole:'GFGK', gr:['jc'] },
  { id:'jonas',  n:'Jonas Five',    ini:'JF', alder:15, skole:'WANG', gr:['jc'] },
  { id:'thea',   n:'Thea Aas',      ini:'TA', alder:17, skole:'WANG', gr:['perf'] }
];
var COACH = { id:'coach', n:'Anders K.', ini:'AK' };
var GRUPPER = [
  { k:'jc',   n:'Junior Academy gruppe C', sted:'Mulligan sim 1–2' },
  { k:'perf', n:'Performance',             sted:'Mulligan + bane' }
];
function sp(id){ if (id === 'coach') return COACH;
  return STALL.filter(function(x){ return x.id === id; })[0] || COACH; }
function gruppeNavn(k){ return GRUPPER.filter(function(g){ return g.k === k; })[0].n; }
function medlemmer(k){ return STALL.filter(function(s){ return s.gr.indexOf(k) > -1; }); }

var DAGER = [
  {dw:'man', dd:'3.8'}, {dw:'tir', dd:'4.8'}, {dw:'ons', dd:'5.8'},
  {dw:'tor', dd:'6.8'}, {dw:'fre', dd:'7.8'}, {dw:'lør', dd:'8.8'}, {dw:'søn', dd:'9.8'}
];

/* ── Hendelsene i uke 32 ─────────────────────────────────────── */
var HEND = [
  /* F4c: done = logget i PlayerHQ · hoppet = spillerens aktive nei */
  { id:'h1', sp:'oyvind', dag:0, start:'16:00', min:90, n:'Innspill · lengdekontroll', omr:'TEK', kilde:'okt', done:true },
  { id:'h2', sp:'oyvind', dag:2, start:'06:30', min:45, n:'Styrke underkropp',         omr:'FYS', kilde:'okt', done:true },
  { id:'h3', sp:'oyvind', dag:3, start:'15:00', min:90, n:'Nærspill · fire meter',     omr:'SLAG',kilde:'okt' },
  { id:'h4', sp:'emma',   dag:0, start:'17:00', min:60, n:'Putt 5–10 ft under press',  omr:'SLAG',kilde:'okt', done:true },

  { id:'h7', sp:'markus', dag:3, start:'15:30', min:60, n:'Wedge 40–90 m',             omr:'SLAG',kilde:'okt' },
  { id:'h8', sp:'thea',   dag:3, start:'18:00', min:60, n:'Mobilitet',                 omr:'FYS', kilde:'okt' },
  { id:'h9', sp:'jonas',  dag:1, start:'16:30', min:60, n:'Chip · landingspunkt',      omr:'SLAG',kilde:'okt', hoppet:true },

  /* Gruppeøkter: coach eier dem. I spiller-modus er de låst («coach eier»),
     i gruppe-modus er de redigerbare og skrives til alle medlemmene. */
  { id:'g1', gruppe:'jc',   dag:1, start:'16:30', min:60, n:'Gruppe C · nærspill',   omr:'SLAG', kilde:'gruppe' },
  { id:'g2', gruppe:'jc',   dag:3, start:'16:30', min:60, n:'Gruppe C · putting',    omr:'SLAG', kilde:'gruppe' },
  { id:'g3', gruppe:'perf', dag:5, start:'10:00', min:120,n:'Performance · banespill', omr:'SPILL', kilde:'gruppe' },

  /* Bookinger: bekreftet = låst blokk med kvittering. */
  { id:'b1', sp:'coach',  dag:4, start:'11:00', min:60, n:'Coachtime · Gamle Fredrikstad GK', kilde:'booking', laast:true },
  { id:'b2', sp:'coach',  dag:3, start:'13:00', min:60, n:'Coachtime · Nora Dahl',            kilde:'booking', laast:true },
  { id:'b3', sp:'oyvind', dag:4, start:'11:00', min:60, n:'Coachtime · med Anders',           kilde:'booking', laast:true },

  /* RSVP: forespørsler lander som tentative blokker du godtar eller avslår
     uten å forlate flaten. De teller ikke som opptatt tid før de er godtatt. */
  { id:'r1', sp:'coach', dag:3, start:'17:00', min:60, n:'Forespørsel · Nora Dahl',
    kilde:'rsvp', fra:'Nora Dahl · utenfor stallen', sendt:'i går 20:14' },
  { id:'r2', sp:'coach', dag:1, start:'18:00', min:90, n:'Forespørsel · Foreldremøte JC',
    kilde:'rsvp', fra:'Foreldregruppa Junior C', sendt:'2 t siden' }
];

/* Skole er bakteppe, ikke plan: den blokkerer ikke, den varsles mot. */
var SKOLETID = { WANG:{ start:'08:00', slutt:'14:00', dager:[0,1,2,3,4] } };

/* Coachens arbeidsuke (fra agencyos-innstillinger). Utenfor denne tegnes
   skravur — tiden finnes, men den er ikke tilgjengelig for booking. */
var TILGJENGELIG = { start:'08:00', slutt:'18:00', dager:[0,1,2,3,4] };

/* Anleggskapasitet: Mulligan har to simulatorer. Tidsforslag regner mot
   dette. Utebane har ingen strukturert kapasitet i dagens datamodell
   (åpent punkt 4 i masterplanen) — derfor merkes forslag som forutsetter
   utebane, i stedet for å bli utelatt eller påstått ledig. */
var KAPASITET = { simer:2 };

var LOGG = [
  { t:'08:41', x:'Gruppe C · putting flyttet fra 16:00 til 16:30 torsdag', hvem:'coach', varsel:'4 spillere varslet' },
  { t:'i går', x:'Coachtime med Nora Dahl bekreftet torsdag 13:00', hvem:'booking', varsel:null }
];

var KILDER = [
  { k:'okter',       n:'Økter',            farge:'var(--accent-olive)',   paa:true, laast:true },
  { k:'logg',        n:'Logg — faktisk',   farge:'var(--up)',             paa:true },
  { k:'gruppe',      n:'Gruppeøkter',      farge:'var(--accent-heather)', paa:true },
  { k:'skole',       n:'Skole',            farge:'var(--mid)',            paa:true },
  { k:'bookinger',   n:'Bookinger',        farge:'var(--accent-sky)',     paa:true },
  { k:'rsvp',        n:'Forespørsler',     farge:'var(--accent-sky)',     paa:true },
  { k:'tester',      n:'Tester',           farge:'var(--accent-fg)',      paa:true },
  { k:'kapasitet',   n:'Anleggskapasitet', farge:'var(--info)',           paa:false }
];
function kildePaa(k){ return KILDER.filter(function(x){ return x.k === k; })[0].paa; }

/* Biblioteket. Ukemalen er en ekte nyttelast (dager + tider), ikke et navn:
   den dras over uka og legges inn som utkast du bekrefter. */
var LIB = {
  maler: [
    { n:'Ukemal · Spesialisering 5 økter', f:'TEK 2 · SLAG 2 · FYS 1 · 5 t 30 min',
      okter:[ {dag:0,start:'16:00',min:90,n:'Teknikk tee',        omr:'TEK'},
              {dag:1,start:'16:30',min:60,n:'Wedge 40–90 m',      omr:'SLAG'},
              {dag:2,start:'06:30',min:45,n:'Styrke underkropp',  omr:'FYS'},
              {dag:3,start:'16:00',min:90,n:'Nærspill · fire meter', omr:'SLAG'},
              {dag:5,start:'10:00',min:75,n:'Ni hull med scorekort', omr:'SPILL'} ] },
    { n:'Ukemal · Turneringsuke', f:'TURN 1 · SLAG 1 · nedtrapping · 3 t',
      okter:[ {dag:1,start:'17:00',min:60,n:'Putt · rullelengde', omr:'SLAG'},
              {dag:3,start:'16:00',min:60,n:'Nedtrapping tee',    omr:'TEK'},
              {dag:5,start:'09:00',min:60,n:'Oppvarmingsrutine',  omr:'TURN'} ] },
    { n:'Ukemal · Skolestart lav belastning', f:'FYS 2 · TEK 1 · 2 t 15 min',
      okter:[ {dag:0,start:'06:30',min:45,n:'Mobilitet og core', omr:'FYS'},
              {dag:2,start:'16:00',min:45,n:'Teknikk innendørs', omr:'TEK'},
              {dag:4,start:'06:30',min:45,n:'Styrke helkropp',   omr:'FYS'} ] }
  ],
  okter: [
    { n:'Avstandsstige 50–100 m', f:'TEK · 60 min', okt:{min:60,n:'Avstandsstige 50–100 m',omr:'TEK'} },
    { n:'Putt 5–10 ft under press', f:'SLAG · 45 min', okt:{min:45,n:'Putt 5–10 ft under press',omr:'SLAG'} },
    { n:'Bunker · sandkontakt', f:'SLAG · 45 min', okt:{min:45,n:'Bunker · sandkontakt',omr:'SLAG'} },
    { n:'Ni hull med scorekort', f:'SPILL · 120 min', okt:{min:120,n:'Ni hull med scorekort',omr:'SPILL'} }
  ],
  drills: [
    { n:'Tee gate 60/40', f:'TEK_TEE_TOTAL_LAV_HAST_TRENINGSOMRADE_ALENE' },
    { n:'Avstandsstige 50–100 m', f:'TEK_INNSPILL_50_LAV_HAST_TRENINGSOMRADE_ALENE' },
    { n:'Putt 5–10 ft, ni kuler', f:'SLAG_PUTT_5_10_AUTO_TRENINGSOMRADE_OBSERVERT' }
  ]
};

/* ── Tidsakse — identisk med workbench-desktop ────────────────── */
var T_START = 5 * 60, T_SLUTT = 23 * 60, SLOT = 30, SLOT_H = 22;
var N_SLOT = (T_SLUTT - T_START) / SLOT;
function minutter(hhmm){ var p = String(hhmm).split(':'); return (+p[0]) * 60 + (+p[1]); }
function klokke(min){
  var t = Math.floor(min / 60), m = min % 60;
  return (t < 10 ? '0' : '') + t + ':' + (m < 10 ? '0' : '') + m;
}
function yFor(min){ return (min - T_START) / SLOT * SLOT_H; }
function snap(min, fin){
  var steg = fin ? 5 : SLOT;
  return Math.max(T_START, Math.min(T_SLUTT - SLOT, Math.round(min / steg) * steg));
}
function tidKort(min){
  var t = Math.floor(min/60), m = min%60;
  if (!t) return m + 'm';
  return m ? t + 't' + m : t + 't';
}
function tid(min){
  var t = Math.floor(min/60), m = min%60;
  if (!t) return m + ' min';
  return m ? t + ' t ' + m + ' min' : t + ' t';
}
var NAA = { dag:3, min:17 * 60 + 24 };

/* ── Tilstand ────────────────────────────────────────────────── */
var MODUS = 'stall';            /* stall · gruppe · spiller · min */
var visDag = 3;                 /* stall og min: én dag, personer som kolonner */
var valgteSp = ['oyvind','emma','markus','sara'];
var visGruppe = 'jc';
var visSpiller = 'emma';
var valgtId = null;
var inspTab = 'valgt';
var libTab = 'maler';
var slots = null;               /* siste tidsforslag */
var valgtSlot = null;
var malUtkast = [];             /* id-er lagt inn fra ukemal, ikke bekreftet */
var publisert = false;

var UNDO = [];
function pushUndo(){
  UNDO.push(JSON.stringify({ h:HEND, l:LOGG, m:malUtkast, p:publisert }));
  if (UNDO.length > 40) UNDO.shift();
}
function angre(){
  if (!UNDO.length){ toast('Ingenting å angre.'); return; }
  var f = JSON.parse(UNDO.pop());
  HEND = f.h; LOGG = f.l; malUtkast = f.m; publisert = f.p;
  renderAll();
  si('Angret. Loggen er rullet tilbake — varselet står ikke igjen.');
  toast('Angret');
}

/* ── Utility ─────────────────────────────────────────────────── */
var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){
  toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600);
}
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
function logg(x, hvem, varsel){
  LOGG.unshift({ t:klokke(NAA.min), x:x, hvem:hvem || 'coach', varsel:varsel || null });
}

/* ── Hvem sin tid: kolonnene ─────────────────────────────────── */
/* Kolonnene er personer i stall/min-modus og dager i gruppe/spiller-modus.
   Det er hele forskjellen mellom modusene — motoren under er den samme. */
function kolonner(){
  if (MODUS === 'stall'){
    return valgteSp.map(function(id){
      var p = sp(id);
      return { key:id, type:'person', tittel:p.ini, navn:p.n, dag:visDag, spId:id };
    }).concat([{ key:'coach', type:'person', navn:COACH.n, tittel:COACH.ini,
                dag:visDag, spId:'coach', coach:true }]);
  }
  if (MODUS === 'min'){
    return [{ key:'coach', type:'person', navn:COACH.n, tittel:COACH.ini,
              dag:visDag, spId:'coach', coach:true }];
  }
  return DAGER.map(function(d, i){
    return { key:'d' + i, type:'dag', tittel:d.dw, navn:d.dd, dag:i,
             spId:(MODUS === 'spiller' ? visSpiller : null), gruppe:(MODUS === 'gruppe' ? visGruppe : null) };
  });
}

/* Hendelsene som hører i en kolonne. Gruppeøkter dukker opp i medlemmenes
   kolonner også — ellers ville stallvisningen påstå at tiden er ledig. */
/* F4c: etterlevelse per person — teller okt+gruppe med passert sluttid.
   Fremtidige økter kan ikke være etterlevd eller brutt. */
function passert(h){
  return h.dag < NAA.dag || (h.dag === NAA.dag && minutter(h.start) + h.min <= NAA.min);
}
function etterlevelse(pid){
  var n = 0, f = 0;
  HEND.forEach(function(h){
    if (h.kilde !== 'okt' && h.kilde !== 'gruppe') return;
    if (h.kilde === 'gruppe'){
      if (pid === 'coach' || !medlemmer(h.gruppe).filter(function(m){ return m.id === pid; }).length) return;
    } else if (h.sp !== pid) return;
    if (!passert(h)) return;
    n++;
    if (h.done) f++;
  });
  return { f:f, n:n };
}
function hendIKol(kol){
  var ut = [];
  HEND.forEach(function(h){
    if (h.dag !== kol.dag) return;
    if (h.kilde === 'gruppe'){
      if (!kildePaa('gruppe')) return;
      if (MODUS === 'gruppe'){ if (h.gruppe === visGruppe) ut.push(h); return; }
      if (kol.coach){ ut.push(h); return; }
      if (kol.spId && medlemmer(h.gruppe).filter(function(m){ return m.id === kol.spId; }).length) ut.push(h);
      return;
    }
    if (h.kilde === 'rsvp' && !kildePaa('rsvp')) return;
    if (h.kilde === 'booking' && !kildePaa('bookinger')) return;
    if (h.kilde === 'test' && !kildePaa('tester')) return;
    if (MODUS === 'gruppe'){
      /* Gruppas uke: gruppas egne økter + coachens bookinger som opptatt tid. */
      if (h.sp === 'coach') ut.push(h);
      return;
    }
    if (h.sp === kol.spId) ut.push(h);
  });
  return ut.sort(function(a,b){ return minutter(a.start) - minutter(b.start); });
}

/* Skoleblokk for en kolonne — genereres, aldri lagret som hendelse. */
function skoleFor(kol){
  if (!kildePaa('skole')) return null;
  var pid = kol.spId;
  if (MODUS === 'gruppe'){
    /* Gruppas medlemmer går på samme skole i denne demoen; er de på ulike,
       vises fellesnevneren og resten som konflikt. */
    pid = medlemmer(visGruppe)[0].id;
  }
  if (!pid || pid === 'coach') return null;
  var p = sp(pid);
  var st = SKOLETID[p.skole];
  if (!st) return null;                       /* GFGK: tid-på-dag finnes ikke */
  if (st.dager.indexOf(kol.dag) === -1) return null;
  return { navn:'Skole · ' + p.skole, start:st.start, slutt:st.slutt };
}
function skoletidUkjent(kol){
  var pid = kol.spId;
  if (!pid || pid === 'coach') return false;
  return !SKOLETID[sp(pid).skole];
}

/* Opptatt tid for en person på en dag — brukes av tidsforslag og konflikter.
   RSVP teller IKKE: en forespørsel er ikke opptatt tid før den er godtatt. */
function opptatt(pid, dag){
  var ut = [];
  HEND.forEach(function(h){
    if (h.dag !== dag || h.kilde === 'rsvp') return;
    if (h.kilde === 'gruppe'){
      if (pid === 'coach' || medlemmer(h.gruppe).filter(function(m){ return m.id === pid; }).length){
        ut.push({ fra:minutter(h.start), til:minutter(h.start) + h.min, n:h.n });
      }
      return;
    }
    if (h.sp === pid) ut.push({ fra:minutter(h.start), til:minutter(h.start) + h.min, n:h.n });
  });
  if (pid !== 'coach'){
    var st = SKOLETID[sp(pid).skole];
    if (st && st.dager.indexOf(dag) > -1)
      ut.push({ fra:minutter(st.start), til:minutter(st.slutt), n:'Skole' });
  }
  return ut;
}
function overlapper(aFra, aTil, bFra, bTil){ return aFra < bTil && bFra < aTil; }

/* ── Konflikter ──────────────────────────────────────────────────
   Regnes, aldri skrevet. En konflikt er to hendelser som overlapper for
   SAMME person. Skole gir varsel, ikke sperre (masterplanens regel).
   Den som ble booket sist viker — vi sier hvem det er, og lar coachen velge. */
function konflikter(){
  var ut = [];
  var personer = STALL.map(function(s){ return s.id; }).concat(['coach']);
  personer.forEach(function(pid){
    for (var d = 0; d < 7; d++){
      var liste = [];
      HEND.forEach(function(h){
        if (h.dag !== d || h.kilde === 'rsvp') return;
        if (h.kilde === 'gruppe'){
          if (pid === 'coach' || medlemmer(h.gruppe).filter(function(m){ return m.id === pid; }).length)
            liste.push(h);
          return;
        }
        if (h.sp === pid) liste.push(h);
      });
      for (var i = 0; i < liste.length; i++){
        for (var j = i + 1; j < liste.length; j++){
          var a = liste[i], b = liste[j];
          if (!overlapper(minutter(a.start), minutter(a.start) + a.min,
                          minutter(b.start), minutter(b.start) + b.min)) continue;
          ut.push({ pid:pid, dag:d, a:a, b:b, slag:'plan' });
        }
      }
      if (pid !== 'coach'){
        var st = SKOLETID[sp(pid).skole];
        if (!st || st.dager.indexOf(d) === -1) continue;
        var sFra = minutter(st.start), sTil = minutter(st.slutt);
        liste.forEach(function(h){
          if (h.kilde === 'booking') return;
          if (overlapper(minutter(h.start), minutter(h.start) + h.min, sFra, sTil))
            ut.push({ pid:pid, dag:d, a:h, b:{ n:'Skole · ' + sp(pid).skole, start:st.start,
              min:sTil - sFra, kilde:'skole' }, slag:'skole' });
        });
      }
    }
  });
  return ut;
}
function konflikterISyn(){
  var k = konflikter();
  if (MODUS === 'stall' || MODUS === 'min')
    return k.filter(function(x){ return x.dag === visDag &&
      (x.pid === 'coach' || valgteSp.indexOf(x.pid) > -1); });
  if (MODUS === 'spiller') return k.filter(function(x){ return x.pid === visSpiller; });
  return k.filter(function(x){ return medlemmer(visGruppe)
    .filter(function(m){ return m.id === x.pid; }).length; });
}
function harKonflikt(h){
  return konflikter().filter(function(k){ return k.a.id === h.id || (k.b && k.b.id === h.id); }).length > 0;
}

/* ── Tidsforslag ─────────────────────────────────────────────────
   «Finn 90 min ledig før fredag.» Motoren søker gjennom rasteret og
   returnerer slots der ALLE valgte spillere er ledige, coachen er
   tilgjengelig, og anlegget har kapasitet. Den påstår ikke mer enn den vet:
   forslag som forutsetter utebane merkes, fordi kapasitetsdata mangler der. */
function finnLedig(varighet, innenDag){
  var ut = [], deltakere = MODUS === 'gruppe' ? medlemmer(visGruppe).map(function(m){ return m.id; })
            : (MODUS === 'spiller' ? [visSpiller] : valgteSp.slice());
  var med = deltakere.concat(['coach']);
  for (var d = 0; d <= innenDag && ut.length < 8; d++){
    var travle = {};
    med.forEach(function(pid){ travle[pid] = opptatt(pid, d); });
    for (var m = T_START; m + varighet <= T_SLUTT; m += SLOT){
      var fri = true, ukjent = [];
      med.forEach(function(pid){
        travle[pid].forEach(function(b){ if (overlapper(m, m + varighet, b.fra, b.til)) fri = false; });
        if (pid !== 'coach' && !SKOLETID[sp(pid).skole]) ukjent.push(sp(pid).n);
      });
      if (!fri) continue;
      /* Coachens arbeidsuke: utenfor den er tiden ikke tilgjengelig. */
      if (TILGJENGELIG.dager.indexOf(d) > -1){
        if (m < minutter(TILGJENGELIG.start) || m + varighet > minutter(TILGJENGELIG.slutt)) continue;
      } else if (m < 9 * 60 || m + varighet > 16 * 60) continue;
      /* Kapasitet: to simer. Tell hvor mange økter som alt ligger i slottet. */
      var samtidige = HEND.filter(function(h){
        return h.dag === d && h.kilde !== 'rsvp' && h.kilde !== 'booking' &&
          overlapper(m, m + varighet, minutter(h.start), minutter(h.start) + h.min);
      }).length;
      if (samtidige >= KAPASITET.simer) continue;
      ut.push({ dag:d, start:klokke(m), min:varighet, ukjent:ukjent,
                merk: d > 4 ? 'utebane · kapasitet ukjent' : null });
      m += varighet - SLOT;                   /* ikke foreslå overlappende slots */
      if (ut.length >= 8) break;
    }
  }
  return ut;
}

/* ── Render: kolonnehode + lerret ────────────────────────────── */
function renderWeek(){
  var w = document.getElementById('week');
  w.innerHTML = '';
  var kols = kolonner();
  w.className = 'tg';
  var minKol = kols.length > 4 ? 118 : 150;
  w.style.gridTemplateColumns = '62px repeat(' + kols.length + ', minmax(' + minKol + 'px, 1fr))';
  w.style.minWidth = (62 + kols.length * minKol) + 'px';

  w.appendChild(el('div', 'tg-corner'));
  kols.forEach(function(k){
    var h = el('div', 'tg-dayhead' + (k.coach ? ' coachkol' : '') +
      (k.type === 'dag' && k.dag === NAA.dag ? ' today' : ''));
    if (k.type === 'person'){
      var av = el('span', 'av', k.tittel); h.appendChild(av);
      h.appendChild(el('span', 'nm', k.navn.split(' ')[0] + (k.coach ? '' : ' ' + k.navn.split(' ')[1].charAt(0) + '.')));
    } else {
      h.appendChild(el('span', 'dw', DAGER[k.dag].dw));
      h.appendChild(el('span', 'dd num', DAGER[k.dag].dd));
    }
    var mins = hendIKol(k).filter(function(x){ return x.kilde === 'okt' || x.kilde === 'gruppe'; })
      .reduce(function(s, x){ return s + x.min; }, 0);
    h.appendChild(el('span', 'dt num', mins ? tidKort(mins) : '—'));
    if (k.type === 'person' && !k.coach && kildePaa('logg')){
      var ev = etterlevelse(k.spId);
      if (ev.n){
        var et = el('span', 'ettl num', ev.f + '/' + ev.n);
        et.setAttribute('aria-label', 'Etterlevelse: ' + ev.f + ' av ' + ev.n +
          ' publiserte økter med passert sluttid');
        et.title = 'etterlevelse · fullført av passert';
        h.appendChild(et);
      }
    }
    if (skoletidUkjent(k)) h.appendChild(el('span', 'ukjent', 'skoletid mangler'));
    w.appendChild(h);
  });

  /* Heldagsbånd: turneringsuka. Uke 32 har ingen — det sies ærlig. */
  var adc = el('div', 'tg-adcorner', 'turn.');
  w.appendChild(adc);
  var cell = el('div', 'tg-adcell',
    'Ingen turnering i uke 32 · neste: NM Junior · Losby · 14.–16.08 (uke 33)');
  cell.style.gridColumn = '2 / -1';
  w.appendChild(cell);

  var axis = el('div', 'tg-axis');
  for (var i = 0; i <= N_SLOT; i++){
    var min = T_START + i * SLOT;
    var t = el('div', 'tg-tick' + (min % 60 === 0 ? ' hel' : ''));
    t.appendChild(el('span', null, klokke(min)));
    axis.appendChild(t);
  }
  axis.style.height = (N_SLOT * SLOT_H) + 'px';
  w.appendChild(axis);

  kols.forEach(function(k){
    var col = el('div', 'tg-col');
    col.dataset.kol = k.key;
    col.dataset.dag = k.dag;
    col.dataset.spid = k.spId || '';
    col.style.height = (N_SLOT * SLOT_H) + 'px';

    /* Lag 1: utenfor arbeidsuka (coachens tilgjengelighet) */
    if (tilgjPaa){
      var innenDag = TILGJENGELIG.dager.indexOf(k.dag) > -1;
      var fra = innenDag ? minutter(TILGJENGELIG.start) : T_SLUTT;
      var til = innenDag ? minutter(TILGJENGELIG.slutt) : T_SLUTT;
      if (fra > T_START) col.appendChild(lag('utenfor', T_START, fra));
      if (til < T_SLUTT) col.appendChild(lag('utenfor', til, T_SLUTT));
    }
    /* Lag 2: anleggskapasitet (begge simer i bruk) */
    if (kildePaa('kapasitet')){
      for (var m = T_START; m < T_SLUTT; m += SLOT){
        var n = HEND.filter(function(h){
          return h.dag === k.dag && (h.kilde === 'okt' || h.kilde === 'gruppe') &&
            overlapper(m, m + SLOT, minutter(h.start), minutter(h.start) + h.min);
        }).length;
        if (n >= KAPASITET.simer) col.appendChild(lag('fullt', m, m + SLOT));
      }
    }
    /* Lag 3: skole som dimmet bakteppe */
    var sk = skoleFor(k);
    if (sk){
      var b = el('div', 'tg-busy', sk.navn + ' ' + sk.start + '–' + sk.slutt);
      b.style.top = yFor(minutter(sk.start)) + 'px';
      b.style.height = ((minutter(sk.slutt) - minutter(sk.start)) / SLOT * SLOT_H - 2) + 'px';
      col.appendChild(b);
    }
    /* Lag 4: planen */
    hendIKol(k).forEach(function(h){ col.appendChild(blokk(h, k)); });

    /* Lag 5: tidsforslag i denne kolonnen */
    if (slots){
      slots.forEach(function(s, idx){
        if (s.dag !== k.dag) return;
        col.appendChild(slotBlokk(s, idx));
      });
    }

    if (k.dag === NAA.dag){
      var nu = el('div', 'tg-now'); nu.id = 'nowline';
      nu.style.top = yFor(NAA.min) + 'px';
      nu.appendChild(el('span', null, klokke(NAA.min)));
      col.appendChild(nu);
    }

    /* Mal-dra: kolonnen er slippsonen. Slipp = utkast, ikke fasit. */
    col.addEventListener('dragover', function(ev){ ev.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('drop'); });
    col.addEventListener('drop', function(ev){
      ev.preventDefault(); col.classList.remove('drop');
      slippBibliotek(ev.dataTransfer.getData('text/plain'), k, ev);
    });
    /* Dra i tom tid = ny økt (samme gest som i workbench-desktop) */
    col.addEventListener('dblclick', function(ev){
      var r = col.getBoundingClientRect();
      nyOkt(k, klokke(snap(T_START + (ev.clientY - r.top) / SLOT_H * SLOT, false)));
    });
    w.appendChild(col);
  });
}
function lag(kls, fra, til){
  var d = el('div', 'tg-lag ' + kls);
  d.style.top = yFor(fra) + 'px';
  d.style.height = ((til - fra) / SLOT * SLOT_H) + 'px';
  return d;
}

function blokk(h, kol){
  var laast = h.laast || h.kilde === 'skole' ||
    (h.kilde === 'gruppe' && MODUS !== 'gruppe' && MODUS !== 'min' && MODUS !== 'stall');
  var kls = 'tg-okt';
  if (h.kilde === 'gruppe') kls += ' gruppeokt';
  if (h.kilde === 'booking') kls += ' booking';
  if (h.kilde === 'test') kls += ' test';
  if (h.kilde === 'rsvp') kls += ' rsvp';
  if (h.mal) kls += ' mal';
  if (laast) kls += ' laast';
  if (harKonflikt(h)) kls += ' har-konflikt';
  var b = el('button', kls);
  b.type = 'button';
  b.dataset.okt = h.id;
  b.dataset.odId = 'wbs-blokk-' + h.id;
  b.style.top = yFor(minutter(h.start)) + 'px';
  b.style.height = Math.max(SLOT_H - 2, h.min / SLOT * SLOT_H - 2) + 'px';
  if (valgtId === h.id) b.setAttribute('aria-current', 'true');
  b.appendChild(el('span', 't', h.n));
  b.appendChild(el('span', 'm num', h.start + '–' + klokke(minutter(h.start) + h.min) + ' · ' + tid(h.min)));
  if (h.kilde === 'gruppe')
    b.appendChild(el('span', 'kn', 'gruppe · ' + medlemmer(h.gruppe).length + ' spillere'));
  if (h.kilde === 'booking') b.appendChild(el('span', 'kn', 'booking · låst'));
  if (h.kilde === 'rsvp') b.appendChild(el('span', 'kn', 'forespørsel · svar mangler'));
  if (h.kilde === 'test') b.appendChild(el('span', 'kn', 'test'));
  if (h.mal) b.appendChild(el('span', 'kn', 'fra ukemal · ikke bekreftet'));
  if (h.omr && !h.mal) b.appendChild(el('span', 'f', h.omr));
  /* F4c: faktisk-mot-planlagt som lag */
  if (kildePaa('logg') && (h.kilde === 'okt' || h.kilde === 'gruppe')){
    if (h.done) b.appendChild(el('span', 'floggr', '✓ logget'));
    else if (h.hoppet) b.appendChild(el('span', 'hoplab', 'hoppet — ikke gjennomført'));
    else if (passert(h)) b.appendChild(el('span', 'hoplab', 'passert · ikke logget'));
  }
  if (harKonflikt(h)) b.appendChild(el('span', 'konf', 'kolliderer'));

  b.addEventListener('click', function(){
    if (b.dataset.dro === '1'){ b.dataset.dro = ''; return; }
    valgtId = h.id;
    inspTab = h.kilde === 'rsvp' ? 'rsvp' : 'valgt';
    renderAll();
  });
  b.addEventListener('keydown', function(ev){ if (!laast) blokkTast(ev, h); });
  if (!laast){
    festFlytt(b, h, kol);
    ['topp','bunn'].forEach(function(kant){
      var rz = el('div', 'rz ' + kant);
      festResize(rz, h, kant);
      b.appendChild(rz);
    });
  }
  return b;
}

function slotBlokk(s, idx){
  var b = el('button', 'tg-slot');
  b.type = 'button';
  b.dataset.odId = 'wbs-slot-' + idx;
  b.setAttribute('aria-pressed', String(valgtSlot === idx));
  b.style.top = yFor(minutter(s.start)) + 'px';
  b.style.height = Math.max(SLOT_H - 2, s.min / SLOT * SLOT_H - 2) + 'px';
  b.appendChild(el('span', null, 'ledig ' + s.start + ' · ' + tid(s.min)));
  b.addEventListener('click', function(){
    valgtSlot = idx; valgtId = null; inspTab = 'valgt'; renderAll();
    si('Forslag valgt: ' + DAGER[s.dag].dw + ' ' + s.start + ', ' + tid(s.min) + '.');
  });
  return b;
}

/* ── Flytt, dupliser, strekk ─────────────────────────────────────
   I stall-modus er kolonnen en PERSON: å slippe Emmas økt i Markus'
   kolonne flytter økta til Markus. Det er coach-makt, og derfor logges den
   og spilleren varsles. I dag-modusene flytter samme gest mellom dager. */
function festFlytt(b, h, kol){
  b.addEventListener('pointerdown', function(ev){
    if (ev.target.classList && ev.target.classList.contains('rz')) return;
    var y0 = ev.clientY, x0 = ev.clientX, dro = false, fra0 = minutter(h.start);
    function mv(e2){
      if (!dro && Math.abs(e2.clientY - y0) + Math.abs(e2.clientX - x0) < 5) return;
      if (!dro){ dro = true; b.classList.add('flyttes'); pushUndo(); }
      e2.preventDefault();
      var ny = snap(fra0 + (e2.clientY - y0) / SLOT_H * SLOT, e2.shiftKey);
      b.style.top = yFor(ny) + 'px';
      b.style.transform = 'translateX(' + (e2.clientX - x0) + 'px)';
      b.dataset.ny = ny;
      var k = document.elementsFromPoint(e2.clientX, e2.clientY).filter(function(n){
        return n.classList && n.classList.contains('tg-col'); })[0];
      if (k){ b.dataset.nyKol = k.dataset.kol; b.dataset.nyDag = k.dataset.dag;
              b.dataset.nySp = k.dataset.spid; }
    }
    function opp(e2){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', opp);
      if (!dro) return;
      b.classList.remove('flyttes'); b.dataset.dro = '1';
      var ny = +b.dataset.ny;
      var nyDag = b.dataset.nyDag != null ? +b.dataset.nyDag : h.dag;
      var nySp = b.dataset.nySp || h.sp;
      if (e2.altKey){
        var kopi = JSON.parse(JSON.stringify(h));
        kopi.id = h.id + '_k' + (Date.now() % 1000);
        kopi.start = klokke(ny); kopi.dag = nyDag;
        if (kopi.kilde !== 'gruppe' && nySp) kopi.sp = nySp;
        HEND.push(kopi); valgtId = kopi.id;
        logg('Duplisert: ' + h.n + ' → ' + DAGER[nyDag].dw + ' ' + klokke(ny), 'coach', null);
        toast('Duplisert (⌥) · ⌘Z angrer');
      } else {
        var byttet = h.kilde !== 'gruppe' && nySp && nySp !== h.sp && nySp !== '';
        var forrige = h.sp;
        h.start = klokke(ny); h.dag = nyDag;
        if (byttet) h.sp = nySp;

          logg(h.n + ' flyttet fra ' + sp(forrige).n + ' til ' + sp(nySp).n,
            'coach', 'begge varslet');
          toast('Flyttet til ' + sp(nySp).n);
        } else if (h.kilde === 'gruppe'){
          logg(h.n + ' flyttet til ' + DAGER[nyDag].dw + ' ' + klokke(ny),
            'coach', medlemmer(h.gruppe).length + ' spillere varslet');

            'coach', MODUS === 'spiller' ? sp(visSpiller).n + ' varslet' : null);
        }
        si(h.n + ' er flyttet til ' + DAGER[nyDag].dw + ' ' + klokke(ny) + '.');
      }
      renderAll();
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', opp);
  });
}
function festResize(rz, h, kant){
  rz.addEventListener('pointerdown', function(ev){
    ev.stopPropagation(); ev.preventDefault();
    var y0 = ev.clientY, gjort = false, fra0 = minutter(h.start), min0 = h.min;
    function mv(e2){
      if (!gjort){ gjort = true; pushUndo(); }
      var steg = e2.shiftKey ? 5 : SLOT;
      var d = Math.round((e2.clientY - y0) / SLOT_H * SLOT / steg) * steg;
      if (kant === 'bunn'){
        if (min0 + d < 15 || fra0 + min0 + d > T_SLUTT) return;
        h.min = min0 + d;
      } else {
        if (fra0 + d < T_START || min0 - d < 15) return;
        h.start = klokke(fra0 + d); h.min = min0 - d;
      }
      renderKpi(); tegnBlokk(h);
    }
    function opp(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', opp);
      if (!gjort) return;
      logg(h.n + ' er nå ' + tid(h.min), 'coach', null);
      renderAll();
      si(h.n + ' varer nå ' + tid(h.min) + '. Differansen skrives til siste drill i økta.');
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', opp);
  });
}
function tegnBlokk(h){
  var b = document.querySelector('.tg-okt[data-okt="' + h.id + '"]');
  if (!b) return;
  b.style.top = yFor(minutter(h.start)) + 'px';
  b.style.height = Math.max(SLOT_H - 2, h.min / SLOT * SLOT_H - 2) + 'px';
  var m = b.querySelector('.m');
  if (m) m.textContent = h.start + '–' + klokke(minutter(h.start) + h.min) + ' · ' + tid(h.min);
}
function blokkTast(ev, h){
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'd'){
    ev.preventDefault(); pushUndo();
    var kopi = JSON.parse(JSON.stringify(h));
    kopi.id = h.id + '_k' + (Date.now() % 1000);
    HEND.push(kopi); valgtId = kopi.id;
    renderAll(); toast('Duplisert · ⌘Z angrer'); return;
  }
  if (ev.key === 'Delete' || ev.key === 'Backspace'){
    ev.preventDefault(); pushUndo();
    HEND = HEND.filter(function(x){ return x.id !== h.id; });
    if (valgtId === h.id) valgtId = null;
    logg(h.n + ' er slettet', 'coach', null);
    renderAll(); toast('Slettet · ⌘Z angrer'); return;
  }
  var dMin = { ArrowUp:-1, ArrowDown:1 }[ev.key];
  if (dMin){
    ev.preventDefault(); pushUndo();
    h.start = klokke(snap(minutter(h.start) + dMin * (ev.shiftKey ? 5 : SLOT), ev.shiftKey));
    renderAll(); fokusBlokk(h.id); return;
  }
  var dSide = { ArrowLeft:-1, ArrowRight:1 }[ev.key];
  if (dSide){
    ev.preventDefault(); pushUndo();
    if (MODUS === 'stall'){
      /* Sideveis i stall-modus bytter PERSON, ikke dag — kolonnene er personer. */
      var kjede = valgteSp.concat(['coach']);
      var i = kjede.indexOf(h.sp);
      var ny = Math.max(0, Math.min(kjede.length - 1, i + dSide));
      if (h.kilde === 'gruppe'){ toast('Gruppeøkta eies av gruppa — bytt i Gruppe-modus.'); return; }
      h.sp = kjede[ny];
      logg(h.n + ' flyttet til ' + sp(h.sp).n, 'coach', 'begge varslet');
    } else {
      h.dag = Math.max(0, Math.min(6, h.dag + dSide));
    }
    renderAll(); fokusBlokk(h.id);
  }
}
function fokusBlokk(id){

   Konflikter listes før bekreftelse — det er hele poenget med utkastet. */
function slippBibliotek(nokkel, kol){
  var mal = LIB.maler.filter(function(m){ return m.n === nokkel; })[0];
  if (mal){
    if (MODUS === 'stall' || MODUS === 'min'){
      toast('Ukemaler legges på en uke — bytt til Gruppe eller Spiller.');
      return;
    }
    pushUndo();

      var h = { id:id, dag:o.dag, start:o.start, min:o.min, n:o.n, omr:o.omr, mal:true,
        kilde: MODUS === 'gruppe' ? 'gruppe' : 'okt' };
      if (MODUS === 'gruppe') h.gruppe = visGruppe; else h.sp = visSpiller;
      HEND.push(h); malUtkast.push(id);
    });
    valgtId = malUtkast[0]; inspTab = 'valgt'; renderAll();
    si(mal.n + ' er lagt inn som utkast. ' + malUtkast.length + ' økter venter på bekreftelse.');
    toast('Utkast lagt inn · bekreft i inspektøren');
    return;
  }
  var okt = LIB.okter.filter(function(m){ return m.n === nokkel; })[0];
  if (okt){
    pushUndo();
    var id = 'o' + Date.now() % 10000;
    var ny = { id:id, dag:kol.dag, start:'16:00', min:okt.okt.min, n:okt.okt.n,

    HEND.push(ny); valgtId = id; renderAll();
    si(okt.n + ' er lagt inn ' + DAGER[kol.dag].dw + ' 16:00.');

}

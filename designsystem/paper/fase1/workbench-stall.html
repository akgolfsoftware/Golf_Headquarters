  if (!h){
    var e = el('div', 'empty');
    e.appendChild(el('h3', null, 'Ingen blokk valgt'));
    e.appendChild(el('p', null, MODUS === 'stall'
      ? 'Velg en økt i en spillerkolonne, eller finn felles ledig tid i venstremargen. ' +
        'Dobbeltklikk i tom tid for å legge inn en ny økt.'
      : 'Velg en økt i uka, dra en ukemal fra biblioteket, eller dobbeltklikk i tom tid.'));
    b.appendChild(e);
    return;
  }

  b.appendChild(el('span', 'flab', h.kilde === 'gruppe' ? 'gruppeøkt' :
    (h.kilde === 'booking' ? 'booking · låst' : (h.kilde === 'test' ? 'test' : 'økt'))));
  var t = el('h3', null, h.n);
  t.style.cssText = 'margin:0 0 var(--s1);font-family:var(--disp);font-size:15px;font-weight:600';
  b.appendChild(t);
  b.appendChild(el('p', 'hint', h.start + '–' + klokke(minutter(h.start) + h.min) + ' · ' +
    tid(h.min) + ' · ' + DAGER[h.dag].dw + ' ' + DAGER[h.dag].dd +
    (h.kilde === 'gruppe' ? ' · ' + gruppeNavn(h.gruppe) : (h.sp ? ' · ' + sp(h.sp).n : ''))));

  if (h.kilde === 'gruppe'){
    b.appendChild(el('span', 'flab', 'deltakere · skrives til alle'));
    var dl = el('div', 'delt');
    medlemmer(h.gruppe).forEach(function(p){
      var kol = konflikter().filter(function(k){
        return k.pid === p.id && (k.a.id === h.id || (k.b && k.b.id === h.id)); }).length > 0;
      dl.appendChild(el('span', 'dp' + (kol ? ' kol' : ''), p.n + (kol ? ' · kolliderer' : '')));
    });
    b.appendChild(dl);
  }

  if (h.laast){
    var lk = el('div', 'cvarsel');
    lk.appendChild(el('span', 'flab', 'låst blokk'));
    lk.appendChild(el('p', null, 'Bookinger eies av bookingflaten. Endring skjer der, ' +
      'med kvittering og varsel til den som booket.'));
    b.appendChild(lk);
    return;
  }

  /* Flytt-feltene: samme jobb som dra-og-slipp, for tastatur og tommel. */
  var f1 = el('div', 'field');
  f1.appendChild(el('label', null, 'Flytt til dag'));
  var selD = el('select'); selD.dataset.odId = 'wbs-flytt-dag';
  DAGER.forEach(function(d, i){
    var o = el('option', null, d.dw + ' ' + d.dd); o.value = i;
    if (i === h.dag) o.selected = true; selD.appendChild(o);
  });
  selD.addEventListener('change', function(){
    pushUndo(); h.dag = +selD.value;
    logg(h.n + ' flyttet til ' + DAGER[h.dag].dw, 'coach',
      h.kilde === 'gruppe' ? medlemmer(h.gruppe).length + ' spillere varslet' : null);
    renderAll();
  });
  f1.appendChild(selD);
  b.appendChild(f1);

  if (h.kilde !== 'gruppe'){
    var f2 = el('div', 'field');
    f2.appendChild(el('label', null, 'Flytt til spiller'));
    var selS = el('select'); selS.dataset.odId = 'wbs-flytt-spiller';
    STALL.forEach(function(s2){
      var o = el('option', null, s2.n); o.value = s2.id;
      if (s2.id === h.sp) o.selected = true; selS.appendChild(o);
    });
    selS.addEventListener('change', function(){
      pushUndo();
      var fra = h.sp; h.sp = selS.value;
      logg(h.n + ' flyttet fra ' + sp(fra).n + ' til ' + sp(h.sp).n, 'coach', 'begge varslet');
      renderAll();
    });
    f2.appendChild(selS);
    f2.appendChild(el('p', 'hint', 'Samme som å dra blokken til en annen kolonne i stallvisningen.'));
    b.appendChild(f2);
  } else {
    var f3 = el('div', 'field');
    f3.appendChild(el('label', null, 'Skriv til'));
    var seg = el('div', 'segs');
    ['Hele gruppa','Bare de som er ledige'].forEach(function(v, i){
      var c = el('button', 'chip sm', v);
      c.type = 'button';
      c.dataset.odId = 'wbs-skrivtil-' + i;
      c.setAttribute('aria-pressed', String(i === 0));
      c.addEventListener('click', function(){
        seg.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
        c.setAttribute('aria-pressed','true');
        toast(i === 0 ? 'Skrives til alle ' + medlemmer(h.gruppe).length + ' spillere'
                      : 'Skrives bare til de uten kollisjon');
      });
      seg.appendChild(c);
    });
    f3.appendChild(seg);
    b.appendChild(f3);
  }

  var acts = el('div', 'kacts');
  var slett = el('button', 'btn sm', 'Slett økt');
  slett.dataset.odId = 'wbs-slett';
  slett.addEventListener('click', function(){
    pushUndo();
    HEND = HEND.filter(function(x){ return x.id !== h.id; });
    valgtId = null;
    logg(h.n + ' er slettet', 'coach', null);
    renderAll(); toast('Slettet · ⌘Z angrer');
  });
  var dup = el('button', 'btn sm', 'Dupliser');
  dup.dataset.odId = 'wbs-dupliser';
  dup.addEventListener('click', function(){
    pushUndo();
    var k = JSON.parse(JSON.stringify(h));
    k.id = h.id + '_k' + (Date.now() % 1000);
    HEND.push(k); valgtId = k.id; renderAll(); toast('Duplisert');
  });
  acts.appendChild(dup); acts.appendChild(slett);
  b.appendChild(acts);
}

function inspKonflikt(b, konf){
  if (!konf.length){
    var e = el('div', 'empty');
    e.appendChild(el('h3', null, 'Ingen konflikter i visningen'));
    e.appendChild(el('p', null, 'Regnet mot skole, bookinger, gruppeøkter og egne økter ' +
      'for spillerne du ser nå.'));
    b.appendChild(e);
    return;
  }
  b.appendChild(el('span', 'flab', konf.length + ' konflikter'));
  konf.forEach(function(k, i){
    var c = el('div', 'konf');
    c.appendChild(el('span', 'kv', (k.slag === 'skole' ? 'skole · varsel' : 'dobbeltbooket') +
      ' · ' + DAGER[k.dag].dw));
    c.appendChild(el('span', 'kn2', sp(k.pid).n));
    c.appendChild(el('p', null, k.a.n + ' (' + k.a.start + ') mot ' + k.b.n + ' (' + k.b.start + '). ' +
      (k.slag === 'skole'
        ? 'Skole er bakteppe, ikke sperre — den som legger økt i skoletid må vite det, og hjemmet skal informeres.'
        : 'Den som ble lagt inn sist viker som regel. Flytt en av dem, eller behold begge hvis spilleren rekker.')));
    var acts = el('div', 'kacts');
    var g = el('button', 'btn sm', 'Vis i lerretet');
    g.dataset.odId = 'wbs-konf-vis-' + i;
    g.addEventListener('click', function(){
      visDag = k.dag; valgtId = k.a.id; inspTab = 'valgt';
      if (MODUS === 'stall' && k.pid !== 'coach' && valgteSp.indexOf(k.pid) === -1)
        valgteSp = valgteSp.slice(0, 5).concat([k.pid]);
      renderAll(); fokusBlokk(k.a.id);
    });
    acts.appendChild(g);
    if (k.slag !== 'skole'){
      var fl = el('button', 'btn sm', 'Flytt ' + k.a.n.split(' ')[0] + ' 60 min senere');
      fl.dataset.odId = 'wbs-konf-flytt-' + i;
      fl.addEventListener('click', function(){
        pushUndo();
        var h = HEND.filter(function(x){ return x.id === k.a.id; })[0];
        if (!h) return;
        h.start = klokke(snap(minutter(h.start) + 60, false));
        logg(h.n + ' flyttet 60 min for å løse kollisjon', 'coach', sp(k.pid).n + ' varslet');
        renderAll();
        si(h.n + ' er flyttet til ' + h.start + '. Konflikten er løst.');
        toast('Flyttet · konflikten er løst');
      });
      acts.appendChild(fl);
    }
    c.appendChild(acts);
    b.appendChild(c);
  });
}

function inspRsvp(b, rsvp){
  if (!rsvp.length){
    var e = el('div', 'empty');
    e.appendChild(el('h3', null, 'Ingen forespørsler venter'));
    e.appendChild(el('p', null, 'Bookingforespørsler lander her som tentative blokker. ' +
      'Du svarer uten å forlate kalenderen.'));
    b.appendChild(e);
    return;
  }
  b.appendChild(el('span', 'flab', rsvp.length + ' forespørsler'));
  rsvp.forEach(function(h, i){
    var c = el('div', 'konf');
    c.appendChild(el('span', 'kv', 'tentativ · ' + h.sendt));
    c.appendChild(el('span', 'kn2', h.n));
    c.appendChild(el('p', null, h.fra + ' ber om ' + DAGER[h.dag].dw + ' ' + h.start + '–' +
      klokke(minutter(h.start) + h.min) + ' (' + tid(h.min) + '). ' +
      (minutter(h.start) + h.min > minutter(TILGJENGELIG.slutt)
        ? 'Tidspunktet ligger utenfor arbeidsuka din.'
        : 'Tidspunktet er innenfor arbeidsuka, og du har ingen annen blokk der.')));
    var acts = el('div', 'kacts');
    var ja = el('button', 'btn ink sm', 'Godta');
    ja.dataset.odId = 'wbs-rsvp-ja-' + i;
    ja.addEventListener('click', function(){
      pushUndo();
      h.kilde = 'booking'; h.laast = true; h.n = h.n.replace('Forespørsel · ', 'Coachtime · ');
      logg(h.n + ' godtatt ' + DAGER[h.dag].dw + ' ' + h.start, 'booking', 'kvittering sendt');
      valgtId = h.id; inspTab = 'valgt'; renderAll();
      si('Forespørselen er godtatt. Blokken er nå en bekreftet booking.');
      toast('Godtatt · kvittering sendt');
    });
    var nei = el('button', 'btn sm', 'Avslå');
    nei.dataset.odId = 'wbs-rsvp-nei-' + i;
    nei.addEventListener('click', function(){
      openDlg('Avslå forespørselen?', h.fra + ' får svaret med begrunnelsen din. ' +
        'Forslag til andre tider følger automatisk med.', true, function(grunn){
        pushUndo();
        HEND = HEND.filter(function(x){ return x.id !== h.id; });
        logg('Forespørsel fra ' + h.fra + ' avslått: ' + grunn, 'booking', 'svar sendt');
        renderAll();
        si('Forespørselen er avslått, og svaret er sendt.');
        toast('Avslått · svar sendt');
      });
    });
    acts.appendChild(ja); acts.appendChild(nei);
    c.appendChild(acts);
    b.appendChild(c);
  });
}

function inspLogg(b){
  b.appendChild(el('span', 'flab', 'endringslogg · det spilleren ser'));
  b.appendChild(el('p', 'hint', 'Hver endring du gjør i en spillers uke merkes «coach» ' +
    'med tidspunkt. Loggen er den samme spilleren leser i PlayerHQ — ' +
    'ingen skjulte endringer.'));
  var ul = el('ul', 'logg');
  LOGG.forEach(function(l){
    var li = el('li');
    li.appendChild(el('span', 'lt num', l.t));
    var bx = el('div', 'lb');
    bx.appendChild(el('span', 'lx', l.x));
    bx.appendChild(el('span', l.hvem === 'coach' ? 'lw' : 'lv',
      l.hvem + (l.varsel ? ' · ' + l.varsel : '')));
    li.appendChild(bx);
    ul.appendChild(li);
  });
  b.appendChild(ul);
}

/* ── Render: målinger, bunnsone, modus ───────────────────────── */
function renderKpi(){
  var kols = kolonner();
  var iVisning = (MODUS === 'stall') ? valgteSp.length
    : (MODUS === 'gruppe' ? medlemmer(visGruppe).length : 1);
  document.getElementById('kSp').textContent = iVisning;
  document.getElementById('kSpW').textContent = MODUS === 'stall' ? 'spillere + meg'
    : (MODUS === 'gruppe' ? 'i gruppa' : (MODUS === 'spiller' ? sp(visSpiller).n : 'meg'));
  var mins = 0;
  kols.forEach(function(k){
    hendIKol(k).forEach(function(h){
      if (h.kilde === 'okt' || h.kilde === 'gruppe') mins += h.min;
    });
  });
  document.getElementById('kTid').textContent = mins ? tid(mins) : '—';
  document.getElementById('kTidW').textContent = (MODUS === 'stall' || MODUS === 'min')
    ? DAGER[visDag].dw + ' ' + DAGER[visDag].dd : 'uke 32';
  var konf = konflikterISyn();
  document.getElementById('kKonf').textContent = konf.length;
  document.getElementById('kRsvp').textContent = HEND.filter(function(h){ return h.kilde === 'rsvp'; }).length;
  document.getElementById('kLedig').textContent = slots ? slots.length : '—';
  document.getElementById('kLedigW').textContent = slots
    ? (slots.length ? 'tidsrom funnet' : 'ingen i perioden') : 'ikke søkt';
}

function renderBunn(){
  var br = document.getElementById('brudd');
  br.innerHTML = '';
  var konf = konflikterISyn();
  var rsvp = HEND.filter(function(h){ return h.kilde === 'rsvp'; }).length;
  var s = el('span', 'bmyk' + (konf.length ? '' : ' bok'));
  s.textContent = konf.length
    ? konf.length + ' konflikter i visningen — skole varsler, dobbeltbooking må løses'
    : 'Ingen konflikter i visningen';
  br.appendChild(s);
  if (malUtkast.length)
    br.appendChild(el('span', 'bmyk', malUtkast.length + ' økter fra ukemal er ikke bekreftet'));
  br.appendChild(el('span', 'bmyk', 'Regler og låser er midlertidig ute — ingenting her er validert'));

  /* Én ting nå: den ene handlingen som faktisk står i veien. Prioritert,
     aldri to samtidig — og den endrer tilstand når du trykker. */
  var nb = document.getElementById('nowBtn');
  nb.className = 'btn now';
  if (rsvp){
    nb.textContent = 'Svar på ' + rsvp + (rsvp === 1 ? ' forespørsel' : ' forespørsler');
    nb.onclick = function(){ inspTab = 'rsvp'; renderAll();
      si('Forespørslene ligger i RSVP-fanen.'); };
    return;
  }
  if (konf.length){
    nb.textContent = 'Løs ' + konf.length + (konf.length === 1 ? ' konflikt' : ' konflikter');
    nb.onclick = function(){ inspTab = 'konflikt'; renderAll();
      si('Konfliktene ligger i konfliktfanen.'); };
    return;
  }
  if (malUtkast.length){
    nb.textContent = 'Bekreft ' + malUtkast.length + ' økter fra ukemal';
    nb.onclick = bekreftMal;
    return;
  }
  if (publisert){
    nb.className = 'btn ink';
    nb.textContent = 'Publisert ' + klokke(NAA.min) + ' · se logg';
    nb.onclick = function(){ inspTab = 'logg'; renderAll(); };
    return;
  }
  var antall = MODUS === 'gruppe' ? medlemmer(visGruppe).length
    : (MODUS === 'spiller' ? 1 : valgteSp.length);
  nb.textContent = MODUS === 'spiller'
    ? 'Publiser uka til ' + sp(visSpiller).n.split(' ')[0]
    : 'Publiser uke 32 til ' + antall + ' spillere';
  nb.onclick = function(){
    openDlg(nb.textContent + '?',
      'Spillerne ser planen i PlayerHQ med én gang, med coach-merking på alt du har ' +
      'endret. Endrer du etterpå, får de varsel om endringen.', false, function(){
      publisert = true;
      logg('Uke 32 publisert til ' + antall + (antall === 1 ? ' spiller' : ' spillere'),
        'coach', 'alle varslet');
      renderAll();
      si('Uke 32 er publisert. Planen er synlig i PlayerHQ.');
      toast('Publisert');
    });
  };
}

function settModus(m){
  MODUS = m;
  valgtId = null; valgtSlot = null; slots = null;
  document.querySelectorAll('.zooms button').forEach(function(x){
    x.setAttribute('aria-current', String(x.dataset.modus === m));
  });
  document.getElementById('dagstripe').hidden = !(m === 'stall' || m === 'min');
  var sub = { stall:'stall · uke 32', gruppe:'gruppe · uke 32',
              spiller:'planlegger for ' + sp(visSpiller).n, min:'min tid · uke 32' }[m];
  document.getElementById('whoSub').innerHTML = sub;
  renderAll();
  si({ stall:'Stallvisning: spillerne er kolonner på valgt dag.',
       gruppe:'Gruppevisning: gruppas uke, med skole bak og periodene over.',
       spiller:'Spillervisning: full redigering av ' + sp(visSpiller).n + ' sin uke, med coach-merking.',
       min:'Min tid: tilgjengelighet, bookinger og forespørsler.' }[m]);
}

function renderDagstripe(){
  var d = document.getElementById('dagstripe');
  d.innerHTML = '';
  DAGER.forEach(function(x, i){
    var treff = slots ? slots.filter(function(sl){ return sl.dag === i; }).length : 0;
    var b = el('button', null, x.dw + ' ' + x.dd + (treff ? ' · ' + treff : ''));
    b.type = 'button';
    b.dataset.odId = 'wbs-dag-' + i;
    if (treff) b.style.color = 'var(--accent-fg)';
    b.setAttribute('aria-label', x.dw + ' ' + x.dd +
      (treff ? ', ' + treff + ' ledige tidsrom' : ''));
    b.setAttribute('aria-current', String(i === visDag));
    b.addEventListener('click', function(){ visDag = i; renderAll();
      si('Viser ' + x.dw + ' ' + x.dd + '.'); });
    d.appendChild(b);
  });
}

function renderAll(){
  var cb = document.querySelector('.canvasbody');
  var sy = cb ? cb.scrollTop : 0, sx = cb ? cb.scrollLeft : 0;
  renderMini(); renderKilder(); renderSpvelg(); renderFinn(); renderLib();
  renderDagstripe(); renderWeek(); renderInsp(); renderKpi(); renderBunn();
  if (cb){ cb.scrollTop = sy; cb.scrollLeft = sx; }
}
function rullTilNaa(){
  var cb = document.querySelector('.canvasbody'), nl = document.getElementById('nowline');
  if (!cb || !nl) return;
  cb.scrollTop = Math.max(0, nl.offsetTop - cb.clientHeight * 0.45);
}

/* ── Dialog ──────────────────────────────────────────────────── */
var scrim = document.getElementById('scrim'), dlg = document.getElementById('dialog'), dlgLast = null;
function openDlg(tittel, tekst, felt, onOk){
  dlgLast = document.activeElement;
  document.getElementById('dlgTitle').textContent = tittel;
  document.getElementById('dlgBody').textContent = tekst;
  document.getElementById('dlgField').hidden = !felt;
  document.getElementById('dlgInput').value = '';
  scrim.hidden = false; dlg.hidden = false;
  document.getElementById('dlgOk').onclick = function(){
    if (felt && !document.getElementById('dlgInput').value.trim()){
      si('Begrunnelse er påkrevd.'); document.getElementById('dlgInput').focus(); return;
    }
    onOk(document.getElementById('dlgInput').value.trim()); closeDlg();
  };
  (felt ? document.getElementById('dlgInput') : document.getElementById('dlgOk')).focus();
}
function closeDlg(){
  scrim.hidden = true; dlg.hidden = true;
  if (dlgLast && dlgLast.focus) dlgLast.focus();
}
document.getElementById('dlgCancel').addEventListener('click', closeDlg);
scrim.addEventListener('click', closeDlg);
dlg.addEventListener('keydown', function(e){
  if (e.key !== 'Tab') return;
  var f = dlg.querySelectorAll('button, textarea, input');
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ── Tastatur ────────────────────────────────────────────────────
   Samme grammatikk som workbench-desktop: ⌘Z angrer, T ruller til nå,
   ←→ bytter dag i stall-modus. S/G/P/M bytter modus. */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !dlg.hidden){ e.preventDefault(); closeDlg(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); angre(); return; }
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || !dlg.hidden) return;
  var m = { s:'stall', g:'gruppe', p:'spiller', m:'min' }[e.key.toLowerCase()];
  if (m){ settModus(m); return; }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') &&
      (!document.activeElement || !document.activeElement.classList.contains('tg-okt'))){
    if (MODUS !== 'stall' && MODUS !== 'min') return;
    visDag = Math.max(0, Math.min(6, visDag + (e.key === 'ArrowRight' ? 1 : -1)));
    renderAll(); si('Viser ' + DAGER[visDag].dw + '.');
    return;
  }
  if (e.key === 't' || e.key === 'T'){
    var nl = document.getElementById('nowline');
    if (nl){
      var cb = document.querySelector('.canvasbody');
      rullTilNaa();
      si('Rullet til nå, ' + klokke(NAA.min) + '.');
    }
  }
});

/* ── Faner, lag og tema ──────────────────────────────────────── */
document.querySelectorAll('.zooms button').forEach(function(b){
  b.addEventListener('click', function(){ settModus(b.dataset.modus); });
});
document.querySelectorAll('.libtabs button').forEach(function(b){
  b.addEventListener('click', function(){ libTab = b.dataset.lib; renderLib(); });
});
document.querySelectorAll('.insptabs button').forEach(function(b){
  b.addEventListener('click', function(){ inspTab = b.dataset.insp; renderInsp(); });
});
var tilgjPaa = true;
document.getElementById('lagTilgj').addEventListener('click', function(){
  tilgjPaa = !tilgjPaa;
  this.setAttribute('aria-pressed', String(tilgjPaa));
  renderWeek();
  si('Tilgjengelighetslaget er ' + (tilgjPaa ? 'på' : 'av') + '.');
});
document.getElementById('backThread').addEventListener('click', function(){
  window.location.href = 'agencyos-konsoll-desktop.html';
});
var KEY = 'akhq-theme-agencyos';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

settModus('stall');
/* Rulling etter at layouten faktisk er målbar — ellers regnes nå-linja
   mot en canvasbody som ennå ikke har høyde, og lerretet åpner på 05:00. */
requestAnimationFrame(function(){ requestAnimationFrame(rullTilNaa); });
})();
</script>

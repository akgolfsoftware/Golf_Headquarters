<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spillere · AgencyOS · AK Golf HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
/* ─────────────────────────────────────────────────────────────
   AK Golf HQ · Claude Paper tokens v3
   Anthropic-justert (offentlige kilder) + AK produktregler

   Én kilde. Kopier verbatim inn i hver HTML/skjerm, eller @import.
   Se SCOPE.md for hva «offisiell» betyr (vi er JUSTERT, ikke Anthropic).

   Kilder:
   - Anthropic brand-guidelines: ink/paper/mid/light + clay/sky/olive
   - anthropic.com DESIGN.md (shadcn reverse-eng): full 21-farge + 8 aksenter
   - Fase 1 (2026-07/08): chat-først, radius 12 for tett app, Én ting nå

   v3.1 · 2026-08-01 (Bølge 1)
   - --rail-hover / --rail-active løftet inn (var lokale i Fase 1-filene)
   - Ingen andre verdiendringer. --muted er #5e5d59 (vinner over Fase 1 #5F5B53)

   v3 · 2026-08-01
   - Full Anthropic surface + accent ladder
   - Radius-stige: sm 8 · app 12 · md 16 · lg 24 · pill
   - Type-tokens for marketing + produkt
   - Motion, z-index, tap-targets, hairline
   - Dark theme (produkt; marketing er primært lys)
   ───────────────────────────────────────────────────────────── */

:root {
  /* ─── Surfaces (Anthropic cream ladder) ─── */
  --bg: #faf9f5;                    /* canvas / ivory */
  --surface: #ffffff;               /* elevated white (produkt-kort) */
  --soft: #f0eee6;                  /* surface-secondary — kort uten skygge */
  --soft-hover: #e8e6dc;            /* surface-secondary-hover */
  --surface-warm: #e3dacc;          /* oat */
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;                /* light gray (brand skill) */
  --hairline: #d1cfc5;              /* finere skille enn --border */
  --inverse: #000000;               /* full-bleed marketing-bånd */

  /* ─── Text (Anthropic slate ladder) ─── */
  --fg: #141413;                    /* ink — primær tekst + CTA-fill */
  --ink-soft: #3d3d3a;              /* hover på primærknapp */
  --muted: #5e5d59;                 /* text-muted (brand skill ~ #5f5b53; Anthropic #5e5d59) */
  --mid: #b0aea5;                   /* text-secondary / cloud medium — IKKE brødtekst i lys */
  --text-tertiary: #87867f;

  /* ─── Rail (produkt, alltid mørk) ─── */
  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);   /* v3.1 — løftet fra Fase 1 */
  --rail-active: rgba(250, 249, 245, 0.14);  /* v3.1 — løftet fra Fase 1 */

  /* ─── Actions ─── */
  --cta: #141413;                   /* Anthropic: CTA er blekk, ikke farge */
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  /* Clay = sterkeste kromatiske aksent (Anthropic clay) */
  --accent: #d97757;                /* kun «Én ting nå» + focus i app */
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;             /* AA-tekst på paper */
  --on-accent: #141413;             /* tekst på fylt clay — sparsomt */
  --accent-deep: #c6613f;           /* burnt sienna */

  /* ─── Dormant accent swatches (Anthropic research palette)
       Brukes sparsomt: chart, kategori, badges — aldri som primær CTA ─── */
  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  /* ─── Datasemantikk (produkt — mørknede for AA-tekst) ─── */
  --up: #63784a;                    /* olive mørknet for tekst */
  --up-raw: #788c5d;                /* olive rå — fyll/sparkline */
  --dn: #a85536;                    /* leire av clay — aldri ren rød */
  --info: #46719f;                  /* sky mørknet for tekst */
  --info-raw: #6a9bcc;

  /* ─── Typography families
       Anthropic proprietary (Serif/Sans/Mono) er IKKE offentlige.
       Brand skill: Poppins + Lora. Mono: IBM Plex Mono (produkt-tall). ─── */
  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  /* Aliases brukt i eksisterende skjermer */
  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  /* ─── Type scale · Produkt (tett) ─── */
  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;       /* AgencyOS desktop */
  --text-body-player: 14px;         /* PlayerHQ mobil */
  --text-label: 10px;               /* versaler + tracking */
  --text-kpi: 40px;                 /* mono */

  /* ─── Type scale · Marketing (editorial, Anthropic-rytme) ─── */
  --text-hero: 56px;                /* nedskalert fra 88 — web-vennlig */
  --text-section: 40px;             /* nedskalert fra 90 */
  --text-prose: 18px;               /* serif body marketing */
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  /* ─── Spacing · 4px base (Anthropic 4/8/12/16/24/32/48/96) ─── */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;                       /* section padding marketing */

  /* ─── Radius
       Anthropic marketing: sm 8 · md 16 · lg 24
       AK produkt (Fase 1 låst): app 12 for kort/composer ─── */
  --r-none: 0px;
  --r-sm: 8px;                      /* knapper, inputs, chips */
  --r: 12px;                        /* app-default (Fase 1) */
  --r-md: 16px;                     /* editorial cards / marketing */
  --r-lg: 24px;                     /* store flater, pille-CTA unntak */
  --r-pill: 999px;

  /* ─── Elevation
       Anthropic marketing: NULL shadow — flater via cream-steg
       Produkt: én myk skygge tillatt (valgfri) ─── */
  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  /* ─── Interaction ─── */
  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  /* Tap targets */
  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;              /* fangst-mikrofon mobil */

  /* ─── Logo (AK Golf — ikke Anthropic) ─── */
  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  /* ─── Z-index ─── */
  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

/* ─── Dark (produkt) ─── */
[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

/* Rail always dark */
.rail {
  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

/* Aksentflate — marketing/innlogging sparsomt */
.on-accent-surface {
  --logo-mark: #141413;
  --logo-dot: #141413;
}

/* Full-bleed inverse band (marketing) */
.band-inverse {
  background: var(--inverse);
  color: var(--bg);
}

/* Skriftimport — lim i <head> på alle skjermer:
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
*/

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Gulvregel: min treffmål på touch */
@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }
/* ═══ Spillere · AgencyOS · desktop + iPad ═══
   Stallen. Reviewen 31.07 felte forgjengeren på fire punkter: tallene
   løy (18 i overskrift, 7 i lista), alle filterchips hadde samme filter,
   radene var href="#" så profilen ikke fantes, og SG med samme fortegn
   fikk motsatt farge. Alle fire er lukket her og målt.

   Tre grupper, ikke to: Trenger deg nå · Følger planen · Hviler. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-agency); line-height:1.5; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap); padding:0 var(--s4); font-size:13px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  min-height:var(--tap-lg); font-weight:600; padding:0 var(--s5); }
.btn.sm{ min-height:var(--tap); padding:0 var(--s3); font-size:12px; }
.btn.icon{ width:var(--tap); padding:0; }
.chip{ display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--tap);
  padding:0 var(--s4); font-size:12.5px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-pill); cursor:pointer; }
.chip[aria-pressed="true"]{ background:var(--fg); color:var(--bg); border-color:var(--fg); }
.chip .n{ font-family:var(--mono); font-size:11px; opacity:.7; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.app{ display:grid; grid-template-columns:64px minmax(0,1fr) 380px; height:100vh; }
.stage{ display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden;
  border-right:1px solid var(--border); }

.rail{ background:var(--rail); display:flex; flex-direction:column; align-items:center;
  gap:var(--s1); padding:var(--s3) 0; z-index:var(--z-rail); }
.logo{ font-family:var(--disp); font-size:15px; font-weight:700; color:var(--rail-on); margin-bottom:var(--s4); }
.logo span{ color:var(--logo-dot); }
.rbtn{ width:52px; min-height:52px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; background:transparent; border:0; border-radius:var(--r);
  color:var(--rail-fg); font-size:9px; cursor:pointer; position:relative; }
.rbtn:hover{ background:var(--rail-hover); color:var(--rail-on); }
.rbtn[aria-current="page"]{ background:var(--rail-active); color:var(--rail-on); }
.rbtn svg{ width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; }
.rbtn .cnt{ position:absolute; top:4px; right:6px; font-family:var(--mono); font-size:9px;
  min-width:15px; height:15px; display:grid; place-items:center; border-radius:var(--r-pill);
  background:var(--rail-on); color:var(--rail); }

.top{ flex:none; display:flex; align-items:center; gap:var(--s3);
  padding:var(--s3) var(--s4); border-bottom:1px solid var(--border); background:var(--surface); }
.top h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.filters{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--border-soft); background:var(--softer);
  overflow-x:auto; scrollbar-width:none; }
.filters::-webkit-scrollbar{ display:none; }
.list{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }

/* Gruppe */
.grp{ margin-bottom:var(--s5); }
.grphead{ display:flex; align-items:baseline; gap:var(--s2); margin-bottom:var(--s2); }
.grphead .n{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted); }
.grpnote{ margin:0 0 var(--s3); font-family:var(--body); font-size:12.5px; color:var(--muted); }

/* Spillerrad — ekte knapp, aldri href="#" */
.row{ display:grid; grid-template-columns:38px minmax(0,1fr) 120px 96px; gap:var(--s3);
  width:100%; text-align:left; padding:var(--s3) var(--s4); margin-bottom:var(--s2);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; align-items:center; }
.row:hover{ border-color:var(--mid); }
.row[aria-current="true"]{ border-color:var(--fg); box-shadow:inset 3px 0 0 var(--fg); }
.av{ width:38px; height:38px; border-radius:var(--r-pill); background:var(--soft);
  display:grid; place-items:center; font-family:var(--mono); font-size:12px; font-weight:600;
  color:var(--muted); }
.row .t{ font-size:13.5px; font-weight:600; }
.row .s{ font-family:var(--mono); font-size:11px; color:var(--muted); }
.kol{ display:flex; flex-direction:column; gap:2px; }
.kol .k{ font-family:var(--mono); font-size:9px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.kol .v{ font-family:var(--mono); font-size:14px; font-weight:600; }
/* SG: fortegnet bestemmer fargen. Alltid. Samme fortegn = samme farge. */
.v.pos{ color:var(--up); } .v.neg{ color:var(--dn); }

.empty{ display:flex; flex-direction:column; align-items:flex-start; gap:var(--s3);
  padding:var(--s6) var(--s5); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.empty h3{ margin:0; font-family:var(--disp); font-size:15px; font-weight:600; }
.empty p{ margin:0; max-width:44ch; font-family:var(--body); font-size:13.5px; color:var(--muted); }

/* Profil-artefakt i panelet — ikke en egen flate */
.detail{ display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg); }
.dhead{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:var(--s3) var(--s4); border-bottom:1px solid var(--border); }
.dhead .t{ font-family:var(--disp); font-size:13.5px; font-weight:600; }
.dbody{ flex:1; min-height:0; overflow-y:auto; padding:var(--s4); }
.dfoot{ flex:none; display:flex; gap:var(--s2); padding:var(--s3) var(--s4);
  border-top:1px solid var(--border); background:var(--surface);
  padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom)); }
.dfoot .btn{ flex:1; }
.kpirad{ display:grid; grid-template-columns:repeat(2,1fr); gap:var(--s2); margin-bottom:var(--s4); }
.kpi{ padding:var(--s3); background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); }
.kpi .k{ display:block; font-family:var(--mono); font-size:9px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--muted); }
.kpi .v{ display:block; font-family:var(--mono); font-size:20px; font-weight:600; }
.kpi .w{ display:block; font-size:10.5px; color:var(--muted); }
.blokk{ margin-bottom:var(--s4); }
.blokk .flab{ display:block; font-family:var(--mono); font-size:var(--text-label);
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-bottom:var(--s2); }
.blokk p{ margin:0; font-family:var(--body); font-size:13.5px; }
.linje{ display:flex; align-items:baseline; gap:var(--s2); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:12.5px; }
.linje:last-child{ border-bottom:0; }
.linje .v{ margin-left:auto; font-family:var(--mono); }
.why{ margin:var(--s2) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

#detOpen{ display:none; }
#detScrim{ display:none; position:fixed; inset:0; background:var(--scrim); z-index:var(--z-sheet); }
@media (max-width:1180px){
  .app{ grid-template-columns:64px minmax(0,1fr); }
  #detOpen{ display:inline-flex; }
  .row{ grid-template-columns:38px minmax(0,1fr) 110px; }
  .row .kol.skjul{ display:none; }
  .detail{ position:fixed; left:0; right:0; bottom:0; z-index:calc(var(--z-sheet) + 1);
    max-height:88vh; background:var(--surface); border-top:1px solid var(--border);
    border-radius:var(--r) var(--r) 0 0; box-shadow:var(--shadow);
    transform:translateY(100%); transition:transform var(--dur-slow) var(--ease);
    padding-bottom:env(safe-area-inset-bottom); }
  .detail::before{ content:""; display:block; width:36px; height:4px; flex:none;
    border-radius:var(--r-pill); background:var(--border); margin:var(--s3) auto var(--s1); }
  body.det-open .detail{ transform:translateY(0); }
  body.det-open #detScrim{ display:block; }
  .dbody{ max-height:56vh; }
}
@media (min-width:1181px){ .detail{ transform:none !important; } }
.toast{ position:fixed; left:50%; bottom:var(--s5); transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:12.5px; }
.btn,.chip,button,[role="button"],summary,input{ min-height:var(--tap); }
.tag,.num,.eyebrow,.kol .v,.kpi .v{ min-height:0; }

</style>
</head>
<body>
<div class="app">

  <nav class="rail" aria-label="Hovednavigasjon">
    <div class="logo">AK<span>.</span></div>
    <button class="rbtn" data-od-id="rail-konsoll" onclick="location.href='agencyos-konsoll-desktop.html'">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Konsoll</button>
    <button class="rbtn" data-od-id="rail-innboks" onclick="location.href='agencyos-innboks.html'">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Innboks
      <span class="cnt num" id="railCount">7</span></button>
    <button class="rbtn" aria-current="page" data-od-id="rail-spillere">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Spillere</button>
    <button class="rbtn" data-od-id="rail-kalender">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalender</button>
    <button class="rbtn" data-od-id="rail-workbench" onclick="location.href='workbench-desktop.html'">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h7v6H4zM15 14h5v6h-5z"/></svg>Workbench</button>
  </nav>

  <main class="stage">
    <header class="top">
      <div>
        <h1>Spillere</h1>
        <div class="eyebrow"><span class="num" id="spCount">7</span> av <span class="num" id="spTotal">7</span> i stallen ·
          <span class="num" id="spTrenger">2</span> trenger deg · fredag 31. juli <span class="num">09:12</span></div>
      </div>
      <span style="flex:1"></span>
      <button class="btn sm" id="detOpen" aria-controls="detail" aria-expanded="false" data-od-id="sp-open-sheet">Se profilen</button>
      <button class="btn icon" id="themeBtn" aria-label="Bytt til mørk modus" data-od-id="sp-theme">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>

    <div class="filters" id="filters" role="group" aria-label="Filtre"></div>
    <div class="list" id="list" role="list" aria-label="Spillere"></div>
  </main>

  <div id="detScrim" data-od-id="sp-scrim"></div>
  <aside class="detail" id="detail" aria-label="Spillerprofil">
    <div class="dhead"><span class="t" id="dTitle">—</span></div>
    <div class="dbody" id="dBody"></div>
    <div class="dfoot" id="dFoot"></div>
  </aside>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ═══ Spillere · datamodell ═══
   Demo-kanon: Øyvind Rohjan er spilleren (ordliste B21). De øvrige navnene
   er demo-fyll og må erstattes med reell stall før pilot — de er merket
   `demo:true` slik at de kan telles og byttes maskinelt.
   Tallene i overskriften regnes ALLTID fra lista. Reviewen 31.07 fant
   «18 spillere» i overskriften og 7 i lista; det kan ikke skje her. */

var SPILLERE = [
  { id:'p1', navn:'Øyvind Rohjan', demo:false, kat:'D', alder:16, sg:2.92, dagerSiden:0,
    gruppe:'trenger', sisteOkt:'i dag 16:00', selskap:'AK Golf Academy',
    hvorfor:'Ukeplan uke 32 venter på godkjenning, og sjekkpunktet 14.08 er om to uker.',
    tester:[['Inspill Basic','7 av 12 innenfor 4 m','30.07'],
            ['Putt Gate','24 av 30','28.07'],
            ['Clubhead Speed','—','ikke tatt']] },
  { id:'p2', navn:'Spiller B', demo:true, kat:'C', alder:17, sg:0.88, dagerSiden:9,
    gruppe:'trenger', sisteOkt:'22.07', selskap:'WANG Toppidrett',
    hvorfor:'Ingen logget økt på ni dager. Ingen fangst, ingen runde.',
    tester:[['Driver Basic','—','ikke tatt'],['Putt Speed Control','18 av 24','15.07']] },
  { id:'p3', navn:'Spiller C', demo:true, kat:'B', alder:18, sg:-1.15, dagerSiden:1,
    gruppe:'planen', sisteOkt:'i går', selskap:'AK Golf Academy',
    hvorfor:'Følger uke 32 som planlagt. Fire av fem økter gjennomført.',
    tester:[['Inspill 160 m','9 av 12','29.07'],['Trapbarmarkløft','120 kg','24.07']] },
  { id:'p4', navn:'Spiller D', demo:true, kat:'D', alder:15, sg:1.40, dagerSiden:2,
    gruppe:'planen', sisteOkt:'29.07', selskap:'GFGK Junior',
    hvorfor:'På plan. Neste økt tirsdag.',
    tester:[['Nærspill Gate','15 av 20','26.07']] },
  { id:'p5', navn:'Spiller E', demo:true, kat:'E', alder:14, sg:-0.30, dagerSiden:3,
    gruppe:'planen', sisteOkt:'28.07', selskap:'GFGK Junior',
    hvorfor:'På plan. Fysisk program to ganger i uka.',
    tester:[['Stille lengde','2,05 m','20.07']] },
  { id:'p6', navn:'Spiller F', demo:true, kat:'C', alder:17, sg:0.10, dagerSiden:21,
    gruppe:'hviler', sisteOkt:'10.07', selskap:'WANG Toppidrett',
    hvorfor:'Planlagt pause etter sesongslutt. Tilbake 12. august.',
    tester:[] },
  { id:'p7', navn:'Spiller G', demo:true, kat:'D', alder:16, sg:0.55, dagerSiden:16,
    gruppe:'hviler', sisteOkt:'15.07', selskap:'AK Golf Academy',
    hvorfor:'Skade i håndledd. Retur-til-spill fra 5. august.',
    tester:[] }
];

var GRUPPER = [
  { k:'trenger', n:'Trenger deg nå',
    note:'Noe venter på deg, eller spilleren har vært stille for lenge.' },
  { k:'planen',  n:'Følger planen',
    note:'Logger som avtalt. Ingen handling nødvendig.' },
  { k:'hviler',  n:'Hviler',
    note:'Planlagt pause eller retur-til-spill. Teller ikke som stille.' }
];

var FILTRE = [
  { k:'alle',    n:'Alle',              f:function(){ return true; } },
  { k:'akademi', n:'AK Golf Academy',   f:function(s){ return s.selskap === 'AK Golf Academy'; } },
  { k:'wang',    n:'WANG Toppidrett',   f:function(s){ return s.selskap === 'WANG Toppidrett'; } },
  { k:'gfgk',    n:'GFGK Junior',       f:function(s){ return s.selskap === 'GFGK Junior'; } },
  { k:'stille',  n:'Stille over 7 dager', f:function(s){ return s.dagerSiden >= 7 && s.gruppe !== 'hviler'; } }
];

var valgtId = 'p1', filter = 'alle';
var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function komma(n){ return String(n).replace('.', ','); }
function sgTekst(v){ return (v > 0 ? '+' : v < 0 ? '−' : '') + komma(Math.abs(v).toFixed(2)); }
function init(n){ return n.split(' ').map(function(x){ return x[0]; }).join('').slice(0,2).toUpperCase(); }
function synlige(){ return SPILLERE.filter(FILTRE.filter(function(x){ return x.k === filter; })[0].f); }

function renderFiltre(){
  var w = document.getElementById('filters'); w.innerHTML = '';
  FILTRE.forEach(function(f){
    var c = el('button', 'chip');
    c.setAttribute('aria-pressed', String(f.k === filter));
    c.dataset.odId = 'sp-filter-' + f.k;
    c.appendChild(el('span', null, f.n));
    c.appendChild(el('span', 'n', SPILLERE.filter(f.f).length));
    c.addEventListener('click', function(){ filter = f.k; renderAlt(); });
    w.appendChild(c);
  });
}

function renderListe(){
  var w = document.getElementById('list'); w.innerHTML = '';
  var vis = synlige();
  if (!vis.length){
    var e = el('div', 'empty');
    e.appendChild(el('h3', null, 'Ingen spillere i dette filteret'));
    e.appendChild(el('p', null, 'Stallen har ' + SPILLERE.length + ' spillere totalt. Prøv «Alle».'));
    var b = el('button', 'btn', 'Vis alle'); b.dataset.odId = 'sp-empty-alle';
    b.addEventListener('click', function(){ filter = 'alle'; renderAlt(); });
    e.appendChild(b); w.appendChild(e); return;
  }
  GRUPPER.forEach(function(g){
    var rader = vis.filter(function(s){ return s.gruppe === g.k; });
    if (!rader.length) return;
    var grp = el('div', 'grp');
    var h = el('div', 'grphead');
    h.appendChild(el('span', 'eyebrow', g.n));
    h.appendChild(el('span', 'n', rader.length));
    grp.appendChild(h);
    grp.appendChild(el('p', 'grpnote', g.note));
    rader.forEach(function(s){
      var r = el('button', 'row');
      r.dataset.odId = 'sp-rad-' + s.id;
      r.setAttribute('aria-current', s.id === valgtId ? 'true' : 'false');
      r.appendChild(el('span', 'av', init(s.navn)));
      var mid = el('span');
      mid.appendChild(el('span', 't', s.navn));
      mid.appendChild(el('span', 's', 'kat. ' + s.kat + ' · ' + s.alder + ' år · ' + s.selskap));
      r.appendChild(mid);
      var k1 = el('span', 'kol');
      k1.appendChild(el('span', 'k', 'sg total'));
      k1.appendChild(el('span', 'v num ' + (s.sg >= 0 ? 'pos' : 'neg'), sgTekst(s.sg)));
      r.appendChild(k1);
      var k2 = el('span', 'kol skjul');
      k2.appendChild(el('span', 'k', 'siste økt'));
      k2.appendChild(el('span', 'v num', s.dagerSiden === 0 ? 'i dag' : s.dagerSiden + ' d'));
      r.appendChild(k2);
      r.addEventListener('click', function(){
        valgtId = s.id; renderAlt();
        if (window.matchMedia('(max-width:1180px)').matches) apneDet();
      });
      grp.appendChild(r);
    });
    w.appendChild(grp);
  });
}

function renderProfil(){
  var s = SPILLERE.filter(function(x){ return x.id === valgtId; })[0];
  var b = document.getElementById('dBody'), foot = document.getElementById('dFoot');
  document.getElementById('dTitle').textContent = s ? s.navn : 'Ingen spiller valgt';
  b.innerHTML = ''; foot.innerHTML = '';
  if (!s){
    var e = el('div', 'empty');
    e.appendChild(el('h3', null, 'Velg en spiller'));
    e.appendChild(el('p', null, 'Klikk en rad for å se profilen som artefakt her.'));
    b.appendChild(e); return;
  }

  if (s.demo){
    var d = el('p', 'grpnote');
    d.textContent = 'Demo-navn. Kun Øyvind Rohjan er kanon — resten byttes mot reell stall før pilot.';
    b.appendChild(d);
  }

  var kp = el('div', 'kpirad');
  [['sg total', sgTekst(s.sg), 'siste 10 runder', s.sg >= 0 ? 'pos' : 'neg'],
   ['kategori', s.kat, 'A–K · ' + s.alder + ' år', ''],
   ['siste økt', s.dagerSiden === 0 ? 'i dag' : s.dagerSiden + ' d', s.sisteOkt, ''],
   ['tester', String(s.tester.length), 'registrert', '']].forEach(function(p){
    var d = el('div', 'kpi');
    d.appendChild(el('span', 'k', p[0]));
    d.appendChild(el('span', 'v num ' + p[3], p[1]));
    d.appendChild(el('span', 'w', p[2]));
    kp.appendChild(d);
  });
  b.appendChild(kp);

  var why = el('details', 'why'); why.dataset.odId = 'sp-why-sg';
  why.appendChild(el('summary', null, 'Hvorfor dette tallet'));
  var ul = document.createElement('ul');
  ['Kilde: siste 10 registrerte runder, brutto score.',
   'Beregning: SG total mot kat. ' + s.kat + '-referansen. Positivt tall = slag spart mot referansen, ikke mot par.',
   'Forbehold: runder uten puttdata gjør SG putt til anslag, og SG total bærer anslaget.']
   .forEach(function(t){ ul.appendChild(el('li', null, t)); });
  why.appendChild(ul);
  b.appendChild(why);

  var st = el('div', 'blokk'); st.style.marginTop = 'var(--s4)';
  st.appendChild(el('span', 'flab', 'hvorfor han står her'));
  st.appendChild(el('p', null, s.hvorfor));
  b.appendChild(st);

  var te = el('div', 'blokk');
  te.appendChild(el('span', 'flab', 'siste tester'));
  if (!s.tester.length){
    te.appendChild(el('p', null, 'Ingen tester registrert i pausen. Første test etter retur.'));
  } else {
    s.tester.forEach(function(t){
      var l = el('div', 'linje');
      l.appendChild(el('span', null, t[0]));
      l.appendChild(el('span', 'v', t[1] + ' · ' + t[2]));
      te.appendChild(l);
    });
  }
  b.appendChild(te);

  /* Clay kun på den ene spilleren som faktisk venter på deg. */
  var forste = synlige().filter(function(x){ return x.gruppe === 'trenger'; })[0];
  var erNa = forste && forste.id === s.id;
  var plan = el('a', 'btn ' + (erNa ? 'now' : 'ink'), erNa ? 'Åpne uke 32 i Workbench' : 'Åpne i Workbench');
  plan.href = 'workbench-desktop.html?agent=0';
  plan.dataset.odId = 'sp-workbench';
  var innb = el('a', 'btn', 'Se i Innboks');
  innb.href = 'agencyos-innboks.html';
  innb.dataset.odId = 'sp-innboks';
  foot.appendChild(innb); foot.appendChild(plan);
}

var detEl = document.getElementById('detail'), detScrim = document.getElementById('detScrim'),
    detBtn = document.getElementById('detOpen'), detFokus = null;
function erArk(){ return window.matchMedia('(max-width:1180px)').matches; }
function apneDet(){
  if (!erArk()) return;
  detFokus = document.activeElement;
  document.body.classList.add('det-open');
  detBtn.setAttribute('aria-expanded','true');
  detEl.setAttribute('role','dialog'); detEl.setAttribute('aria-modal','true');
  var f = detEl.querySelector('button, a, [tabindex]:not([tabindex="-1"])'); if (f) f.focus();
}
function lukkDet(){
  document.body.classList.remove('det-open');
  detBtn.setAttribute('aria-expanded','false');
  detEl.removeAttribute('role'); detEl.removeAttribute('aria-modal');
  if (detFokus && detFokus.focus) detFokus.focus();
}
detBtn.addEventListener('click', function(){
  document.body.classList.contains('det-open') ? lukkDet() : apneDet(); });
detScrim.addEventListener('click', lukkDet);
detEl.addEventListener('keydown', function(e){
  if (e.key !== 'Tab' || !document.body.classList.contains('det-open')) return;
  var f = detEl.querySelectorAll('button, a, [tabindex]:not([tabindex="-1"])');
  if (!f.length) return;
  var first = f[0], last = f[f.length-1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});
window.addEventListener('resize', function(){
  if (!erArk() && document.body.classList.contains('det-open')) lukkDet(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && document.body.classList.contains('det-open')){ e.preventDefault(); lukkDet(); } });

var KEY = 'akhq-theme-agencyos';
var saved = localStorage.getItem(KEY);
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem(KEY, next);
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

function renderAlt(){
  renderFiltre(); renderListe(); renderProfil();
  /* Overskriftstallet regnes fra lista. Aldri skrevet for hånd. */
  var vis = synlige();
  document.getElementById('spCount').textContent = vis.length;
  document.getElementById('spTotal').textContent = SPILLERE.length;
  document.getElementById('spTrenger').textContent =
    vis.filter(function(s){ return s.gruppe === 'trenger'; }).length;
}
renderAlt();
})();

</script>
</body>
</html>

<style>
/* ═══ akhq-tokens.css v3.1 — KOPIERT VERBATIM. Eneste tokenkilde. ═══ */
:root {
  --bg: #faf9f5;
  --surface: #ffffff;
  --soft: #f0eee6;
  --soft-hover: #e8e6dc;
  --surface-warm: #e3dacc;
  --surface-manilla: #ebdbbc;
  --surface-kraft: #d4a27f;
  --border: #e8e6dc;
  --hairline: #d1cfc5;
  --inverse: #000000;

  --fg: #141413;
  --ink-soft: #3d3d3a;
  --muted: #5e5d59;
  --mid: #b0aea5;
  --text-tertiary: #87867f;

  --rail: #141413;
  --rail-fg: #b0aea5;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.08);
  --rail-active: rgba(250, 249, 245, 0.14);

  --cta: #141413;
  --on-cta: #faf9f5;
  --cta-hover: #3d3d3a;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.12);
  --accent-fg: #b85c3d;
  --on-accent: #141413;
  --accent-deep: #c6613f;

  --accent-coral: #ebcece;
  --accent-fig: #c46686;
  --accent-cactus: #bcd1ca;
  --accent-olive: #788c5d;
  --accent-sky: #6a9bcc;
  --accent-heather: #cbcadb;

  --up: #63784a;
  --up-raw: #788c5d;
  --dn: #a85536;
  --info: #46719f;
  --info-raw: #6a9bcc;

  --font-sans: "Poppins", Arial, system-ui, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  --disp: var(--font-sans);
  --ui: var(--font-sans);
  --body: var(--font-serif);
  --mono: var(--font-mono);

  --text-display: 32px;
  --text-title: 22px;
  --text-card: 16px;
  --text-panel: 14.5px;
  --text-body-agency: 13.5px;
  --text-body-player: 14px;
  --text-label: 10px;
  --text-kpi: 40px;

  --text-hero: 56px;
  --text-section: 40px;
  --text-prose: 18px;
  --text-prose-lg: 22px;
  --text-nav: 16px;
  --text-eyebrow: 12px;

  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
  --s8: 64px;
  --s9: 96px;

  --r-none: 0px;
  --r-sm: 8px;
  --r: 12px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-pill: 999px;

  --shadow: 0 1px 0 rgba(20, 20, 19, 0.03), 0 18px 40px rgba(20, 20, 19, 0.05);
  --shadow-none: none;
  --scrim: rgba(20, 20, 19, 0.4);

  --focus: #d97757;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --dur: 160ms;
  --dur-slow: 280ms;

  --tap: 44px;
  --tap-lg: 48px;
  --tap-capture: 60px;

  --logo-mark: #141413;
  --logo-dot: #b85c3d;

  --z-sticky: 10;
  --z-rail: 20;
  --z-sheet: 40;
  --z-modal: 50;
  --z-toast: 100;
  --z-command: 110;
}

[data-theme="dark"] {
  color: #faf9f5;
  --bg: #141413;
  --surface: #1d1c1a;
  --soft: #26241f;
  --soft-hover: #2e2c28;
  --surface-warm: #2a2824;
  --border: rgba(250, 249, 245, 0.10);
  --hairline: rgba(250, 249, 245, 0.08);
  --inverse: #000000;

  --fg: #faf9f5;
  --ink-soft: #e8e6dc;
  --muted: #b0aea5;
  --mid: #6b675e;
  --text-tertiary: #87867f;

  --rail: #0e0d0c;
  --rail-fg: #97938a;
  --rail-on: #faf9f5;
  --rail-hover: rgba(250, 249, 245, 0.06);
  --rail-active: rgba(250, 249, 245, 0.12);

  --cta: #faf9f5;
  --on-cta: #141413;
  --cta-hover: #e8e6dc;

  --accent: #d97757;
  --accent-soft: rgba(217, 119, 87, 0.18);
  --accent-fg: #e5a184;
  --on-accent: #141413;

  --up: #9db284;
  --up-raw: #788c5d;
  --dn: #de9e82;
  --info: #93b7dc;
  --info-raw: #6a9bcc;

  --shadow: none;
  --focus: #d97757;

  --logo-mark: #faf9f5;
  --logo-dot: #d97757;
}

[data-theme="light"] {
  color: #141413;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

@media (pointer: coarse) {
  :root {
    --floor: var(--tap);
  }
}

:root{ --softer:#f6f4ee; --border-soft:#efede4; }
[data-theme="dark"]{ --softer:#1a1917; --border-soft:rgba(250,249,245,.06); }
/* ═══ PlayerHQ · Etter økta (ETTER i sløyfa) ═══
   Gjennomføre-flyten, skjerm 3 av 3: brief → live → oppsummering.
   Avvik mellom plan og gjort vises i klarspråk — aldri som feil.
   Lagring skriver tilbake til loggen og varsler Anders. */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--fg); font-family:var(--ui);
  font-size:var(--text-body-player); line-height:1.55; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
.eyebrow{ font-family:var(--mono); font-size:var(--text-label); font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.prose{ font-family:var(--body); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
:where(a,button,input,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:var(--tap-lg); padding:0 var(--s4); font-size:14px; font-weight:500;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; white-space:nowrap; text-decoration:none; color:inherit; }
.btn:hover{ background:var(--soft); border-color:var(--mid); }
.btn:active{ transform:translateY(1px); }
.btn.ink{ background:var(--cta); color:var(--on-cta); border-color:var(--cta); }
.btn.now{ background:var(--accent); color:var(--on-accent); border-color:var(--accent);
  font-weight:600; min-height:56px; }
.btn.sm{ min-height:var(--tap); font-size:13px; padding:0 var(--s3); }
.btn.full{ width:100%; }
.tag{ display:inline-flex; align-items:center; padding:3px var(--s2); border-radius:var(--r-pill);
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase;
  background:var(--soft); color:var(--muted); border:1px solid var(--border); }
.tag.up{ color:var(--up); } .tag.dn{ color:var(--dn); } .tag.info{ color:var(--info); }

.phone{ width:430px; max-width:100%; height:920px; margin:0 auto; position:relative;
  overflow:hidden; background:var(--bg); border:1px solid var(--border);
  border-radius:var(--r-lg); display:flex; flex-direction:column; }
@media (max-width:640px){
  .phone{ width:100%; height:100dvh; max-width:none; border:0; border-radius:0; }
  .framehint{ display:none; }
}
@media (min-width:1024px){
  .phone{ width:100%; max-width:none; height:100vh; border:0; border-radius:0; }
  .kropp > *{ max-width:720px; margin-left:auto; margin-right:auto; }
}
.framehint{ text-align:center; font-size:11px; color:var(--muted); padding:var(--s3); }

.topp{ flex:none; display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3);
  border-bottom:1px solid var(--border); background:var(--surface); }
.topp h1{ margin:0; font-family:var(--disp); font-size:17px; font-weight:600; }
.topp .sub{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.ikon{ flex:none; width:var(--tap); height:var(--tap); display:grid; place-items:center;
  background:transparent; border:1px solid var(--border); border-radius:var(--r);
  cursor:pointer; color:inherit; text-decoration:none; }
.ikon svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }

.loop{ flex:none; display:flex; align-items:stretch; gap:var(--s1);
  padding:var(--s2) var(--s4); border-bottom:1px solid var(--border);
  background:var(--surface); overflow-x:auto; scrollbar-width:none; }
.loop::-webkit-scrollbar{ display:none; }
.loop a{ flex:1; min-height:var(--tap); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px; text-decoration:none;
  color:var(--muted); font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; border-radius:var(--r-sm); }
.loop a small{ font-family:var(--ui); font-size:10px; letter-spacing:0;
  text-transform:none; color:var(--mid); }
.loop a[aria-current="step"]{ color:var(--fg); box-shadow:inset 0 -2px 0 0 var(--fg); }
.loop .arw{ align-self:center; color:var(--mid); font-family:var(--mono); font-size:11px; }

.kropp{ flex:1; min-height:0; overflow-y:auto;
  padding:var(--s4) var(--s4) calc(96px + env(safe-area-inset-bottom)); }

.kort{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:var(--s4); margin-bottom:var(--s4); }
.kort .rad{ display:flex; align-items:baseline; gap:var(--s2); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:13px; }
.kort .rad:last-child{ border-bottom:0; }
.kort .rad .v{ margin-left:auto; font-family:var(--mono); text-align:right; }

/* Avvik plan/gjort — informasjon, aldri kritikk */
.avvik{ display:flex; align-items:flex-start; gap:var(--s2); padding:var(--s2) 0;
  border-bottom:1px solid var(--border-soft); font-size:13px; }
.avvik:last-child{ border-bottom:0; }
.avvik .an{ min-width:0; }
.avvik .am{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.avvik .tag{ margin-left:auto; flex:none; }

.notat{ border:1px solid var(--border); border-radius:var(--r); background:var(--surface);
  padding:var(--s3); margin-top:var(--s2); font-family:var(--body); font-size:13.5px; }
.notat .nt{ display:block; font-family:var(--mono); font-size:10px; color:var(--muted);
  margin-bottom:2px; }

.loggfelt{ width:100%; min-height:110px; padding:var(--s3); font-family:var(--body);
  font-size:15px; background:var(--surface); color:var(--fg);
  border:1px solid var(--border); border-radius:var(--r); resize:vertical; }

/* Kvittering etter lagring */
.kvitt{ padding:var(--s5) var(--s4); background:var(--surface);
  border:1px solid var(--up); border-radius:var(--r); margin-bottom:var(--s4); }
.kvitt h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:16px; font-weight:600;
  display:flex; align-items:center; gap:var(--s2); }
.kvitt h3 svg{ width:20px; height:20px; fill:none; stroke:var(--up); stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; }
.kvitt p{ margin:0; font-family:var(--body); font-size:13.5px; color:var(--muted); }

.tom{ padding:var(--s5) var(--s4); background:var(--soft); border:1px dashed var(--border);
  border-radius:var(--r); }
.tom h3{ margin:0 0 var(--s2); font-family:var(--disp); font-size:15px; font-weight:600; }
.tom p{ margin:0 0 var(--s3); font-family:var(--body); font-size:13.5px; color:var(--muted); }
.tom .valg{ display:flex; flex-direction:column; gap:var(--s2); }
.skel{ height:16px; background:var(--soft); border-radius:var(--r-sm);
  margin-bottom:var(--s2); animation:puls 1.6s var(--ease) infinite; }
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.55} }

.why{ margin:var(--s3) 0 0; border:1px solid var(--border); border-radius:var(--r); }
.why summary{ display:flex; align-items:center; min-height:var(--tap); padding:0 var(--s4);
  cursor:pointer; list-style:none; font-size:12.5px; font-weight:500; color:var(--muted); }
.why summary::-webkit-details-marker{ display:none; }
.why[open] summary{ border-bottom:1px solid var(--border); color:var(--fg); }
.why ul{ margin:0; padding:var(--s3) var(--s4) var(--s4) var(--s5);
  font-family:var(--body); font-size:13px; color:var(--muted); }
.why li{ margin-bottom:var(--s2); }

.dokk{ position:absolute; left:0; right:0; bottom:0;
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 70%, transparent); }
@media (min-width:1024px){ .dokk{ position:sticky; background:var(--bg);
  border-top:1px solid var(--border); } .dokk .btn{ max-width:720px; margin:0 auto; display:flex; } }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
  z-index:var(--z-toast); background:var(--fg); color:var(--bg);
  padding:var(--s3) var(--s4); border-radius:var(--r); font-size:13px; }
button,.btn,summary,a.btn{ min-height:var(--tap); }
.tag,.num,.eyebrow{ min-height:0; }
</style>
</head>
<body>

<script>
(function(){
'use strict';

/* ═══ PlayerHQ · Etter økta · datamodell ═══
   Kilder: TrainingLog (det som faktisk ble gjort: reps, treff, notater,
   varighet) · TrainingPlanSession (planen det måles mot; status settes
   COMPLETED ved lagring) · IUP (målet).
   Lagring skriver tilbake til loggen og varsler Anders — aldri en
   godkjenningsrunde. Avvik er informasjon, ikke feil.
   Økta er o2 fra workbench-mobil.html. Demo-kanon: Øyvind Rohjan. */

var OPPSUM = {
  navn:'Innspill · lengdekontroll',
  varighet:'1 t 24 min', planlagt:'1 t 30 min',
  drills:[
    { navn:'Halv sving · kalibrering', gjort:'15 av 15 reps', avvik:null },
    { navn:'Avstandsstige 50–100 m', gjort:'30 av 30 reps · 19 innenfor', avvik:null },
    { navn:'Én ball · én sjanse', gjort:'12 av 12 reps · 8 innenfor', avvik:'mål 9' }
  ],
  treff:8, treffAv:12, maal:9, sist:7,
  notater:[ { t:'54:10', tekst:'Traff tynt på 70 m når jeg ble sliten.' } ]
};

var UTKAST = 'Lengdekontrollen sitter bedre — 8 av 12 innenfor fire meter. ' +
  'Ble tynn på 70 m mot slutten når jeg ble sliten.';

/* Neste økt — vises i kvitteringen (fra TrainingPlanSession). */
var NESTE = { dagNavn:'Torsdag 6.8', start:'16:00', navn:'Nærspill · landingspunkt' };

var tilstand = 'fylt', lagret = false;

var live = document.getElementById('live');
function si(t){ live.textContent = t; }
var toastEl = document.getElementById('toast'), toastT;
function toast(t){ toastEl.textContent = t; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600); }
function el(tag, cls, txt){ var e = document.createElement(tag);
  if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function render(){
  var w = document.getElementById('kropp'); w.innerHTML = '';
  var dokk = document.getElementById('dokk'); dokk.innerHTML = '';

  if (tilstand === 'laster'){
    for (var i = 0; i < 7; i++){ var s = el('div', 'skel'); s.style.width = (95 - i*7) + '%'; w.appendChild(s); }
    return;
  }
  if (tilstand === 'tom'){
    var t = el('div', 'tom');
    t.appendChild(el('h3', null, 'Ingen økt å oppsummere'));
    t.appendChild(el('p', null,
      'Du har ikke avsluttet noen økt i dag. Oppsummeringen lages når du ' +
      'trykker «Avslutt og logg økta» i en live-økt.'));
    var v = el('div', 'valg');
    /* Kontrakt §3: i tom tilstand er start skjermens ene aksenthandling. */
    var st = el('a', 'btn now full', 'Til dagens økt');
    st.href = 'playerhq-live-brief.html'; st.dataset.odId = 'etter-tom-start';
    var pl = el('a', 'btn full', 'Åpne planen');
    pl.href = 'playerhq-plan.html'; pl.dataset.odId = 'etter-tom-plan';
    v.appendChild(st); v.appendChild(pl);
    t.appendChild(v); w.appendChild(t); return;
  }
  if (tilstand === 'feil'){
    var f = el('div', 'tom');
    f.appendChild(el('h3', null, 'Klarte ikke å lagre til loggen'));
    f.appendChild(el('p', null,
      'Oppsummeringen ligger trygt på telefonen og synkes når nettet er ' +
      'tilbake. Ingenting du gjorde i økta er tapt.'));
    /* Kontrakt §3: i feiltilstand er «Prøv igjen» skjermens ene aksenthandling. */
    var fb = el('button', 'btn now full', 'Prøv igjen'); fb.dataset.odId = 'etter-retry';
    fb.addEventListener('click', function(){ tilstand = 'fylt'; settDemo(); });
    f.appendChild(fb); w.appendChild(f); return;
  }

  if (lagret){ renderKvittering(w); return; }

  /* ── Suksess: oppsummering før lagring ── */

  /* Tallene — kilde: TrainingLog for økta */
  var k = el('div', 'kort');
  k.appendChild(el('div', 'eyebrow', OPPSUM.navn + ' · gjennomført'));
  [['Varighet', OPPSUM.varighet + ' (plan ' + OPPSUM.planlagt + ')'],
   ['Drills', '3 av 3'],
   ['Reps totalt', '57 av 57'],
   ['Innenfor 4 m', OPPSUM.treff + ' av ' + OPPSUM.treffAv + ' (mål ' + OPPSUM.maal + ')']]
   .forEach(function(p){
    var r = el('div', 'rad');
    r.appendChild(el('span', null, p[0]));
    r.appendChild(el('span', 'v num', p[1]));
    k.appendChild(r);
  });
  var wd = el('details', 'why'); wd.dataset.odId = 'etter-why-treff';
  wd.appendChild(el('summary', null, 'Hvorfor dette tallet'));
  var ul = document.createElement('ul');
  ['Kilde: 12 slag logget i økta på «Én ball · én sjanse», 8 innenfor 4 m.',
   'Målet var 9 av 12, foreslått fra IUP. Sist gang: 7 av 12 — dette er +1.',
   'Forbehold: én økt er ett datapunkt. Trenden vises i Analyse.']
   .forEach(function(x){ ul.appendChild(el('li', null, x)); });
  wd.appendChild(ul); k.appendChild(wd);
  w.appendChild(k);

  /* Avvik plan/gjort — klarspråk, aldri kritikk */
  var ak = el('div', 'kort');
  ak.appendChild(el('div', 'eyebrow', 'plan mot gjort'));
  OPPSUM.drills.forEach(function(d){
    var r = el('div', 'avvik');
    var an = el('div', 'an');
    an.appendChild(document.createTextNode(d.navn));
    an.appendChild(el('span', 'am num', d.gjort));
    r.appendChild(an);
    r.appendChild(el('span', 'tag' + (d.avvik ? ' info' : ' up'),
      d.avvik ? d.avvik : 'som planlagt'));
    ak.appendChild(r);
  });
  var r2 = el('div', 'avvik');
  var an2 = el('div', 'an');
  an2.appendChild(document.createTextNode('Avsluttet 6 min før planlagt'));
  an2.appendChild(el('span', 'am', 'Helt greit — avvik er informasjon til neste plan, ikke feil.'));
  r2.appendChild(an2);
  r2.appendChild(el('span', 'tag info', 'notert'));
  ak.appendChild(r2);
  w.appendChild(ak);

  /* Notater fra økta — kilde: TrainingLog */
  if (OPPSUM.notater.length){
    w.appendChild(el('div', 'eyebrow', 'notater fra økta · ' + OPPSUM.notater.length));
    OPPSUM.notater.forEach(function(n){
      var nd = el('div', 'notat');
      nd.appendChild(el('span', 'nt num', n.t + ' inn i økta'));
      nd.appendChild(document.createTextNode(n.tekst));
      w.appendChild(nd);
    });
  }

  /* Skriv-tilbake: spillerens egne ord — utkastet kan endres fritt */
  var lw = el('div'); lw.style.marginTop = 'var(--s4)';
  lw.appendChild(el('div', 'eyebrow', 'dine ord · skrives til loggen'));
  var ta = document.createElement('textarea');
  ta.className = 'loggfelt'; ta.id = 'oppsumTekst';
  ta.value = UTKAST;
  ta.setAttribute('aria-label', 'Oppsummering med dine ord');
  ta.dataset.odId = 'etter-oppsum-tekst';
  ta.style.marginTop = 'var(--s2)';
  lw.appendChild(ta);
  var hint = el('p', 'prose');
  hint.style.cssText = 'font-size:12.5px;color:var(--muted);margin:var(--s2) 0 0';
  hint.textContent = 'Utkastet er laget fra tallene og notatene dine. Endre fritt — det er dine ord som lagres. Anders ser oppsummeringen i stallen sin.';
  lw.appendChild(hint);
  w.appendChild(lw);

  /* Kontrakt §3: skjermens ene aksenthandling — skriver til loggen. */
  var lagreBtn = el('button', 'btn now full', 'Lagre i loggen');
  lagreBtn.dataset.odId = 'etter-lagre-logg';
  lagreBtn.addEventListener('click', function(){
    lagret = true; render();
    si('Økta er lagret i loggen. Anders har fått oppsummeringen.');
  });
  document.getElementById('dokk').appendChild(lagreBtn);
}

/* ── Kvittering ── */
function renderKvittering(w){
  var kv = el('div', 'kvitt');
  var h = el('h3');
  h.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
  h.appendChild(document.createTextNode('Lagret i loggen'));
  kv.appendChild(h);
  kv.appendChild(el('p', null,
    'Økta er logget som gjennomført, og uka er oppdatert. Anders har fått ' +
    'oppsummeringen — han skal ikke godkjenne noe, bare vite hva som skjedde.'));
  w.appendChild(kv);

  /* Neste steg — én vei videre, aldri blank flate */
  var nk = el('div', 'kort');
  nk.appendChild(el('div', 'eyebrow', 'neste økt'));
  var r = el('div', 'rad');
  r.appendChild(el('span', null, NESTE.navn));
  r.appendChild(el('span', 'v num', NESTE.dagNavn + ' ' + NESTE.start));
  nk.appendChild(r);
  w.appendChild(nk);

  var v = el('div');
  v.style.cssText = 'display:flex;flex-direction:column;gap:var(--s2)';
  var p1 = el('a', 'btn full', 'Til planen');
  p1.href = 'playerhq-plan.html'; p1.dataset.odId = 'etter-kvitt-plan';
  var p2 = el('a', 'btn full', 'Se utviklingen i Analyse');
  p2.href = 'playerhq-analyse.html'; p2.dataset.odId = 'etter-kvitt-analyse';
  var p3 = el('button', 'btn sm full', 'Angre — tilbake til oppsummeringen');
  p3.dataset.odId = 'etter-kvitt-angre';
  p3.addEventListener('click', function(){ lagret = false; render(); });
  v.appendChild(p1); v.appendChild(p2); v.appendChild(p3);
  w.appendChild(v);
}

function settDemo(){
  document.querySelectorAll('[data-tilstand]').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.tilstand === tilstand)); });
  render();
}
document.querySelectorAll('[data-tilstand]').forEach(function(b){
  b.addEventListener('click', function(){ tilstand = b.dataset.tilstand; lagret = false; settDemo(); }); });

var KEY = 'akhq-theme-playerhq';
var saved = null;
try { saved = localStorage.getItem(KEY); } catch(e){}
if (saved) document.documentElement.dataset.theme = saved;
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(KEY, next); } catch(e){}
  this.setAttribute('aria-label', next === 'dark' ? 'Bytt til lys modus' : 'Bytt til mørk modus');
});

render();
})();
</script>
</body>
</html>

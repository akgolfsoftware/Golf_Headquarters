<div style="min-height: 100vh; background: #000000; display: flex; align-items: center; justify-content: safe center; padding: 56px 24px;">

    </div>
    <div style="position: absolute; top: 54px; bottom: 0; left: 0; right: 0; overflow-y: auto; padding: 8px 16px 24px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8E8E93;">Lørdag 22. august</div>
      <h1 style="margin: 6px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;">I dag</h1>
      <div style="margin-top: 18px; background: #161616; border-radius: 20px; padding: 20px;">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8E8E93;">Caddie</div>
        <div style="margin-top: 10px; font-size: 15px; font-weight: 400; line-height: 1.5;">Ingen økt i dag. Anders har ikke lagt inn.</div>
      </div>
      <div style="margin-top: 12px; background: #161616; border-radius: 20px; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8E8E93; white-space: nowrap;">August</span>
          <span></span>
        </div>
        <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px;">
          <div style="text-align: center; font-size: 11px; font-weight: 600; color: #8E8E93;">M</div><div style="text-align: center; font-size: 11px; font-weight: 600; color: #8E8E93;">T</div><div style="text-align: center; font-size: 11px; font-weight: 600; color: #8E8E93;">O</div><div style="text-align: center; font-size: 11px; font-weight: 600; color: #8E8E93;">T</div><div style="text-align: center; font-size: 11px; font-weight: 600; color: #8E8E93;">F</div><div style="text-align: center; font-size: 11px; font-weight: 600; color: #8E8E93;">L</div><div style="text-align: center; font-size: 11px; font-weight: 600; color: #8E8E93;">S</div>
          <sc-for list="{{ dots }}" as="d" hint-placeholder-count="35">
            <div style="height: 38px; display: flex; align-items: center; justify-content: center;"><div style="width: 32px; height: 32px; border-radius: 50%; background: {{ d.bg }}; box-shadow: {{ d.ring }};"></div></div>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 0; z-index: 6;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="flex: 1; height: 48px; border-radius: 999px; background: #1C1C1E; display: flex; align-items: center; padding: 0 18px; font-size: 15px; font-weight: 400; color: #8E8E93;">Spør Caddie</div>
        <div style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"><rect x="9.5" y="3" width="5" height="10.5" rx="2.5"></rect><path d="M6 11.5 a6 6 0 0 0 12 0"></path><path d="M12 17.5 V21"></path></svg>
        </div>
      </div>
      <div style="margin: 10px 0 0; height: 64px; background: #1C1C1E; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px;">
        <div style="display: flex; align-items: center; gap: 7px; background: #FFFFFF; color: #000000; border-radius: 999px; height: 48px; padding: 0 18px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#000000"><path d="M4 10.5 L12 4 L20 10.5 V20 H14.5 V14.5 H9.5 V20 H4 Z"></path></svg>
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;">I dag</span>

        <div style="width: 52px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"><path d="M5 20 V13 M12 20 V6 M19 20 V10"></path></svg><span style="font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8E8E93; white-space: nowrap;">Analyse</span></div>
        <div style="width: 52px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;"><div style="width: 22px; height: 22px; border-radius: 50%; background: #B08968; color: #201409; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center;">ØR</div><span style="font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8E8E93; white-space: nowrap;">Meg</span></div>
      </div>
      <div style="height: 30px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;"><div style="width: 140px; height: 5px; border-radius: 3px; background: #F5F5F5;"></div></div>
    </div>
  </div>
  <div style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: #8E8E93;">PH-03 · I dag · tom uke — én linje fra Caddie, ingen maskot · dataState: tom</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const done = new Set([1, 3, 4, 6, 8, 10, 11, 13, 15, 17, 18, 20, 21]);
    const dots = [];
    for (let i = 0; i < 5; i++) dots.push({ bg: "transparent", ring: "none" });
    for (let day = 1; day <= 31; day++) {
      if (day === 22) dots.push({ bg: "transparent", ring: "inset 0 0 0 2.5px #FFFFFF" });
      else if (done.has(day)) dots.push({ bg: "#F5F5F5", ring: "none" });
      else dots.push({ bg: "#2C2C2E", ring: "none" });
    }
    return { dots };
  }
}
</script>

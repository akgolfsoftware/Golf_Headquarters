name: CI

on:
  # Ingen base-filter på pull_request: med `branches: [main]` kjørte CI ALDRI på
  # stablede PR-er (PR mot en feature-gren). 2026-07-26 ble tre slike merget der
  # verify/e2e aldri hadde kjørt — de så grønne ut fordi bare Vercel-bygget hadde
  # rapportert. Enhver PR skal gjennom denne jobben.
  pull_request:
  push:
    branches: [main]
  # Manuell kjøring fra Actions-fanen — lagt til 2026-07-19 for å kunne teste
  # Actions-oppsettet direkte (kjøringer trigget av push/PR har aldri startet).
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy DB-URLer på job-nivå så `postinstall: prisma generate` (kjøres av
      # `npm ci`) og senere steg har dem. Generate kobler ikke til DB.
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy?pgbouncer=true
      DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
      # tsc --noEmit + next build går tom for default ~2GB heap på et stort
      # prosjekt (411 ruter). Hev til 4GB (ubuntu-latest har 7GB RAM).
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Action-auth gate (KS-1 — server actions må ha auth-import)
        run: npm run check:action-auth

      - name: Unit tests (node:test + tsx)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy-verdier for build (Next bygger uten DB-tilkobling)
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy?pgbouncer=true
          DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          ANTHROPIC_API_KEY: dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          STRIPE_PRICE_ID_PRO: price_dummy
          CRON_SECRET: dummy

      # E2E er BEVISST fjernet herfra (2026-07-26). Blokket startet appen med
      # dummy-DB/Supabase-verdier og kjørte hele suiten (206 tester) mot den:
      # auth-guard-testene feilet fordi ingen redirect er mulig uten Supabase,
      # og `continue-on-error: true` svelget alt. Resultatet var ~6 minutter per
      # kjøring uten dekning — verre enn ingen test, fordi det så ut som en gate.
      #
      # Ekte e2e på PR krever en Postgres-service + seed + Supabase-stub. Til det
      # finnes er PR-gaten stegene over (tsc, lint, action-auth, enhetstester,
      # build) — alle blokkerende. `playwright.yml` er prod-røyktest etter deploy,
      # ikke en PR-gate.

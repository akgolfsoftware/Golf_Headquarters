name: Scrape GolfBox (norske turneringer)

# Henter KUN terminliste (kommende turneringer + påmeldingsfrister) for norske
# amatør/junior-turneringer fra GolfBox sine offentlige JSON-handlere.
# Skriver direkte til Supabase. Delsystem A — se docs/turnering-datakilder.md.
#
# Rettet 27.09.2026 (beslutninger.md §PIPELINES ER ENESTE KILDE, punkt 5):
# skriver IKKE lenger turneringsRESULTATER — det gjør kun ak-golf-pipelines
# (mandag 04:00 UTC). Denne jobben dekker bare kalender/frister + intern
# User<->PublicPlayer-lenking, ikke ekstern resultatinnhenting.

on:
  schedule:
    # Hver time 06–20 UTC (norsk dag/kveld) — kun kalender/frister, billig.
    - cron: "0 6-20 * * *"
  workflow_dispatch: {}

# Unngå overlappende kjøringer.
concurrency:
  group: scrape-golfbox
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # DB-creds må være tilgjengelig allerede ved `npm ci` (postinstall kjører
    # `prisma generate`, som leser DIRECT_URL fra prisma.config.ts).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Scrape GolfBox (kalender/frister)
        run: npx tsx scripts/scrape-golfbox.ts

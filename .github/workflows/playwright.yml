name: Playwright E2E (prod-røyktest)

# Denne jobben tester PRODUKSJON (akgolf-hq.vercel.app) — ikke koden i en PR.
# Fram til 2026-07-26 kjørte den også på pull_request, der `base_url`-inputen
# ikke finnes og URL-en derfor alltid falt til prod. Resultatet var en grønn
# «e2e»-hake på PR-er som i virkeligheten bare sa at prod var frisk. Flere
# merge-beslutninger ble tatt på den lesningen. Trigger nå bare ETTER deploy
# til main, pluss manuelt mot valgfri URL.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL å teste mot (default = Vercel prod)"
        required: false
        default: "https://akgolf-hq.vercel.app"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy DB-URLer på job-nivå så `postinstall: prisma generate` (kjøres av
      # `npm ci`) har dem. Testene kjører mot prod-URL, ikke lokal DB.
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy?pgbouncer=true
      DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium webkit --with-deps

      - name: Run Playwright tests mot prod (eller valgt base_url)
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || 'https://akgolf-hq.vercel.app' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Rød prod-røyktest sto uvarslet i to døgn (31. juli–2. aug) mens /turneringer
      # ga 500 til brukerne. Dette steget sier fra i Telegram samme minutt.
      # Secrets settes med samme navn som Meg-boten bruker lokalt.
      - name: Varsle Telegram ved rød kjøring
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.MEG_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.MEG_TELEGRAM_ALLOWED_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram-secrets mangler (MEG_TELEGRAM_BOT_TOKEN / MEG_TELEGRAM_ALLOWED_CHAT_ID) — ingen varsel sendt."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="Prod-røyktesten er RØD (akgolf-hq). Produksjonen kan ha en feil brukerne ser. Kjøring: ${RUN_URL}" \
            > /dev/null
          echo "Telegram-varsel sendt."

<div style="width:390px;height:844px;background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;font-variant-numeric:tabular-nums">
<div style="height:44px;flex-shrink:0;background:var(--surface-card);display:flex;align-items:flex-end;padding:0 20px 4px"><span style="font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--navy-900)">09.41</span></div>
<div style="flex-shrink:0;background:var(--surface-card);border-bottom:1px solid var(--border-subtle);padding:8px 16px 14px">
<div style="font-family:var(--font-mono);font-size:var(--text-micro);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-secondary)">TEAM NORWAY · COLLEGE</div>
<h2 style="font-size:var(--text-h2);font-weight:var(--weight-bold);letter-spacing:var(--tracking-heading);color:var(--navy-900);margin:4px 0 0">Collegegruppen</h2>
</div>
<div style="flex-shrink:0;background:var(--status-amber-bg);padding:10px 16px;display:flex;align-items:flex-start;gap:9px">
<span style="width:6px;height:6px;border-radius:var(--radius-full);background:var(--status-amber);flex-shrink:0;margin-top:5px"></span>
<div style="font-size:var(--text-xs);color:var(--status-amber-text);line-height:var(--leading-normal);text-wrap:pretty">Studieår er ført manuelt. Feltet finnes ikke i datamodellen ennå.</div>
</div>
<div style="flex:1;min-height:0;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:14px">
<div style="background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px;display:flex;flex-direction:column;gap:10px">
<span style="font-family:var(--font-mono);font-size:var(--text-micro);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-secondary)">HJEMME I NORGE NÅ</span>
<div style="display:flex;align-items:baseline;gap:8px">
<span style="font-family:var(--font-mono);font-size:46px;font-weight:var(--weight-semibold);color:var(--navy-900);letter-spacing:-.02em;line-height:1">0</span>
<span style="font-size:var(--text-base);font-weight:var(--weight-semibold);color:var(--text-secondary)">av 6 spillere</span>
</div>
<span style="font-size:var(--text-xs);color:var(--text-secondary);line-height:var(--leading-normal)">Første hjemkomst 08.05.2027 · kilde: spilleren selv</span>
</div>
<div style="display:flex;flex-direction:column;gap:10px;overflow:hidden">
<sc-for list="{{ mobilKull }}" as="a" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:7px">
<div style="display:flex;align-items:center;gap:9px">
<span style="font-size:var(--text-base);font-weight:var(--weight-bold);font-family:var(--font-display);letter-spacing:var(--tracking-heading);color:var(--navy-900)">{{ a.tittel }}</span>
<div style="flex:1;height:1px;background:var(--border-subtle)"></div>
<span style="font-family:var(--font-mono);font-size:var(--text-micro);color:var(--text-tertiary)">{{ a.antall }}</span>
</div>
<sc-for list="{{ a.spillere }}" as="s" hint-placeholder-count="2">
<div style="background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:13px 15px;display:flex;align-items:center;gap:12px;min-height:44px">
<div style="flex:1;min-width:0">
<div style="font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--navy-900)">{{ s.navn }}</div>
<div style="font-size:var(--text-xs);color:var(--text-secondary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.skole }}</div>
<div ref="{{ s.hjemRef }}" style="font-size:var(--text-xs);margin-top:3px">{{ s.hjem }}</div>
</div>
<span ref="{{ s.statusRef }}" style="flex-shrink:0;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;padding:4px 8px;border-radius:var(--radius-full)">{{ s.status }}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>
<div style="flex:1;min-height:0"></div>
</div>
<div style="height:76px;flex-shrink:0;background:var(--surface-card);border-top:1px solid var(--border-subtle);display:flex;align-items:flex-start;padding:8px 8px 0">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<div style="flex:1;min-width:0;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
<span ref="{{ t.barRef }}" style="width:22px;height:3px;border-radius:var(--radius-full)"></span>
<span ref="{{ t.labelRef }}" style="font-size:var(--text-xs);font-weight:var(--weight-semibold)">{{ t.label }}</span>
</div>
</sc-for>
</div>
</div>

<div style="width:390px;height:844px;background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;font-variant-numeric:tabular-nums">
<div style="height:44px;flex-shrink:0;background:var(--surface-card);display:flex;align-items:flex-end;padding:0 20px 4px"><span style="font-family:var(--font-mono);font-size:var(--text-xs);font-weight:var(--weight-medium);color:var(--navy-900)">09.41</span></div>
<div style="flex-shrink:0;background:var(--surface-card);border-bottom:1px solid var(--border-subtle);padding:8px 16px 14px;display:flex;flex-direction:column;gap:12px">
<div>
<div style="font-family:var(--font-mono);font-size:var(--text-micro);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-secondary)">DATA · 27 PROTOKOLLER</div>
<h2 style="font-size:var(--text-h2);font-weight:var(--weight-bold);letter-spacing:var(--tracking-heading);color:var(--navy-900);margin:4px 0 0">Testprotokoller</h2>
</div>
<div style="height:44px;background:var(--ink-50);border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:0 16px;display:flex;align-items:center;gap:10px">
<span style="color:var(--text-tertiary);font-size:14px">⌕</span>
<span style="font-size:var(--text-sm);color:var(--text-tertiary)">Søk protokoll eller eier</span>
</div>
<div style="display:flex;gap:8px;overflow:hidden">
<sc-for list="{{ filtreMobil }}" as="f" hint-placeholder-count="4">
<div role="button" ref="{{ f.ref }}" style="height:36px;padding:0 14px;border-radius:var(--radius-full);display:flex;align-items:center;font-size:var(--text-xs);font-weight:var(--weight-semibold);white-space:nowrap;flex-shrink:0">{{ f.label }}</div>
</sc-for>
</div>
</div>
<div style="flex:1;min-height:0;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:14px">
<sc-for list="{{ mobilOmrader }}" as="o" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:baseline;gap:8px">
<span style="font-family:var(--font-mono);font-size:var(--text-micro);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-secondary)">{{ o.navn }}</span>
<span style="font-family:var(--font-mono);font-size:var(--text-micro);color:var(--text-tertiary)">{{ o.antall }}</span>
</div>
<sc-for list="{{ o.rader }}" as="p" hint-placeholder-count="3">
<div role="button" style="background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:44px">
<div style="display:flex;align-items:flex-start;gap:10px">
<div style="flex:1;min-width:0">
<div style="font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--navy-900)">{{ p.navn }}</div>
<div style="font-size:var(--text-xs);color:var(--text-secondary);margin-top:2px;line-height:var(--leading-normal);text-wrap:pretty">{{ p.maler }}</div>
</div>
<span style="font-family:var(--font-mono);font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--navy-900);flex-shrink:0">{{ p.versjon }}</span>
</div>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<span ref="{{ p.eierRef }}" style="font-family:var(--font-mono);font-size:var(--text-micro);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-xs)">{{ p.eier }}</span>
<span style="font-family:var(--font-mono);font-size:var(--text-micro);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)">{{ p.brukere }}</span>
<div style="flex:1"></div>
<span style="font-family:var(--font-mono);font-size:var(--text-micro);color:var(--text-tertiary)">{{ p.sist }}</span>
</div>
<span style="font-size:var(--text-xs);color:var(--text-secondary);border-top:1px solid var(--border-subtle);padding-top:7px">{{ p.batteri }}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
